<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>

    {% include meta.html %}
    {% include adsense.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml" />
  </head>

  <body>

    <header class="site-header">
      <div class="container">
        <div class="site-header-inner">
          <div class="site-identity">
            <a href="{{ site.baseurl }}/" class="site-name">{{ site.name }}</a>
            <span class="site-subtitle">{{ site.description }}</span>
          </div>
          <nav class="site-nav">
            <a href="{{ site.baseurl }}/" class="nav-link">Writing</a>
            <a href="{{ site.baseurl }}/about" class="nav-link">About</a>
          </nav>
        </div>
      </div>
    </header>

    <main id="main" role="main" class="container main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-inner">
          <div class="footer-social">
            {% include svg-icons.html %}
          </div>
          <p class="footer-copy">
            &copy; {{ site.time | date: '%Y' }} {{ site.name }} &middot; Backend Engineer
          </p>
        </div>
      </div>
    </footer>

    {% include analytics.html %}
    <script>
      (function() {
        function initMermaid() {
          const mermaidBlocks = [];
          const elements = document.querySelectorAll('.language-mermaid, code.language-mermaid, pre.language-mermaid');
          
          elements.forEach(function(el) {
            let container = el;
            if (el.tagName === 'CODE') {
              if (el.parentElement && el.parentElement.tagName === 'PRE') {
                container = el.parentElement;
                if (container.parentElement && container.parentElement.classList.contains('highlight')) {
                  container = container.parentElement;
                  if (container.parentElement && container.parentElement.classList.contains('language-mermaid')) {
                    container = container.parentElement;
                  }
                }
              }
            } else if (el.tagName === 'PRE') {
              if (el.parentElement && el.parentElement.classList.contains('language-mermaid')) {
                container = el.parentElement;
              }
            }
            
            if (!mermaidBlocks.includes(container)) {
              mermaidBlocks.push(container);
            }
          });

          if (mermaidBlocks.length > 0) {
            mermaidBlocks.forEach(function(container) {
              const text = container.textContent || container.innerText;
              const newEl = document.createElement('div');
              newEl.className = 'mermaid';
              newEl.textContent = text.trim();
              container.parentNode.replaceChild(newEl, container);
            });

            const script = document.createElement('script');
            script.type = 'module';
            script.textContent = `
              import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
              mermaid.initialize({
                startOnLoad: true,
                theme: 'default',
                securityLevel: 'loose',
                flowchart: { useMaxWidth: true, htmlLabels: true }
              });
              mermaid.run();
            `;
            document.body.appendChild(script);
          }
        }

        function initHighlighting() {
          const codeBlocks = document.querySelectorAll('pre code');
          codeBlocks.forEach(function(codeEl) {
            // 1. Skip if it is a mermaid block or child of one
            if (codeEl.classList.contains('language-mermaid') || 
                codeEl.closest('.language-mermaid') || 
                codeEl.closest('.mermaid')) {
              return;
            }

            // Prevent double-highlighting
            if (codeEl.classList.contains('hljs') || codeEl.dataset.highlighted) {
              return;
            }
            codeEl.dataset.highlighted = 'true';

            const rawCode = codeEl.textContent;
            let lang = null;

            // Extract language class name if specified (excluding plaintext)
            const classList = codeEl.classList;
            for (let i = 0; i < classList.length; i++) {
              const cls = classList[i];
              if (cls.startsWith('language-') && cls !== 'language-plaintext') {
                lang = cls.replace('language-', '');
                break;
              }
            }

            // Check parent containers for class names if not found on codeEl
            if (!lang) {
              let parent = codeEl.parentElement;
              while (parent && parent !== document.body) {
                const pClasses = parent.classList;
                for (let i = 0; i < pClasses.length; i++) {
                  const cls = pClasses[i];
                  if (cls.startsWith('language-') && cls !== 'language-plaintext') {
                    lang = cls.replace('language-', '');
                    break;
                  }
                }
                if (lang) break;
                parent = parent.parentElement;
              }
            }

            // 2. Perform highlighting
            let highlightedResult;
            if (lang && hljs.getLanguage(lang)) {
              highlightedResult = hljs.highlight(rawCode, { language: lang });
            } else {
              // Auto detect!
              try {
                highlightedResult = hljs.highlightAuto(rawCode);
                lang = highlightedResult.language || 'code';
              } catch (e) {
                highlightedResult = { value: hljs.escapeHTML(rawCode) };
                lang = 'code';
              }
            }

            // Replace content and add class
            codeEl.innerHTML = highlightedResult.value;
            codeEl.classList.add('hljs');

            // 3. Add Container, Header & Copy Button
            const preEl = codeEl.parentElement;
            if (preEl && preEl.tagName === 'PRE') {
              const container = document.createElement('div');
              container.className = 'code-block-container';

              const header = document.createElement('div');
              header.className = 'code-block-header';

              const badge = document.createElement('span');
              badge.className = 'code-block-lang';
              badge.textContent = lang.toUpperCase();

              const copyBtn = document.createElement('button');
              copyBtn.className = 'code-block-copy-btn';
              copyBtn.innerHTML = `
                <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy</span>
              `;

              copyBtn.addEventListener('click', function() {
                navigator.clipboard.writeText(rawCode).then(function() {
                  copyBtn.classList.add('copied');
                  copyBtn.innerHTML = `
                    <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Copied!</span>
                  `;
                  setTimeout(function() {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = `
                      <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                      </svg>
                      <span>Copy</span>
                    `;
                  }, 2000);
                }).catch(function(err) {
                  console.error('Could not copy text: ', err);
                });
              });

              header.appendChild(badge);
              header.appendChild(copyBtn);

              // Find the element to wrap (outermost highlight wrapper or preEl itself)
              let wrapper = preEl;
              if (preEl.parentElement && preEl.parentElement.classList.contains('highlight')) {
                wrapper = preEl.parentElement;
              }

              // Rearrange DOM: insert container before wrapper
              wrapper.parentNode.insertBefore(container, wrapper);
              container.appendChild(header);
              container.appendChild(wrapper);
            }
          });
        }

        function loadHighlightJS(callback) {
          if (typeof hljs !== 'undefined') {
            callback();
            return;
          }
          
          // Load CSS
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css';
          document.head.appendChild(link);

          // Load JS
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js';
          script.onload = callback;
          document.body.appendChild(script);
        }

        function initAll() {
          initMermaid();
          loadHighlightJS(initHighlighting);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initAll);
        } else {
          initAll();
        }
      })();
    </script>
  </body>
</html>
