---
layout: default
---

<div class="posts-explorer-layout">
  
  <!-- Left Side: Main Postings Area -->
  <section class="explorer-content" id="explorer-content-area">
    
    <!-- Active filters display -->
    <div id="active-filters-container" class="active-filters-info" style="display: none;">
      <span id="active-filters-text">Active filters: </span>
      <button id="btn-reset-filters" class="btn-reset-filters">Reset filters</button>
    </div>

    <!-- Dynamic Post Grid -->
    <div id="posts-grid" class="posts-grid">
      <!-- Cards rendered dynamically by JS -->
    </div>

    <!-- Virtual pagination controller -->
    <div class="load-more-container">
      <button id="btn-load-more" class="btn-load-more">Load More Posts</button>
    </div>
  </section>

  <!-- Right Side: Sidebar Navigation and Filters -->
  <aside class="explorer-sidebar">
    
    <!-- Widget: Instant Search -->
    <div class="sidebar-widget">
      <h3 class="widget-title">Search</h3>
      <div class="search-input-wrapper">
        <input type="text" id="search-input" placeholder="Search title, tag, content..." autocomplete="off">
        <span class="search-clear-btn" id="search-clear-btn">&times;</span>
      </div>
    </div>

    <!-- Widget: Topics (Tags) -->
    <div class="sidebar-widget">
      <h3 class="widget-title">Topics</h3>
      <div id="topic-tags-list" class="sidebar-tags-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Widget: Archive Years -->
    <div class="sidebar-widget">
      <h3 class="widget-title">Archive by Year</h3>
      <div id="archive-years-list" class="sidebar-years-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </aside>
</div>

<!-- Jekyll compiles all posts metadata into a local JS array -->
<script>
  window.blogPosts = [
    {% for post in site.posts %}
      {
        title: {{ post.title | jsonify }},
        url: {{ post.url | prepend: site.baseurl | jsonify }},
        date: {{ post.date | date: "%B %-d, %Y" | jsonify }},
        date_iso: {{ post.date | date_to_xmlschema | jsonify }},
        year: {{ post.date | date: "%Y" | jsonify }},
        description: {{ post.description | default: post.excerpt | strip_html | truncatewords: 22 | jsonify }},
        tags: [
          {% for tag in post.tags %}
            {{ tag | jsonify }}{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ]
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  document.addEventListener('DOMContentLoaded', () => {
    const allPosts = window.blogPosts || [];
    
    // Application States
    let filteredPosts = [...allPosts];
    let activeSearch = '';
    let activeTag = '';
    let activeYear = '';
    let currentPage = 1;
    const postsPerPage = 12; // Dynamic loading page size

    // DOM References
    const postsGrid = document.getElementById('posts-grid');
    const btnLoadMore = document.getElementById('btn-load-more');
    const searchInput = document.getElementById('search-input');
    const searchClearBtn = document.getElementById('search-clear-btn');
    const tagsList = document.getElementById('topic-tags-list');
    const yearsList = document.getElementById('archive-years-list');
    const activeFiltersContainer = document.getElementById('active-filters-container');
    const activeFiltersText = document.getElementById('active-filters-text');
    const btnResetFilters = document.getElementById('btn-reset-filters');

    // 1. Process Metadata (Topic counts and Year counts)
    const tagCounts = {};
    const yearCounts = {};

    allPosts.forEach(post => {
      if (post.tags && Array.isArray(post.tags)) {
        post.tags.forEach(tag => {
          const cleanTag = tag.trim();
          if (cleanTag) {
            tagCounts[cleanTag] = (tagCounts[cleanTag] || 0) + 1;
          }
        });
      }
      if (post.year) {
        yearCounts[post.year] = (yearCounts[post.year] || 0) + 1;
      }
    });

    const uniqueTags = Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]); // Sort by most popular
    const uniqueYears = Object.keys(yearCounts).sort((a, b) => b - a); // Sort chronologically descending

    // 2. Render Widget Lists
    function renderWidgets() {
      // Tags/Topics
      tagsList.innerHTML = uniqueTags.map(tag => `
        <button class="sidebar-tag-btn ${activeTag === tag ? 'active' : ''}" data-tag="${tag}">
          #${tag}
          <span class="tag-count">${tagCounts[tag]}</span>
        </button>
      `).join('');

      // Years
      yearsList.innerHTML = uniqueYears.map(year => `
        <button class="sidebar-year-btn ${activeYear === year ? 'active' : ''}" data-year="${year}">
          <span>${year}</span>
          <span class="year-count">${yearCounts[year]}</span>
        </button>
      `).join('');
    }

    // 3. Filter Application Logic
    function applyFilters() {
      filteredPosts = allPosts.filter(post => {
        const matchesSearch = !activeSearch || 
          post.title.toLowerCase().includes(activeSearch.toLowerCase()) ||
          (post.description && post.description.toLowerCase().includes(activeSearch.toLowerCase())) ||
          post.tags.some(t => t.toLowerCase().includes(activeSearch.toLowerCase()));
          
        const matchesTag = !activeTag || post.tags.includes(activeTag);
        const matchesYear = !activeYear || post.year === activeYear;

        return matchesSearch && matchesTag && matchesYear;
      });

      currentPage = 1;
      updateActiveFiltersUI();
      renderPostsGrid();
    }

    // 4. Render Post Cards Grid
    function renderPostsGrid() {
      postsGrid.innerHTML = '';

      if (filteredPosts.length === 0) {
        postsGrid.innerHTML = `
          <div class="explorer-status-message" style="grid-column: 1 / -1;">
            <p>No articles found matching your criteria.</p>
            <p class="reset-link" id="status-reset-link">Reset all filters</p>
          </div>
        `;
        document.getElementById('status-reset-link').addEventListener('click', resetAllFilters);
        btnLoadMore.style.display = 'none';
        return;
      }

      const endIndex = currentPage * postsPerPage;
      const postsToDisplay = filteredPosts.slice(0, endIndex);

      postsToDisplay.forEach((post, index) => {
        const card = document.createElement('article');
        card.className = 'explorer-card';
        card.style.animation = 'fadeIn 0.3s ease-out both';
        card.style.animationDelay = `${(index % postsPerPage) * 0.04}s`;

        const tagsMarkup = post.tags && post.tags.length > 0
          ? post.tags.map(t => `<span class="explorer-card-tag" data-tag="${t}">#${t}</span>`).join('')
          : '';

        card.innerHTML = `
          <div class="explorer-card-header">
            <div class="explorer-card-meta">
              <time datetime="${post.date_iso || ''}">${post.date}</time>
            </div>
            <h2 class="explorer-card-title">
              <a href="${post.url}">${post.title}</a>
            </h2>
          </div>
          <p class="explorer-card-desc">${post.description}</p>
          <div class="explorer-card-footer">
            ${tagsMarkup}
          </div>
        `;

        // Interactive tag elements within each card
        card.querySelectorAll('.explorer-card-tag').forEach(tagBtn => {
          tagBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            setTagFilter(tagBtn.dataset.tag);
          });
        });

        postsGrid.appendChild(card);
      });

      // Toggle Virtual Pagination Button
      if (endIndex < filteredPosts.length) {
        btnLoadMore.classList.remove('disabled');
        btnLoadMore.style.display = 'block';
      } else {
        btnLoadMore.classList.add('disabled');
        btnLoadMore.style.display = 'none';
      }
    }

    // 5. Update Status & Filter Headers
    function updateActiveFiltersUI() {
      const activeChips = [];
      if (activeSearch) activeChips.push(`search: "${activeSearch}"`);
      if (activeTag) activeChips.push(`#${activeTag}`);
      if (activeYear) activeChips.push(`year: ${activeYear}`);

      if (activeChips.length > 0) {
        activeFiltersText.textContent = `Active filter: ${activeChips.join(' + ')} (${filteredPosts.length} article${filteredPosts.length !== 1 ? 's' : ''})`;
        activeFiltersContainer.style.display = 'flex';
      } else {
        activeFiltersContainer.style.display = 'none';
      }

      // Show/Hide search clear trigger
      searchClearBtn.style.display = activeSearch ? 'block' : 'none';

      // Update sidebar visual indicator classes
      document.querySelectorAll('.sidebar-tag-btn').forEach(btn => {
        if (btn.dataset.tag === activeTag) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      document.querySelectorAll('.sidebar-year-btn').forEach(btn => {
        if (btn.dataset.year === activeYear) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // 6. Navigation Actions
    function setTagFilter(tag) {
      activeTag = (activeTag === tag) ? '' : tag;
      updateURLQuery();
      applyFilters();
      scrollToContent();
    }

    function setYearFilter(year) {
      activeYear = (activeYear === year) ? '' : year;
      updateURLQuery();
      applyFilters();
      scrollToContent();
    }

    function resetAllFilters() {
      activeSearch = '';
      activeTag = '';
      activeYear = '';
      searchInput.value = '';
      updateURLQuery();
      applyFilters();
    }

    function scrollToContent() {
      if (window.innerWidth <= 900) {
        const topOffset = document.getElementById('explorer-content-area').getBoundingClientRect().top + window.scrollY - 80;
        window.scrollTo({ top: topOffset, behavior: 'smooth' });
      }
    }

    // Update query strings in URL bar for link sharing
    function updateURLQuery() {
      const url = new URL(window.location);
      
      if (activeTag) url.searchParams.set('tag', activeTag);
      else url.searchParams.delete('tag');
      
      if (activeYear) url.searchParams.set('year', activeYear);
      else url.searchParams.delete('year');

      if (activeSearch) url.searchParams.set('search', activeSearch);
      else url.searchParams.delete('search');

      window.history.replaceState({}, '', url);
    }

    // 7. Event Binding
    btnLoadMore.addEventListener('click', () => {
      currentPage++;
      renderPostsGrid();
    });

    let debounceTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        activeSearch = e.target.value.trim();
        updateURLQuery();
        applyFilters();
      }, 150);
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      activeSearch = '';
      updateURLQuery();
      applyFilters();
      searchInput.focus();
    });

    tagsList.addEventListener('click', (e) => {
      const btn = e.target.closest('.sidebar-tag-btn');
      if (btn) setTagFilter(btn.dataset.tag);
    });

    yearsList.addEventListener('click', (e) => {
      const btn = e.target.closest('.sidebar-year-btn');
      if (btn) setYearFilter(btn.dataset.year);
    });

    btnResetFilters.addEventListener('click', resetAllFilters);

    // Watch for URL parameters on load
    const params = new URLSearchParams(window.location.search);
    const tagParam = params.get('tag');
    const yearParam = params.get('year');
    const searchParam = params.get('search');

    if (tagParam) activeTag = tagParam;
    if (yearParam) activeYear = yearParam;
    if (searchParam) {
      activeSearch = searchParam;
      searchInput.value = searchParam;
    }

    // Bootstrapping
    renderWidgets();
    applyFilters();
  });
</script>
