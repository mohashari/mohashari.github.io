<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Component Gradients -->
    <linearGradient id="kafka-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <linearGradient id="consumer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="limiter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="ctrl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
    .label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .sub-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #cbd5e1; }
    .metric-val { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
    .flow-line { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6,4; animation: flow 20s linear infinite; }
    .control-line { stroke: #f43f5e; stroke-width: 2; stroke-dasharray: 4,4; }
    .arrow { fill: #64748b; }
    .arrow-ctrl { fill: #f43f5e; }
    
    @keyframes flow {
      to {
        stroke-dashoffset: -100;
      }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" />
  
  <!-- Outer Border -->
  <rect x="2" y="2" width="896" height="546" fill="none" stroke="#334155" stroke-width="2" rx="10" />

  <!-- HEADER -->
  <g transform="translate(30, 45)">
    <text class="title">Dynamic Kafka Consumer Lag Mitigation Architecture</text>
    <text class="subtitle" y="22">Feedback-driven rate limiting, adaptive rebalancing, and autoscaling</text>
  </g>

  <!-- KAFKA BROKER & TOPIC -->
  <g transform="translate(50, 120)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="200" height="350" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect width="200" height="40" rx="8" fill="url(#kafka-grad)" />
    <text class="label" x="100" y="25" text-anchor="middle">Kafka Cluster</text>
    
    <!-- Partitions -->
    <g transform="translate(15, 60)">
      <!-- P0 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="55" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text class="sub-label" x="15" y="25">Partition 0</text>
        <text class="metric-val" x="15" y="42">Lag: 12,450 msg</text>
        <circle cx="155" cy="27" r="6" fill="#ef4444" />
      </g>
      <!-- P1 -->
      <g transform="translate(0, 70)">
        <rect width="170" height="55" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text class="sub-label" x="15" y="25">Partition 1</text>
        <text class="metric-val" x="15" y="42">Lag: 8,120 msg</text>
        <circle cx="155" cy="27" r="6" fill="#f59e0b" />
      </g>
      <!-- P2 -->
      <g transform="translate(0, 140)">
        <rect width="170" height="55" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text class="sub-label" x="15" y="25">Partition 2</text>
        <text class="metric-val" x="15" y="42">Lag: 142 msg</text>
        <circle cx="155" cy="27" r="6" fill="#10b981" />
      </g>
      <!-- P3 -->
      <g transform="translate(0, 210)">
        <rect width="170" height="55" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text class="sub-label" x="15" y="25">Partition 3</text>
        <text class="metric-val" x="15" y="42">Lag: 95 msg</text>
        <circle cx="155" cy="27" r="6" fill="#10b981" />
      </g>
    </g>
  </g>

  <!-- CONSUMER GROUP (ACTIVE INSTANCES) -->
  <g transform="translate(360, 120)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="260" height="350" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect width="260" height="40" rx="8" fill="url(#consumer-grad)" />
    <text class="label" x="130" y="25" text-anchor="middle">Consumer Group: order-processor</text>

    <!-- Consumer 1 (Throttled/Stressed) -->
    <g transform="translate(15, 60)">
      <rect width="230" height="120" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
      <text class="label" x="15" y="25">Consumer Instance #1</text>
      <text class="sub-label" x="15" y="45">Assigned: P0, P1</text>
      
      <!-- Internal Rate Limiter -->
      <g transform="translate(15, 60)">
        <rect width="200" height="45" rx="4" fill="url(#limiter-grad)" opacity="0.9" />
        <text class="label" x="10" y="20" style="font-size: 11px;">Token Bucket Rate Limiter</text>
        <text class="metric-val" x="10" y="35" style="fill: #ffffff;">Limit: 250 req/sec (Throttled)</text>
      </g>
    </g>

    <!-- Consumer 2 (Healthy) -->
    <g transform="translate(15, 200)">
      <rect width="230" height="120" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text class="label" x="15" y="25">Consumer Instance #2</text>
      <text class="sub-label" x="15" y="45">Assigned: P2, P3</text>
      
      <!-- Internal Rate Limiter -->
      <g transform="translate(15, 60)">
        <rect width="200" height="45" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <text class="label" x="10" y="20" style="font-size: 11px; fill: #10b981;">Token Bucket Rate Limiter</text>
        <text class="metric-val" x="10" y="35" style="fill: #10b981;">Limit: 1,000 req/sec (Normal)</text>
      </g>
    </g>
  </g>

  <!-- TELEMETRY & CONTROLLERS (PROMETHEUS & KEDA) -->
  <!-- Prometheus -->
  <g transform="translate(690, 120)" filter="url(#shadow)">
    <rect width="160" height="110" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <rect width="160" height="35" rx="8" fill="#f97316" />
    <text class="label" x="80" y="22" text-anchor="middle">Prometheus</text>
    <text class="sub-label" x="15" y="55">Scrapes Lag Metrics</text>
    <text class="metric-val" x="15" y="75">kafka_consumergroup_lag</text>
    <text class="metric-val" x="15" y="92">rate(processing_failures)</text>
  </g>

  <!-- Dynamic Controller / Autoscaler -->
  <g transform="translate(690, 310)" filter="url(#shadow)">
    <rect width="160" height="160" rx="8" fill="#1e293b" stroke="url(#ctrl-grad)" stroke-width="1.5" />
    <rect width="160" height="35" rx="8" fill="url(#ctrl-grad)" />
    <text class="label" x="80" y="22" text-anchor="middle">Dynamic Controller</text>
    <text class="sub-label" x="15" y="55">Adaptive Scaling &amp;</text>
    <text class="sub-label" x="15" y="70">Rate Limit Coordinator</text>
    <text class="metric-val" x="15" y="100">KEDA Scaler: Active</text>
    <text class="metric-val" x="15" y="120">Target HPA: 4 instances</text>
    <text class="metric-val" x="15" y="140">State: Scale-Up Triggered</text>
  </g>

  <!-- FLOW LINES & CONNECTIONS -->
  <!-- Kafka -> Consumers Data Flow -->
  <path d="M 250 205 L 360 205" fill="none" class="flow-line" />
  <path d="M 250 345 L 360 345" fill="none" class="flow-line" />
  
  <polygon points="360,205 352,200 352,210" class="arrow" />
  <polygon points="360,345 352,340 352,350" class="arrow" />

  <!-- Consumers -> Prometheus Metrics Scrape -->
  <path d="M 620 235 L 690 190" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
  <polygon points="690,190 681,190 685,198" class="arrow" />
  <text class="sub-label" x="635" y="200" style="font-size: 10px;">Metrics</text>

  <!-- Prometheus -> Dynamic Controller (Alerts / Lag values) -->
  <path d="M 770 230 L 770 310" fill="none" class="control-line" />
  <polygon points="770,310 765,302 775,302" class="arrow-ctrl" />
  <text class="sub-label" x="780" y="275" style="font-size: 10px; fill: #f43f5e;">Alert/Lag Data</text>

  <!-- Dynamic Controller -> Consumer Group (Scale-out / Rebalance request) -->
  <path d="M 690 410 L 620 410" fill="none" class="control-line" />
  <polygon points="620,410 628,415 628,405" class="arrow-ctrl" />
  <text class="sub-label" x="630" y="400" style="font-size: 10px; fill: #f43f5e;">Scale Signal</text>

  <!-- Dynamic Controller -> Consumer Rate Limiter feedback (via ConfigMap or gRPC API) -->
  <path d="M 690 370 L 590 370 L 590 180" fill="none" class="control-line" />
  <polygon points="590,180 585,188 595,188" class="arrow-ctrl" />
  <text class="sub-label" x="510" y="360" style="font-size: 10px; fill: #f43f5e;">Rate Adjust</text>

</svg>
