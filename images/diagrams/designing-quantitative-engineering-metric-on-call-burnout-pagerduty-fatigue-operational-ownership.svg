<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="500" rx="10" fill="#0d1117"/>
  
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="gradient-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d419e"/>
    </linearGradient>
    <linearGradient id="gradient-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#5522b0"/>
    </linearGradient>
    <linearGradient id="gradient-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#c25000"/>
    </linearGradient>
    <linearGradient id="gradient-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#1b7c2a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">On-Call Burnout Metric (PFS) Architecture</text>
  <text x="30" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">Pipeline for ingestion, computation, and actionability of the Pager Fatigue Score</text>

  <!-- Connector Lines -->
  <!-- Webhooks to Ingestion -->
  <path d="M 180 200 L 260 200" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="260,200 250,195 250,205" fill="#30363d"/>
  
  <!-- Ingestion to DB -->
  <path d="M 400 200 L 480 200" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="480,200 470,195 470,205" fill="#30363d"/>

  <!-- DB to Calculator -->
  <path d="M 620 200 L 700 200" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="700,200 690,195 690,205" fill="#30363d"/>

  <!-- Calculator to Destinations -->
  <!-- Dashboards -->
  <path d="M 760 250 L 760 360 L 620 360" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="620,360 630,355 630,365" fill="#30363d"/>

  <!-- Slack Alerts -->
  <path d="M 760 250 L 760 430 L 620 430" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="620,430 630,425 630,435" fill="#30363d"/>

  <!-- Source Block: PagerDuty -->
  <g filter="url(#shadow)">
    <rect x="30" y="140" width="150" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="30" y="140" width="150" height="8" rx="8" fill="url(#gradient-orange)"/>
    <text x="105" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f0f6fc" text-anchor="middle">PagerDuty API</text>
    <text x="105" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Webhook Events</text>
    <text x="105" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">&amp; REST Polling</text>
  </g>

  <!-- Ingestion Service -->
  <g filter="url(#shadow)">
    <rect x="260" y="140" width="140" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="260" y="140" width="140" height="8" rx="8" fill="url(#gradient-blue)"/>
    <text x="330" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Ingestion Worker</text>
    <text x="330" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Go / Lambda</text>
    <text x="330" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Normalizes Webhooks</text>
  </g>

  <!-- Storage: DB -->
  <g filter="url(#shadow)">
    <rect x="480" y="140" width="140" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="480" y="140" width="140" height="8" rx="8" fill="url(#gradient-purple)"/>
    <text x="550" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f0f6fc" text-anchor="middle">TimescaleDB</text>
    <text x="550" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">PostgreSQL Store</text>
    <text x="550" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Incident &amp; Shift logs</text>
  </g>

  <!-- Computation Engine -->
  <g filter="url(#shadow)">
    <rect x="700" y="140" width="170" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="700" y="140" width="170" height="8" rx="8" fill="url(#gradient-green)"/>
    <text x="785" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Burnout Calculator</text>
    <text x="785" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Calculates PFS based on:</text>
    <text x="785" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">- Alert Time (Sleep/Off)</text>
    <text x="785" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">- Frequency &amp; Urgency</text>
  </g>

  <!-- Visualisation: Grafana -->
  <g filter="url(#shadow)">
    <rect x="470" y="320" width="150" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="545" y="345" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Grafana Dashboards</text>
    <text x="545" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Team PFS &amp; Long Term Trends</text>
  </g>

  <!-- Action: Slack / Alerting -->
  <g filter="url(#shadow)">
    <rect x="470" y="390" width="150" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="545" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Slack / Alerting</text>
    <text x="545" y="430" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Trigger Backup Shift Swap</text>
  </g>
</svg>
