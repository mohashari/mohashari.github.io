<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="go-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#007d9c"/>
    </linearGradient>
    <linearGradient id="redis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="zset-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-go" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00ADD8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  
  <!-- Outer Border Grid Pattern -->
  <g opacity="0.05">
    <path d="M 0,50 L 900,50 M 0,100 L 900,100 M 0,150 L 900,150 M 0,200 L 900,200 M 0,250 L 900,250 M 0,300 L 900,300 M 0,350 L 900,350 M 0,400 L 900,400 M 0,450 L 900,450 M 0,500 L 900,500" stroke="#94A3B8" stroke-width="1"/>
    <path d="M 100,0 L 100,550 M 200,0 L 200,550 M 300,0 L 300,550 M 400,0 L 400,550 M 500,0 L 500,550 M 600,0 L 600,550 M 700,0 L 700,550 M 800,0 L 800,550" stroke="#94A3B8" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1">
    SLIDING WINDOW LOG RATE LIMITER ARCHITECTURE
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">
    Distributed sliding-window enforcement using pipelined Redis Cluster commands
  </text>

  <!-- ==================== CLIENTS ==================== -->
  <g transform="translate(50, 180)" filter="url(#shadow)">
    <!-- Client Box -->
    <rect width="140" height="180" rx="8" fill="url(#client-grad)"/>
    <rect x="2" y="2" width="136" height="176" rx="6" fill="#0F172A" opacity="0.9"/>
    <text x="70" y="30" text-anchor="middle" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Client Traffic</text>
    
    <!-- User A -->
    <rect x="15" y="55" width="110" height="40" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="70" y="72" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">IP: 198.51.100.42</text>
    <text x="70" y="86" text-anchor="middle" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="9">Tenant ID: usr_99a2</text>

    <!-- User B -->
    <rect x="15" y="110" width="110" height="40" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="70" y="127" text-anchor="middle" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">IP: 203.0.113.88</text>
    <text x="70" y="141" text-anchor="middle" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="9">Tenant ID: usr_14ff</text>
  </g>

  <!-- ==================== GO GATEWAY / APP LAYER ==================== -->
  <!-- Go Node 1 -->
  <g transform="translate(280, 100)" filter="url(#shadow)">
    <rect width="180" height="140" rx="8" fill="url(#go-grad)"/>
    <rect x="2" y="2" width="176" height="136" rx="6" fill="#0F172A" opacity="0.95"/>
    <text x="90" y="28" text-anchor="middle" fill="#00ADD8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Go App Instance #1</text>
    <text x="90" y="45" text-anchor="middle" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="10">API Gateway Node</text>
    
    <!-- Middleware Box -->
    <rect x="15" y="65" width="150" height="55" rx="4" fill="#1E293B" stroke="#00ADD8" stroke-width="1"/>
    <text x="90" y="85" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Limiter Middleware</text>
    <text x="90" y="100" text-anchor="middle" fill="#00ADD8" font-family="Courier New, monospace" font-size="9">redis.Pipeliner</text>
  </g>

  <!-- Go Node 2 -->
  <g transform="translate(280, 300)" filter="url(#shadow)">
    <rect width="180" height="140" rx="8" fill="url(#go-grad)"/>
    <rect x="2" y="2" width="176" height="136" rx="6" fill="#0F172A" opacity="0.95"/>
    <text x="90" y="28" text-anchor="middle" fill="#00ADD8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Go App Instance #2</text>
    <text x="90" y="45" text-anchor="middle" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="10">API Gateway Node</text>
    
    <!-- Middleware Box -->
    <rect x="15" y="65" width="150" height="55" rx="4" fill="#1E293B" stroke="#00ADD8" stroke-width="1"/>
    <text x="90" y="85" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Limiter Middleware</text>
    <text x="90" y="100" text-anchor="middle" fill="#00ADD8" font-family="Courier New, monospace" font-size="9">redis.Pipeliner</text>
  </g>

  <!-- ==================== REDIS CLUSTER ==================== -->
  <g transform="translate(560, 80)" filter="url(#shadow)">
    <!-- Redis Cluster Border -->
    <rect width="290" height="380" rx="12" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
    <text x="145" y="-15" text-anchor="middle" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">REDIS CLUSTER</text>
    
    <!-- Shard 1 (Active for usr_99a2 via Hash Slot) -->
    <g transform="translate(15, 20)">
      <rect width="260" height="150" rx="8" fill="url(#redis-grad)"/>
      <rect x="2" y="2" width="256" height="146" rx="6" fill="#0F172A" opacity="0.95"/>
      <text x="130" y="25" text-anchor="middle" fill="#EF4444" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Redis Master Shard #1</text>
      <text x="130" y="40" text-anchor="middle" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="9">Slots: 0 - 5460</text>
      
      <!-- Key-Value ZSET Visual -->
      <g transform="translate(15, 55)">
        <rect width="230" height="80" rx="4" fill="url(#zset-grad)" stroke="#EF4444" stroke-width="1"/>
        <text x="12" y="20" fill="#F8FAFC" font-family="Courier New, monospace" font-size="10" font-weight="700">Key: {usr_99a2}:ratelimit</text>
        <text x="12" y="35" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">Type: Sorted Set (ZSET)</text>
        
        <!-- ZSET Items -->
        <g transform="translate(10, 48)">
          <!-- Member 1 -->
          <rect x="0" y="0" width="100" height="22" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
          <text x="50" y="14" text-anchor="middle" fill="#10B981" font-family="Courier New, monospace" font-size="8">1721347140.012</text>
          
          <!-- Member 2 -->
          <rect x="110" y="0" width="100" height="22" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
          <text x="160" y="14" text-anchor="middle" fill="#10B981" font-family="Courier New, monospace" font-size="8">1721347185.340</text>
        </g>
      </g>
    </g>

    <!-- Shard 2 (Active for usr_14ff via Hash Slot) -->
    <g transform="translate(15, 200)">
      <rect width="260" height="150" rx="8" fill="url(#redis-grad)"/>
      <rect x="2" y="2" width="256" height="146" rx="6" fill="#0F172A" opacity="0.95"/>
      <text x="130" y="25" text-anchor="middle" fill="#EF4444" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Redis Master Shard #2</text>
      <text x="130" y="40" text-anchor="middle" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="9">Slots: 5461 - 10922</text>
      
      <!-- Key-Value ZSET Visual -->
      <g transform="translate(15, 55)">
        <rect width="230" height="80" rx="4" fill="url(#zset-grad)" stroke="#EF4444" stroke-width="1"/>
        <text x="12" y="20" fill="#F8FAFC" font-family="Courier New, monospace" font-size="10" font-weight="700">Key: {usr_14ff}:ratelimit</text>
        <text x="12" y="35" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">Type: Sorted Set (ZSET)</text>
        
        <!-- ZSET Items -->
        <g transform="translate(10, 48)">
          <!-- Member 1 -->
          <rect x="0" y="0" width="100" height="22" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
          <text x="50" y="14" text-anchor="middle" fill="#10B981" font-family="Courier New, monospace" font-size="8">1721347190.115</text>
          
          <!-- Member 2 -->
          <rect x="110" y="0" width="100" height="22" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
          <text x="160" y="14" text-anchor="middle" fill="#10B981" font-family="Courier New, monospace" font-size="8">1721347198.882</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== FLOW LINES & LABELS ==================== -->
  
  <!-- Client to Go Node 1 -->
  <path d="M 190,240 L 270,180" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="215" y="200" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" transform="rotate(-30, 215, 200)">GET /api/v1/resource</text>
  
  <!-- Client to Go Node 2 -->
  <path d="M 190,300 L 270,360" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)" opacity="0.7"/>

  <!-- Go Node 1 to Redis Master Shard 1 (Hash slot mapping) -->
  <path d="M 460,150 L 565,120" fill="none" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow-go)"/>
  <text x="510" y="125" fill="#00ADD8" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" transform="rotate(-15, 510, 125)">1. Redis Pipeline</text>

  <!-- Go Node 1 to Redis Master Shard 2 -->
  <path d="M 460,180 L 565,280" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  
  <!-- Go Node 2 to Redis Master Shard 2 -->
  <path d="M 460,370 L 565,320" fill="none" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow-go)"/>

  <!-- Pipeline Details Annotation Box (Center Bottom) -->
  <g transform="translate(230, 465)">
    <rect width="440" height="65" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="15" y="20" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Atomic Multi-Command Pipelining Steps:</text>
    <text x="15" y="38" fill="#94A3B8" font-family="Courier New, monospace" font-size="10">1. ZREMRANGEBYSCORE key -inf (now - window)</text>
    <text x="15" y="52" fill="#94A3B8" font-family="Courier New, monospace" font-size="10">2. ZCARD key | 3. ZADD key now now | 4. EXPIRE key window</text>
  </g>
</svg>
