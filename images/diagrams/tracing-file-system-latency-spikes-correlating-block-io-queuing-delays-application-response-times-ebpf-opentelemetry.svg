<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" fill="#0f172a" rx="8"/>
  
  <!-- Boundary Grid -->
  <line x1="40" y1="230" x2="760" y2="230" stroke="#334155" stroke-dasharray="5,5" stroke-width="1.5"/>
  <text x="50" y="220" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">USER SPACE</text>
  <text x="50" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">KERNEL SPACE</text>

  <!-- User Space Components -->
  <!-- Application Block -->
  <rect x="80" y="50" width="220" height="130" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="190" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Application Server</text>
  <rect x="95" y="95" width="190" height="35" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-dasharray="3,3"/>
  <text x="190" y="117" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Active OTel Span Context</text>
  <text x="190" y="138" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">(TraceID, SpanID on Thread/Task)</text>

  <!-- eBPF Agent Block -->
  <rect x="360" y="50" width="200" height="130" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="460" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">eBPF Collector Agent</text>
  <rect x="375" y="95" width="170" height="35" rx="4" fill="#0f172a" stroke="#34d399"/>
  <text x="460" y="117" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">BPF Ring Buffer Reader</text>
  <text x="460" y="138" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">(Correlates PID/TID to Span)</text>

  <!-- OTel Collector Block -->
  <rect x="610" y="50" width="140" height="130" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="680" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OTel Collector</text>
  <rect x="625" y="105" width="110" height="50" rx="4" fill="#0f172a" stroke="#fbbf24"/>
  <text x="680" y="125" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Span Correlation</text>
  <text x="680" y="140" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Engine</text>

  <!-- Kernel Space Components -->
  <!-- VFS Layer -->
  <rect x="80" y="280" width="220" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="190" y="310" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Virtual File System (VFS)</text>

  <!-- I/O Queue / Block Layer -->
  <rect x="80" y="380" width="220" height="80" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="190" y="405" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Block I/O Layer</text>
  <!-- Queue visualization -->
  <rect x="100" y="418" width="25" height="25" rx="3" fill="#ef4444" opacity="0.8"/>
  <rect x="130" y="418" width="25" height="25" rx="3" fill="#f97316" opacity="0.8"/>
  <rect x="160" y="418" width="25" height="25" rx="3" fill="#eab308" opacity="0.8"/>
  <text x="215" y="435" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">I/O Queue</text>

  <!-- BPF Maps Block -->
  <rect x="360" y="280" width="200" height="180" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <text x="460" y="305" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">eBPF Kernel Probes &amp; Maps</text>
  
  <rect x="375" y="325" width="170" height="40" rx="4" fill="#1f2937" stroke="#059669"/>
  <text x="460" y="342" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">map: active_traces</text>
  <text x="460" y="355" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">[PID/TID] -&gt; SpanContext</text>

  <rect x="375" y="375" width="170" height="40" rx="4" fill="#1f2937" stroke="#059669"/>
  <text x="460" y="392" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">map: io_start_times</text>
  <text x="460" y="405" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">[BIO Pointer] -&gt; timestamp</text>
  
  <text x="460" y="445" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">Ring Buffer Events</text>

  <!-- Physical Disk -->
  <path d="M 640 370 A 30 10 0 0 0 700 370 L 700 420 A 30 10 0 0 1 640 420 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <ellipse cx="670" cy="370" rx="30" ry="10" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <text x="670" y="405" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Physical Disk</text>

  <!-- Connectors & Arrows -->
  <!-- App syscall to VFS -->
  <path d="M 140 180 L 140 280" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="95" y="240" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. Syscalls</text>

  <!-- VFS to Block Layer -->
  <path d="M 190 330 L 190 380" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow-grey)"/>
  
  <!-- Block Layer to Disk -->
  <path d="M 300 420 L 640 420" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="320" y="440" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">I/O Submit/Complete</text>

  <!-- Hook VFS probe -->
  <path d="M 300 305 L 360 305" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <ellipse cx="300" cy="305" rx="3" ry="3" fill="#10b981"/>
  <text x="315" y="298" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">kprobe</text>

  <!-- Hook Block I/O tracepoint -->
  <path d="M 300 400 L 360 400" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <ellipse cx="300" cy="400" rx="3" ry="3" fill="#10b981"/>
  <text x="315" y="393" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">tracepoint</text>

  <!-- Kernel-User Map Sync (eBPF Agent) -->
  <path d="M 460 280 L 460 180" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="465" y="240" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. Latency + Context</text>

  <!-- Trace context sharing -->
  <path d="M 300 115 L 375 115" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="338" y="108" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Trace Context</text>

  <!-- Export App Spans -->
  <path d="M 300 145 C 330 160, 580 160, 610 145" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="590" y="165" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">App Spans</text>

  <!-- Export eBPF Kernel Spans -->
  <path d="M 560 115 L 610 115" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="585" y="105" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">I/O Spans</text>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>
</svg>
