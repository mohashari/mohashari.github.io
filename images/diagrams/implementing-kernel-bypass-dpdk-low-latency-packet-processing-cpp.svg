<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="dpdkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400"/>
    <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500"/>
  </g>

  <!-- Title / Legend -->
  <text x="30" y="40" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold">DPDK Kernel Bypass vs. Standard Kernel Stack</text>
  <text x="30" y="60" fill="#64748b" font-family="monospace" font-size="12">Low-Latency Packet Processing Architecture in C++</text>

  <!-- Standard Kernel Path Boundary -->
  <rect x="50" y="100" width="320" height="350" rx="8" fill="url(#kernelGrad)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="65" y="125" fill="#ef4444" font-family="monospace" font-size="14" font-weight="bold">Standard Kernel Stack (Slow Path)</text>
  <text x="65" y="142" fill="#94a3b8" font-family="monospace" font-size="11">High Latency: Interrupts &amp; Context Switches</text>

  <!-- DPDK Bypass Path Boundary -->
  <rect x="430" y="100" width="320" height="350" rx="8" fill="url(#dpdkGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="445" y="125" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">DPDK Kernel Bypass (Fast Path)</text>
  <text x="445" y="142" fill="#94a3b8" font-family="monospace" font-size="11">Zero-Copy, Lockless Ring, CPU Pinning (PMD)</text>

  <!-- Hardware Layer (NIC) -->
  <rect x="100" y="400" width="220" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="210" y="425" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">Physical NIC (Standard)</text>

  <rect x="480" y="400" width="220" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="590" y="425" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">Physical NIC (SR-IOV / DPDK Bound)</text>

  <!-- Kernel Space (Left Path) -->
  <g transform="translate(100, 260)">
    <rect width="220" height="90" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="110" y="25" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Linux Kernel Space</text>
    <text x="110" y="45" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">1. Hardware Interrupt (IRQ)</text>
    <text x="110" y="60" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">2. SoftIRQ / NAPI poll</text>
    <text x="110" y="75" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">3. Socket Buffer (sk_buff) Alloc</text>
  </g>

  <!-- User Space App (Left Path) -->
  <g transform="translate(100, 160)">
    <rect width="220" height="60" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="110" y="25" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">User Space Application</text>
    <text x="110" y="45" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">recv() / read() syscalls</text>
  </g>

  <!-- DPDK User Space PMD & Lockless Ring (Right Path) -->
  <g transform="translate(480, 260)">
    <rect width="220" height="90" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="110" y="25" fill="#10b981" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">DPDK Poll Mode Driver</text>
    <text x="110" y="45" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="middle">Kernel Bypassed: UIOMU / VFIO</text>
    <text x="110" y="60" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="middle">Direct DMA to Hugepages</text>
    <text x="110" y="75" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="middle">rte_ring (Lockless Queue)</text>
  </g>

  <g transform="translate(480, 160)">
    <rect width="220" height="60" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="110" y="25" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">C++ Packet Processor</text>
    <text x="110" y="45" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">rte_eth_rx_burst() on Dedicated Core</text>
  </g>

  <!-- Flow Arrows - Left Path (Red) -->
  <line x1="210" y1="400" x2="210" y2="353" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="210" y1="260" x2="210" y2="223" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M 210,160 C 210,140 180,140 180,160" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-red)"/>
  <text x="160" y="145" fill="#ef4444" font-family="monospace" font-size="9">Context Switch</text>

  <!-- Flow Arrows - Right Path (Green) -->
  <path d="M 590,400 L 590,353" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="600" y="380" fill="#10b981" font-family="monospace" font-size="10">Zero-Copy DMA</text>
  <line x1="590" y1="260" x2="590" y2="223" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="600" y="245" fill="#10b981" font-family="monospace" font-size="10">Polling (100% CPU)</text>

  <!-- Label/Indicator for Kernel Bypass -->
  <path d="M 370,280 L 430,280" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="400" cy="280" r="12" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="400" y="284" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">X</text>
  <text x="400" y="305" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">No Kernel OS Overhead</text>
</svg>
