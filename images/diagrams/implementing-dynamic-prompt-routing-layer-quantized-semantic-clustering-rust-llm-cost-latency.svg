<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title & Background Grid -->
  <rect width="1000" height="650" fill="#0f172a" />
  <g stroke="#1e293b" stroke-width="1">
    <path d="M 0 100 L 1000 100 M 0 200 L 1000 200 M 0 300 L 1000 300 M 0 400 L 1000 400 M 0 500 L 1000 500 M 0 600 L 1000 600" />
    <path d="M 100 0 L 100 650 M 200 0 L 200 650 M 300 0 L 300 650 M 400 0 L 400 650 M 500 0 L 500 650 M 600 0 L 600 650 M 700 0 L 700 650 M 800 0 L 800 650 M 900 0 L 900 650" />
  </g>

  <!-- Header Panel -->
  <text x="50" y="55" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="0.5">DYNAMIC PROMPT ROUTER (RUST LAYER)</text>
  <text x="50" y="80" fill="#64748b" font-size="14">Quantized Semantic Clustering &amp; Predictive Routing Architecture</text>

  <!-- 1. Incoming Prompt -->
  <g transform="translate(50, 240)">
    <rect width="160" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="80" y="35" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">User Prompt</text>
    <rect x="15" y="55" width="130" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="71" fill="#94a3b8" font-size="11" font-family="monospace">{"prompt": "..."}</text>
    <text x="80" y="105" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">gRPC / HTTPS API</text>
  </g>

  <!-- Connection: Prompt -> Local Embedder -->
  <path d="M 210 300 L 270 300" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. Local Embedder (ONNX) -->
  <g transform="translate(280, 210)">
    <rect width="180" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="0" y="0" width="180" height="40" rx="8" fill="url(#blue-grad)" />
    <text x="90" y="25" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1. ONNX Embedder</text>
    
    <text x="90" y="65" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">BGE-Micro-v2</text>
    <text x="90" y="85" fill="#94a3b8" font-size="11" text-anchor="middle">Local CPU/GPU Inference</text>
    
    <line x1="20" y1="105" x2="160" y2="105" stroke="#334155" stroke-width="1" />
    
    <text x="90" y="125" fill="#e2e8f0" font-size="12" text-anchor="middle">Output Vector:</text>
    <text x="90" y="145" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">FP32 [384 dims]</text>
    <text x="90" y="165" fill="#64748b" font-size="10" text-anchor="middle">Latency: ~2.5ms</text>
  </g>

  <!-- Connection: Embedder -> Quantization -->
  <path d="M 460 300 L 520 300" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Quantization & Distance Engine -->
  <g transform="translate(530, 200)">
    <rect width="200" height="200" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <rect x="0" y="0" width="200" height="40" rx="8" fill="url(#emerald-grad)" />
    <text x="100" y="25" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2. Quantizer &amp; Router</text>
    
    <text x="10" y="65" fill="#f8fafc" font-size="12" font-weight="600">Scalar Quantization</text>
    <text x="10" y="80" fill="#94a3b8" font-size="11">FP32 Vector -&gt; INT8 Quantized</text>

    <line x1="10" y1="95" x2="190" y2="95" stroke="#334155" stroke-width="1" />
    
    <text x="10" y="115" fill="#f8fafc" font-size="12" font-weight="600">Cosine Distance Engine</text>
    <text x="10" y="130" fill="#94a3b8" font-size="11">SIMD AVX2/NEON Cluster Match</text>
    <text x="10" y="145" fill="#34d399" font-size="10" font-family="monospace">distance = 1.0 - (A·B)/(||A||||B||)</text>

    <line x1="10" y1="155" x2="190" y2="155" stroke="#334155" stroke-width="1" />
    
    <text x="100" y="175" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">Lookup Latency: &lt; 80µs</text>
    <text x="100" y="190" fill="#64748b" font-size="10" text-anchor="middle">Memory Footprint: ~12MB</text>
  </g>

  <!-- Branching Connections from Router to Targets -->
  <!-- Upper Route (Low Cost) -->
  <path d="M 730 250 L 780 250 L 780 150 L 810 150" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Middle Route (Balanced) -->
  <path d="M 730 300 L 810 300" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Lower Route (High Reasoning) -->
  <path d="M 730 350 L 780 350 L 780 450 L 810 450" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. Target LLM Clusters -->
  <!-- Target A: Low-Cost / Commodity (Haiku / 4o-mini) -->
  <g transform="translate(820, 90)">
    <rect width="150" height="110" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
    <rect x="0" y="0" width="150" height="30" rx="6" fill="url(#amber-grad)" />
    <text x="75" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Commodity Tier</text>
    <text x="75" y="50" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Claude 3 Haiku / 4o-mini</text>
    <text x="75" y="70" fill="#34d399" font-size="11" text-anchor="middle">Cost: $0.15 / M tokens</text>
    <text x="75" y="90" fill="#fbbf24" font-size="11" text-anchor="middle">Latency: ~200ms</text>
  </g>

  <!-- Target B: Standard / Production (Sonnet 3.5 / 4o) -->
  <g transform="translate(820, 245)">
    <rect width="150" height="110" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <rect x="0" y="0" width="150" height="30" rx="6" fill="url(#indigo-grad)" />
    <text x="75" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Balanced Tier</text>
    <text x="75" y="50" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Claude 3.5 Sonnet / 4o</text>
    <text x="75" y="70" fill="#34d399" font-size="11" text-anchor="middle">Cost: $3.00 / M tokens</text>
    <text x="75" y="90" fill="#818cf8" font-size="11" text-anchor="middle">Latency: ~900ms</text>
  </g>

  <!-- Target C: Complex Reasoning (o1 / DeepSeek R1) -->
  <g transform="translate(820, 395)">
    <rect width="150" height="110" rx="6" fill="#1e293b" stroke="#f87171" stroke-width="2" />
    <rect x="0" y="0" width="150" height="30" rx="6" fill="url(#rose-grad)" />
    <text x="75" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Reasoning Tier</text>
    <text x="75" y="50" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">OpenAI o1 / R1</text>
    <text x="75" y="70" fill="#f87171" font-size="11" text-anchor="middle">Cost: $15.00 / M tokens</text>
    <text x="75" y="90" fill="#f87171" font-size="11" text-anchor="middle">Latency: ~4.5s</text>
  </g>

  <!-- Legend & Bottom Details -->
  <rect x="50" y="540" width="920" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="70" cy="570" r="6" fill="#fbbf24" />
  <text x="85" y="574" fill="#94a3b8" font-size="12">Low complexity (e.g. greetings, simple lookups)</text>
  
  <circle cx="380" cy="570" r="6" fill="#818cf8" />
  <text x="395" y="574" fill="#94a3b8" font-size="12">Structured generation, medium code gen</text>
  
  <circle cx="680" cy="570" r="6" fill="#f87171" />
  <text x="695" y="574" fill="#94a3b8" font-size="12">Complex reasoning, math, deep code refactoring</text>
</svg>
