<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <!-- Background -->
  <rect width="960" height="480" rx="12" fill="#0b0f19"/>
  
  <!-- Grid pattern for aesthetic background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="envoyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e40"/>
      <stop offset="100%" stop-color="#e1251b"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="url(#grid)" rx="12"/>

  <!-- TITLE -->
  <text x="30" y="40" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="bold">Envoy Sidecar mTLS (No Service Mesh)</text>
  <text x="30" y="60" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="12">Direct Service-to-Service Mutual TLS via Static/SDS-driven Envoy Sidecars</text>

  <!-- POD / HOST 1 (CLIENT) -->
  <rect x="40" y="100" width="380" height="340" rx="10" fill="#111827" stroke="#1f2937" stroke-width="2"/>
  <rect x="40" y="100" width="380" height="35" rx="10" fill="#1f2937" fill-opacity="0.5"/>
  <text x="60" y="122" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold">CLIENT NODE / POD (e.g. Kubernetes, VM)</text>

  <!-- Service A Container -->
  <rect x="60" y="160" width="140" height="110" rx="8" fill="url(#blueGrad)" fill-opacity="0.15" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="195" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold">Service A</text>
  <text x="80" y="215" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="11">App Container</text>
  <text x="80" y="245" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="10">Initiates outbound</text>

  <!-- Envoy Client Sidecar (Outbound Proxy) -->
  <rect x="260" y="160" width="140" height="110" rx="8" fill="url(#envoyGrad)" fill-opacity="0.15" stroke="#ea580c" stroke-width="2"/>
  <text x="280" y="195" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold">Envoy Proxy</text>
  <text x="280" y="215" fill="#ff7e40" font-family="Inter, system-ui, sans-serif" font-size="11">Outbound Sidecar</text>
  <text x="280" y="245" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="10">Local Port: 9001</text>

  <!-- Client Certs -->
  <rect x="140" y="320" width="180" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="155" y="342" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold">Certificates &amp; Keys (SDS / Files)</text>
  <text x="155" y="362" fill="#64748b" font-family="monospace" font-size="10">├─ client-cert.pem</text>
  <text x="155" y="377" fill="#64748b" font-family="monospace" font-size="10">├─ client-key.pem</text>
  <text x="155" y="392" fill="#64748b" font-family="monospace" font-size="10">└─ ca-certificates.crt</text>


  <!-- CONNECTION CLIENT APP -> ENVOY -->
  <path d="M 200 215 L 260 215" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="255,210 260,215 255,220" fill="#94a3b8"/>
  <text x="207" y="205" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Plaintext</text>
  <text x="207" y="232" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">127.0.0.1:9001</text>

  <!-- CONNECTION CLIENT CERT STORAGE -> ENVOY -->
  <path d="M 230 320 L 230 295 L 330 295 L 330 270" fill="none" stroke="#475569" stroke-width="1.5"/>
  <polygon points="327,275 330,270 333,275" fill="#475569"/>
  <text x="280" y="290" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Dynamic Reload (SDS)</text>


  <!-- POD / HOST 2 (SERVER) -->
  <rect x="540" y="100" width="380" height="340" rx="10" fill="#111827" stroke="#1f2937" stroke-width="2"/>
  <rect x="540" y="100" width="380" height="35" rx="10" fill="#1f2937" fill-opacity="0.5"/>
  <text x="560" y="122" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold">SERVER NODE / POD (e.g. Kubernetes, VM)</text>

  <!-- Envoy Server Sidecar (Inbound Proxy) -->
  <rect x="560" y="160" width="140" height="110" rx="8" fill="url(#envoyGrad)" fill-opacity="0.15" stroke="#ea580c" stroke-width="2"/>
  <text x="580" y="195" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold">Envoy Proxy</text>
  <text x="580" y="215" fill="#ff7e40" font-family="Inter, system-ui, sans-serif" font-size="11">Inbound Sidecar</text>
  <text x="580" y="245" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="10">Listen Port: 8443</text>

  <!-- Service B Container -->
  <rect x="760" y="160" width="140" height="110" rx="8" fill="url(#tealGrad)" fill-opacity="0.15" stroke="#0f766e" stroke-width="2"/>
  <text x="780" y="195" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold">Service B</text>
  <text x="780" y="215" fill="#2dd4bf" font-family="Inter, system-ui, sans-serif" font-size="11">App Container</text>
  <text x="780" y="245" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="10">Receives request</text>

  <!-- Server Certs -->
  <rect x="640" y="320" width="180" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="655" y="342" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold">Certificates &amp; Keys (SDS / Files)</text>
  <text x="655" y="362" fill="#64748b" font-family="monospace" font-size="10">├─ server-cert.pem</text>
  <text x="655" y="377" fill="#64748b" font-family="monospace" font-size="10">├─ server-key.pem</text>
  <text x="655" y="392" fill="#64748b" font-family="monospace" font-size="10">└─ ca-certificates.crt</text>

  <!-- CONNECTION ENVOY -> SERVER APP -->
  <path d="M 700 215 L 760 215" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="755,210 760,215 755,220" fill="#94a3b8"/>
  <text x="730" y="205" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Plaintext</text>
  <text x="730" y="232" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">127.0.0.1:8080</text>

  <!-- CONNECTION SERVER CERT STORAGE -> ENVOY -->
  <path d="M 730 320 L 730 295 L 630 295 L 630 270" fill="none" stroke="#475569" stroke-width="1.5"/>
  <polygon points="627,275 630,270 633,275" fill="#475569"/>
  <text x="680" y="290" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Dynamic Reload (SDS)</text>


  <!-- MTLS NETWORK CONNECTION (ENVOY OUTBOUND -> ENVOY INBOUND) -->
  <!-- Glowing background line for mTLS path -->
  <path d="M 400 215 L 560 215" fill="none" stroke="url(#glowGrad)" stroke-width="10" filter="url(#glow)"/>
  <!-- Primary connection line -->
  <path d="M 400 215 L 560 215" fill="none" stroke="#10b981" stroke-width="3"/>
  
  <!-- Handshake icons/labels -->
  <circle cx="480" cy="215" r="18" fill="#111827" stroke="#10b981" stroke-width="2"/>
  <!-- Padlock Icon in SVG -->
  <path d="M 476 218 L 484 218 L 484 213 L 476 213 Z M 477 213 L 477 210 A 3 3 0 0 1 483 210 L 483 213" fill="none" stroke="#10b981" stroke-width="1.5"/>
  
  <text x="480" y="180" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))">Mutual TLS 1.3</text>
  <text x="480" y="193" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Port 8443 (SAN Validation)</text>
  <text x="480" y="247" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Mutual Cryptographic Identity verification</text>
</svg>
