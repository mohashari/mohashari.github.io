<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Definitions for gradients, markers, filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Box Gradients -->
    <linearGradient id="go-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADD8" />
      <stop offset="100%" stop-color="#0083B0" />
    </linearGradient>
    <linearGradient id="kernel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="ebpf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="nic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow-go" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00ADD8" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-ebpf" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" rx="12" fill="url(#bg-grad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">TCP Socket Buffer Bloat &amp; eBPF Observability Pipeline</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Visualizing how eBPF probes intercept kernel socket buffers to measure queueing delay.</text>

  <!-- Boundary: USER SPACE -->
  <rect x="30" y="90" width="840" height="180" rx="8" fill="#1e293b" fill-opacity="0.3" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="45" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">USER SPACE</text>

  <!-- Go Application Block -->
  <rect x="60" y="140" width="220" height="100" rx="8" fill="url(#go-grad)" filter="url(#glow-go)" />
  <text x="75" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Go Service (netpoll)</text>
  <text x="75" y="195" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11">gRPC/HTTP Server</text>
  <text x="75" y="215" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11">Writes packets via net.Conn</text>

  <!-- Go Observability Daemon Block -->
  <rect x="600" y="140" width="240" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="615" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">eBPF Telemetry Agent</text>
  <text x="615" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Reads Ring Buffer Events</text>
  <text x="615" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Exposes Prometheus tcp_queue_latency_ns</text>

  <!-- Boundary: KERNEL SPACE -->
  <rect x="30" y="290" width="840" height="280" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="45" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">KERNEL SPACE</text>

  <!-- System Call Transition -->
  <path d="M 170 240 L 170 330" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#arrow-blue)"/>
  <text x="180" y="280" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">write() / sendmsg()</text>

  <!-- Socket Buffer (sk_buff) Queue Structure -->
  <rect x="60" y="340" width="480" height="130" rx="8" fill="url(#kernel-grad)" stroke="#475569" stroke-width="1.5"/>
  <text x="75" y="365" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Socket Write Queue (sk_write_queue)</text>
  
  <!-- sk_buff blocks representing buffer bloat -->
  <!-- Block 1: Acked (leaving) -->
  <rect x="75" y="385" width="80" height="45" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="85" y="405" fill="#94a3b8" font-family="monospace" font-size="10">sk_buff [1]</text>
  <text x="85" y="420" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">Sent &amp; Acked</text>

  <!-- Block 2: In-flight / Unacked -->
  <rect x="165" y="385" width="80" height="45" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="405" fill="#94a3b8" font-family="monospace" font-size="10">sk_buff [2]</text>
  <text x="175" y="420" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9">In-Flight</text>

  <!-- Block 3: Unsent (Buffer Bloat area) -->
  <rect x="255" y="385" width="110" height="45" rx="4" fill="#2d1b24" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="265" y="405" fill="#f43f5e" font-family="monospace" font-size="10">sk_buff [3..N]</text>
  <text x="265" y="420" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="9">Unsent (Bloated)</text>
  
  <!-- TCP_NOTSENT_LOWAT Limit Marker -->
  <line x1="250" y1="375" x2="250" y2="445" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="220" y="460" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">LOWAT Limit</text>

  <!-- Queueing delay bracket -->
  <path d="M 255 440 L 365 440" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="260" y="452" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="9">Queueing Delay (ms)</text>

  <!-- TCP/IP Engine -->
  <rect x="420" y="385" width="100" height="45" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="430" y="405" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">TCP Engine</text>
  <text x="430" y="420" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Congestion/CC</text>

  <!-- Flow lines within Kernel Queue -->
  <path d="M 370 407 L 410 407" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- eBPF Subsystem -->
  <rect x="330" y="490" width="350" height="65" rx="8" fill="url(#ebpf-grad)" filter="url(#glow-ebpf)"/>
  <text x="345" y="515" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">eBPF Latency Engine</text>
  <text x="345" y="535" fill="#e6f4ea" font-family="system-ui, sans-serif" font-size="10">Hooks: kprobe:tcp_sendmsg | kprobe:tcp_write_xmit</text>

  <!-- Probes hooking points -->
  <!-- Probe 1 -->
  <path d="M 170 330 L 330 500" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow-green)"/>
  <circle cx="170" cy="330" r="4" fill="#10b981"/>
  <text x="120" y="325" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">tcp_sendmsg()</text>

  <!-- Probe 2 -->
  <path d="M 420 407 L 390 490" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow-green)"/>
  <circle cx="420" cy="407" r="4" fill="#10b981"/>
  <text x="430" y="375" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">tcp_write_xmit()</text>

  <!-- eBPF Maps & Ring Buffer communication -->
  <rect x="680" y="340" width="160" height="130" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="695" y="365" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">eBPF Maps</text>
  <rect x="695" y="380" width="130" height="35" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="705" y="400" fill="#10b981" font-family="monospace" font-size="9">hash_map (timestamps)</text>
  <rect x="695" y="423" width="130" height="35" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="705" y="443" fill="#10b981" font-family="monospace" font-size="9">ring_buffer (events)</text>

  <!-- Data pipeline from Engine to Maps -->
  <path d="M 600 520 L 760 520 L 760 468" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="695" y="510" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">Submit Event</text>

  <!-- Data pipeline from Ring buffer to Daemon in user space -->
  <path d="M 760 340 L 760 250" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#arrow-blue)"/>
  <text x="770" y="295" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">Ringbuf Poll</text>

  <!-- Network Interface Card (NIC) / Egress -->
  <rect x="580" y="385" width="80" height="45" rx="4" fill="url(#nic-grad)" stroke="#d97706" stroke-width="1.5"/>
  <text x="590" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">NIC (tx)</text>
  <text x="590" y="420" fill="#feebc8" font-family="system-ui, sans-serif" font-size="9">fq / qdisc</text>

  <path d="M 520 407 L 570 407" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 660 407 L 850 407" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="398" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">To Wire (Egress)</text>
</svg>
