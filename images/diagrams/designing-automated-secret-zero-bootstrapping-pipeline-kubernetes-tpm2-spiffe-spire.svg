<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0b0f19" />
  <grid class="grid" />

  <!-- Title -->
  <text x="30" y="45" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
    Secret Zero Bootstrapping Pipeline (TPM 2.0 + SPIFFE/SPIRE)
  </text>
  <text x="30" y="65" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b">
    Hardware-Rooted Workload Cryptographic Identity Issuance &amp; Secret Retrieval
  </text>

  <!-- Kubernetes Node Boundary -->
  <rect x="30" y="100" width="460" height="400" rx="12" fill="url(#blueGrad)" stroke="#334155" stroke-width="2" filter="url(#dropShadow)" />
  <text x="45" y="125" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">
    Kubernetes Worker Node (Bare Metal / HSM Enabled VM)
  </text>

  <!-- Hardware Layer (TPM) -->
  <rect x="60" y="400" width="400" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="75" y="425" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
    Hardware Root of Trust
  </text>
  
  <!-- TPM 2.0 Chip -->
  <rect x="290" y="415" width="150" height="50" rx="6" fill="url(#amberGrad)" stroke="#d97706" stroke-width="1" filter="url(#dropShadow)" />
  <text x="365" y="440" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    TPM 2.0
  </text>
  <text x="365" y="453" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#fef3c7" text-anchor="middle">
    EK / AK Attestation Keys
  </text>

  <!-- SPIRE Agent -->
  <rect x="60" y="270" width="180" height="90" rx="8" fill="url(#accentGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#dropShadow)" />
  <text x="150" y="295" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    SPIRE Agent
  </text>
  <text x="150" y="315" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#e0f2fe" text-anchor="middle">
    Runs as DaemonSet
  </text>
  <rect x="80" y="328" width="140" height="20" rx="4" fill="#0c4a6e" />
  <text x="150" y="341" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">
    TPM Node Attestor
  </text>

  <!-- Workload Pod -->
  <rect x="60" y="150" width="400" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="75" y="175" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
    Workload Pod (Target Application)
  </text>
  
  <!-- App Container -->
  <rect x="80" y="190" width="160" height="40" rx="4" fill="url(#greenGrad)" stroke="#059669" stroke-width="1" />
  <text x="160" y="215" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    Application Container
  </text>
  
  <!-- SPIFFE Workload API Sidecar / Socket -->
  <rect x="290" y="190" width="150" height="40" rx="4" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="365" y="210" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="middle">
    /run/spiffe/workload.sock
  </text>
  <text x="365" y="222" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">
    Mounted Unix Domain Socket
  </text>

  <!-- Control Plane (SPIRE Server) -->
  <rect x="540" y="240" width="380" height="150" rx="12" fill="url(#blueGrad)" stroke="#334155" stroke-width="2" filter="url(#dropShadow)" />
  <text x="555" y="265" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">
    SPIRE Server (Control Plane)
  </text>

  <!-- SPIRE Server Core -->
  <rect x="560" y="285" width="160" height="85" rx="8" fill="url(#purpleGrad)" stroke="#7c3aed" stroke-width="1.5" filter="url(#dropShadow)" />
  <text x="640" y="315" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    SPIRE Server
  </text>
  <text x="640" y="335" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#f5f3ff" text-anchor="middle">
    TPM Node Resolver &amp; CA
  </text>

  <!-- Trust Database / EK Inventory -->
  <rect x="760" y="285" width="140" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="830" y="310" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">
    EK / AK Inventory
  </text>
  <text x="830" y="325" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
    Pre-registered Host
  </text>
  <text x="830" y="338" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
    Endorsement Keys
  </text>
  <rect x="775" y="348" width="110" height="16" rx="3" fill="#064e3b" />
  <text x="830" y="359" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">
    Hardware Whitelist Verified
  </text>

  <!-- HashiCorp Vault (External Secret Manager) -->
  <rect x="540" y="100" width="380" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#dropShadow)" />
  <text x="555" y="125" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
    Secret Management Plane (e.g., Vault / AWS KMS)
  </text>
  <rect x="560" y="140" width="340" height="55" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5" />
  <text x="730" y="165" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">
    HashiCorp Vault (with SPIFFE Auth Engine)
  </text>
  <text x="730" y="180" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">
    Validates SVID JWT/X.509 directly without manual bootstrap tokens
  </text>

  <!-- Connectors and Flows -->

  <!-- Flow 1: Node Attestation (TPM -> Agent -> Server) -->
  <!-- TPM to Agent -->
  <path d="M 365 415 L 365 375 L 150 375 L 150 360" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="370" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">
    1. Read TPM Quote &amp; EK Cert
  </text>

  <!-- Agent to Server -->
  <path d="M 240 315 L 550 315" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-blue)" />
  <text x="390" y="305" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">
    2. Node Attestation (Quote + Certificate)
  </text>

  <!-- Server to Inventory -->
  <path d="M 720 325 L 750 325" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Flow 2: Workload Identity SVID Issuance -->
  <!-- Agent to Workload socket -->
  <path d="M 150 270 L 150 250 L 365 250 L 365 238" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="245" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">
    3. Generate SVID &amp; mount socket
  </text>

  <!-- App Container calls Socket -->
  <path d="M 240 210 L 282 210" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="261" y="202" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">
    gRPC
  </text>

  <!-- Flow 3: Vault Authentication -->
  <!-- App Container to Vault -->
  <path d="M 160 190 L 160 115 L 530 115 L 530 150 M 530 150 L 550 150" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />
  <text x="345" y="110" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">
    4. Authenticate using SVID &amp; Retrieve Secret Zero
  </text>
</svg>
