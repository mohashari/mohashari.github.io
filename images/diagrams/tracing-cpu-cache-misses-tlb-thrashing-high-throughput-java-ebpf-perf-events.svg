<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="userSpaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="hardwareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    
    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowCyan" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-size="20" font-weight="bold" letter-spacing="0.5">CPU Cache &amp; TLB Tracing Architecture for JVM</text>
  <text x="30" y="60" fill="#94a3b8" font-size="12">Low-Overhead HW Counter PMU Profiling with eBPF and perf_events</text>

  <!-- Boundary: User Space -->
  <rect x="30" y="90" width="840" height="190" rx="8" fill="url(#userSpaceGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="42" y="102" width="90" height="22" rx="4" fill="#0284c7" />
  <text x="87" y="117" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">USER SPACE</text>

  <!-- JVM Box -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="340" height="120" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="15" y="25" fill="#38bdf8" font-size="14" font-weight="bold">Java Virtual Machine (JVM)</text>
    
    <!-- JVM Threads -->
    <rect x="15" y="40" width="140" height="65" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="25" y="58" fill="#f1f5f9" font-size="11" font-weight="bold">JIT Compiled Code</text>
    <text x="25" y="75" fill="#64748b" font-size="10">Executing Hot Loops</text>
    <text x="25" y="90" fill="#64748b" font-size="10">Pointer-chasing objects</text>

    <!-- perf.map -->
    <rect x="175" y="40" width="150" height="65" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" />
    <text x="185" y="58" fill="#fbbf24" font-size="11" font-weight="bold">/tmp/perf-PID.map</text>
    <text x="185" y="75" fill="#94a3b8" font-size="10">JVM TI / async-profiler</text>
    <text x="185" y="90" fill="#94a3b8" font-size="9">Native IP &lt;=&gt; Java Symbols</text>
  </g>

  <!-- BCC / BPFtrace tool -->
  <g transform="translate(480, 140)">
    <rect x="0" y="0" width="360" height="120" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="25" fill="#34d399" font-size="14" font-weight="bold">BPF User Daemon &amp; Tooling</text>
    
    <!-- Python script -->
    <rect x="15" y="45" width="330" height="60" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="25" y="65" fill="#f1f5f9" font-size="11" font-weight="bold">eBPF Python Loader / Symbol Resolver</text>
    <text x="25" y="82" fill="#94a3b8" font-size="10">Reads BPF maps, matches JIT addresses from perf.map</text>
    <text x="25" y="95" fill="#10b981" font-size="10">Console Output: Hot JVM methods causing misses</text>
  </g>

  <!-- Boundary: Kernel Space -->
  <rect x="30" y="300" width="840" height="170" rx="8" fill="url(#kernelGrad)" stroke="#065f46" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="42" y="312" width="100" height="22" rx="4" fill="#059669" />
  <text x="92" y="327" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">KERNEL SPACE</text>

  <!-- perf_event subsystem -->
  <g transform="translate(60, 350)">
    <rect x="0" y="0" width="220" height="100" rx="6" fill="#022c22" stroke="#059669" stroke-width="1.2" />
    <text x="15" y="25" fill="#34d399" font-size="13" font-weight="bold">perf_event Subsystem</text>
    <text x="15" y="50" fill="#93c5fd" font-size="10" font-family="monospace">perf_event_open()</text>
    <text x="15" y="68" fill="#a7f3d0" font-size="10">Triggers on counter overflow</text>
    <text x="15" y="85" fill="#a7f3d0" font-size="10">Configures HW event thresholds</text>
  </g>

  <!-- eBPF Program and Maps -->
  <g transform="translate(320, 350)">
    <rect x="0" y="0" width="520" height="100" rx="6" fill="#022c22" stroke="#34d399" stroke-width="1.5" />
    <text x="15" y="25" fill="#34d399" font-size="13" font-weight="bold">eBPF VM (JIT Compiled in Kernel)</text>

    <!-- Hook -->
    <rect x="15" y="38" width="190" height="50" rx="4" fill="#064e3b" stroke="#059669" />
    <text x="25" y="55" fill="#a7f3d0" font-size="10" font-weight="bold">Kernel Probe / Perf Hook</text>
    <text x="25" y="72" fill="#d1fae5" font-size="9" font-family="monospace">bpf_perf_event_output()</text>

    <!-- Maps -->
    <rect x="235" y="38" width="270" height="50" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="245" y="55" fill="#fb7185" font-size="11" font-weight="bold">BPF_MAP_TYPE_HASH</text>
    <text x="245" y="72" fill="#cbd5e1" font-size="10">Key: User Space Stack / Val: Event Count</text>
  </g>

  <!-- Boundary: Hardware -->
  <rect x="30" y="490" width="840" height="130" rx="8" fill="url(#hardwareGrad)" stroke="#7c2d12" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="42" y="502" width="90" height="22" rx="4" fill="#ea580c" />
  <text x="87" y="517" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">CPU HARDWARE</text>

  <!-- CPU Cache & TLB -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="460" height="65" rx="6" fill="#451a03" stroke="#ea580c" stroke-width="1.2" />
    <text x="15" y="22" fill="#ffedd5" font-size="12" font-weight="bold">CPU Cores &amp; Memory Hierarchy</text>
    
    <!-- L1/L3 Cache -->
    <rect x="15" y="32" width="200" height="23" rx="3" fill="#7c2d12" stroke="#ea580c" stroke-width="0.8" />
    <text x="115" y="47" fill="#ffedd5" font-size="10" text-anchor="middle" font-weight="bold">L1/L2/L3 Cache (LLC)</text>

    <!-- TLB -->
    <rect x="235" y="32" width="210" height="23" rx="3" fill="#7c2d12" stroke="#ea580c" stroke-width="0.8" />
    <text x="340" y="47" fill="#ffedd5" font-size="10" text-anchor="middle" font-weight="bold">Translation Lookaside Buffer (TLB)</text>
  </g>

  <!-- PMU -->
  <g transform="translate(560, 540)">
    <rect x="0" y="0" width="280" height="65" rx="6" fill="#451a03" stroke="#f97316" stroke-width="1.5" />
    <text x="15" y="22" fill="#fdba74" font-size="12" font-weight="bold">PMU (Performance Monitoring Unit)</text>
    <text x="15" y="45" fill="#fddfcc" font-size="10" font-family="monospace">L1-dcache-load-misses, dTLB-load-misses</text>
  </g>

  <!-- FLOW LINES (ARROWS) -->
  
  <!-- JVM execution -> Cache/TLB misses -->
  <path d="M 120,260 L 120,490" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <text x="130" y="287" fill="#f43f5e" font-size="9" font-weight="bold">JIT Execution Path</text>

  <!-- Cache/TLB misses -> PMU counters -->
  <path d="M 520,572 L 560,572" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)" />
  <text x="540" y="565" fill="#fdba74" font-size="9" text-anchor="middle">Events</text>

  <!-- PMU -> perf_event (Hardware Interrupt / Overflow) -->
  <path d="M 680,540 L 680,480 L 180,480 L 180,450" fill="none" stroke="#f97316" stroke-width="2" />
  <text x="330" y="475" fill="#f97316" font-size="10" font-weight="bold">PMU Overflow Interrupt (e.g. 1 miss per 10k)</text>

  <!-- perf_event -> eBPF Hook -->
  <path d="M 280,400 L 320,400" fill="none" stroke="#34d399" stroke-width="2" />

  <!-- Hook writes to Maps -->
  <path d="M 510,400 L 555,400" fill="none" stroke="#10b981" stroke-width="1.5" />

  <!-- BPF User Daemon reads Map -->
  <path d="M 620,350 L 620,260" fill="none" stroke="#10b981" stroke-width="2" />
  <text x="625" y="295" fill="#34d399" font-size="10" font-weight="bold">Reads maps via BPF syscall</text>

  <!-- BPF User Daemon reads perf.map -->
  <path d="M 330,200 L 480,200" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="405" y="195" fill="#fbbf24" font-size="10" text-anchor="middle">Symbol Lookup</text>

  <!-- Arrow marker definition -->
  <svg>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e" />
      </marker>
    </defs>
  </svg>
</svg>
