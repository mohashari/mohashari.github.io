<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <!-- Definition of gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Thread State Gradients -->
    <linearGradient id="state-running" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="state-loop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="state-native" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="state-suspended" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="state-vm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="state-blocked" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B7280" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <filterDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" rx="8" fill="url(#bg-grad)" />
  <rect width="958" height="578" x="1" y="1" rx="7" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- Title and Subtitle -->
  <text x="40" y="45" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#F9FAFB">JVM Safepoint Timeline &amp; TTSP Bottleneck</text>
  <text x="40" y="68" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" fill="#9CA3AF">Visualizing the Time To Safepoint (TTSP) delay caused by non-exited/counted loops and native states</text>

  <!-- Legend -->
  <g transform="translate(620, 35)">
    <!-- Running -->
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#state-running)" />
    <text x="20" y="12" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#D1D5DB" font-weight="500">Running (Mutator)</text>

    <!-- Uncounted/Counted Loop -->
    <rect x="140" y="0" width="14" height="14" rx="3" fill="url(#state-loop)" />
    <text x="160" y="12" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#D1D5DB" font-weight="500">Un-polled Loop (Slow)</text>

    <!-- Native/JNI -->
    <rect x="0" y="22" width="14" height="14" rx="3" fill="url(#state-native)" />
    <text x="20" y="34" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#D1D5DB" font-weight="500">Native / JNI Code</text>

    <!-- Suspended -->
    <rect x="140" y="22" width="14" height="14" rx="3" fill="url(#state-suspended)" />
    <text x="160" y="34" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#D1D5DB" font-weight="500">Suspended / Paused</text>
  </g>

  <!-- Swimlane Grid Backgrounds -->
  <g transform="translate(40, 95)">
    <!-- VM Thread Lane -->
    <rect x="0" y="0" width="880" height="75" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="2,2"/>
    <text x="15" y="42" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#E2E8F0">VM Thread</text>

    <!-- Thread 1 Lane -->
    <rect x="0" y="90" width="880" height="75" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="2,2"/>
    <text x="15" y="132" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#E2E8F0">Thread 1 (Fast)</text>
    <text x="15" y="148" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="10" fill="#94A3B8">Reaches poll immediately</text>

    <!-- Thread 2 Lane -->
    <rect x="0" y="180" width="880" height="75" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="2,2"/>
    <text x="15" y="222" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#E2E8F0">Thread 2 (Slow)</text>
    <text x="15" y="238" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="10" fill="#94A3B8">Counted loop (No Poll)</text>

    <!-- Thread 3 Lane -->
    <rect x="0" y="270" width="880" height="75" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="2,2"/>
    <text x="15" y="312" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#E2E8F0">Thread 3 (JNI)</text>
    <text x="15" y="328" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="10" fill="#94A3B8">In Native, blocks on return</text>
  </g>

  <!-- Timelines and Blocks -->
  <g transform="translate(220, 95)">
    <!-- Time axes lines (vertical indicators) -->
    <!-- Safepoint Requested -->
    <line x1="180" y1="-10" x2="180" y2="355" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="135" y="-30" width="90" height="20" rx="3" fill="#D97706" />
    <text x="180" y="-16" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="9" fill="#FFF" font-weight="bold" text-anchor="middle">SAFEPOINT REQUEST</text>

    <!-- All Threads Suspended -->
    <line x1="420" y1="-10" x2="420" y2="355" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="375" y="-30" width="90" height="20" rx="3" fill="#DC2626" />
    <text x="420" y="-16" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="9" fill="#FFF" font-weight="bold" text-anchor="middle">SAFEPOINT START</text>

    <!-- Safepoint Resume -->
    <line x1="580" y1="-10" x2="580" y2="355" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="540" y="-30" width="80" height="20" rx="3" fill="#059669" />
    <text x="580" y="-16" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="9" fill="#FFF" font-weight="bold" text-anchor="middle">MUTATOR RESUME</text>

    <!-- TTSP Bracket (Time to Safepoint) -->
    <path d="M 180,380 L 180,390 L 420,390 L 420,380" fill="none" stroke="#F59E0B" stroke-width="2" />
    <rect x="250" y="395" width="100" height="22" rx="4" fill="#78350F" stroke="#F59E0B" stroke-width="1" />
    <text x="300" y="410" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FDE68A" font-weight="bold" text-anchor="middle">TTSP: 240ms</text>

    <!-- Safepoint Operation Duration -->
    <path d="M 420,380 L 420,390 L 580,390 L 580,380" fill="none" stroke="#EF4444" stroke-width="2" />
    <rect x="440" y="395" width="100" height="22" rx="4" fill="#7F1D1D" stroke="#EF4444" stroke-width="1" />
    <text x="490" y="410" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FCA5A5" font-weight="bold" text-anchor="middle">Stop-the-World: 15ms</text>

    <!-- Total Pause Duration -->
    <path d="M 180,440 L 180,450 L 580,450 L 580,440" fill="none" stroke="#E2E8F0" stroke-width="2" />
    <text x="380" y="470" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" fill="#E2E8F0" font-weight="bold" text-anchor="middle">Total Application Stop Time: 255ms (TTSP dominates!)</text>


    <!-- ==================== VM THREAD BLOCKS ==================== -->
    <!-- VM Thread Running Idle -->
    <rect x="0" y="20" width="180" height="35" rx="4" fill="url(#state-running)" opacity="0.15" />
    <text x="90" y="42" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Idle / Monitoring</text>

    <!-- VM Thread initiating safepoint (waiting for mutators) -->
    <rect x="180" y="20" width="240" height="35" rx="4" fill="url(#state-vm)" />
    <text x="300" y="42" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" font-weight="bold" text-anchor="middle">Waiting for Mutators (TTSP)</text>

    <!-- VM Thread running safepoint operation (e.g. GC / Revoke Bias) -->
    <rect x="420" y="20" width="160" height="35" rx="4" fill="url(#state-suspended)" />
    <text x="500" y="42" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" font-weight="bold" text-anchor="middle">GC / Safepoint Op (15ms)</text>

    <!-- VM Thread Resuming Mutators -->
    <rect x="580" y="20" width="100" height="35" rx="4" fill="url(#state-running)" opacity="0.15" />
    <text x="630" y="42" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Idle</text>


    <!-- ==================== THREAD 1 BLOCKS (FAST) ==================== -->
    <!-- Running -->
    <rect x="0" y="110" width="180" height="35" rx="4" fill="url(#state-running)" />
    <text x="90" y="132" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Running</text>

    <!-- Safepoint poll hit - immediately goes to suspended -->
    <rect x="180" y="110" width="20" height="35" fill="url(#state-running)" opacity="0.4" />
    <line x1="200" y1="110" x2="200" y2="145" stroke="#FFF" stroke-width="2" />
    <text x="190" y="125" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="9" fill="#FFF" text-anchor="middle">Poll</text>

    <!-- Suspended waiting for TTSP and JVM OP -->
    <rect x="200" y="110" width="380" height="35" rx="4" fill="url(#state-suspended)" />
    <text x="390" y="132" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" font-weight="bold" text-anchor="middle">Suspended (Blocked at Safepoint)</text>

    <!-- Resumed -->
    <rect x="580" y="110" width="100" height="35" rx="4" fill="url(#state-running)" />
    <text x="630" y="132" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Running</text>


    <!-- ==================== THREAD 2 BLOCKS (SLOW) ==================== -->
    <!-- Running -->
    <rect x="0" y="200" width="180" height="35" rx="4" fill="url(#state-running)" />
    <text x="90" y="222" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Running</text>

    <!-- Counted Loop starts (No Safepoint Poll checks compiled in!) -->
    <rect x="180" y="200" width="220" height="35" fill="url(#state-loop)" />
    <text x="290" y="222" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" font-weight="bold" text-anchor="middle">Counted Loop (Executing without Poll)</text>

    <!-- Loop completes, hits next poll/method exit, suspended -->
    <rect x="400" y="200" width="20" height="35" fill="url(#state-running)" opacity="0.4" />
    <line x1="420" y1="200" x2="420" y2="235" stroke="#FFF" stroke-width="2" />
    <text x="410" y="215" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="8" fill="#FFF" text-anchor="middle">Poll</text>

    <!-- Suspended during actual operation -->
    <rect x="420" y="200" width="160" height="35" rx="4" fill="url(#state-suspended)" />
    <text x="500" y="222" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" font-weight="bold" text-anchor="middle">Suspended (15ms)</text>

    <!-- Resumed -->
    <rect x="580" y="200" width="100" height="35" rx="4" fill="url(#state-running)" />
    <text x="630" y="222" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Running</text>


    <!-- ==================== THREAD 3 BLOCKS (JNI / NATIVE) ==================== -->
    <!-- Running JNI/Native -->
    <rect x="0" y="290" width="340" height="35" rx="4" fill="url(#state-native)" />
    <text x="170" y="312" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Executing JNI / System Call</text>

    <!-- Thread is in native code, which is ALREADY safe. JVM doesn't wait for it.
         But at 340, the thread tries to return to Java space. It blocks on the Safepoint boundary! -->
    <rect x="340" y="290" width="80" height="35" fill="url(#state-blocked)" />
    <text x="380" y="312" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Block on Return</text>

    <!-- Suspended at Safepoint border -->
    <rect x="420" y="290" width="160" height="35" rx="4" fill="url(#state-suspended)" />
    <text x="500" y="312" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" font-weight="bold" text-anchor="middle">Suspended (15ms)</text>

    <!-- Resumed -->
    <rect x="580" y="290" width="100" height="35" rx="4" fill="url(#state-running)" />
    <text x="630" y="312" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Running (Java)</text>
  </g>
</svg>