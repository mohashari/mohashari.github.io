<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="980" height="510" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e1e1e">io_uring Architecture: SQ / CQ Ring and Zero-Copy Networking</text>

  <!-- User Space box -->
  <rect x="20" y="60" width="460" height="360" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" opacity="0.85"/>
  <text x="36" y="82" font-size="13" font-weight="bold" fill="#1971c2">User Space</text>

  <!-- Application box -->
  <rect x="50" y="100" width="160" height="60" rx="6" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="130" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f9e44">Application</text>

  <!-- SQ Ring user -->
  <rect x="50" y="200" width="160" height="72" rx="6" fill="#fff3bf" stroke="#e67700" stroke-width="1.5"/>
  <text x="130" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67700">SQ Ring</text>
  <text x="130" y="252" text-anchor="middle" font-size="11" fill="#e67700">(Submission Queue)</text>

  <!-- CQ Ring user -->
  <rect x="50" y="315" width="160" height="72" rx="6" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="130" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#c92a2a">CQ Ring</text>
  <text x="130" y="367" text-anchor="middle" font-size="11" fill="#c92a2a">(Completion Queue)</text>

  <!-- Shared Memory box -->
  <rect x="255" y="195" width="195" height="200" rx="6" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.5"/>
  <text x="352" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#6741d9">Shared Memory</text>
  <text x="352" y="234" text-anchor="middle" font-size="11" fill="#6741d9">(mmap, kernel+user)</text>

  <rect x="275" y="248" width="155" height="34" rx="4" fill="#fff3bf" stroke="#e67700" stroke-width="1"/>
  <text x="352" y="270" text-anchor="middle" font-size="11" fill="#e67700">sq_ring[head / tail]</text>

  <rect x="275" y="292" width="155" height="30" rx="4" fill="#fff3bf" stroke="#e67700" stroke-width="1"/>
  <text x="352" y="312" text-anchor="middle" font-size="11" fill="#e67700">sqes[] array</text>

  <rect x="275" y="334" width="155" height="30" rx="4" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1"/>
  <text x="352" y="354" text-anchor="middle" font-size="11" fill="#c92a2a">cq_ring[head / tail]</text>

  <rect x="275" y="374" width="155" height="12" rx="3" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1"/>
  <text x="352" y="384" text-anchor="middle" font-size="9" fill="#2f9e44">fixed_buffers[] (pre-pinned)</text>

  <!-- Kernel Space box -->
  <rect x="510" y="60" width="450" height="360" rx="8" fill="#f8f0fc" stroke="#862e9c" stroke-width="2" opacity="0.85"/>
  <text x="526" y="82" font-size="13" font-weight="bold" fill="#862e9c">Kernel Space</text>

  <!-- io_uring Core -->
  <rect x="540" y="100" width="170" height="70" rx="6" fill="#f3d9fa" stroke="#862e9c" stroke-width="1.5"/>
  <text x="625" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#862e9c">io_uring Core</text>
  <text x="625" y="148" text-anchor="middle" font-size="11" fill="#862e9c">io_uring_enter(2)</text>

  <!-- SQPOLL thread -->
  <rect x="540" y="205" width="170" height="62" rx="6" fill="#dbe4ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="625" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#1971c2">SQPOLL Kernel Thread</text>
  <text x="625" y="250" text-anchor="middle" font-size="10" fill="#1971c2">polls SQ (no syscall)</text>

  <!-- Fixed buffers kernel -->
  <rect x="540" y="308" width="170" height="62" rx="6" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="625" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f9e44">Fixed Buffers</text>
  <text x="625" y="353" text-anchor="middle" font-size="10" fill="#2f9e44">zero-copy, pre-pinned</text>

  <!-- Network Stack -->
  <rect x="760" y="205" width="170" height="62" rx="6" fill="#fff3bf" stroke="#e67700" stroke-width="1.5"/>
  <text x="845" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67700">Network Stack</text>
  <text x="845" y="250" text-anchor="middle" font-size="10" fill="#e67700">send / recv / splice</text>

  <!-- NIC -->
  <rect x="760" y="308" width="170" height="62" rx="6" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="845" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#c92a2a">NIC / Device</text>

  <!-- Arrows: App -> SQ (push SQE) -->
  <line x1="130" y1="160" x2="130" y2="198" stroke="#2f9e44" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="145" y="183" font-size="10" fill="#2f9e44">push SQE</text>

  <!-- Arrows: CQ -> App (read CQE) -->
  <line x1="130" y1="315" x2="130" y2="274" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="145" y="300" font-size="10" fill="#c92a2a">read CQE</text>

  <!-- Arrows: SQ -> Shared Memory -->
  <line x1="210" y1="236" x2="254" y2="268" stroke="#e67700" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Arrows: Shared Memory -> io_uring Core (mmap) -->
  <line x1="450" y1="280" x2="538" y2="240" stroke="#6741d9" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arr-purple)"/>
  <text x="460" y="260" font-size="10" fill="#6741d9">mmap</text>
  <text x="460" y="273" font-size="10" fill="#6741d9">(no copy)</text>

  <!-- Arrow: io_uring Core -> SQPOLL -->
  <line x1="625" y1="170" x2="625" y2="203" stroke="#862e9c" stroke-width="1.5" marker-end="url(#arr-purple2)"/>

  <!-- Arrow: SQPOLL -> Network Stack -->
  <line x1="710" y1="236" x2="758" y2="236" stroke="#1971c2" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Arrow: Fixed Buffers -> Network Stack -->
  <line x1="710" y1="339" x2="758" y2="280" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green2)"/>
  <text x="718" y="320" font-size="9" fill="#2f9e44">zero-copy buf</text>

  <!-- Arrow: Network -> NIC -->
  <line x1="845" y1="267" x2="845" y2="306" stroke="#e67700" stroke-width="1.5" marker-end="url(#arr-orange2)"/>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f9e44"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c92a2a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e67700"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6741d9"/>
    </marker>
    <marker id="arr-purple2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#862e9c"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1971c2"/>
    </marker>
    <marker id="arr-green2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f9e44"/>
    </marker>
    <marker id="arr-orange2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e67700"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="20" y="435" width="940" height="62" rx="6" fill="#f8f9fa" stroke="#868e96" stroke-width="1" opacity="0.9"/>
  <text x="40" y="456" font-size="11" fill="#495057" font-weight="bold">Key:</text>
  <text x="75" y="456" font-size="11" fill="#495057">SQE = Submission Queue Entry (opcode, fd, buf, flags, user_data)</text>
  <text x="40" y="474" font-size="11" fill="#495057">CQE = Completion Queue Entry (res, flags, user_data)  |  SQPOLL = kernel thread polls SQ without syscall overhead  |  Fixed Buffers = zero-copy via pre-pinned pages (io_uring_register)</text>
</svg>
