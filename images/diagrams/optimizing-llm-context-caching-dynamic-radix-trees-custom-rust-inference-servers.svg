<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="root-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="sys-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="hit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="evict-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="gpu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg-grad)" rx="12"/>
  
  <!-- Grid Lines for Technical Look -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <path d="M 0,50 L 900,50 M 0,100 L 900,100 M 0,150 L 900,150 M 0,200 L 900,200 M 0,250 L 900,250 M 0,300 L 900,300 M 0,350 L 900,350 M 0,400 L 900,400 M 0,450 L 900,450" />
    <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500 M 800,0 L 800,500" />
  </g>

  <!-- Title & Metadata -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">CONTEXT CACHING VIA DYNAMIC RADIX TREE</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Logical Radix Tree Prefix Matching mapped to Physical GPU PagedAttention Blocks</text>

  <!-- Legend -->
  <g transform="translate(620, 20)">
    <rect width="250" height="95" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6" opacity="0.9"/>
    
    <circle cx="20" cy="20" r="6" fill="url(#sys-grad)"/>
    <text x="35" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">System Node (Root Shared)</text>

    <circle cx="20" cy="40" r="6" fill="url(#hit-grad)"/>
    <text x="35" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Cache Hit / Active Node</text>

    <circle cx="20" cy="60" r="6" fill="url(#evict-grad)"/>
    <text x="35" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Cache Candidate for Eviction (LRU)</text>

    <rect x="14" y="74" width="12" height="12" fill="url(#gpu-grad)" rx="2"/>
    <text x="35" y="84" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">GPU Block Allocation</text>
  </g>

  <!-- Tree Connections (Lines) -->
  <!-- Root to System Prompt -->
  <path d="M 120,230 L 220,230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- System Prompt to User Turn 1 (Hit Branch) -->
  <path d="M 370,230 L 450,170" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  
  <!-- System Prompt to User Turn 1 (Evict Branch) -->
  <path d="M 370,230 L 450,290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- User Turn 1 (Hit) to Assistant Turn 1 -->
  <path d="M 600,170 L 660,170" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- GPU Mapping Connections (Dotted lines pointing down to GPU Physical Memory) -->
  <!-- Root doesn't map to GPU blocks. System maps to Block 0..7 -->
  <path d="M 295,260 L 295,390" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <!-- User Turn 1 Hit maps to Block 8..11 -->
  <path d="M 525,200 L 525,390" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <!-- Assistant Turn 1 maps to Block 12..15 -->
  <path d="M 735,200 L 735,390" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <!-- User Turn 1 (Evicted) maps to Block 16..17 (Eviction candidate) -->
  <path d="M 525,320 L 525,410" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- TREE NODES -->
  
  <!-- Node: Root -->
  <g transform="translate(30, 200)" filter="url(#shadow)">
    <rect width="90" height="60" fill="url(#root-grad)" rx="8" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="45" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Root Node</text>
    <text x="45" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Ref Count: 4</text>
  </g>

  <!-- Node: System Prompt -->
  <g transform="translate(220, 200)" filter="url(#shadow)">
    <rect width="150" height="60" fill="url(#sys-grad)" rx="8" stroke="#38bdf8" stroke-width="2"/>
    <text x="75" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">System Prompt</text>
    <text x="75" y="38" fill="#93c5fd" font-family="monospace" font-size="9" text-anchor="middle">Tokens: 0..1024</text>
    <text x="75" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ref: 3 | Blocks: #0-7</text>
  </g>

  <!-- Node: User Turn 1 (Active Hit Branch) -->
  <g transform="translate(450, 140)" filter="url(#shadow)">
    <rect width="150" height="60" fill="url(#hit-grad)" rx="8" stroke="#34d399" stroke-width="2"/>
    <text x="75" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">User: "Run benchmark..."</text>
    <text x="75" y="38" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">Tokens: 1025..1150</text>
    <text x="75" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ref: 1 | Blocks: #8-11</text>
  </g>

  <!-- Node: Assistant Response 1 (Active Hit Branch) -->
  <g transform="translate(660, 140)" filter="url(#shadow)">
    <rect width="150" height="60" fill="url(#hit-grad)" rx="8" stroke="#34d399" stroke-width="1.5"/>
    <text x="75" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Assistant: "Results..."</text>
    <text x="75" y="38" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">Tokens: 1151..1400</text>
    <text x="75" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ref: 1 | Blocks: #12-15</text>
  </g>

  <!-- Node: User Turn 1 (Evict Candidate Branch) -->
  <g transform="translate(450, 260)" filter="url(#shadow)">
    <rect width="150" height="60" fill="url(#evict-grad)" rx="8" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="75" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">User: "Generate SVG..."</text>
    <text x="75" y="38" fill="#fde68a" font-family="monospace" font-size="9" text-anchor="middle">Tokens: 1025..1080</text>
    <text x="75" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ref: 0 | Blocks: #16-17</text>
  </g>

  <!-- PHYSICAL GPU BLOCK POOL (Visual Representation at bottom) -->
  <g transform="translate(30, 400)">
    <rect width="840" height="70" fill="#0b0f19" stroke="#334155" stroke-width="1.5" rx="8"/>
    <text x="15" y="-10" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PHYSICAL GPU KV CACHE (PagedAttention Block Pool)</text>
    
    <!-- Blocks -->
    <!-- Blocks 0-7 (System) -->
    <g transform="translate(15, 15)">
      <rect width="180" height="40" fill="url(#gpu-grad)" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
      <text x="90" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Blocks #0-7 (System KV)</text>
    </g>

    <!-- Blocks 8-11 (User Hit) -->
    <g transform="translate(210, 15)">
      <rect width="140" height="40" fill="url(#gpu-grad)" stroke="#10b981" stroke-width="1.5" rx="4"/>
      <text x="70" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Blocks #8-11 (User KV)</text>
    </g>

    <!-- Blocks 12-15 (Assistant Hit) -->
    <g transform="translate(365, 15)">
      <rect width="140" height="40" fill="url(#gpu-grad)" stroke="#10b981" stroke-width="1.5" rx="4"/>
      <text x="70" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Blocks #12-15 (Asst KV)</text>
    </g>

    <!-- Blocks 16-17 (Evict) -->
    <g transform="translate(520, 15)">
      <rect width="100" height="40" fill="url(#gpu-grad)" stroke="#f59e0b" stroke-width="1.5" rx="4" stroke-dasharray="3,3"/>
      <text x="50" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Blocks #16-17</text>
    </g>

    <!-- Unallocated Free Blocks -->
    <g transform="translate(635, 15)">
      <rect width="190" height="40" fill="#1e293b" stroke="#475569" stroke-width="1" rx="4"/>
      <text x="95" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Blocks #18-255 (Free Pool)</text>
    </g>
  </g>
</svg>
