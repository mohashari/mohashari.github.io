<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="420" viewBox="0 0 820 420"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; }
    </style>
    <!-- Slight hand-drawn roughness filter -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3"
                    seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" fill="#fafaf8" rx="8"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle"
        font-size="18" font-weight="700" fill="#1e1e2e">Semantic Cache Flow for LLM Gateway using Redis VSS</text>
  <line x1="40" y1="42" x2="780" y2="42" stroke="#e5e3de" stroke-width="1"/>

  <!-- Client Box -->
  <g filter="url(#rough)">
    <rect x="30" y="150" width="100" height="70" rx="6" ry="6"
          fill="#ffffff" stroke="#1e1e2e" stroke-width="2"/>
  </g>
  <text x="80" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e2e">Client</text>
  <text x="80" y="195" text-anchor="middle" font-size="12" fill="#4b5563">User Query</text>

  <!-- Request Arrow -->
  <path d="M 130 175 L 210 175" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="170" y="165" text-anchor="middle" font-size="12" fill="#1e1e2e">1. Prompt</text>

  <!-- Gateway Box -->
  <g filter="url(#rough)">
    <rect x="220" y="120" width="180" height="130" rx="6" ry="6"
          fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  <text x="310" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">LLM Gateway</text>
  <text x="310" y="170" text-anchor="middle" font-size="12" fill="#1e3a8a">Embedding + Router</text>
  <text x="310" y="190" text-anchor="middle" font-size="11" fill="#2563eb">(&lt; 15ms Cache Hit)</text>
  <text x="310" y="210" text-anchor="middle" font-size="11" fill="#dc2626">(&gt; 2s Cache Miss)</text>

  <!-- Local/Remote Embedding Service -->
  <g filter="url(#rough)">
    <rect x="220" y="320" width="180" height="60" rx="6" ry="6"
          fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="310" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">Embedding Model</text>
  <text x="310" y="362" text-anchor="middle" font-size="11" fill="#6d28d9">(Local ONNX / OpenAI)</text>

  <!-- Bidirectional arrow to Embedding -->
  <path d="M 285 250 L 285 310" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 335 320 L 335 260" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="245" y="285" font-size="11" fill="#5b21b6">2. Text</text>
  <text x="342" y="285" font-size="11" fill="#5b21b6">3. Vector</text>

  <!-- Redis VSS Box -->
  <g filter="url(#rough)">
    <rect x="520" y="60" width="180" height="110" rx="6" ry="6"
          fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="610" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Redis VSS</text>
  <text x="610" y="110" text-anchor="middle" font-size="12" fill="#991b1b">Index: HNSW (Cosine)</text>
  <text x="610" y="130" text-anchor="middle" font-size="11" fill="#b91c1c">Keyspace: llm_cache:*</text>

  <!-- Arrow Gateway <-> Redis -->
  <path d="M 400 150 L 510 100" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="465" y="115" text-anchor="middle" font-size="11" fill="#b91c1c" transform="rotate(-23, 465, 115)">4. KNN Query</text>

  <path d="M 510 140 L 400 190" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="465" y="180" text-anchor="middle" font-size="11" fill="#b91c1c" transform="rotate(-23, 465, 180)">5. Hit / Score</text>

  <!-- LLM Provider Box -->
  <g filter="url(#rough)">
    <rect x="520" y="240" width="180" height="110" rx="6" ry="6"
          fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="610" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">LLM Provider</text>
  <text x="610" y="295" text-anchor="middle" font-size="12" fill="#065f46">(OpenAI / Anthropic)</text>
  <text x="610" y="315" text-anchor="middle" font-size="11" fill="#047857">Latency: 1.5s - 4.0s</text>

  <!-- Arrow Gateway <-> LLM -->
  <path d="M 390 220 L 510 270" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="450" y="235" text-anchor="middle" font-size="11" fill="#047857" transform="rotate(22, 450, 235)">6. API Call (Miss)</text>

  <path d="M 520 310 L 375 250" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="440" y="295" text-anchor="middle" font-size="11" fill="#047857" transform="rotate(22, 440, 295)">7. Completion</text>

  <!-- Background Write Arrow from Gateway to Redis -->
  <path d="M 370 120 C 400 30, 480 30, 520 65" fill="none" stroke="#2563eb" stroke-dasharray="4,4" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="450" y="45" text-anchor="middle" font-size="11" fill="#1e40af">8. Async Write-Back</text>

  <!-- Return Response Arrow to Client -->
  <path d="M 220 220 C 180 230, 150 230, 130 210" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="170" y="240" text-anchor="middle" font-size="11" fill="#1e3a8a">9. Response</text>

</svg>
