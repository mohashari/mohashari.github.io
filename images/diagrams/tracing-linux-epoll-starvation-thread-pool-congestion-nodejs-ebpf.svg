<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Backgrounds -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" rx="12" fill="url(#bgGrad)" />
  <rect width="900" height="550" rx="12" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" letter-spacing="1">NODE.JS HYBRID CONGESTION ARCHITECTURE</text>
  <text x="30" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">eBPF Tracing of libuv Event Loop &amp; Worker Thread Pool Latency</text>

  <!-- Boundaries / Containers -->
  <!-- User Space Container -->
  <rect x="30" y="80" width="840" height="240" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="45" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">USER SPACE (Node.js / libuv / V8)</text>

  <!-- Kernel Space Container -->
  <rect x="30" y="340" width="840" height="180" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="45" y="362" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">KERNEL SPACE (Linux)</text>

  <!-- USER SPACE COMPONENTS -->
  
  <!-- V8 / JS Execution Thread (Event Loop) -->
  <g transform="translate(60, 120)">
    <rect width="220" height="170" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glowBlue)" />
    <text x="110" y="25" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Event Loop (Main Thread)</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#334155" stroke-width="1" />
    
    <!-- Stages of Loop -->
    <rect x="15" y="45" width="190" height="25" rx="3" fill="#1e293b" stroke="#475569" />
    <text x="110" y="61" fill="#f1f5f9" font-family="sans-serif" font-size="11" text-anchor="middle">JavaScript / V8 Stack Execution</text>

    <rect x="15" y="77" width="190" height="25" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="110" y="93" fill="#f59e0b" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">uv__io_poll (epoll_wait)</text>

    <rect x="15" y="109" width="190" height="25" rx="3" fill="#1e293b" stroke="#475569" />
    <text x="110" y="125" fill="#f1f5f9" font-family="sans-serif" font-size="11" text-anchor="middle">Pending Callbacks / Timers</text>
    
    <!-- Loop Delay Indicator -->
    <text x="110" y="155" fill="#f43f5e" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⏱️ LOOP STARVATION POINT</text>
  </g>

  <!-- libuv Thread Pool Work Queue -->
  <g transform="translate(340, 130)">
    <rect width="180" height="70" rx="6" fill="url(#boxGrad)" stroke="#64748b" stroke-width="1.5" />
    <text x="90" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Worker Queue (wq)</text>
    <line x1="15" y1="35" x2="165" y2="35" stroke="#334155" stroke-width="1" />
    
    <!-- Queue Items -->
    <rect x="15" y="42" width="30" height="20" rx="2" fill="#475569" />
    <text x="30" y="56" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">DNS</text>
    
    <rect x="50" y="42" width="30" height="20" rx="2" fill="#475569" />
    <text x="65" y="56" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">FS</text>

    <rect x="85" y="42" width="45" height="20" rx="2" fill="#b91c1c" stroke="#f87171" stroke-width="1" />
    <text x="107.5" y="55" fill="#fecaca" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">CRYPTO</text>

    <text x="145" y="56" fill="#64748b" font-family="sans-serif" font-size="12">...</text>
  </g>

  <!-- libuv Thread Pool Workers -->
  <g transform="translate(580, 100)">
    <rect width="260" height="200" rx="6" fill="url(#boxGrad)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)" />
    <text x="130" y="25" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">libuv Thread Pool (UV_THREADPOOL_SIZE=4)</text>
    <line x1="15" y1="35" x2="245" y2="35" stroke="#334155" stroke-width="1" />

    <!-- Worker Threads -->
    <g transform="translate(15, 45)">
      <rect width="110" height="60" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
      <text x="55" y="20" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Worker 1</text>
      <rect x="10" y="30" width="90" height="20" rx="2" fill="#7f1d1d" stroke="#f87171" />
      <text x="55" y="43" fill="#fecaca" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">scrypt (Blocked)</text>
    </g>

    <g transform="translate(135, 45)">
      <rect width="110" height="60" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
      <text x="55" y="20" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Worker 2</text>
      <rect x="10" y="30" width="90" height="20" rx="2" fill="#7f1d1d" stroke="#f87171" />
      <text x="55" y="43" fill="#fecaca" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">dns_lookup (Wait)</text>
    </g>

    <g transform="translate(15, 120)">
      <rect width="110" height="60" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="55" y="20" fill="#fbbf24" font-family="sans-serif" font-size="11" text-anchor="middle">Worker 3</text>
      <rect x="10" y="30" width="90" height="20" rx="2" fill="#1e293b" stroke="#94a3b8" />
      <text x="55" y="43" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">fs_stat (Idle)</text>
    </g>

    <g transform="translate(135, 120)">
      <rect width="110" height="60" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
      <text x="55" y="20" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Worker 4</text>
      <rect x="10" y="30" width="90" height="20" rx="2" fill="#7f1d1d" stroke="#f87171" />
      <text x="55" y="43" fill="#fecaca" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">scrypt (Blocked)</text>
    </g>
  </g>

  <!-- KERNEL SPACE COMPONENTS -->
  
  <!-- epoll Subsystem -->
  <g transform="translate(60, 380)">
    <rect width="220" height="110" rx="6" fill="url(#boxGrad)" stroke="#64748b" stroke-width="1.5" />
    <text x="110" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Linux Kernel: epoll</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#334155" stroke-width="1" />
    
    <rect x="15" y="45" width="190" height="48" rx="3" fill="#0f172a" stroke="#475569" />
    <text x="110" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Active FD Ready List (Interest List)</text>
    <text x="110" y="78" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">[ Socket FDs | Pipe FDs ]</text>
  </g>

  <!-- Kernel Thread Scheduler -->
  <g transform="translate(580, 380)">
    <rect width="260" height="110" rx="6" fill="url(#boxGrad)" stroke="#64748b" stroke-width="1.5" />
    <text x="130" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Task Scheduler &amp; Futexes</text>
    <line x1="15" y1="35" x2="245" y2="35" stroke="#334155" stroke-width="1" />
    
    <rect x="15" y="45" width="230" height="48" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="130" y="62" fill="#f87171" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">futex_wait / sched_switch</text>
    <text x="130" y="78" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Thread Pool Contention &amp; High Latency Queue</text>
  </g>

  <!-- INTERACTION / FLOW ARROWS -->

  <!-- Event Loop calling epoll_wait -->
  <path d="M 170,290 L 170,380" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="180" y="338" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold">sys_epoll_wait()</text>

  <!-- Event Loop dispatching to thread pool queue -->
  <path d="M 280,205 Q 310,205 340,180" fill="none" stroke="#38bdf8" stroke-width="2" />
  <text x="310" y="170" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle">uv__work_submit</text>
  
  <!-- Thread Pool pulling from queue -->
  <path d="M 520,165 Q 550,150 580,150" fill="none" stroke="#10b981" stroke-width="2" />

  <!-- Worker Threads Blocking/Switching in Kernel -->
  <path d="M 710,300 L 710,380" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" />
  <text x="720" y="345" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="bold">Context Switches</text>

  <!-- eBPF TRACING PROBES (THE HERO) -->
  <!-- Probe on epoll_wait -->
  <g transform="translate(30, 310)">
    <circle cx="140" cy="28" r="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" filter="url(#glowRed)" />
    <text x="140" y="32" fill="#e9d5ff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">e</text>
    <!-- Tooltip pointer -->
    <path d="M 156,28 L 220,28" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2,2" />
    <rect x="220" y="10" width="130" height="35" rx="3" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
    <text x="285" y="22" fill="#f3e8ff" font-family="Courier New" font-size="8" font-weight="bold" text-anchor="middle">tracepoint:syscalls:</text>
    <text x="285" y="32" fill="#22d3ee" font-family="Courier New" font-size="9" font-weight="bold" text-anchor="middle">sys_enter_epoll_wait</text>
  </g>

  <!-- Probe on sched_switch / futex -->
  <g transform="translate(420, 310)">
    <circle cx="160" cy="28" r="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" filter="url(#glowRed)" />
    <text x="160" y="32" fill="#e9d5ff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">e</text>
    <!-- Tooltip pointer -->
    <path d="M 144,28 L 60,28" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2,2" />
    <rect x="-70" y="10" width="130" height="35" rx="3" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
    <text x="-5" y="22" fill="#f3e8ff" font-family="Courier New" font-size="8" font-weight="bold" text-anchor="middle">tracepoint:sched:</text>
    <text x="-5" y="32" fill="#e11d48" font-family="Courier New" font-size="9" font-weight="bold" text-anchor="middle">sched_switch</text>
  </g>

  <!-- SVG Marker for Arrow -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>

</svg>
