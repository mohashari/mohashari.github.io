<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%" style="background-color: #0B0F19; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="localBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="platformBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    
    <!-- Filters for Glow / Shadow -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.25" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="amberGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.25" />
    </filter>
    
    <!-- Marker for Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#14B8A6" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F43F5E" />
    </marker>
  </defs>

  <!-- Title & Background Grid Pattern (Subtle) -->
  <rect width="100%" height="100%" fill="#070A13" />
  <g opacity="0.05">
    <path d="M 0 50 L 960 50 M 0 100 L 960 100 M 0 150 L 960 150 M 0 200 L 960 200 M 0 250 L 960 250 M 0 300 L 960 300 M 0 350 L 960 350 M 0 400 L 960 400 M 0 450 L 960 450 M 0 500 L 960 500 M 0 550 L 960 550" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 50 0 L 50 580 M 100 0 L 100 580 M 150 0 L 150 580 M 200 0 L 200 580 M 250 0 L 250 580 M 300 0 L 300 580 M 350 0 L 350 580 M 400 0 L 400 580 M 450 0 L 450 580 M 500 0 L 500 580 M 550 0 L 550 580 M 600 0 L 600 580 M 650 0 L 650 580 M 700 0 L 700 580 M 750 0 L 750 580 M 800 0 L 800 580 M 850 0 L 850 580 M 900 0 L 900 580" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header -->
  <text x="30" y="35" fill="#F8FAFC" font-size="16" font-weight="700" letter-spacing="0.5">DEV-LOOP TELEMETRY &amp; DRIFT FRAMEWORK</text>
  <text x="30" y="55" fill="#64748B" font-size="12">Quantitative Inner-Loop Latency Tracking and Configuration Drift Auditing System</text>

  <!-- ==================== LOCAL WORKSTATION ==================== -->
  <g transform="translate(30, 80)">
    <!-- Main Outer Container -->
    <rect width="400" height="460" rx="12" fill="url(#localBg)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="400" height="40" rx="12" fill="#1E293B" opacity="0.5" />
    <text x="20" y="25" fill="#94A3B8" font-size="13" font-weight="600" letter-spacing="0.5">LOCAL DEVELOPER WORKSTATION</text>
    <circle cx="370" cy="20" r="5" fill="#EF4444" />
    <circle cx="355" cy="20" r="5" fill="#F59E0B" />
    <circle cx="340" cy="20" r="5" fill="#10B981" />

    <!-- Developer Actions Group -->
    <g transform="translate(20, 60)">
      <rect width="360" height="85" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="15" y="22" fill="#64748B" font-size="11" font-weight="600">INNER-LOOP TRIGGER ACTIONS</text>
      
      <!-- Action: Compile -->
      <g transform="translate(15, 32)">
        <rect width="105" height="40" rx="6" fill="#1E293B" stroke="#475569" />
        <text x="52.5" y="24" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">Code Compile</text>
      </g>
      
      <!-- Action: Unit Test -->
      <g transform="translate(127, 32)">
        <rect width="105" height="40" rx="6" fill="#1E293B" stroke="#475569" />
        <text x="52.5" y="24" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">Run Unit Tests</text>
      </g>

      <!-- Action: Docker Compose -->
      <g transform="translate(240, 32)">
        <rect width="105" height="40" rx="6" fill="#1E293B" stroke="#475569" />
        <text x="52.5" y="24" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">Dev Server Start</text>
      </g>
    </g>

    <!-- Dev Instrumentation Agent (Metrics Wrapper) -->
    <g transform="translate(20, 165)">
      <rect width="360" height="110" rx="8" fill="#1E1E38" stroke="#4F46E5" stroke-width="1.5" filter="url(#glow)" />
      <text x="15" y="22" fill="#818CF8" font-size="11" font-weight="700" letter-spacing="0.5">DEV-METRIC-CLI &amp; SHELL WRAPPERS</text>
      
      <!-- Latency Hook -->
      <g transform="translate(15, 35)">
        <rect width="155" height="55" rx="6" fill="#111827" stroke="#312E81" />
        <text x="15" y="20" fill="#E2E8F0" font-size="11" font-weight="600">Latency Hook</text>
        <text x="15" y="35" fill="#94A3B8" font-size="9">Times: compiler, dev-server,</text>
        <text x="15" y="45" fill="#94A3B8" font-size="9">hot-reloads, local test runners</text>
      </g>

      <!-- Git Hooks -->
      <g transform="translate(190, 35)">
        <rect width="155" height="55" rx="6" fill="#111827" stroke="#312E81" />
        <text x="15" y="20" fill="#E2E8F0" font-size="11" font-weight="600">Git Hooks (Pre-commit)</text>
        <text x="15" y="35" fill="#94A3B8" font-size="9">Checks code churn, static</text>
        <text x="15" y="45" fill="#94A3B8" font-size="9">lint latency, schema diffs</text>
      </g>
    </g>

    <!-- Drift & Verification Engine -->
    <g transform="translate(20, 295)">
      <rect width="360" height="145" rx="8" fill="#1C1E26" stroke="#D97706" stroke-width="1.5" filter="url(#amberGlow)" />
      <text x="15" y="22" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="0.5">LOCAL ENVIRONMENT DRIFT AUDITOR</text>
      
      <!-- Verification Components -->
      <g transform="translate(15, 35)">
        <!-- DB Schema Check -->
        <rect width="100" height="95" rx="6" fill="#111318" stroke="#451A03" />
        <text x="50" y="22" fill="#FDBA74" font-size="10" font-weight="600" text-anchor="middle">DB Schema</text>
        <path d="M 30 45 L 70 45 M 35 60 L 65 60 M 40 75 L 60 75" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
        <text x="50" y="88" fill="#78350F" font-size="8" text-anchor="middle">Migration Diff</text>
      </g>

      <g transform="translate(130, 35)">
        <!-- Config Drift Check -->
        <rect width="100" height="95" rx="6" fill="#111318" stroke="#451A03" />
        <text x="50" y="22" fill="#FDBA74" font-size="10" font-weight="600" text-anchor="middle">Env &amp; Config</text>
        <path d="M 40 45 A 10 10 0 0 1 60 45 A 10 10 0 0 1 40 65 A 10 10 0 0 0 60 65" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" />
        <circle cx="50" cy="75" r="2" fill="#F59E0B" />
        <text x="50" y="88" fill="#78350F" font-size="8" text-anchor="middle">Secrets / Env</text>
      </g>

      <g transform="translate(245, 35)">
        <!-- Toolchain Check -->
        <rect width="100" height="95" rx="6" fill="#111318" stroke="#451A03" />
        <text x="50" y="22" fill="#FDBA74" font-size="10" font-weight="600" text-anchor="middle">Toolchains</text>
        <!-- Gear Icon -->
        <circle cx="50" cy="55" r="10" stroke="#F59E0B" stroke-width="2.5" fill="none" />
        <path d="M 50 40 L 50 70 M 35 55 L 65 55 M 40 45 L 60 65 M 40 65 L 60 45" stroke="#F59E0B" stroke-width="2" />
        <circle cx="50" cy="55" r="4" fill="#111318" />
        <text x="50" y="88" fill="#78350F" font-size="8" text-anchor="middle">Docker/Go Version</text>
      </g>
    </g>

    <!-- Connectors inside Host -->
    <path d="M 200 145 L 200 165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 200 275 L 200 295" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- ==================== DRIFT REFERENCE (GOLDEN STATE) ==================== -->
  <g transform="translate(460, 415)">
    <rect width="140" height="110" rx="8" fill="#0F172A" stroke="#0D9488" stroke-width="1.5" />
    <text x="70" y="20" fill="#14B8A6" font-size="11" font-weight="700" text-anchor="middle">GOLDEN INFRA STATE</text>
    
    <g transform="translate(15, 35)">
      <!-- Git Remote & Vault Config -->
      <rect width="110" height="25" rx="4" fill="#111827" stroke="#1E293B" />
      <text x="10" y="16" fill="#94A3B8" font-size="9">Git Repo (CI Specs)</text>
    </g>
    <g transform="translate(15, 68)">
      <rect width="110" height="25" rx="4" fill="#111827" stroke="#1E293B" />
      <text x="10" y="16" fill="#94A3B8" font-size="9">Schema Registry</text>
    </g>
  </g>

  <!-- Connector from Drift Reference to Drift Auditor -->
  <path d="M 460 470 L 410 470" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowTeal)" />
  <text x="435" y="460" fill="#14B8A6" font-size="9" text-anchor="middle">Pull Golden Specs</text>

  <!-- ==================== TELEMETRY INGESTION PIPELINE ==================== -->
  <!-- API Gateway -->
  <g transform="translate(465, 205)">
    <rect width="130" height="85" rx="8" fill="url(#primaryGrad)" filter="url(#shadow)" />
    <text x="65" y="25" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">API GATEWAY</text>
    <text x="65" y="42" fill="#E0E7FF" font-size="9" text-anchor="middle">Telemetry Ingest</text>
    <rect x="15" y="52" width="100" height="20" rx="4" fill="#312E81" />
    <text x="65" y="65" fill="#818CF8" font-size="9" font-weight="700" text-anchor="middle">POST /api/v1/metrics</text>
  </g>

  <!-- Collector Agent to API Gateway Link -->
  <path d="M 430 247 L 457 247" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="444" y="237" fill="#6366F1" font-size="9" text-anchor="middle" font-weight="600">HTTPS</text>

  <!-- Ingestion Queue -->
  <g transform="translate(625, 205)">
    <rect width="80" height="85" rx="8" fill="#1E293B" stroke="#475569" />
    <!-- Queue cylinders -->
    <rect x="10" y="20" width="60" height="15" rx="3" fill="#334155" />
    <text x="40" y="31" fill="#E2E8F0" font-size="8" text-anchor="middle">Event Buffer</text>
    <rect x="10" y="40" width="60" height="15" rx="3" fill="#334155" />
    <text x="40" y="51" fill="#E2E8F0" font-size="8" text-anchor="middle">Redis/Kafka</text>
    <rect x="10" y="60" width="60" height="15" rx="3" fill="#475569" />
    <text x="40" y="71" fill="#FFFFFF" font-size="8" text-anchor="middle">JSON Stream</text>
  </g>

  <path d="M 595 247 L 617 247" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== OBSERVABILITY PLATFORM (STORE & DISP) ==================== -->
  <g transform="translate(730, 80)">
    <rect width="200" height="460" rx="12" fill="url(#platformBg)" stroke="#374151" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="200" height="40" rx="12" fill="#1F2937" opacity="0.5" />
    <text x="100" y="25" fill="#9CA3AF" font-size="13" font-weight="600" letter-spacing="0.5" text-anchor="middle">OBSERVABILITY ENGINE</text>

    <!-- TSDB Datastore -->
    <g transform="translate(15, 60)">
      <rect width="170" height="110" rx="8" fill="#111827" stroke="#1F2937" />
      <text x="85" y="22" fill="#E5E7EB" font-size="11" font-weight="600" text-anchor="middle">TELEMETRY DATASTORE</text>
      
      <!-- ClickHouse -->
      <g transform="translate(15, 35)">
        <rect width="140" height="30" rx="4" fill="#1F2937" stroke="#374151" />
        <text x="70" y="19" fill="#F97316" font-size="10" font-weight="700" text-anchor="middle">ClickHouse (TSDB)</text>
      </g>
      <!-- Postgres Meta -->
      <g transform="translate(15, 70)">
        <rect width="140" height="30" rx="4" fill="#1F2937" stroke="#374151" />
        <text x="70" y="19" fill="#3B82F6" font-size="10" font-weight="700" text-anchor="middle">PostgreSQL (Drift Log)</text>
      </g>
    </g>

    <!-- Grafana Dashboard -->
    <g transform="translate(15, 185)">
      <rect width="170" height="135" rx="8" fill="#111827" stroke="#6366F1" stroke-width="1" />
      <text x="85" y="20" fill="#E5E7EB" font-size="11" font-weight="600" text-anchor="middle">GRAFANA DASHBOARDS</text>
      
      <!-- Dashboard Mini chart -->
      <path d="M 25 80 L 50 60 L 75 75 L 100 45 L 125 50 L 150 35" fill="none" stroke="#6366F1" stroke-width="2" transform="translate(0, 15)" />
      <path d="M 25 80 L 50 60 L 75 75 L 100 45 L 125 50 L 150 35 L 150 95 L 25 95 Z" fill="url(#primaryGrad)" fill-opacity="0.1" transform="translate(0, 15)" />
      <line x1="25" y1="110" x2="150" y2="110" stroke="#374151" stroke-width="1.5" />
      <line x1="25" y1="50" x2="25" y2="110" stroke="#374151" stroke-width="1.5" />
      <text x="85" y="125" fill="#9CA3AF" font-size="8" text-anchor="middle">P95 Inner-Loop &amp; Churn Metrics</text>
    </g>

    <!-- Alerting & Notification -->
    <g transform="translate(15, 335)">
      <rect width="170" height="110" rx="8" fill="#111827" stroke="#F43F5E" stroke-width="1" />
      <text x="85" y="22" fill="#FDA4AF" font-size="11" font-weight="700" text-anchor="middle">ALERTING ENGINE</text>
      
      <g transform="translate(15, 35)">
        <rect width="140" height="60" rx="4" fill="#271C1F" stroke="#9F1239" />
        <text x="12" y="20" fill="#F43F5E" font-size="10" font-weight="700">ALERT: Local Drift</text>
        <text x="12" y="35" fill="#FDA4AF" font-size="8">Dev 'ashari' is using Go 1.21</text>
        <text x="12" y="47" fill="#FDA4AF" font-size="8">Golden target: Go 1.22.4</text>
      </g>
    </g>
  </g>

  <!-- Connect Queue to Datastore -->
  <path d="M 705 247 L 722 247" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Internal platform connections -->
  <path d="M 830 170 L 830 185" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 830 320 L 830 335" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Drift Alert Back-Propagation -->
  <path d="M 728 415 C 620 370, 560 370, 400 370" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowRose)" />
  <text x="590" y="360" fill="#F43F5E" font-size="10" font-weight="600" text-anchor="middle">Real-time Drift Remediation &amp; Notification</text>

</svg>