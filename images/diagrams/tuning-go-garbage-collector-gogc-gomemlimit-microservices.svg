<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="960" height="520" fill="#0f172a" rx="12"/>
  
  <!-- Definitions for gradients and patterns -->
  <defs>
    <linearGradient id="liveHeapGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gogcGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="oomGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="diagonalStripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="3" stroke-opacity="0.4"/>
    </pattern>
    <pattern id="yellowStripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Go Garbage Collector Tuning: GOGC &amp; GOMEMLIMIT Mechanics</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#94a3b8">Interactive execution flow, memory limits, and the GC CPU Limiter protection</text>

  <!-- Layout: 3 Columns -->
  
  <!-- Column 1: Memory Space (Vertical Stack) -->
  <g transform="translate(40, 85)">
    <!-- Card Outline -->
    <rect width="260" height="400" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="130" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#f1f5f9">Managed Memory Space</text>
    
    <!-- Thermometer / Memory Bar Container -->
    <rect x="50" y="45" width="60" height="320" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    
    <!-- OOM Danger Zone (Top portion of bar) -->
    <rect x="52" y="47" width="56" height="48" rx="2" fill="url(#diagonalStripes)"/>
    
    <!-- GOMEMLIMIT Buffer Zone -->
    <rect x="52" y="95" width="56" height="65" fill="#38bdf8" fill-opacity="0.15"/>
    
    <!-- GOGC Growth Zone -->
    <rect x="52" y="160" width="56" height="110" fill="url(#yellowStripes)"/>
    
    <!-- Live Heap -->
    <rect x="52" y="270" width="56" height="93" rx="6" fill="url(#liveHeapGrad)"/>
    
    <!-- Labels on the thermometer -->
    <!-- Container RAM Limit (2.0 GiB) -->
    <line x1="30" y1="47" x2="135" y2="47" stroke="#ef4444" stroke-width="2"/>
    <text x="142" y="51" font-size="11" font-weight="700" fill="#f87171">Container RAM (2.0 GiB)</text>
    <text x="142" y="63" font-size="9" fill="#94a3b8">Hard OS OOM Threshold</text>
    
    <!-- GOMEMLIMIT (1.7 GiB) -->
    <line x1="30" y1="95" x2="135" y2="95" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="142" y="99" font-size="11" font-weight="700" fill="#38bdf8">GOMEMLIMIT (1.7 GiB)</text>
    <text x="142" y="111" font-size="9" fill="#94a3b8">Soft Runtime Cap</text>
    
    <!-- Target Heap (GOGC=100) (1.0 GiB) -->
    <line x1="30" y1="160" x2="130" y2="160" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="142" y="164" font-size="10" font-weight="700" fill="#f59e0b">Target Heap (1.0 GiB)</text>
    <text x="142" y="175" font-size="9" fill="#94a3b8">Live Heap * (1 + GOGC/100)</text>
    
    <!-- Live Heap (500 MiB) -->
    <line x1="30" y1="270" x2="120" y2="270" stroke="#10b981" stroke-width="1.5"/>
    <text x="142" y="274" font-size="11" font-weight="700" fill="#10b981">Live Heap (500 MiB)</text>
    <text x="142" y="285" font-size="9" fill="#94a3b8">Allocated active objects</text>
  </g>
  
  <!-- Column 2: The Pacer & Decision Loop -->
  <g transform="translate(320, 85)">
    <rect width="320" height="400" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#f1f5f9">Go GC Pacer Decision Engine</text>
    
    <!-- Allocations Input -->
    <rect x="20" y="50" width="280" height="55" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="32" y="72" font-size="11" font-weight="700" fill="#60a5fa">1. Application Allocations</text>
    <text x="32" y="88" font-size="10" fill="#94a3b8">Goroutines allocate objects onto the heap</text>
    <path d="M 160 105 L 160 130" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <polygon points="160,132 156,124 164,124" fill="#3b82f6"/>
    
    <!-- GC Pacer Logic Box -->
    <rect x="20" y="132" width="280" height="110" rx="6" fill="#1e293b" stroke="#4b5563" stroke-width="1"/>
    <text x="32" y="152" font-size="11" font-weight="700" fill="#e2e8f0">2. Pacer Trigger Formula</text>
    
    <!-- Formula Code blocks -->
    <rect x="32" y="162" width="256" height="66" rx="4" fill="#0f172a"/>
    <text x="42" y="180" font-family="monospace" font-size="10" fill="#38bdf8">TargetHeap = LiveHeap * (1 + GOGC/100)</text>
    <text x="42" y="196" font-family="monospace" font-size="10" fill="#ef4444">TriggerLimit = min(TargetHeap, GOMEMLIMIT)</text>
    <text x="42" y="212" font-family="monospace" font-size="9" fill="#64748b">/* Accounts for non-heap stack/offheap */</text>
    
    <path d="M 160 242 L 160 268" stroke="#4b5563" stroke-width="2" fill="none"/>
    <polygon points="160,270 156,262 164,262" fill="#4b5563"/>
    
    <!-- Garbage Collection Execution -->
    <rect x="20" y="270" width="280" height="100" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="290" font-size="11" font-weight="700" fill="#34d399">3. Execution &amp; Sweeping</text>
    <text x="32" y="306" font-size="10" fill="#94a3b8">- Triggers concurrent mark-and-sweep</text>
    <text x="32" y="320" font-size="10" fill="#94a3b8">- Reclaims dead memory back to heap</text>
    <text x="32" y="334" font-size="10" fill="#94a3b8">- Returns unused memory to OS (Scavenging)</text>
    <text x="32" y="354" font-size="9.5" fill="#f59e0b" font-weight="600">Dynamic tuning balances CPU vs. Memory</text>
  </g>
  
  <!-- Column 3: The Safety Valve (GC CPU Limiter) -->
  <g transform="translate(660, 85)">
    <rect width="260" height="400" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="130" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#f1f5f9">GC CPU Limiter (Safety Valve)</text>
    
    <!-- Thrashing Scenario Box -->
    <rect x="20" y="50" width="220" height="85" rx="6" fill="#7f1d1d" fill-opacity="0.3" stroke="#f87171" stroke-width="1"/>
    <text x="30" y="70" font-size="11" font-weight="700" fill="#f87171">High Memory Pressure</text>
    <text x="30" y="86" font-size="10" fill="#fca5a5">If Live Heap + Stack approaches</text>
    <text x="30" y="98" font-size="10" fill="#fca5a5">GOMEMLIMIT, the runtime triggers</text>
    <text x="30" y="110" font-size="10" font-weight="700" fill="#f87171">non-stop GC cycles (Thrashing)</text>
    
    <!-- Connector Arrow -->
    <path d="M 130 135 L 130 160" stroke="#f87171" stroke-width="2" stroke-dasharray="3,2" fill="none"/>
    <polygon points="130,162 126,154 134,154" fill="#f87171"/>
    
    <!-- 50% CPU Cap Monitor -->
    <rect x="20" y="162" width="220" height="110" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="30" y="182" font-size="11" font-weight="700" fill="#facc15">50% GC CPU Cap Rule</text>
    <text x="30" y="200" font-size="10" fill="#e2e8f0">To prevent CPU starvation, Go</text>
    <text x="30" y="212" font-size="10" fill="#e2e8f0">restricts the GC from using</text>
    <text x="30" y="224" font-size="10" fill="#e2e8f0">more than </text>
    <text x="93" y="224" font-size="11" font-weight="800" fill="#facc15">50% of user CPU</text>
    <text x="30" y="236" font-size="10" fill="#e2e8f0">in a rolling window.</text>
    
    <!-- Dial / Visual representation of 50% Limit -->
    <path d="M 70 258 A 60 60 0 0 1 190 258" fill="none" stroke="#4b5563" stroke-width="6"/>
    <path d="M 70 258 A 60 60 0 0 1 130 198" fill="none" stroke="#eab308" stroke-width="6"/>
    <text x="130" y="245" text-anchor="middle" font-size="9" fill="#94a3b8" font-weight="700">50% MAX CPU</text>
    
    <!-- Connector Arrow -->
    <path d="M 130 272 L 130 297" stroke="#eab308" stroke-width="2" fill="none"/>
    <polygon points="130,299 126,291 134,291" fill="#eab308"/>
    
    <!-- Outcome Box -->
    <rect x="20" y="299" width="220" height="71" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="30" y="318" font-size="11" font-weight="700" fill="#34d399">Outcome &amp; Trade-off</text>
    <text x="30" y="334" font-size="10" fill="#a7f3d0">App gets CPU cycles, but heap</text>
    <text x="30" y="346" font-size="10" fill="#a7f3d0">may exceed GOMEMLIMIT, risking</text>
    <text x="30" y="358" font-size="10.5" font-weight="700" fill="#f87171">OS OOM-Kill instead.</text>
  </g>

  <!-- Interactive/Flow arrows connecting Columns -->
  <!-- Arrow Col 1 GOMEMLIMIT to Col 2 Formula -->
  <path d="M 260 180 Q 290 190 320 200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="320,200 311,197 315,205" fill="#38bdf8"/>
  
  <!-- Arrow Col 2 Sweeping back to Col 1 Live Heap -->
  <path d="M 320 335 Q 260 345 200 345" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="200,345 208,349 208,341" fill="#10b981"/>
  
  <!-- Arrow Col 2 Sweeping to Col 3 Limiter -->
  <path d="M 500 270 Q 580 180 660 145" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="660,145 651,143 655,151" fill="#f87171"/>

  <!-- Footer Info -->
  <rect x="40" y="493" width="880" height="18" rx="4" fill="#1e293b"/>
  <text x="480" y="506" text-anchor="middle" font-size="9.5" fill="#94a3b8">
    Rule of thumb: Set <tspan fill="#38bdf8" font-weight="bold">GOMEMLIMIT = 85-90% of Container RAM</tspan> to leave head room for runtime overhead, stack, and CGO.
  </text>
</svg>
