<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="950" height="540" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="950" height="540" fill="#0f1117" rx="8"/>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Raft Joint Consensus: Membership Transition Architecture</text>
  
  <!-- Phase Timeline Header -->
  <text x="475" y="70" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">CONFIGURATION TRANSITION TIMELINE</text>
  
  <!-- Phase 1 Card (C_old) -->
  <rect x="50" y="90" width="240" height="100" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="170" y="115" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">Phase 1: C_old Configuration</text>
  <rect x="70" y="130" width="200" height="45" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="170" y="148" text-anchor="middle" fill="#e2e8f0" font-size="10">Active: C_old (A, B, C)</text>
  <text x="170" y="163" text-anchor="middle" fill="#38bdf8" font-size="9">Decisions: Majority of C_old</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 300 140 L 340 140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="320" y="130" text-anchor="middle" fill="#64748b" font-size="8">Propose C_old,new</text>

  <!-- Phase 2 Card (C_old,new) -->
  <rect x="350" y="90" width="250" height="100" rx="6" fill="#1e1b29" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="475" y="115" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">Phase 2: Joint Consensus (C_old,new)</text>
  <rect x="370" y="130" width="210" height="45" rx="3" fill="#2e1065" stroke="#6d28d9" stroke-width="1"/>
  <text x="475" y="148" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Active: Logs on C_old &amp; C_new</text>
  <text x="475" y="163" text-anchor="middle" fill="#a78bfa" font-size="8.5">Decisions: Majority of C_old AND C_new</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 610 140 L 650 140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="630" y="130" text-anchor="middle" fill="#64748b" font-size="8">Commit C_old,new</text>

  <!-- Phase 3 Card (C_new) -->
  <rect x="660" y="90" width="240" height="100" rx="6" fill="#111c18" stroke="#065f46" stroke-width="1.5"/>
  <text x="780" y="115" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">Phase 3: C_new Configuration</text>
  <rect x="680" y="130" width="200" height="45" rx="3" fill="#064e3b" stroke="#0f766e" stroke-width="1"/>
  <text x="780" y="148" text-anchor="middle" fill="#e2e8f0" font-size="10">Active: C_new (A, B, C, D, E)</text>
  <text x="780" y="163" text-anchor="middle" fill="#34d399" font-size="9">Decisions: Majority of C_new</text>

  <!-- Divider -->
  <line x1="30" y1="210" x2="920" y2="210" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Middle Section: Joint Consensus Majority Verification (Phase 2 detail) -->
  <text x="475" y="235" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">VERIFYING COMMITMENT IN PHASE 2 (JOINT CONSENSUS)</text>
  
  <!-- Outer Box for Joint Consensus verification -->
  <rect x="50" y="250" width="850" height="135" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.5"/>
  
  <!-- Left Side: C_old Majority -->
  <text x="250" y="275" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">C_old Server Group (Majority: 2 of 3)</text>
  
  <!-- Server Node A -->
  <rect x="90" y="295" width="80" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="130" y="315" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">Node A</text>
  <text x="130" y="328" text-anchor="middle" fill="#34d399" font-size="8">Log Appended</text>

  <!-- Server Node B -->
  <rect x="185" y="295" width="80" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="225" y="315" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">Node B</text>
  <text x="225" y="328" text-anchor="middle" fill="#34d399" font-size="8">Log Appended</text>

  <!-- Server Node C (Offline/Delayed) -->
  <rect x="280" y="295" width="80" height="40" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="320" y="315" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">Node C</text>
  <text x="320" y="328" text-anchor="middle" fill="#f43f5e" font-size="8">No Append</text>

  <!-- Status text C_old -->
  <rect x="130" y="350" width="190" height="22" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="225" y="364" text-anchor="middle" fill="#34d399" font-size="9" font-weight="bold">C_old Majority: REACHED (2/3)</text>

  <!-- Logic Operator (AND) -->
  <circle cx="475" cy="325" r="22" fill="#1e1b29" stroke="#6d28d9" stroke-width="2"/>
  <text x="475" y="329" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="bold">AND</text>

  <!-- Right Side: C_new Majority -->
  <text x="700" y="275" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">C_new Server Group (Majority: 3 of 5)</text>

  <!-- Node A (already shown in C_old) -->
  <rect x="520" y="295" width="65" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="552.5" y="315" text-anchor="middle" fill="#e2e8f0" font-size="9.5" font-weight="bold">Node A</text>
  <text x="552.5" y="328" text-anchor="middle" fill="#34d399" font-size="8">Appended</text>

  <!-- Node B (already shown in C_old) -->
  <rect x="595" y="295" width="65" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="627.5" y="315" text-anchor="middle" fill="#e2e8f0" font-size="9.5" font-weight="bold">Node B</text>
  <text x="627.5" y="328" text-anchor="middle" fill="#34d399" font-size="8">Appended</text>

  <!-- Node D (New Server) -->
  <rect x="670" y="295" width="65" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="702.5" y="315" text-anchor="middle" fill="#e2e8f0" font-size="9.5" font-weight="bold">Node D</text>
  <text x="702.5" y="328" text-anchor="middle" fill="#38bdf8" font-size="8">Appended</text>

  <!-- Node E (New Server - Offline/Delayed) -->
  <rect x="745" y="295" width="65" height="40" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="777.5" y="315" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-weight="bold">Node E</text>
  <text x="777.5" y="328" text-anchor="middle" fill="#f43f5e" font-size="8">No Append</text>

  <!-- Node C (also in C_new, delayed, not active here) -->
  <rect x="820" y="295" width="65" height="40" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="852.5" y="315" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-weight="bold">Node C</text>
  <text x="852.5" y="328" text-anchor="middle" fill="#f43f5e" font-size="8">No Append</text>

  <!-- Status text C_new -->
  <rect x="605" y="350" width="190" height="22" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="700" y="364" text-anchor="middle" fill="#34d399" font-size="9" font-weight="bold">C_new Majority: REACHED (3/5)</text>

  <!-- Divider -->
  <line x1="30" y1="400" x2="920" y2="400" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Bottom Panel: Production Corner Cases & Rules -->
  <rect x="30" y="415" width="890" height="105" rx="4" fill="#1c0f1a" stroke="#581c49" stroke-width="1"/>
  <text x="50" y="435" fill="#f472b6" font-size="11" font-weight="bold">PRODUCTION CORNER CASES &amp; RULE OF SAFETY</text>
  
  <text x="50" y="455" fill="#e2e8f0" font-size="9.5">1. IMMEDIATE ENROLLMENT: Nodes use new configuration immediately upon writing to disk (do not wait for commitment).</text>
  <text x="50" y="470" fill="#e2e8f0" font-size="9.5">2. LEADER DISRUPTION: Non-voting catch-up servers must be synchronized fully before they are added to avoid blocking commits.</text>
  <text x="50" y="485" fill="#e2e8f0" font-size="9.5">3. TERM CHANGES &amp; STEP DOWN: If the leader is not in C_new, it must step down to follower after committing C_new.</text>
  <text x="50" y="500" fill="#fb7185" font-size="9.5">4. JOINT SAFETY: Standard single-server transitions work ONLY if changes are strict 1-by-1 additions/removals. Use Joint for N-to-M changes.</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow-gray" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
