<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E2640"/>
      <stop offset="100%" stop-color="#0F1322"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card-grad-active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="github-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="aws-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#CC7A00"/>
    </linearGradient>
    <linearGradient id="vault-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="runner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <filterDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#6366F1"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FF9900"/>
    </marker>
    <marker id="arrow-vault" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FF4081"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .subtitle { font-size: 13px; fill: #94A3B8; font-weight: 400; }
    .box-title { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .box-subtitle { font-size: 10px; font-weight: 800; fill: #6366F1; letter-spacing: 1px; text-transform: uppercase; }
    .box-desc { font-size: 11px; fill: #94A3B8; }
    .flow-label { font-size: 11px; font-weight: 600; fill: #94A3B8; }
    .flow-num { font-size: 10px; font-weight: bold; fill: #FFFFFF; }
    .code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 10px; fill: #38BDF8; }
  </style>

  <!-- Background -->
  <rect width="1000" height="680" fill="url(#bg-glow)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" class="title">Hardening CI/CD: Ephemeral Self-Hosted Runner Architecture</text>
  <text x="40" y="68" class="subtitle">Zero-trust credential exchange via GitHub Actions OIDC, HashiCorp Vault, and AWS EC2</text>

  <!-- ==================== GITHUB PLATFORM ZONE ==================== -->
  <rect x="40" y="100" width="280" height="520" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="100" width="280" height="40" rx="12" fill="url(#github-grad)" opacity="0.9"/>
  <text x="60" y="125" class="box-title">GitHub Actions Platform</text>
  
  <!-- GitHub Actions Component: VCS & Trigger -->
  <rect x="60" y="160" width="240" height="110" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="75" y="185" class="box-subtitle">1. Workflow Engine</text>
  <text x="75" y="205" class="box-title" font-size="13">Pipeline Triggered</text>
  <text x="75" y="225" class="box-desc">Developer pushes code to repo.</text>
  <text x="75" y="240" class="box-desc">Workflow triggers self-hosted runner.</text>

  <!-- GitHub Actions Component: OIDC Provider -->
  <rect x="60" y="290" width="240" height="110" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="75" y="315" class="box-subtitle">2. Identity Provider</text>
  <text x="75" y="335" class="box-title" font-size="13">GHA OIDC Provider</text>
  <text x="75" y="355" class="box-desc">Issues ephemeral, cryptographically</text>
  <text x="75" y="370" class="box-desc">signed JSON Web Tokens (JWT).</text>
  <text x="75" y="385" class="code">token: write</text>

  <!-- GitHub Actions Component: Webhook Service -->
  <rect x="60" y="420" width="240" height="180" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="75" y="445" class="box-subtitle">3. Event Delivery</text>
  <text x="75" y="465" class="box-title" font-size="13">GitHub Webhook Dispatcher</text>
  <text x="75" y="485" class="box-desc">Sends encrypted event payload on</text>
  <text x="75" y="500" class="box-desc">workflow_job events (queued status).</text>
  <text x="75" y="525" class="code">webhook_secret: HMAC-SHA256</text>
  <rect x="75" y="540" width="130" height="20" rx="4" fill="#312E81" />
  <text x="85" y="554" fill="#818CF8" font-size="9" font-weight="bold">workflow_job.queued</text>

  <!-- ==================== AWS CLOUD ZONE ==================== -->
  <rect x="380" y="100" width="580" height="520" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="380" y="100" width="580" height="40" rx="12" fill="url(#aws-grad)" opacity="0.9"/>
  <text x="400" y="125" class="box-title">AWS Secure Environment (VPC)</text>

  <!-- AWS Component: Runner Orchestrator -->
  <rect x="400" y="160" width="250" height="150" rx="8" fill="#0F172A" stroke="#FF9900" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="415" y="185" class="box-subtitle" fill="#FF9900">Runner Orchestrator</text>
  <text x="415" y="205" class="box-title" font-size="13">EC2 Runner Manager</text>
  <text x="415" y="225" class="box-desc">Listens to Webhooks (webhook receiver).</text>
  <text x="415" y="240" class="box-desc">Authenticates & validates payloads.</text>
  <text x="415" y="255" class="box-desc">Asynchronously provisions runners.</text>
  <rect x="415" y="275" width="105" height="20" rx="4" fill="#451A03" />
  <text x="425" y="289" fill="#FDBA74" font-size="9" font-weight="bold">AWS SDK / Go / Rust</text>

  <!-- AWS Component: Vault Instance -->
  <rect x="400" y="420" width="250" height="180" rx="8" fill="#0F172A" stroke="#FF4081" stroke-width="1"/>
  <text x="415" y="445" class="box-subtitle" fill="#FF4081">Secrets Engine</text>
  <text x="415" y="465" class="box-title" font-size="13">HashiCorp Vault</text>
  <text x="415" y="485" class="box-desc">Configured with JWT/OIDC Auth.</text>
  <text x="415" y="500" class="box-desc">Validates GHA claims (aud, iss, sub).</text>
  <text x="415" y="515" class="box-desc">Generates dynamic secrets on the fly.</text>
  <rect x="415" y="535" width="140" height="20" rx="4" fill="#4D0720" />
  <text x="425" y="549" fill="#FDA4AF" font-size="9" font-weight="bold">jwt auth / aws secrets engine</text>
  <text x="415" y="575" class="code" font-size="9">vault.service.internal</text>

  <!-- AWS Component: Ephemeral EC2 Runner -->
  <rect x="690" y="220" width="250" height="320" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="2" filter="url(#glow-green)"/>
  <text x="705" y="245" class="box-subtitle" fill="#10B981">Ephemeral Runner Instance</text>
  <text x="705" y="265" class="box-title" font-size="13">Amazon EC2 (Spot / On-Demand)</text>
  <text x="705" y="285" class="box-desc">Hardened AMI, running rootless Docker.</text>
  <text x="705" y="300" class="box-desc">Configured with `run.sh --once` flag.</text>
  
  <rect x="705" y="325" width="220" height="85" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="715" y="345" class="box-subtitle" fill="#94A3B8" font-size="9">Running Job Lifecycle</text>
  <text x="715" y="365" fill="#E2E8F0" font-size="11" font-weight="bold">1. Spin Up -> 2. Register Runner</text>
  <text x="715" y="380" fill="#E2E8F0" font-size="11" font-weight="bold">3. Execute Job -> 4. Self-Terminate</text>

  <rect x="705" y="425" width="220" height="95" rx="6" fill="#020617" stroke="#1E293B" stroke-width="1"/>
  <text x="715" y="445" class="box-subtitle" fill="#6366F1" font-size="9">Security Parameters</text>
  <text x="715" y="465" class="box-desc">No IAM instance profile (No AWS Keys)</text>
  <text x="715" y="480" class="box-desc">No long-lived GitHub Runner Tokens</text>
  <text x="715" y="495" class="box-desc">No hardcoded database credentials</text>


  <!-- ==================== FLOW LINES & ARROWS ==================== -->
  
  <!-- 1. Webhook trigger from GHA to Orchestrator -->
  <path d="M 300 480 L 350 480 L 350 250 L 400 250" fill="none" stroke="#FF9900" stroke-width="1.5" marker-end="url(#arrow-orange)" stroke-dasharray="3 3"/>
  <rect x="305" y="300" width="85" height="30" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="310" y="312" fill="#FF9900" font-size="9" font-weight="bold">1. Webhook</text>
  <text x="310" y="322" fill="#94A3B8" font-size="8">Trigger Runner</text>

  <!-- 2. Orchestrator provisions runner -->
  <path d="M 650 190 L 815 190 L 815 220" fill="none" stroke="#FF9900" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="680" y="165" width="105" height="35" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="685" y="177" fill="#FF9900" font-size="9" font-weight="bold">2. Provision EC2</text>
  <text x="685" y="192" fill="#94A3B8" font-size="8">Creates runner VM</text>

  <!-- 3. Runner registers back to GitHub -->
  <path d="M 690 340 L 360 340 L 360 215 L 300 215" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="3 3"/>
  <rect x="315" y="240" width="85" height="30" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="320" y="252" fill="#10B981" font-size="9" font-weight="bold">3. Register</text>
  <text x="320" y="262" fill="#94A3B8" font-size="8">Pulls Queued Job</text>

  <!-- 4. GHA Runner gets OIDC Token -->
  <path d="M 300 370 L 690 370" fill="none" stroke="#6366F1" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="3 3"/>
  <rect x="475" y="345" width="90" height="30" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="480" y="357" fill="#818CF8" font-size="9" font-weight="bold">4. Request JWT</text>
  <text x="480" y="367" fill="#94A3B8" font-size="8">Short-lived OIDC</text>

  <!-- 5. Runner exchanges JWT for Vault Token -->
  <path d="M 815 540 L 815 570 L 650 570" fill="none" stroke="#FF4081" stroke-width="2" marker-end="url(#arrow-vault)"/>
  <rect x="680" y="555" width="115" height="35" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="685" y="567" fill="#FF4081" font-size="9" font-weight="bold">5. Authenticate</text>
  <text x="685" y="582" fill="#94A3B8" font-size="8">Presents JWT to Vault</text>

  <!-- 6. Vault verifies GHA JWT using JWKS -->
  <path d="M 400 500 L 340 500 L 340 380 L 300 380" fill="none" stroke="#FF4081" stroke-width="1.5" marker-end="url(#arrow-vault)" stroke-dasharray="3 3"/>
  <rect x="315" y="420" width="85" height="30" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="320" y="432" fill="#FF4081" font-size="9" font-weight="bold">6. Verify JWT</text>
  <text x="320" y="442" fill="#94A3B8" font-size="8">Verifies signature</text>

  <!-- 7. Vault issues short-lived dynamic secrets -->
  <path d="M 525 420 L 525 390 L 690 390" fill="none" stroke="#FF4081" stroke-width="1.5" marker-end="url(#arrow-vault)"/>
  <rect x="560" y="380" width="90" height="35" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="565" y="392" fill="#FF4081" font-size="9" font-weight="bold">7. Issue Secrets</text>
  <text x="565" y="407" fill="#94A3B8" font-size="8">Temporary DB/AWS</text>

  <!-- 8. Runner completes job and terminates -->
  <path d="M 880 220 L 880 180 L 910 180 C 930 180 940 190 940 210 L 940 480 C 940 500 930 510 910 510 L 890 510" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="895" y="315" width="85" height="35" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="900" y="327" fill="#10B981" font-size="9" font-weight="bold">8. Terminate</text>
  <text x="900" y="342" fill="#94A3B8" font-size="8">VM shutdown --once</text>

</svg>
