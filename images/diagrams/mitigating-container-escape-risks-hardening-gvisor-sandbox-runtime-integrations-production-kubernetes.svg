<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#0f172a" rx="10" />
  
  <!-- Title / Headers -->
  <text x="400" y="35" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">gVisor Sandbox Integration Architecture in Kubernetes</text>
  <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Comparing Standard Runtime (runc) vs Hardened Sandbox (runsc)</text>

  <!-- Legend -->
  <g transform="translate(50, 85)">
    <rect width="700" height="40" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="20" r="6" fill="#38bdf8"/>
    <text x="32" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Standard Path (Direct Syscalls)</text>
    
    <circle cx="260" cy="20" r="6" fill="#ef4444"/>
    <text x="272" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Intercepted &amp; Sandboxed Path</text>
    
    <rect x="500" y="14" width="20" height="12" fill="none" stroke="#f59e0b" stroke-dasharray="3,3" stroke-width="2"/>
    <text x="530" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Security/Isolation Boundary</text>
  </g>

  <!-- Left: Standard runc Node/Namespace -->
  <g transform="translate(50, 150)">
    <!-- Container boundary -->
    <rect width="320" height="280" fill="#1e293b" rx="8" stroke="#475569" stroke-width="1.5" />
    <text x="160" y="25" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13">Standard Container Pod (runc)</text>
    
    <!-- User Space App -->
    <rect x="40" y="45" width="240" height="50" fill="#334155" rx="6" stroke="#64748b" stroke-width="1" />
    <text x="160" y="70" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Application Container (User Space)</text>
    <text x="160" y="85" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Processes execute instructions &amp; syscalls</text>
    
    <!-- Syscall Layer -->
    <path d="M 160 95 L 160 230" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="170" y="150" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Direct Syscalls</text>
    <text x="170" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">(e.g., clone, execve, socket)</text>
    
    <!-- Container runtime container/runc -->
    <rect x="40" y="230" width="240" height="35" fill="#0f172a" rx="4" stroke="#38bdf8" stroke-width="1.5" />
    <text x="160" y="252" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">containerd-shim-runc-v2</text>
  </g>

  <!-- Right: gVisor runsc Sandbox Node/Namespace -->
  <g transform="translate(430, 150)">
    <!-- Sandboxed Pod boundary -->
    <rect width="320" height="280" fill="#1e293b" rx="8" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
    <text x="160" y="25" text-anchor="middle" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13">gVisor Sandboxed Pod (runsc)</text>
    
    <!-- User Space App -->
    <rect x="40" y="45" width="240" height="40" fill="#334155" rx="6" stroke="#64748b" stroke-width="1" />
    <text x="160" y="70" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Application Container (User Space)</text>
    
    <!-- Path from app to Sentry -->
    <path d="M 160 85 L 160 115" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)"/>
    <text x="170" y="105" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold">Intercepted Syscalls</text>

    <!-- Sentry (User-Space Kernel) -->
    <rect x="30" y="115" width="260" height="70" fill="#7f1d1d" rx="6" stroke="#f87171" stroke-width="1.5" />
    <text x="160" y="135" text-anchor="middle" fill="#fecaca" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Sentry (User-Space Kernel in Go)</text>
    <text x="160" y="152" text-anchor="middle" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10">Implements Linux syscalls in user-space</text>
    <text x="160" y="168" text-anchor="middle" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="9">Platform: KVM / ptrace</text>

    <!-- Gofer (File System Proxy) and Sentry Communication -->
    <path d="M 90 185 L 90 230" stroke="#f87171" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="95" y="208" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="8">9P / lisafs</text>

    <!-- Gofer Process -->
    <rect x="30" y="230" width="115" height="35" fill="#451a03" rx="4" stroke="#d97706" stroke-width="1" />
    <text x="87" y="252" text-anchor="middle" fill="#fed7aa" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Gofer (FS Proxy)</text>

    <!-- runsc runtime shim -->
    <rect x="165" y="230" width="125" height="35" fill="#0f172a" rx="4" stroke="#f59e0b" stroke-width="1.5" />
    <text x="227" y="252" text-anchor="middle" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">containerd-shim-runsc-v2</text>
  </g>

  <!-- Downward arrows to Host Kernel -->
  <!-- Left path: runc standard host kernel access -->
  <path d="M 210 430 L 210 490" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="100" y="465" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Direct Kernel Interface</text>

  <!-- Right path: Sentry host kernel access -->
  <path d="M 660 430 L 660 490" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="670" y="455" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Drastically Restricted</text>
  <text x="670" y="467" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="9">Syscalls (seccomp-filtered)</text>

  <!-- Host Operating System / Kernel Layer -->
  <g transform="translate(50, 490)">
    <rect width="700" height="90" fill="#020617" rx="8" stroke="#1e293b" stroke-width="2" />
    <rect x="10" y="10" width="680" height="40" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1" />
    <text x="350" y="35" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Host OS Kernel (Linux Shared Host Kernel)</text>
    
    <!-- Host Hardware -->
    <text x="350" y="75" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">Physical Hardware / Virtual Machine (CPU, Memory, Devices)</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>
</svg>
