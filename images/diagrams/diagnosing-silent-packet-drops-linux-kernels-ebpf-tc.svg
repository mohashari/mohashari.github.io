<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="100%" height="100%">
  <defs>
    <!-- Background styling and shadows -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="ebpf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Base canvas background -->
  <rect width="850" height="550" rx="12" fill="url(#bg-grad)" />

  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">Linux Kernel Packet Path &amp; eBPF Observability Hooks</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Visualizing silent drops and instrumentation points (tc &amp; kfree_skb)</text>

  <!-- Legend -->
  <g transform="translate(560, 25)">
    <rect width="260" height="50" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="15" cy="15" r="6" fill="#38bdf8" />
    <text x="28" y="19" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10">eBPF Probe / Hook</text>
    <circle cx="15" cy="35" r="6" fill="#ef4444" />
    <text x="28" y="39" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10">Silent Drop Location</text>
    <line x1="140" y1="15" x2="160" y2="15" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="2" />
    <text x="170" y="19" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10">Event Flow</text>
  </g>

  <!-- Network Interface Card (NIC) -->
  <g transform="translate(40, 150)" filter="url(#shadow)">
    <rect width="130" height="280" rx="8" fill="url(#box-grad)" stroke="#475569" stroke-width="1.5" />
    <text x="65" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">NIC (eth0)</text>
    
    <rect x="15" y="60" width="100" height="50" rx="4" fill="#334155" stroke="#64748b" />
    <text x="65" y="80" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Rx/Tx Ring Buffer</text>
    <text x="65" y="98" text-anchor="middle" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Drop: Ring Full</text>
    
    <rect x="15" y="140" width="100" height="40" rx="4" fill="#334155" stroke="#64748b" />
    <text x="65" y="164" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Driver / NAPI</text>

    <rect x="15" y="210" width="100" height="50" rx="4" fill="#334155" stroke="#64748b" />
    <text x="65" y="230" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">netif_receive_skb</text>
    <text x="65" y="243" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">allocates sk_buff</text>
  </g>

  <!-- TC & eBPF tc Section -->
  <g transform="translate(210, 150)" filter="url(#shadow)">
    <rect width="150" height="280" rx="8" fill="url(#box-grad)" stroke="#475569" stroke-width="1.5" />
    <text x="75" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">tc (Traffic Control)</text>
    
    <!-- TC Ingress Hook -->
    <rect x="15" y="70" width="120" height="80" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="75" y="90" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">tc Ingress Hook</text>
    <rect x="25" y="105" width="100" height="34" rx="4" fill="url(#ebpf-grad)" />
    <text x="75" y="120" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">eBPF (SCHED_CLS)</text>
    <text x="75" y="132" text-anchor="middle" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9">Inspect / Filter / Drop</text>

    <!-- Drop visual inside tc -->
    <circle cx="75" cy="210" r="15" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
    <text x="75" y="214" text-anchor="middle" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">X</text>
    <text x="75" y="240" text-anchor="middle" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10">TC_ACT_SHOT</text>
  </g>

  <!-- Network Stack (IP / Netfilter) -->
  <g transform="translate(400, 150)" filter="url(#shadow)">
    <rect width="180" height="280" rx="8" fill="url(#box-grad)" stroke="#475569" stroke-width="1.5" />
    <text x="90" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">IP Stack &amp; Netfilter</text>

    <!-- IP Routing -->
    <rect x="15" y="60" width="150" height="50" rx="4" fill="#334155" stroke="#64748b" />
    <text x="90" y="80" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">IP Routing (ip_rcv)</text>
    <text x="90" y="95" text-anchor="middle" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="9">Drop: Invalid Header / TTL</text>

    <!-- Netfilter Hook -->
    <rect x="15" y="140" width="150" height="70" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
    <text x="90" y="160" text-anchor="middle" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">Netfilter / iptables</text>
    <text x="90" y="178" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">NF_IP_PRE_ROUTING</text>
    <text x="90" y="195" text-anchor="middle" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Drop: Firewalls (DROP)</text>

    <!-- Socket Allocation / Protocol Layer -->
    <rect x="15" y="225" width="150" height="40" rx="4" fill="#334155" stroke="#64748b" />
    <text x="90" y="242" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">TCP/UDP (tcp_v4_rcv)</text>
    <text x="90" y="255" text-anchor="middle" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="9">Drop: Buffer Full / No Port</text>
  </g>

  <!-- kfree_skb Tracepoint Hook -->
  <g transform="translate(620, 150)" filter="url(#shadow)">
    <rect width="190" height="110" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="10" y="-10" width="120" height="20" rx="3" fill="#38bdf8" />
    <text x="70" y="4" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Kernel Tracepoint</text>
    
    <text x="95" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">skb:kfree_skb</text>
    <text x="95" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Monitors call path of drops</text>
    <rect x="15" y="65" width="160" height="34" rx="4" fill="url(#ebpf-grad)" />
    <text x="95" y="80" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">eBPF Probe (tracepoint)</text>
    <text x="95" y="92" text-anchor="middle" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9">Extract Reason &amp; Callstack</text>
  </g>

  <!-- User Space Daemon (Ring Buffer Collector) -->
  <g transform="translate(620, 310)" filter="url(#shadow)">
    <rect width="190" height="120" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="95" y="25" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">User-space Agent (Go/C)</text>
    <rect x="15" y="40" width="160" height="30" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="95" y="58" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">eBPF Perf Ring Buffer</text>
    
    <rect x="15" y="78" width="160" height="30" rx="4" fill="#064e3b" />
    <text x="95" y="96" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Prometheus / Alerts</text>
  </g>

  <!-- Connectors / Paths -->
  <!-- eth0 -> tc Ingress -->
  <path d="M 170, 240 L 210, 240" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- tc Ingress -> Drop -->
  <path d="M 275, 150 L 275, 195" fill="none" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="2" marker-end="url(#arrow-red)" />
  
  <!-- tc Ingress (Pass) -> IP Stack -->
  <path d="M 360, 240 L 400, 240" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- Tracing connections to kfree_skb -->
  <!-- From NIC Ring Buffer Drop -->
  <path d="M 115, 210 L 115, 120 C 115, 110 380, 110 590, 160" fill="none" stroke="#ef4444" stroke-opacity="0.5" stroke-dasharray="2,2" stroke-width="1.5" />
  <!-- From Netfilter Drop -->
  <path d="M 550, 175 L 610, 175" fill="none" stroke="#ef4444" stroke-opacity="0.8" stroke-dasharray="2,2" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <!-- From tc Class Shot -->
  <path d="M 290, 210 L 610, 205" fill="none" stroke="#ef4444" stroke-opacity="0.8" stroke-dasharray="2,2" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Ring buffer flow to User Space -->
  <path d="M 715, 260 L 715, 310" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
</svg>
