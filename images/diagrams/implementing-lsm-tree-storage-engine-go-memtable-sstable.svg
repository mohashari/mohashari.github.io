<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Component Gradients -->
    <linearGradient id="memtable-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="imm-memtable-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="wal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <linearGradient id="l0-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>

    <linearGradient id="l1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8" />
    </marker>

    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>

    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee" />
    </marker>
    
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" rx="16" fill="url(#bg-grad)" />
  <rect width="1000" height="650" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Diagram Title -->
  <text x="50%" y="40" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">LSM-Tree Storage Engine Architecture</text>
  
  <!-- Subtitle -->
  <text x="50%" y="65" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Write Path, Flush Pipeline, and Multi-Level SSTable Compaction</text>

  <!-- Bounding Box: memory -->
  <rect x="220" y="100" width="310" height="490" rx="12" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 4" />
  <text x="235" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">RAM (IN-MEMORY STATE)</text>

  <!-- Bounding Box: disk -->
  <rect x="580" y="100" width="380" height="490" rx="12" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 4" />
  <text x="595" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DISK (PERSISTENT STORAGE)</text>

  <!-- ================= CLIENT & WRITE PATH ================= -->
  
  <!-- Client Box -->
  <g transform="translate(40, 200)">
    <rect width="130" height="120" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="65" y="35" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Client API</text>
    <text x="65" y="65" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Put(k, v)</text>
    <text x="65" y="90" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Get(k)</text>
  </g>

  <!-- Write Arrow: Client -> WAL (Disk) -->
  <path d="M 170 230 L 610 230" fill="none" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)" />
  <text x="390" y="220" text-anchor="middle" fill="#fb7185" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">1. Append Write</text>

  <!-- Write Arrow: Client -> Memtable (RAM) -->
  <path d="M 170 260 L 240 260" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow-indigo)" />
  <text x="205" y="282" text-anchor="middle" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Update</text>

  <!-- ================= IN-MEMORY COMPONENTS ================= -->

  <!-- WAL Box (Disk) -->
  <g transform="translate(620, 200)">
    <rect width="140" height="50" rx="6" fill="url(#wal-grad)" stroke="#ef4444" stroke-width="2" />
    <text x="70" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Write-Ahead Log</text>
    <!-- WAL line patterns to look like log records -->
    <line x1="15" y1="38" x2="60" y2="38" stroke="#fca5a5" stroke-width="2" stroke-linecap="round" />
    <line x1="70" y1="38" x2="125" y2="38" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Memtable (RAM) -->
  <g transform="translate(250, 160)">
    <rect width="250" height="120" rx="8" fill="url(#memtable-grad)" stroke="#6366f1" stroke-width="2" />
    <text x="125" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Memtable (Active)</text>
    <text x="125" y="50" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">SkipList / Red-Black Tree</text>
    
    <!-- Skiplist Visual representation -->
    <g transform="translate(25, 70)" stroke="#818cf8" stroke-width="1.5">
      <!-- nodes -->
      <circle cx="20" cy="15" r="8" fill="#312e81" stroke="#818cf8" stroke-width="2" />
      <circle cx="80" cy="15" r="8" fill="#312e81" stroke="#818cf8" stroke-width="2" />
      <circle cx="140" cy="15" r="8" fill="#312e81" stroke="#818cf8" stroke-width="2" />
      <circle cx="200" cy="15" r="8" fill="#312e81" stroke="#818cf8" stroke-width="2" />
      
      <circle cx="20" cy="35" r="8" fill="#312e81" stroke="#818cf8" stroke-width="2" />
      <circle cx="140" cy="35" r="8" fill="#312e81" stroke="#818cf8" stroke-width="2" />
      
      <!-- links -->
      <line x1="28" y1="15" x2="72" y2="15" />
      <line x1="88" y1="15" x2="132" y2="15" />
      <line x1="148" y1="15" x2="192" y2="15" />
      <line x1="28" y1="35" x2="132" y2="35" />
      <line x1="20" y1="23" x2="20" y2="27" />
      <line x1="140" y1="23" x2="140" y2="27" />
    </g>
  </g>

  <!-- Freeze & Transition Path -->
  <path d="M 375 282 L 375 338" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="385" y="315" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Threshold Reached (Freeze)</text>

  <!-- Immutable Memtable (RAM) -->
  <g transform="translate(250, 350)">
    <rect width="250" height="90" rx="8" fill="url(#imm-memtable-grad)" stroke="#475569" stroke-width="2" />
    <text x="125" y="30" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Immutable Memtable</text>
    <text x="125" y="52" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Frozen RAM State (Read Only)</text>
    
    <!-- Small read-only lock symbol -->
    <path d="M 120 68 L 120 63 A 5 5 0 0 1 130 63 L 130 68 M 117 68 L 133 68 L 133 76 L 117 76 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- ================= PERSISTENCE & FLUSH ================= -->

  <!-- Flush Path: Immutable Memtable -> Level 0 SSTable -->
  <path d="M 502 395 L 610 395" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)" />
  <text x="556" y="380" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Background Flush</text>
  <text x="556" y="415" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10">Serialize to L0 SSTable</text>

  <!-- Level 0 SSTables (Disk, Overlapping key ranges) -->
  <g transform="translate(620, 300)">
    <rect width="320" height="110" rx="8" fill="url(#l0-grad)" stroke="#eab308" stroke-width="2" />
    <text x="160" y="25" text-anchor="middle" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Level 0 SSTables (Overlapping Keys)</text>
    
    <!-- SSTable Files -->
    <g transform="translate(15, 40)">
      <rect width="85" height="55" rx="4" fill="#422006" stroke="#eab308" stroke-width="1.5" />
      <text x="42" y="22" text-anchor="middle" fill="#fef08a" font-family="monospace" font-size="10">sstable_1.db</text>
      <text x="42" y="42" text-anchor="middle" fill="#ca8a04" font-family="system-ui, -apple-system, sans-serif" font-size="9">Bloom + Index</text>
    </g>
    <g transform="translate(115, 40)">
      <rect width="85" height="55" rx="4" fill="#422006" stroke="#eab308" stroke-width="1.5" />
      <text x="42" y="22" text-anchor="middle" fill="#fef08a" font-family="monospace" font-size="10">sstable_2.db</text>
      <text x="42" y="42" text-anchor="middle" fill="#ca8a04" font-family="system-ui, -apple-system, sans-serif" font-size="9">Bloom + Index</text>
    </g>
    <g transform="translate(215, 40)">
      <rect width="85" height="55" rx="4" fill="#422006" stroke="#eab308" stroke-width="1.5" />
      <text x="42" y="22" text-anchor="middle" fill="#fef08a" font-family="monospace" font-size="10">sstable_3.db</text>
      <text x="42" y="42" text-anchor="middle" fill="#ca8a04" font-family="system-ui, -apple-system, sans-serif" font-size="9">Bloom + Index</text>
    </g>
  </g>

  <!-- ================= COMPACTION PATH ================= -->

  <!-- Compaction Loop Curve -->
  <path d="M 945 355 C 980 355, 980 500, 945 500" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="4 2" marker-end="url(#arrow-cyan)" />
  <text x="980" y="430" text-anchor="middle" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" transform="rotate(90, 980, 430)">Compaction Loop</text>
  
  <g transform="translate(680, 420)">
    <!-- Invisible point for compaction path alignment -->
    <path d="M 60 5 L -10 5" fill="none" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
    <text x="25" y="-5" text-anchor="middle" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Merge &amp; Sort</text>
  </g>

  <!-- Level 1 SSTables (Disk, Sorted Non-Overlapping key ranges) -->
  <g transform="translate(620, 460)">
    <rect width="320" height="110" rx="8" fill="url(#l1-grad)" stroke="#10b981" stroke-width="2" />
    <text x="160" y="25" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Level 1 SSTables (Non-Overlapping)</text>
    
    <!-- Level 1 Sorted Tables -->
    <g transform="translate(25, 40)">
      <rect width="120" height="55" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
      <text x="60" y="22" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="10">sstable_merged_1.db</text>
      <text x="60" y="42" text-anchor="middle" fill="#059669" font-family="system-ui, -apple-system, sans-serif" font-size="9">Range: AAA - LLL</text>
    </g>
    <g transform="translate(175, 40)">
      <rect width="120" height="55" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
      <text x="60" y="22" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="10">sstable_merged_2.db</text>
      <text x="60" y="42" text-anchor="middle" fill="#059669" font-family="system-ui, -apple-system, sans-serif" font-size="9">Range: MMM - ZZZ</text>
    </g>
  </g>

  <!-- ================= READ PATH ================= -->
  
  <!-- Read Path: Client -> Memtable -> Immutable Memtable -> SSTables -->
  <!-- We'll trace a single dotted line showing priority query cascade -->
  <path d="M 105 322 L 105 520 L 250 520" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="177" y="512" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Read Query Cascade</text>

  <!-- Query search order detail box in bottom-left inside Memory block -->
  <g transform="translate(250, 480)">
    <rect width="250" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="15" y="22" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Read Cascade Priority Order:</text>
    <text x="15" y="40" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11">1. Active Memtable (Lock-Free Read)</text>
    <text x="15" y="55" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">2. Immutable Memtable (Locked Read)</text>
    <text x="15" y="72" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="11">3. L0 SSTables (Search All Bloom Filters)</text>
    <text x="15" y="87" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9" transform="translate(0, -2)">4. L1+ SSTables (Binary Search via Sparse Index)</text>
  </g>
  
  <path d="M 502 525 L 610 525" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" />

</svg>
