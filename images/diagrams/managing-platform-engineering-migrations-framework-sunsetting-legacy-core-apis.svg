<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="gateway-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="legacy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="new-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="db-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers for Arrows -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a78bfa" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" rx="16" fill="url(#bg-grad)" />
  <rect width="996" height="596" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Title / Legend -->
  <text x="50" y="45" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#f8fafc">SAFE CORE API SUNSETTING WORKFLOW</text>
  <text x="50" y="70" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Production Traffic Routing, Shadowing, and CDC-Based Data Synchronization Architecture</text>

  <!-- Outer Borders/Groups -->
  <!-- Traffic Control Domain -->
  <rect x="40" y="110" width="220" height="440" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="55" y="135" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">TRAFFIC CONTROL</text>

  <!-- Execution Domain -->
  <rect x="290" y="110" width="420" height="440" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="305" y="135" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">API SERVICE LAYER</text>

  <!-- Data & Obs Domain -->
  <rect x="740" y="110" width="220" height="440" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="755" y="135" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">DATA &amp; OBSERVABILITY</text>

  <!-- NODES -->

  <!-- Clients -->
  <g id="node-clients" filter="url(#shadow)">
    <rect x="60" y="270" width="180" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="150" y="298" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">API Clients / SDKs</text>
    <text x="150" y="316" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Mobile, Web, &amp; Cron Jobs</text>
  </g>

  <!-- API Gateway (Envoy) -->
  <g id="node-gateway" filter="url(#shadow)">
    <rect x="60" y="390" width="180" height="90" rx="8" fill="url(#gateway-grad)" stroke="#2563eb" stroke-width="1" />
    <text x="150" y="420" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">API Gateway (Envoy)</text>
    <text x="150" y="440" font-family="'Inter', sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Header Routing &amp; Mirroring</text>
    <!-- Config / Consul tag -->
    <rect x="90" y="452" width="120" height="18" rx="4" fill="#1e40af" />
    <text x="150" y="465" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">Dynamically Configured</text>
  </g>

  <!-- Legacy Core API -->
  <g id="node-legacy-api" filter="url(#shadow)">
    <rect x="320" y="170" width="220" height="90" rx="8" fill="url(#legacy-grad)" stroke="#e11d48" stroke-width="1" />
    <text x="430" y="205" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Legacy Core API (v1)</text>
    <text x="430" y="225" font-family="'Inter', sans-serif" font-size="11" fill="#fecdd3" text-anchor="middle">Deprecating (Monolith/REST)</text>
    <rect x="350" y="235" width="160" height="16" rx="4" fill="#9f1239" />
    <text x="430" y="247" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#fda4af" text-anchor="middle">Canary Path (Low Traffic)</text>
  </g>

  <!-- New Core API -->
  <g id="node-new-api" filter="url(#shadow)">
    <rect x="320" y="310" width="220" height="90" rx="8" fill="url(#new-grad)" stroke="#059669" stroke-width="1" />
    <text x="430" y="345" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">New Core API (v2)</text>
    <text x="430" y="365" font-family="'Inter', sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Target Architecture (gRPC)</text>
    <rect x="350" y="375" width="160" height="16" rx="4" fill="#065f46" />
    <text x="430" y="387" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">Main Production Target</text>
  </g>

  <!-- Async Traffic Shadow Diffy -->
  <g id="node-diffy" filter="url(#shadow)">
    <rect x="320" y="440" width="220" height="80" rx="8" fill="url(#shadow-grad)" stroke="#7c3aed" stroke-width="1" />
    <text x="430" y="470" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Shadow Compare (Diffy)</text>
    <text x="430" y="490" font-family="'Inter', sans-serif" font-size="11" fill="#ddd6fe" text-anchor="middle">Replays Write-Dry &amp; Read Requests</text>
    <text x="430" y="505" font-family="'Inter', sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="700">Async Shadow Validation</text>
  </g>

  <!-- Legacy Database -->
  <g id="node-legacy-db" filter="url(#shadow)">
    <rect x="580" y="170" width="100" height="90" rx="8" fill="url(#db-grad)" stroke="#475569" stroke-width="1" />
    <!-- Cylinder details -->
    <path d="M 580 185 C 580 175, 680 175, 680 185 M 580 195 C 580 185, 680 185, 680 195 M 580 205 C 580 195, 680 195, 680 205" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="630" y="225" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#f1f5f9" text-anchor="middle">Legacy DB</text>
    <text x="630" y="242" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Oracle/MySQL</text>
  </g>

  <!-- New Database -->
  <g id="node-new-db" filter="url(#shadow)">
    <rect x="580" y="310" width="100" height="90" rx="8" fill="url(#db-grad)" stroke="#475569" stroke-width="1" />
    <!-- Cylinder details -->
    <path d="M 580 325 C 580 315, 680 315, 680 325 M 580 335 C 580 325, 680 325, 680 335 M 580 345 C 580 335, 680 335, 680 345" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="630" y="365" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#f1f5f9" text-anchor="middle">New DB</text>
    <text x="630" y="382" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- CDC / Replication Engine (Debezium/Kafka) -->
  <g id="node-cdc" filter="url(#shadow)">
    <rect x="580" y="440" width="100" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 600 475 L 610 470 L 610 480 Z M 660 485 L 650 490 L 650 480 Z" fill="#94a3b8" />
    <text x="630" y="475" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f1f5f9" text-anchor="middle">CDC Sync</text>
    <text x="630" y="495" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Kafka/Debezium</text>
  </g>

  <!-- Prometheus / Grafana -->
  <g id="node-metrics" filter="url(#shadow)">
    <rect x="760" y="270" width="180" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Small graph drawing -->
    <path d="M 780 340 L 800 320 L 820 330 L 840 295 L 860 310 L 880 280 L 900 325" fill="none" stroke="#f59e0b" stroke-width="2" />
    <circle cx="880" cy="280" r="3" fill="#f59e0b" />
    <text x="850" y="195" font-family="'Inter', sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">OBSERVABILITY ENGINE</text>
    <text x="850" y="215" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#f1f5f9" text-anchor="middle">Prometheus + Jaeger</text>
    <text x="850" y="235" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Tracking Latency &amp; Error Diff</text>
  </g>

  <!-- CONNECTIONS / ARROWS -->

  <!-- Client to Gateway -->
  <path d="M 150 330 L 150 382" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="160" y="360" font-family="'Inter', sans-serif" font-size="11" fill="#60a5fa" font-weight="700">HTTPS</text>

  <!-- Gateway to Legacy API (Red - Canary path) -->
  <path d="M 190 390 C 220 310, 270 240, 312 225" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-red)" />
  <text x="210" y="260" font-family="'Inter', sans-serif" font-size="11" fill="#f87171" font-weight="700">v1 Call (Canary/Opt-in)</text>

  <!-- Gateway to New API (Green - Main Path) -->
  <path d="M 215 390 C 250 365, 280 360, 312 356" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="270" y="375" font-family="'Inter', sans-serif" font-size="11" fill="#34d399" font-weight="700">v2 Call (Active)</text>

  <!-- Gateway to Shadow Compare (Purple - Async Traffic Mirror) -->
  <path d="M 190 480 C 230 500, 280 500, 312 492" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-purple)" />
  <text x="210" y="515" font-family="'Inter', sans-serif" font-size="11" fill="#a78bfa" font-weight="700">Async Mirror (Shadow)</text>

  <!-- Shadow Compare to Legacy API & New API (Verification lines) -->
  <path d="M 330 440 C 310 400, 310 280, 325 250" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="2 2" />
  <path d="M 360 440 C 350 420, 350 410, 355 400" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="2 2" />
  <text x="280" y="435" font-family="'Inter', sans-serif" font-size="9" fill="#a78bfa">Dry-Run Replay &amp; Compare</text>

  <!-- Legacy API to Legacy DB -->
  <path d="M 540 215 L 572 215" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- New API to New DB -->
  <path d="M 540 355 L 572 355" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- Database CDC Sync -->
  <path d="M 630 260 L 630 432" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-gray)" />
  <path d="M 630 440 L 630 408" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="640" y="300" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">CDC Capture</text>
  <text x="640" y="420" font-family="'Inter', sans-serif" font-size="10" fill="#34d399">CDC Replay</text>

  <!-- Obs Connections -->
  <!-- Legacy to Metrics -->
  <path d="M 430 170 C 430 150, 780 150, 830 262" fill="none" stroke="#e11d48" stroke-width="1" stroke-dasharray="2 2" />
  <!-- New to Metrics -->
  <path d="M 540 325 C 600 300, 700 300, 752 305" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2" />
  <!-- Diffy to Metrics -->
  <path d="M 540 480 C 650 480, 790 440, 830 368" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Informational Tags / Legend -->
  <g transform="translate(760, 420)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="15" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">FLOW STATUS LEGEND</text>
    
    <!-- Active Flow -->
    <circle cx="25" cy="50" r="5" fill="#34d399" />
    <text x="40" y="54" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Active Prod Route (v2)</text>

    <!-- Deprecated Flow -->
    <circle cx="25" cy="75" r="5" fill="#f87171" />
    <text x="40" y="79" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Canary / Opt-in Route (v1)</text>

    <!-- Shadow Flow -->
    <circle cx="25" cy="100" r="5" fill="#a78bfa" />
    <text x="40" y="104" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Shadow Validation Route</text>
  </g>

</svg>
