<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <!-- Glow effects -->
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Deep dark slate background -->
  <rect width="100%" height="100%" fill="#0f172a" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Header -->
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.025em">Vault CA Rotation &amp; Dual-Trust Propagation</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Step-by-step trust transition during zero-downtime mTLS root/intermediate certificate authority rollover</text>

  <!-- 1. HASHICORP VAULT (PKI Secrets Engine) -->
  <rect x="250" y="110" width="400" height="150" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#glow-indigo)" />
  <text x="270" y="140" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">HashiCorp Vault (PKI Engine)</text>
  
  <!-- Old CA -->
  <rect x="270" y="160" width="165" height="80" rx="8" fill="#312e81" fill-opacity="0.6" stroke="#4f46e5" stroke-width="1.5" />
  <text x="285" y="185" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Old / Active CA</text>
  <text x="285" y="205" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Role: Int. Issuer (Active)</text>
  <text x="285" y="225" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Signing outgoing certs</text>

  <!-- New CA -->
  <rect x="465" y="160" width="165" height="80" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
  <text x="480" y="185" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">New / Next CA</text>
  <text x="480" y="205" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Role: Int. Issuer (Read-only)</text>
  <text x="480" y="225" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Trusted for validation</text>

  <!-- 2. CLIENT SERVICE (Left) -->
  <rect x="40" y="330" width="340" height="180" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="60" y="360" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Client Service (Go App)</text>
  
  <!-- Client Trust Bundle -->
  <rect x="60" y="380" width="300" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="75" y="405" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Dual-Trust Bundle (CACertPool)</text>
  
  <!-- Old CA in Trust Bundle -->
  <rect x="75" y="420" width="130" height="55" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
  <text x="85" y="440" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">Old CA Cert</text>
  <text x="85" y="455" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Expires in 7 days</text>

  <!-- New CA in Trust Bundle -->
  <rect x="215" y="420" width="130" height="55" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1" />
  <text x="225" y="440" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">New CA Cert</text>
  <text x="225" y="455" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10">Active (1 year)</text>

  <!-- 3. SERVER SERVICE (Right) -->
  <rect x="520" y="330" width="340" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#glow-emerald)" />
  <text x="540" y="360" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Server Service (gRPC/HTTP)</text>
  
  <!-- Server Trust Bundle -->
  <rect x="540" y="380" width="300" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="555" y="405" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Dual-Trust Bundle (CACertPool)</text>
  
  <!-- Old CA in Trust Bundle -->
  <rect x="555" y="420" width="130" height="55" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
  <text x="565" y="440" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">Old CA Cert</text>
  <text x="565" y="455" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Expires in 7 days</text>

  <!-- New CA in Trust Bundle -->
  <rect x="695" y="420" width="130" height="55" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1" />
  <text x="705" y="440" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">New CA Cert</text>
  <text x="705" y="455" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10">Active (1 year)</text>

  <!-- CONNECTIONS & LABELS -->
  
  <!-- Vault to Client (Trust Propagator) -->
  <path d="M 310 260 L 250 330" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" />
  <path d="M 500 260 L 330 330" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" />
  <rect x="250" y="275" width="120" height="28" rx="4" fill="#0f172a" stroke="#475569" />
  <text x="260" y="293" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Fetch Trust Bundle</text>

  <!-- Vault to Server (Trust Propagator) -->
  <path d="M 390 260 L 570 330" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)" />
  <path d="M 590 260 L 650 330" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)" />
  <rect x="530" y="275" width="120" height="28" rx="4" fill="#0f172a" stroke="#475569" />
  <text x="540" y="293" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">Fetch Trust Bundle</text>

  <!-- Service-to-Service mTLS Traffic (Bi-directional) -->
  <path d="M 380 400 L 520 400" fill="none" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <rect x="400" y="385" width="100" height="30" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
  <text x="410" y="404" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">mTLS TLS 1.3</text>
  
  <text x="390" y="445" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Client presents cert</text>
  <text x="390" y="460" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">issued by Old CA</text>
  
  <text x="510" y="445" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Server validates via bundle;</text>
  <text x="510" y="460" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Presents cert signed by New CA</text>
</svg>
