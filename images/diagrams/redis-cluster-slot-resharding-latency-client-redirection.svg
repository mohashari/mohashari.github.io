<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="880" height="580" fill="#0b0f19" rx="12"/>

  <!-- Grid lines for subtle background structure -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="580"/>
    <line x1="200" y1="0" x2="200" y2="580"/>
    <line x1="300" y1="0" x2="300" y2="580"/>
    <line x1="400" y1="0" x2="400" y2="580"/>
    <line x1="500" y1="0" x2="500" y2="580"/>
    <line x1="600" y1="0" x2="600" y2="580"/>
    <line x1="700" y1="0" x2="700" y2="580"/>
    <line x1="800" y1="0" x2="800" y2="580"/>
    <line x1="0" y1="100" x2="880" y2="100"/>
    <line x1="0" y1="200" x2="880" y2="200"/>
    <line x1="0" y1="300" x2="880" y2="300"/>
    <line x1="0" y1="400" x2="880" y2="400"/>
    <line x1="0" y1="500" x2="880" y2="500"/>
  </g>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    
    <!-- Linear Gradients -->
    <linearGradient id="client-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="source-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a10"/>
      <stop offset="100%" stop-color="#1c0f0a"/>
    </linearGradient>
    <linearGradient id="target-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062f22"/>
      <stop offset="100%" stop-color="#021c15"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="440" y="35" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="800" letter-spacing="0.5">REDIS CLUSTER SLOT RESHARDING REDIRECTION &amp; PIPELINING MECHANICS</text>
  <text x="440" y="55" text-anchor="middle" fill="#64748b" font-size="11" font-weight="500">Transitional States and Latency Impacts during Slot Migration</text>

  <!-- ==================== CLIENT NODE ==================== -->
  <rect x="40" y="110" width="260" height="420" rx="8" fill="url(#client-gradient)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="55" y="125" width="230" height="25" rx="4" fill="#2563eb" opacity="0.2"/>
  <text x="170" y="142" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">CLIENT APPLICATION</text>

  <!-- Client local cache -->
  <g transform="translate(55, 170)">
    <rect width="230" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="15" y="20" fill="#94a3b8" font-size="11" font-weight="bold">Local Slot Map Cache</text>
    <rect x="15" y="32" width="200" height="20" rx="3" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="46" fill="#f1f5f9" font-size="10">Slots [0-10921]   → Node A (Source)</text>
    <rect x="15" y="56" width="200" height="20" rx="3" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="70" fill="#f1f5f9" font-size="10">Slots [10922-16383] → Node B (Target)</text>
  </g>

  <!-- Pipelining / Grouping Component -->
  <g transform="translate(55, 275)">
    <rect width="230" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="15" y="20" fill="#94a3b8" font-size="11" font-weight="bold">Smart Pipeline Grouping</text>
    
    <!-- Keys to be queried -->
    <rect x="15" y="32" width="200" height="32" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="22" y="45" fill="#f43f5e" font-size="9" font-weight="bold">RAW BATCH (Unsorted):</text>
    <text x="22" y="57" fill="#cbd5e1" font-size="9">GET key_a {slot 100}, GET key_b {slot 100}</text>

    <!-- Sorted Pipeline -->
    <rect x="15" y="74" width="200" height="60" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="22" y="87" fill="#34d399" font-size="9" font-weight="bold">SLOT-SORTED PIPELINE:</text>
    <text x="22" y="100" fill="#f1f5f9" font-size="9">Sub-Pipeline 1 (Slot 100) → Node A</text>
    <text x="22" y="112" fill="#64748b" font-size="9">└─ Response: -ASK 10.0.0.2:6379</text>
    <text x="22" y="124" fill="#34d399" font-size="9">Sub-Pipeline 2 (Slot 100) → Node B (retry)</text>
  </g>

  <!-- Singleflight blocker -->
  <g transform="translate(55, 445)">
    <rect width="230" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="15" y="22" fill="#94a3b8" font-size="11" font-weight="bold">Singleflight Cache Refresher</text>
    <rect x="15" y="35" width="200" height="20" rx="3" fill="#022c22" stroke="#065f46"/>
    <text x="25" y="49" fill="#34d399" font-size="9" font-weight="bold">Deduplicating CLUSTER SLOTS calls</text>
  </g>


  <!-- ==================== REDIS SOURCE NODE ==================== -->
  <g transform="translate(500, 110)">
    <rect width="320" height="175" rx="8" fill="url(#source-gradient)" stroke="#f97316" stroke-width="2"/>
    <rect x="15" y="15" width="290" height="25" rx="4" fill="#f97316" opacity="0.15"/>
    <text x="160" y="32" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="bold">REDIS NODE A (SOURCE) - 10.0.0.1:6379</text>
    
    <rect x="15" y="55" width="290" height="40" rx="4" fill="#1c0f0a" stroke="#7c2d12"/>
    <text x="25" y="70" fill="#f97316" font-size="10" font-weight="bold">Slot 100 State: MIGRATING</text>
    <text x="25" y="86" fill="#a7f3d0" font-size="9">Some keys already migrated, some remaining</text>

    <!-- Key store visualization -->
    <rect x="15" y="105" width="135" height="55" rx="4" fill="#2c1a10" stroke="#f97316" stroke-width="0.5"/>
    <text x="25" y="120" fill="#fdba74" font-size="9" font-weight="bold">Local Store (Slot 100)</text>
    <text x="25" y="134" fill="#94a3b8" font-size="9">key_b (Remaining)</text>
    <text x="25" y="146" fill="#ef4444" font-size="9" stroke-dasharray="1">key_a (Migrated ->)</text>

    <rect x="170" y="105" width="135" height="55" rx="4" fill="#2c1a10" stroke="#f97316" stroke-width="0.5"/>
    <text x="180" y="120" fill="#fdba74" font-size="9" font-weight="bold">Engine Operations</text>
    <text x="180" y="134" fill="#f87171" font-size="9">Read key_a: Send ASK</text>
    <text x="180" y="146" fill="#34d399" font-size="9">Read key_b: Serve local</text>
  </g>


  <!-- ==================== REDIS TARGET NODE ==================== -->
  <g transform="translate(500, 355)">
    <rect width="320" height="175" rx="8" fill="url(#target-gradient)" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="15" width="290" height="25" rx="4" fill="#10b981" opacity="0.15"/>
    <text x="160" y="32" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">REDIS NODE B (TARGET) - 10.0.0.2:6379</text>
    
    <rect x="15" y="55" width="290" height="40" rx="4" fill="#021c15" stroke="#064e3b"/>
    <text x="25" y="70" fill="#10b981" font-size="10" font-weight="bold">Slot 100 State: IMPORTING</text>
    <text x="25" y="86" fill="#94a3b8" font-size="9">Ready to accept migrated keys &amp; ASKING redirections</text>

    <!-- Key store visualization -->
    <rect x="15" y="105" width="135" height="55" rx="4" fill="#062f22" stroke="#10b981" stroke-width="0.5"/>
    <text x="25" y="120" fill="#6ee7b7" font-size="9" font-weight="bold">Local Store (Slot 100)</text>
    <text x="25" y="135" fill="#f1f5f9" font-size="9">key_a (Migrated in)</text>
    <text x="25" y="147" fill="#64748b" font-size="9">[Empty space for key_b]</text>

    <rect x="170" y="105" width="135" height="55" rx="4" fill="#062f22" stroke="#10b981" stroke-width="0.5"/>
    <text x="180" y="120" fill="#6ee7b7" font-size="9" font-weight="bold">Engine Operations</text>
    <text x="180" y="135" fill="#a7f3d0" font-size="9">Only serves key_a</text>
    <text x="180" y="147" fill="#fdba74" font-size="9">if prepended by ASKING</text>
  </g>


  <!-- ==================== FLOW ARROWS & INTERACTIONS ==================== -->

  <!-- 1. Client Query to Source Node -->
  <path d="M 300, 180 Q 400, 160 500, 160" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="345" y="145" width="110" height="20" rx="3" fill="#0b0f19" stroke="#1e293b"/>
  <text x="400" y="158" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="bold">1. GET key_a</text>

  <!-- 2. Source Node returning -ASK redirection -->
  <path d="M 500, 190 Q 400, 195 300, 205" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="3 3"/>
  <rect x="330" y="185" width="140" height="20" rx="3" fill="#0b0f19" stroke="#1e293b"/>
  <text x="400" y="198" text-anchor="middle" fill="#f43f5e" font-size="9" font-weight="bold">2. -ASK 10.0.0.2:6379</text>

  <!-- 3. Client Query to Target Node (ASKING + GET) -->
  <path d="M 300, 395 Q 400, 410 500, 420" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="315" y="405" width="170" height="20" rx="3" fill="#0b0f19" stroke="#1e293b"/>
  <text x="400" y="418" text-anchor="middle" fill="#34d399" font-size="9" font-weight="bold">3. ASKING + GET key_a</text>

  <!-- 4. Target Node serving client -->
  <path d="M 500, 450 Q 400, 460 300, 470" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="340" y="455" width="120" height="20" rx="3" fill="#0b0f19" stroke="#1e293b"/>
  <text x="400" y="468" text-anchor="middle" fill="#cbd5e1" font-size="9" font-weight="bold">4. Value of key_a</text>

  <!-- Resharding controller migration process -->
  <path d="M 660, 285 L 660, 345" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-purple)"/>
  <rect x="580" y="295" width="160" height="32" rx="4" fill="#0b0f19" stroke="#a855f7" stroke-width="1"/>
  <text x="660" y="307" text-anchor="middle" fill="#c084fc" font-size="8" font-weight="bold">BACKGROUND MIGRATION</text>
  <text x="660" y="319" text-anchor="middle" fill="#e9d5ff" font-size="8">MIGRATE key_a (Source -> Target)</text>

  <!-- RTT Latency penalty annotation -->
  <rect x="330" y="240" width="140" height="40" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="400" y="255" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="bold">LATENCY PENALTY</text>
  <text x="400" y="270" text-anchor="middle" fill="#cbd5e1" font-size="9">Double RTT (2x Network Hops)</text>
</svg>
