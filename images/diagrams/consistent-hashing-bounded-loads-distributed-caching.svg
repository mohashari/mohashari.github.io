<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    
    <linearGradient id="nodeFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="nodeAvailable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    
    <linearGradient id="nodeEmpty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="requestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Filters for glows and shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .node-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #f1f5f9; }
    .node-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; }
    .req-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f8fafc; }
    .path-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
    .legend-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; }
  </style>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="#0b0f19"/>
  <rect width="800" height="550" rx="16" fill="url(#grid)"/>

  <!-- Title & Subtitle -->
  <text x="30" y="45" class="title">Consistent Hashing with Bounded Loads</text>
  <text x="30" y="68" class="subtitle">Visualizing Key Displacement (Overflow) when Target Node capacity is exceeded</text>

  <!-- Hashing Ring (Center: 400, 290, Radius: 150) -->
  <circle cx="400" cy="290" r="150" fill="none" stroke="#1e293b" stroke-width="8" />
  <circle cx="400" cy="290" r="150" fill="none" stroke="url(#ringGradient)" stroke-width="4" stroke-dasharray="12 4" />

  <!-- Directional arrowheads along the ring (Clockwise indicator) -->
  <path d="M 550 290 L 555 280 M 550 290 L 545 280" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <path d="M 250 290 L 255 300 M 250 290 L 245 300" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  
  <!-- ================= NODES ================= -->
  
  <!-- Node C (Top, 270 deg) - X: 400, Y: 140 -->
  <g transform="translate(400, 140)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="url(#nodeAvailable)" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="-30" text-anchor="middle" class="node-label">Node C</text>
    <text x="0" y="38" text-anchor="middle" class="node-sub">Load: 0/2 (0%)</text>
    <!-- Capacity Slots -->
    <rect x="-16" y="45" width="12" height="8" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>
    <rect x="4" y="45" width="12" height="8" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Center text -->
    <text x="0" y="4" text-anchor="middle" class="badge-text">C</text>
  </g>

  <!-- Node A (Bottom-Right, 30 deg) - X: 530, Y: 365 -->
  <g transform="translate(530, 365)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="url(#nodeFull)" stroke="#ef4444" stroke-width="2"/>
    <text x="45" y="-5" class="node-label">Node A</text>
    <text x="45" y="13" class="node-sub">Load: 2/2 (100%)</text>
    <text x="45" y="30" class="node-sub" fill="#ef4444" font-weight="bold">[OVERLOADED]</text>
    <!-- Capacity Slots -->
    <rect x="-16" y="32" width="12" height="8" rx="2" fill="#ef4444"/>
    <rect x="4" y="32" width="12" height="8" rx="2" fill="#ef4444"/>
    <!-- Center text -->
    <text x="0" y="4" text-anchor="middle" class="badge-text">A</text>
  </g>

  <!-- Node B (Bottom-Left, 150 deg) - X: 270, Y: 365 -->
  <g transform="translate(270, 365)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="url(#nodeAvailable)" stroke="#10b981" stroke-width="2"/>
    <text x="-45" y="-5" text-anchor="end" class="node-label">Node B</text>
    <text x="-45" y="13" text-anchor="end" class="node-sub">Load: 1/2 (50%)</text>
    <text x="-45" y="30" text-anchor="end" class="node-sub" fill="#34d399">Available Space</text>
    <!-- Capacity Slots -->
    <rect x="-16" y="32" width="12" height="8" rx="2" fill="#10b981"/>
    <rect x="4" y="32" width="12" height="8" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Center text -->
    <text x="0" y="4" text-anchor="middle" class="badge-text">B</text>
  </g>

  <!-- ================= KEY & ASSIGNMENT FLOW ================= -->

  <!-- Client Request Card (Top-Right) -->
  <g transform="translate(600, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="12" y="24" class="req-text" fill="#f59e0b">Key: users:1234</text>
    <text x="12" y="42" class="node-sub">Hashes to angle 330°</text>
    <!-- Small orange dot inside -->
    <circle cx="150" cy="30" r="6" fill="#f59e0b"/>
  </g>

  <!-- Arrow from request card to ring hash point -->
  <!-- Hash point on ring at 330 deg: X=530, Y=215 (approx) -->
  <path d="M 600 125 L 535 210" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="530" cy="215" r="5" fill="#f59e0b" filter="url(#glowBlue)"/>
  <text x="542" y="210" class="node-sub" fill="#f59e0b">Hash Destination (330°)</text>

  <!-- 1. Normal Routing (Clockwise to next Node: Node A at 30 deg) -->
  <!-- Curved path from 330 deg to 30 deg along the ring -->
  <!-- Arc path: Rx Ry x-axis-rotation large-arc-flag sweep-flag x y -->
  <path d="M 530 215 A 150 150 0 0 1 530 343" stroke="#f59e0b" stroke-width="3" fill="none" />
  <path d="M 527 335 L 530 343 L 522 342" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Attempted connection label (rejected) -->
  <g transform="translate(560, 275)">
    <rect x="-15" y="-12" width="105" height="24" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="38" y="4" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ef4444">1. Primary Target (Full)</text>
  </g>

  <!-- 2. Displacement / Overflow Routing (Clockwise search to Node B at 150 deg) -->
  <!-- Curved path along the ring from Node A (530, 365) to Node B (270, 365) via bottom (400, 440) -->
  <!-- From 30 deg to 150 deg -->
  <path d="M 508 365 A 150 150 0 0 1 292 365" stroke="#10b981" stroke-width="3" stroke-dasharray="5 3" fill="none" />
  <!-- Arrowhead at Node B -->
  <path d="M 302 360 L 292 365 L 300 372" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Overflow redirect label -->
  <g transform="translate(400, 460)">
    <rect x="-100" y="-12" width="200" height="24" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#10b981">2. Displaced Clockwise (Bounded Load)</text>
  </g>

  <!-- Connect to Node B marker -->
  <path d="M 285 365 L 280 365" stroke="#10b981" stroke-width="2" />
  
  <!-- ================= LEGEND & FOOTER ================= -->
  <line x1="30" y1="495" x2="770" y2="495" stroke="#1e293b" stroke-width="1"/>
  
  <g transform="translate(30, 515)">
    <circle cx="10" cy="5" r="8" fill="url(#nodeFull)"/>
    <text x="25" y="9" class="legend-text">Node at Max Capacity (Redirection Target)</text>
    
    <circle cx="300" cy="5" r="8" fill="url(#nodeAvailable)"/>
    <text x="315" y="9" class="legend-text">Node with Available Capacity</text>
    
    <circle cx="560" cy="5" r="6" fill="#f59e0b"/>
    <text x="575" y="9" class="legend-text">Client Hash Request</text>
  </g>
</svg>