<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="engine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 24px; font-weight: 700; fill: #f8fafc; letter-spacing: 1px; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.5px; }
    .section-title { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; fill: #f8fafc; }
    .card-title { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; fill: #f1f5f9; }
    .card-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #94a3b8; }
    .metric-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
    .metric-val { font-family: 'Courier New', monospace; font-size: 11px; fill: #f43f5e; font-weight: bold; }
    .metric-val-good { font-family: 'Courier New', monospace; font-size: 11px; fill: #10b981; font-weight: bold; }
    .formula { font-family: 'Courier New', monospace; font-size: 12px; fill: #38bdf8; font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="1100" height="650" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid Overlay -->
  <path d="M 0,50 L 1100,50 M 0,100 L 1100,100 M 0,150 L 1100,150 M 0,200 L 1100,200 M 0,250 L 1100,250 M 0,300 L 1100,300 M 0,350 L 1100,350 M 0,400 L 1100,400 M 0,450 L 1100,450 M 0,500 L 1100,500 M 0,550 L 1100,550 M 0,600 L 1100,600" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.15" />
  <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650 M 1000,0 L 1000,650" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.15" />

  <!-- Title Block -->
  <g transform="translate(50, 45)">
    <text class="title">MICROSERVICES CONSOLIDATION VS DECOMPOSITION</text>
    <text class="subtitle" y="25">A Quantitative Decision Matrix &amp; Architectural Path Engine</text>
  </g>

  <!-- ==================== LEFT PANEL: DECOMPOSED STATE ==================== -->
  <g transform="translate(50, 110)">
    <!-- Container -->
    <rect width="360" height="480" fill="url(#card-dark)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4" rx="12" filter="url(#glow-red)" />
    <text class="section-title" x="20" y="30">Decomposed State</text>
    <text class="card-text" x="20" y="48">High Network Overhead &amp; Distributed Friction</text>

    <!-- Service A -->
    <g transform="translate(20, 75)">
      <rect width="140" height="85" fill="#1e293b" stroke="#f87171" stroke-width="1.5" rx="8" />
      <text class="card-title" x="15" y="25">Cart Service</text>
      <text class="card-text" x="15" y="45">Conns: 45 / Max 50</text>
      <text class="card-text" x="15" y="60">CPU overhead: 12%</text>
      <rect x="15" y="68" width="110" height="4" fill="#64748b" rx="2" />
      <rect x="15" y="68" width="99" height="4" fill="#f87171" rx="2" /> <!-- 90% DB conn saturation -->
    </g>

    <!-- Service B -->
    <g transform="translate(20, 195)">
      <rect width="140" height="85" fill="#1e293b" stroke="#f87171" stroke-width="1.5" rx="8" />
      <text class="card-title" x="15" y="25">Pricing Service</text>
      <text class="card-text" x="15" y="45">Conns: 30 / Max 50</text>
      <text class="card-text" x="15" y="60">CPU overhead: 8%</text>
      <rect x="15" y="68" width="110" height="4" fill="#64748b" rx="2" />
      <rect x="15" y="68" width="66" height="4" fill="#facc15" rx="2" />
    </g>

    <!-- Service C -->
    <g transform="translate(20, 315)">
      <rect width="140" height="85" fill="#1e293b" stroke="#f87171" stroke-width="1.5" rx="8" />
      <text class="card-title" x="15" y="25">Inventory Service</text>
      <text class="card-text" x="15" y="45">Conns: 40 / Max 50</text>
      <text class="card-text" x="15" y="60">CPU overhead: 14%</text>
      <rect x="15" y="68" width="110" height="4" fill="#64748b" rx="2" />
      <rect x="15" y="68" width="88" height="4" fill="#f87171" rx="2" />
    </g>

    <!-- Network Hops (Distributed Latency) -->
    <!-- Path A to B -->
    <path d="M 160,117 L 220,117 L 220,237 L 160,237" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />
    <!-- Path B to C -->
    <path d="M 160,250 L 220,250 L 220,360 L 160,360" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />

    <!-- Hop Labels -->
    <rect x="180" y="150" width="75" height="35" rx="4" fill="#0f172a" stroke="#334155" />
    <text class="metric-label" x="185" y="164">gRPC Latency</text>
    <text class="metric-val" x="185" y="178">24ms avg</text>

    <rect x="180" y="280" width="75" height="35" rx="4" fill="#0f172a" stroke="#334155" />
    <text class="metric-label" x="185" y="294">JSON-over-HTTP</text>
    <text class="metric-val" x="185" y="308">42ms avg</text>

    <!-- Distributed Database Infrastructure -->
    <g transform="translate(20, 420)">
      <rect width="90" height="45" fill="#1e293b" stroke="#f87171" stroke-width="1" rx="6" />
      <text class="card-text" x="10" y="20">DB: Cart</text>
      <text class="card-text" x="10" y="35">Pool: 90% sat</text>
    </g>
    <g transform="translate(130, 420)">
      <rect width="90" height="45" fill="#1e293b" stroke="#f87171" stroke-width="1" rx="6" />
      <text class="card-text" x="10" y="20">DB: Pricing</text>
      <text class="card-text" x="10" y="35">Pool: 60% sat</text>
    </g>
    <g transform="translate(240, 420)">
      <rect width="100" height="45" fill="#1e293b" stroke="#f87171" stroke-width="1" rx="6" />
      <text class="card-text" x="10" y="20">DB: Inventory</text>
      <text class="card-text" x="10" y="35">Pool: 80% sat</text>
    </g>
  </g>

  <!-- ==================== MIDDLE PANEL: ENGINE ==================== -->
  <g transform="translate(435, 110)">
    <!-- Main Box -->
    <rect width="230" height="480" fill="url(#card-dark)" stroke="#818cf8" stroke-width="1.5" rx="12" filter="url(#glow-blue)" />
    
    <!-- Header -->
    <rect width="230" height="50" fill="url(#engine-grad)" rx="12" clip-path="polygon(0 0, 230 0, 230 50, 0 50)" />
    <text class="section-title" x="25" y="32" fill="#ffffff">Decision Matrix Engine</text>
    
    <!-- Equation Display -->
    <g transform="translate(15, 75)">
      <rect width="200" height="55" rx="6" fill="#0f172a" stroke="#312e81" stroke-width="1" />
      <text class="metric-label" x="10" y="22">Coupling Index (CI) Formula</text>
      <text class="formula" x="10" y="42">CI = 0.4*D_c + 0.3*N_l + 0.3*O_e</text>
    </g>

    <!-- Metrics Radar Inputs -->
    <g transform="translate(15, 150)">
      <!-- Label list -->
      <text class="card-title" x="5" y="15">Metrics Scorecard</text>
      
      <!-- Metric 1 -->
      <text class="card-text" x="5" y="40">Shared-domain dependency</text>
      <text class="metric-val" x="175" y="40">9.2 / 10</text>
      <line x1="5" y1="46" x2="200" y2="46" stroke="#334155" stroke-width="1" />
      
      <!-- Metric 2 -->
      <text class="card-text" x="5" y="70">Inter-service network hops</text>
      <text class="metric-val" x="175" y="70">8.5 / 10</text>
      <line x1="5" y1="76" x2="200" y2="76" stroke="#334155" stroke-width="1" />

      <!-- Metric 3 -->
      <text class="card-text" x="5" y="100">Database connection waste</text>
      <text class="metric-val" x="175" y="100">7.8 / 10</text>
      <line x1="5" y1="106" x2="200" y2="106" stroke="#334155" stroke-width="1" />

      <!-- Metric 4 -->
      <text class="card-text" x="5" y="130">Serialization Overhead</text>
      <text class="metric-val" x="175" y="130">6.9 / 10</text>
      <line x1="5" y1="136" x2="200" y2="136" stroke="#334155" stroke-width="1" />

      <!-- Metric 5 -->
      <text class="card-text" x="5" y="160">DevEx deployment lock</text>
      <text class="metric-val" x="175" y="160">8.1 / 10</text>
      <line x1="5" y1="166" x2="200" y2="166" stroke="#334155" stroke-width="1" />
    </g>

    <!-- Recommendation -->
    <g transform="translate(15, 340)">
      <rect width="200" height="110" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5" />
      <text class="metric-label" x="15" y="25" fill="#818cf8">ENGINE VERDICT</text>
      <text class="section-title" x="15" y="50" fill="#34d399">CONSOLIDATE</text>
      <text class="card-text" x="15" y="75" fill="#a5b4fc">CI (8.1) &gt; Threshold (6.0)</text>
      <text class="card-text" x="15" y="92" fill="#a5b4fc">Consolidation optimizes performance.</text>
    </g>
  </g>

  <!-- Left flow arrow to Center Engine -->
  <path d="M 412,350 L 433,350" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Right flow arrow from Center Engine to Right Panel -->
  <path d="M 667,350 L 688,350" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- ==================== RIGHT PANEL: CONSOLIDATED STATE ==================== -->
  <g transform="translate(690, 110)">
    <!-- Container -->
    <rect width="360" height="480" fill="url(#card-dark)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" rx="12" filter="url(#glow-green)" />
    <text class="section-title" x="20" y="30">Consolidated State (Shared-Process)</text>
    <text class="card-text" x="20" y="48">Zero Network Latency &amp; Unified DB Footprint</text>

    <!-- Unified Monolith/Macroservice -->
    <g transform="translate(20, 75)">
      <rect width="320" height="315" fill="#111827" stroke="#34d399" stroke-width="1.5" rx="10" />
      <text class="card-title" x="20" y="30" fill="#34d399">Monolithic Binary / Shared Process</text>
      
      <!-- Module A -->
      <g transform="translate(20, 50)">
        <rect width="280" height="55" fill="#1f2937" stroke="#374151" rx="6" />
        <text class="card-title" x="15" y="22">Cart Module</text>
        <text class="card-text" x="15" y="40">In-process operations</text>
      </g>

      <!-- In-process arrow A to B -->
      <path d="M 160,105 L 160,135" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
      <text class="metric-val-good" x="175" y="125">&lt; 0.05ms (Memory pointer)</text>

      <!-- Module B -->
      <g transform="translate(20, 140)">
        <rect width="280" height="55" fill="#1f2937" stroke="#374151" rx="6" />
        <text class="card-title" x="15" y="22">Pricing Module</text>
        <text class="card-text" x="15" y="40">Local dynamic dispatch</text>
      </g>

      <!-- In-process arrow B to C -->
      <path d="M 160,195 L 160,225" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
      <text class="metric-val-good" x="175" y="215">&lt; 0.05ms (Memory pointer)</text>

      <!-- Module C -->
      <g transform="translate(20, 230)">
        <rect width="280" height="55" fill="#1f2937" stroke="#374151" rx="6" />
        <text class="card-title" x="15" y="22">Inventory Module</text>
        <text class="card-text" x="15" y="40">Atomic memory execution</text>
      </g>
    </g>

    <!-- Unified DB Pool -->
    <g transform="translate(20, 410)">
      <rect width="320" height="55" fill="#1e293b" stroke="#34d399" stroke-width="1.2" rx="8" />
      <text class="card-title" x="15" y="25">Unified Database (Shared Engine)</text>
      <text class="card-text" x="15" y="42">Active connections: 35/150 (Elastic pooling, transactions isolated locally)</text>
    </g>
  </g>
</svg>