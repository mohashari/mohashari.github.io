<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Definitions for gradients, markers, and filters -->
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#39d353" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f0883e" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff7b72" />
    </marker>
    
    <!-- Linear Gradients for Nodes -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#39d353" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd5c00" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#ff7b72" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>
    <linearGradient id="dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="#0d1117" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Borders/Containers (Logical Groupings) -->
  <!-- Legacy Environment Boundary -->
  <rect x="30" y="110" width="370" height="490" rx="12" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.4" />
  <text x="45" y="135" fill="#ff7b72" font-size="12" font-weight="bold" letter-spacing="1">LEGACY MONOLITH DOMAIN</text>

  <!-- Modern Microservices Domain -->
  <rect x="600" y="110" width="370" height="490" rx="12" fill="none" stroke="#39d353" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.4" />
  <text x="615" y="135" fill="#39d353" font-size="12" font-weight="bold" letter-spacing="1">TARGET MICROSERVICE DOMAIN</text>

  <!-- Integration & CDC Layer -->
  <rect x="420" y="270" width="160" height="330" rx="12" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.4" />
  <text x="430" y="295" fill="#f0883e" font-size="10" font-weight="bold" letter-spacing="0.5">CDC &amp; BUS LAYER</text>

  <!-- Title -->
  <text x="50%" y="45" fill="#c9d1d9" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="0.5">Strangler Fig Database Migration Architecture</text>
  <text x="50%" y="68" fill="#8b949e" font-size="13" text-anchor="middle">Zero-downtime database extraction using Debezium CDC and Kafka Connect</text>

  <!-- Nodes Definition -->

  <!-- API Gateway / Traffic Router -->
  <g id="node-router" transform="translate(415, 140)">
    <rect x="0" y="0" width="170" height="60" rx="8" fill="url(#dark-grad)" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
    <text x="85" y="26" fill="#c9d1d9" font-size="12" font-weight="bold" text-anchor="middle">API Gateway</text>
    <text x="85" y="42" fill="#58a6ff" font-size="10" font-weight="bold" text-anchor="middle">(Strangler Router)</text>
  </g>

  <!-- Client Traffic -->
  <g id="node-client" transform="translate(450, 75)">
    <circle cx="50" cy="5" r="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
    <path d="M 42 22 L 58 22" stroke="#58a6ff" stroke-width="2" />
    <path d="M 50 17 L 50 30" stroke="#58a6ff" stroke-width="2" />
    <path d="M 50 30 L 44 42" stroke="#58a6ff" stroke-width="1.5" />
    <path d="M 50 30 L 56 42" stroke="#58a6ff" stroke-width="1.5" />
    <text x="50" y="-12" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="bold">Client Apps</text>
  </g>

  <!-- Legacy Monolith Application -->
  <g id="node-monolith" transform="translate(50, 200)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="url(#dark-grad)" stroke="#ff7b72" stroke-width="2" />
    <text x="80" y="32" fill="#c9d1d9" font-size="13" font-weight="bold" text-anchor="middle">Monolith App</text>
    <text x="80" y="50" fill="#8b949e" font-size="10" text-anchor="middle">Legacy Business Logic</text>
    <text x="80" y="65" fill="#ff7b72" font-size="10" font-weight="bold" text-anchor="middle">Writes to Monolith DB</text>
  </g>

  <!-- Monolith Database -->
  <g id="node-monolith-db" transform="translate(50, 380)">
    <!-- Cylinder database icon -->
    <path d="M 40 15 C 40 5, 120 5, 120 15 L 120 75 C 120 85, 40 85, 40 75 Z" fill="url(#dark-grad)" stroke="#ff7b72" stroke-width="2" />
    <path d="M 40 15 C 40 25, 120 25, 120 15" fill="none" stroke="#ff7b72" stroke-width="2" />
    <path d="M 40 35 C 40 45, 120 45, 120 35" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 40 55 C 40 65, 120 65, 120 55" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="80" y="45" fill="#c9d1d9" font-size="12" font-weight="bold" text-anchor="middle">Shared DB</text>
    <text x="80" y="60" fill="#8b949e" font-size="10" text-anchor="middle">(PostgreSQL)</text>
    <!-- Highlight: Source Tables -->
    <rect x="48" y="67" width="64" height="12" rx="2" fill="#ff7b72" opacity="0.2"/>
    <text x="80" y="76" fill="#ff7b72" font-size="8" font-weight="bold" text-anchor="middle">MIGRATING TABLES</text>
  </g>

  <!-- Debezium Source Connector -->
  <g id="node-debezium" transform="translate(250, 395)">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="url(#dark-grad)" stroke="#f0883e" stroke-width="2" />
    <text x="65" y="24" fill="#c9d1d9" font-size="12" font-weight="bold" text-anchor="middle">Debezium</text>
    <text x="65" y="40" fill="#f0883e" font-size="10" font-weight="bold" text-anchor="middle">Kafka Connect</text>
    <text x="65" y="56" fill="#8b949e" font-size="9" text-anchor="middle">Source Connector</text>
  </g>

  <!-- Apache Kafka Cluster -->
  <g id="node-kafka" transform="translate(435, 450)">
    <rect x="0" y="0" width="130" height="90" rx="8" fill="url(#dark-grad)" stroke="#bc8cff" stroke-width="2" />
    <!-- Kafka Logo Representation (Circles and lines) -->
    <circle cx="65" cy="25" r="10" fill="#8957e5" opacity="0.3"/>
    <text x="65" y="29" fill="#bc8cff" font-size="12" font-weight="bold" text-anchor="middle">KAFKA</text>
    <!-- Log Queue Visualization -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="100" height="20" rx="3" fill="#161b22" stroke="#bc8cff" stroke-width="1" />
      <line x1="20" y1="0" x2="20" y2="20" stroke="#bc8cff" stroke-width="1" />
      <line x1="40" y1="0" x2="40" y2="20" stroke="#bc8cff" stroke-width="1" />
      <line x1="60" y1="0" x2="60" y2="20" stroke="#bc8cff" stroke-width="1" />
      <line x1="80" y1="0" x2="80" y2="20" stroke="#bc8cff" stroke-width="1" />
      <text x="50" y="32" fill="#8b949e" font-size="8" text-anchor="middle">CDC Topics: db.orders</text>
    </g>
  </g>

  <!-- Ingestion / Consumer Engine (Sync) -->
  <g id="node-consumer" transform="translate(620, 395)">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="url(#dark-grad)" stroke="#f0883e" stroke-width="2" />
    <text x="65" y="24" fill="#c9d1d9" font-size="12" font-weight="bold" text-anchor="middle">Outbox Consumer</text>
    <text x="65" y="40" fill="#f0883e" font-size="10" font-weight="bold" text-anchor="middle">Sync Service</text>
    <text x="65" y="56" fill="#8b949e" font-size="9" text-anchor="middle">Reconciliation Engine</text>
  </g>

  <!-- Target Microservice DB -->
  <g id="node-target-db" transform="translate(800, 380)">
    <path d="M 40 15 C 40 5, 120 5, 120 15 L 120 75 C 120 85, 40 85, 40 75 Z" fill="url(#dark-grad)" stroke="#39d353" stroke-width="2" />
    <path d="M 40 15 C 40 25, 120 25, 120 15" fill="none" stroke="#39d353" stroke-width="2" />
    <path d="M 40 35 C 40 45, 120 45, 120 35" fill="none" stroke="#39d353" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 40 55 C 40 65, 120 65, 120 55" fill="none" stroke="#39d353" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="80" y="45" fill="#c9d1d9" font-size="12" font-weight="bold" text-anchor="middle">Target DB</text>
    <text x="80" y="60" fill="#8b949e" font-size="10" text-anchor="middle">(PostgreSQL)</text>
    <!-- Highlight: Target Tables -->
    <rect x="48" y="67" width="64" height="12" rx="2" fill="#39d353" opacity="0.2"/>
    <text x="80" y="76" fill="#39d353" font-size="8" font-weight="bold" text-anchor="middle">ORDER SERVICE</text>
  </g>

  <!-- Target Microservice (Order Service) -->
  <g id="node-microservice" transform="translate(800, 200)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="url(#dark-grad)" stroke="#39d353" stroke-width="2" />
    <text x="80" y="32" fill="#c9d1d9" font-size="13" font-weight="bold" text-anchor="middle">Order Service</text>
    <text x="80" y="50" fill="#8b949e" font-size="10" text-anchor="middle">New Extracted Service</text>
    <text x="80" y="65" fill="#39d353" font-size="10" font-weight="bold" text-anchor="middle">Active for Reads/Writes</text>
  </g>


  <!-- Flow Lines / Connections -->

  <!-- Client to API Gateway Router -->
  <path d="M 500,105 L 500,132" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)" />
  
  <!-- API Gateway Router to Monolith (Legacy Path) - Controlled via routing percentage (e.g. 90%) -->
  <path d="M 415,170 L 130,170 L 130,192" fill="none" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="210" y="162" fill="#ff7b72" font-size="10" font-weight="bold">90% Traffic (Legacy)</text>

  <!-- API Gateway Router to Microservice (Strangled Path) - Controlled via routing percentage (e.g. 10%) -->
  <path d="M 585,170 L 880,170 L 880,192" fill="none" stroke="#39d353" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="750" y="162" fill="#39d353" font-size="10" font-weight="bold">10% Traffic (Canary)</text>

  <!-- Monolith to Monolith DB (JDBC Writes) -->
  <path d="M 130,282 L 130,372" fill="none" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="140" y="325" fill="#8b949e" font-size="10">OLTP SQL</text>

  <!-- Monolith DB Engine Binlog/WAL extraction by Debezium -->
  <path d="M 172,430 L 242,430" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="180" y="420" fill="#f0883e" font-size="10" font-weight="bold">CDC Engine</text>
  <text x="180" y="445" fill="#8b949e" font-size="8">WAL / Binlog</text>

  <!-- Debezium to Kafka Topic publishing -->
  <path d="M 382,430 L 410,430 L 410,480 L 428,480" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="390" y="495" fill="#8b949e" font-size="9">Stream Events</text>

  <!-- Kafka Cluster to Sync/Reconciliation Service -->
  <path d="M 567,495 L 685,495 L 685,472" fill="none" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="590" y="512" fill="#bc8cff" font-size="9">Consume events</text>

  <!-- Sync Service writes to Microservice DB -->
  <path d="M 752,430 L 792,430" fill="none" stroke="#39d353" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="760" y="420" fill="#39d353" font-size="10" font-weight="bold">Sync</text>

  <!-- Microservice to Target DB (JDBC Reads/Writes) -->
  <path d="M 880,282 L 880,372" fill="none" stroke="#39d353" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="890" y="325" fill="#8b949e" font-size="10">OLTP SQL</text>

  <!-- Dual-Write Safeguard / Sync back path (Optional, dashed) -->
  <path d="M 685,390 L 685,350 L 315,350 L 315,390" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,4" />
  <text x="500" y="340" fill="#f0883e" font-size="10" text-anchor="middle" font-weight="bold">Optional: Reverse CDC Sync (Safeguard)</text>

  <!-- Labels & Legends -->
  <g transform="translate(30, 570)">
    <!-- Legend Box -->
    <rect x="0" y="0" width="940" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    
    <!-- Legend Items -->
    <g transform="translate(20, 18)">
      <line x1="0" y1="8" x2="30" y2="8" stroke="#ff7b72" stroke-width="2" />
      <text x="40" y="12" fill="#8b949e" font-size="11">Legacy Flow</text>
    </g>
    <g transform="translate(190, 18)">
      <line x1="0" y1="8" x2="30" y2="8" stroke="#39d353" stroke-width="2" />
      <text x="40" y="12" fill="#8b949e" font-size="11">New Microservice Flow</text>
    </g>
    <g transform="translate(420, 18)">
      <line x1="0" y1="8" x2="30" y2="8" stroke="#f0883e" stroke-width="2" />
      <text x="40" y="12" fill="#8b949e" font-size="11">CDC / Synchronization Path</text>
    </g>
    <g transform="translate(680, 18)">
      <line x1="0" y1="8" x2="30" y2="8" stroke="#bc8cff" stroke-width="2" />
      <text x="40" y="12" fill="#8b949e" font-size="11">Kafka Stream Channels</text>
    </g>
  </g>
</svg>
