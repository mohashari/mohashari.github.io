<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <!-- Gradients -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="45" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5px">SWMR Lockless Hash Map Architecture</text>
  <text x="30" y="70" fill="#94a3b8" font-size="13">Safe memory reclamation &amp; atomic swaps in C++20</text>

  <!-- Grid lines for styling -->
  <line x1="30" y1="90" x2="770" y2="90" stroke="#334155" stroke-dasharray="4 4" />

  <!-- Readers Section -->
  <g transform="translate(30, 110)">
    <!-- Readers Box -->
    <rect x="0" y="20" width="120" height="180" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="60" y="55" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Concurrent</text>
    <text x="60" y="75" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Readers</text>
    <text x="60" y="105" fill="#93c5fd" font-size="11" text-anchor="middle">Thread 1..N</text>
    <text x="60" y="140" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">Read-Only</text>
    <text x="60" y="160" fill="#e0f2fe" font-size="10" text-anchor="middle" font-family="monospace">memory_order_acquire</text>

    <!-- Arrow to bucket array -->
    <path d="M 120 110 L 190 110" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="3 3"/>
  </g>

  <!-- Single Writer Section -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="url(#roseGrad)" filter="url(#shadow)"/>
    <text x="60" y="35" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Single Writer</text>
    <text x="60" y="55" fill="#ffe4e6" font-size="11" text-anchor="middle">Serialized writes</text>
    <text x="60" y="72" fill="#fecdd3" font-size="10" text-anchor="middle" font-family="monospace">memory_order_release</text>
  </g>

  <!-- Bucket Array -->
  <g transform="translate(200, 130)">
    <!-- Header -->
    <text x="0" y="-15" fill="#94a3b8" font-size="12" font-weight="600">Bucket Directory (Atomic Pointers)</text>
    
    <!-- Array elements -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="90" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="45" y="24" fill="#f8fafc" font-size="12" font-family="monospace" text-anchor="middle">Bucket 0</text>
    </g>
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="90" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <text x="45" y="24" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="middle">Bucket 1</text>
      <!-- Link out -->
      <line x1="90" y1="20" x2="190" y2="20" stroke="#38bdf8" stroke-width="2" />
      <circle cx="190" cy="20" r="3" fill="#38bdf8" />
    </g>
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="90" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="45" y="24" fill="#f8fafc" font-size="12" font-family="monospace" text-anchor="middle">Bucket 2</text>
    </g>
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="90" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="45" y="24" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">...</text>
    </g>
  </g>

  <!-- Node Chains (Bucket 1 chain) -->
  <g transform="translate(390, 150)">
    <!-- Node A (Active) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="100" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="50" y="25" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Node A</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Key: 42 | Val: 100</text>
      <line x1="100" y1="30" x2="160" y2="30" stroke="#38bdf8" stroke-width="2" />
      <circle cx="160" cy="30" r="3" fill="#38bdf8" />
    </g>

    <!-- Node B (Active) -->
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="100" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="50" y="25" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Node B</text>
      <text x="50" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Key: 99 | Val: 200</text>
      <line x1="100" y1="30" x2="160" y2="30" stroke="#64748b" stroke-width="1.5" />
      <!-- Null ptr -->
      <line x1="160" y1="20" x2="160" y2="40" stroke="#64748b" stroke-width="2" />
    </g>

    <!-- Node New (Writer inserting this) -->
    <g transform="translate(80, 120)">
      <rect x="0" y="0" width="100" height="60" rx="6" fill="#022c22" stroke="#34d399" stroke-width="2" stroke-dasharray="3 3" filter="url(#shadow)"/>
      <text x="50" y="25" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">New Node C</text>
      <text x="50" y="42" fill="#a7f3d0" font-size="10" font-family="monospace" text-anchor="middle">Key: 15 | Val: 300</text>
      
      <!-- Atomic swap links -->
      <!-- Link to A -->
      <path d="M 100 30 Q 130 0 160 10" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="135" y="-5" fill="#34d399" font-size="9" text-anchor="middle">1. link next</text>

      <!-- Swap from Bucket 1 to New Node C -->
      <path d="M -200 -20 Q -100 130 80 130" fill="none" stroke="#f43f5e" stroke-width="2" />
      <text x="-40" y="95" fill="#f43f5e" font-size="10" font-weight="600" text-anchor="middle">2. Atomic CAS Swap</text>
    </g>
  </g>

  <!-- Memory Reclamation Queue -->
  <g transform="translate(450, 330)">
    <rect x="0" y="0" width="300" height="80" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#shadow)"/>
    <text x="150" y="25" fill="#f43f5e" font-size="12" font-weight="700" text-anchor="middle">Epoch-Based Reclamation (EBR)</text>
    
    <!-- Deferred nodes -->
    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="80" height="30" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1"/>
      <text x="40" y="18" fill="#ffe4e6" font-size="10" font-family="monospace" text-anchor="middle">Node Del (E: 12)</text>
    </g>
    <g transform="translate(110, 35)">
      <rect x="0" y="0" width="80" height="30" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1"/>
      <text x="40" y="18" fill="#ffe4e6" font-size="10" font-family="monospace" text-anchor="middle">Node Del (E: 12)</text>
    </g>
    <text x="205" y="50" fill="#94a3b8" font-size="11">Reclaimed when</text>
    <text x="205" y="65" fill="#94a3b8" font-size="11">Epoch 12 is retired</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>
</svg>
