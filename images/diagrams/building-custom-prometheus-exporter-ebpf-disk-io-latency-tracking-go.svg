<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Component Gradients -->
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="ebpfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00add8" />
      <stop offset="100%" stop-color="#007d9c" />
    </linearGradient>

    <linearGradient id="promGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Glow Filter for eBPF -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" rx="16" fill="url(#bgGrad)" />
  <rect width="996" height="646" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Title -->
  <text x="50" y="50" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" letter-spacing="0.5">
    eBPF Disk I/O Latency Exporter Architecture
  </text>
  <text x="50" y="75" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    High-performance block device latency metrics collection from Kernel to Prometheus
  </text>

  <!-- KERNEL SPACE CONTAINER -->
  <rect x="50" y="110" width="900" height="230" rx="12" fill="url(#kernelGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)" />
  <text x="70" y="140" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">
    KERNEL SPACE
  </text>

  <!-- Block I/O Layer Subsystem -->
  <rect x="80" y="165" width="220" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="95" y="195" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Block I/O Layer (bio)</text>
  
  <rect x="95" y="215" width="190" height="35" rx="4" fill="#0f172a" stroke="#475569" />
  <text x="110" y="237" fill="#94a3b8" font-family="monospace" font-size="11">block_rq_issue</text>
  <circle cx="265" cy="232" r="5" fill="#f43f5e" />

  <rect x="95" y="260" width="190" height="35" rx="4" fill="#0f172a" stroke="#475569" />
  <text x="110" y="282" fill="#94a3b8" font-family="monospace" font-size="11">block_rq_complete</text>
  <circle cx="265" cy="277" r="5" fill="#10b981" />

  <!-- eBPF Program -->
  <rect x="380" y="165" width="240" height="150" rx="8" fill="#0c4a6e" stroke="#0891b2" stroke-width="2" filter="url(#cyanGlow)" />
  <text x="395" y="195" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold">eBPF Program (C)</text>
  
  <!-- eBPF hooks / latency calc -->
  <rect x="395" y="215" width="210" height="85" rx="6" fill="#082f49" stroke="#0284c7" />
  <text x="410" y="238" fill="#38bdf8" font-family="monospace" font-size="12">1. Record start ts</text>
  <text x="410" y="258" fill="#38bdf8" font-family="monospace" font-size="12">2. Calculate Δt</text>
  <text x="410" y="278" fill="#38bdf8" font-family="monospace" font-size="12">3. Increment bucket</text>

  <!-- eBPF Maps (Data Store) -->
  <rect x="700" y="165" width="220" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="715" y="195" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">BPF Maps</text>

  <rect x="715" y="215" width="190" height="35" rx="4" fill="#0f172a" stroke="#475569" />
  <text x="725" y="237" fill="#cbd5e1" font-family="monospace" font-size="11">start_map (Hash)</text>
  <text x="860" y="237" fill="#94a3b8" font-family="sans-serif" font-size="10">Temp</text>

  <rect x="715" y="260" width="190" height="35" rx="4" fill="#0f172a" stroke="#0891b2" stroke-width="1" />
  <text x="725" y="282" fill="#38bdf8" font-family="monospace" font-size="11">hist_map (Hist)</text>
  <text x="860" y="282" fill="#38bdf8" font-family="sans-serif" font-size="10">Buckets</text>

  <!-- USER SPACE CONTAINER -->
  <rect x="50" y="400" width="570" height="200" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#shadow)" />
  <text x="70" y="430" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">
    USER SPACE (Go Prometheus Exporter)
  </text>

  <!-- Go Exporter Box -->
  <rect x="80" y="450" width="510" height="130" rx="8" fill="#0f172a" stroke="#00add8" stroke-width="1.5" />
  
  <!-- cilium/ebpf loader -->
  <rect x="100" y="480" width="180" height="80" rx="6" fill="#0c4a6e" stroke="#0284c7" />
  <text x="115" y="505" fill="#f0f9ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">cilium/ebpf Library</text>
  <text x="115" y="525" fill="#38bdf8" font-family="sans-serif" font-size="11">Loads ELF bytes</text>
  <text x="115" y="542" fill="#38bdf8" font-family="sans-serif" font-size="11">Reads Map: hist_map</text>

  <!-- Prometheus Custom Collector -->
  <rect x="360" y="480" width="210" height="80" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="375" y="505" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">Custom Collector</text>
  <text x="375" y="525" fill="#94a3b8" font-family="sans-serif" font-size="11">prometheus.Collector</text>
  <text x="375" y="542" fill="#94a3b8" font-family="sans-serif" font-size="11">Exposes: /metrics</text>

  <!-- PROMETHEUS SERVER -->
  <rect x="700" y="400" width="250" height="200" rx="12" fill="#1c1917" stroke="#78716c" stroke-width="1.5" filter="url(#shadow)" />
  <text x="720" y="430" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">
    OBSERVABILITY PLATFORM
  </text>
  
  <rect x="730" y="460" width="190" height="110" rx="8" fill="url(#promGrad)" stroke="#f43f5e" stroke-width="1.5" />
  <text x="745" y="495" fill="#fff1f2" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold">Prometheus</text>
  <text x="745" y="520" fill="#fecdd3" font-family="sans-serif" font-size="12">Scrapes histogram metrics</text>
  <text x="745" y="540" fill="#fecdd3" font-family="sans-serif" font-size="12">Computes P99, P95, etc.</text>

  <!-- FLOW ARROWS AND CONNECTIONS -->

  <!-- Hook Connections -->
  <path d="M 300 232 L 340 232 L 340 220 L 372 220" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" />
  <text x="315" y="210" fill="#f43f5e" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Start</text>

  <path d="M 300 277 L 340 277 L 340 250 L 372 250" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />
  <text x="315" y="295" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Complete</text>

  <!-- eBPF Program updates maps -->
  <path d="M 620 240 L 690 240" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <text x="655" y="230" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">Write</text>

  <!-- Go library loads/reads kernel maps -->
  <!-- We cross boundary from user to kernel -->
  <path d="M 190 480 L 190 350 L 730 350 L 730 305" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-cyan)" />
  <text x="460" y="340" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">Reads Map (ring/hash/hist buffer via netlink/syscall)</text>

  <!-- Go internals: Library to Collector -->
  <path d="M 280 520 L 350 520" fill="none" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow)" />
  <text x="315" y="510" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Parse</text>

  <!-- Prometheus Scraping Exporter -->
  <path d="M 730 515 L 580 515" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-rose)" />
  <text x="655" y="500" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HTTP Scrape</text>
  <text x="655" y="535" fill="#f43f5e" font-family="monospace" font-size="10" text-anchor="middle">/metrics (9100)</text>

</svg>
