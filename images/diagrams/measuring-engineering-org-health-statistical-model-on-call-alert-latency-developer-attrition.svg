<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Flow Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4b5563" />
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="980" height="500" fill="url(#bg-grad)" rx="12" />
  
  <!-- Subtle Grid Lines for Tech Aesthetic -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="490" y1="0" x2="490" y2="500" />
    <line x1="730" y1="0" x2="730" y2="500" />
    <line x1="880" y1="0" x2="880" y2="500" />
    <line x1="0" y1="100" x2="980" y2="100" />
    <line x1="0" y1="250" x2="980" y2="250" />
    <line x1="0" y1="400" x2="980" y2="400" />
  </g>

  <!-- Title Text -->
  <text x="30" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f3f4f6" letter-spacing="-0.025em">
    Statistical Modeling Pipeline: On-Call Stress to Attrition Risk
  </text>
  <text x="30" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#9ca3af">
    End-to-end data ingestion, metric synthesis, hazard modeling, and feedback loops
  </text>

  <!-- STAGE 1: DATA SOURCES -->
  <g>
    <!-- Section Border/Label -->
    <rect x="25" y="95" width="200" height="375" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4" rx="8" />
    <text x="35" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="0.05em">1. DATA INGESTION</text>

    <!-- Source Box A: PagerDuty / Opsgenie -->
    <g transform="translate(35, 135)">
      <rect width="180" height="100" fill="url(#card-grad)" stroke="#4b5563" stroke-width="1" rx="6" />
      <rect width="4" height="100" fill="url(#sky-grad)" rx="2" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f3f4f6">Incident Logs API</text>
      <text x="15" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">• PagerDuty / Opsgenie webhook</text>
      <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">• Alert ack &amp; resolve times</text>
      <text x="15" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">• Escapes &amp; escalation tiers</text>
      <text x="15" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0284c7">RAW METRIC STREAM</text>
    </g>

    <!-- Source Box B: HRIS & Git Metadata -->
    <g transform="translate(35, 255)">
      <rect width="180" height="100" fill="url(#card-grad)" stroke="#4b5563" stroke-width="1" rx="6" />
      <rect width="4" height="100" fill="url(#violet-grad)" rx="2" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f3f4f6">Org &amp; Git Metadata</text>
      <text x="15" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">• HRIS records (Tenure, Role)</text>
      <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">• Team size &amp; rotations</text>
      <text x="15" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">• Commit frequency/volume</text>
      <text x="15" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7c3aed">DEMOGRAPHIC COHORTS</text>
    </g>

    <!-- Source Box C: Developer Survey Logs (Optional baseline) -->
    <g transform="translate(35, 375)">
      <rect width="180" height="80" fill="url(#card-grad)" stroke="#374151" stroke-width="1" rx="6" />
      <rect width="4" height="80" fill="#4b5563" rx="2" />
      <text x="15" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9ca3af">Survey Baselines</text>
      <text x="15" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280">• Quarterly sentiment data</text>
      <text x="15" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280">• Self-reported burnout rate</text>
      <text x="15" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#4b5563">STATIC CORRELATION ONLY</text>
    </g>
  </g>

  <!-- CONNECTIONS 1 -> 2 -->
  <path d="M 215 185 L 245 185 L 245 282.5 L 265 282.5" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 215 305 L 265 305" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- STAGE 2: FEATURE ENGINEERING -->
  <g>
    <rect x="260" y="95" width="220" height="375" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4" rx="8" />
    <text x="270" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="0.05em">2. METRICS SYNTHESIS</text>

    <!-- Feature Processing Engine -->
    <g transform="translate(270, 135)">
      <rect width="200" height="320" fill="url(#card-grad)" stroke="#4b5563" stroke-width="1" rx="6" />
      <rect width="200" height="4" fill="url(#violet-grad)" rx="2" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f3f4f6">Feature Extraction</text>
      
      <rect x="10" y="45" width="180" height="55" fill="#1f2937" stroke="#374151" rx="4" />
      <text x="20" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Alert Fatigue Index (AFI)</text>
      <text x="20" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#d1d5db">AFI = Σ (W_hour × Alert_count)</text>
      <text x="20" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9ca3af">Penalizes night pages (22:00-06:00)</text>

      <rect x="10" y="115" width="180" height="55" fill="#1f2937" stroke="#374151" rx="4" />
      <text x="20" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Sleep Interruption Index (SII)</text>
      <text x="20" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#d1d5db">Conscutive sleep breaks</text>
      <text x="20" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9ca3af">Calculates delta between pages</text>

      <rect x="10" y="185" width="180" height="55" fill="#1f2937" stroke="#374151" rx="4" />
      <text x="20" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Response Latency Shift (RLS)</text>
      <text x="20" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#d1d5db">Moving avg of Ack/Resolve</text>
      <text x="20" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9ca3af">Normalized by team baseline</text>

      <rect x="10" y="255" width="180" height="50" fill="#1f2937" stroke="#374151" rx="4" />
      <text x="20" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Developer Demographics</text>
      <text x="20" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d1d5db">Tenure, Level, Team size</text>
    </g>
  </g>

  <!-- CONNECTIONS 2 -> 3 -->
  <path d="M 470 295 L 498 295" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- STAGE 3: STATISTICAL MODELING -->
  <g>
    <rect x="495" y="95" width="225" height="375" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4" rx="8" />
    <text x="505" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="0.05em">3. STATISTICAL MODELING</text>

    <!-- Model Box -->
    <g transform="translate(505, 135)">
      <rect width="205" height="320" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" rx="6" />
      <rect width="205" height="4" fill="url(#sky-grad)" rx="2" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f3f4f6">Survival Engine (Cox Pro)</text>
      
      <rect x="10" y="45" width="185" height="75" fill="#1e293b" stroke="#0284c7" rx="4" />
      <text x="18" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Hazard Function Equation</text>
      <text x="18" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#e2e8f0">h(t | X) = h₀(t) exp(Xβ)</text>
      <text x="18" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9ca3af">X = [AFI, SII, RLS, Tenure, Size]</text>
      <text x="18" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9ca3af">β = Learned hazard coefficients</text>

      <rect x="10" y="130" width="185" height="65" fill="#111827" stroke="#374151" rx="4" />
      <text x="18" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">Survival Function S(t)</text>
      <text x="18" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#d1d5db">Probability of developer survival</text>
      <text x="18" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#d1d5db">past time t without resigning</text>

      <rect x="10" y="205" width="185" height="65" fill="#111827" stroke="#374151" rx="4" />
      <text x="18" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">Hazard Ratios (e^β)</text>
      <text x="18" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#d1d5db">Relative risk increases (e.g. 1.4x</text>
      <text x="18" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#d1d5db">risk per 10hr night on-call)</text>

      <text x="15" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0ea5e9">EVALUATION METRIC: C-INDEX &gt; 0.78</text>
      <text x="15" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">Bootstrapped validation on historical logs</text>
    </g>
  </g>

  <!-- CONNECTIONS 3 -> 4 -->
  <path d="M 710 215 L 730 215 L 730 185 L 742 185" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-sky)" />
  <path d="M 710 375 L 730 375 L 730 355 L 742 355" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)" />

  <!-- STAGE 4: ACTIONABLE OUTPUTS -->
  <g>
    <rect x="735" y="95" width="220" height="375" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4" rx="8" />
    <text x="745" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="0.05em">4. INTERVENTIONS &amp; METRIC LOOPS</text>

    <!-- Output Box A: Risk Analytics -->
    <g transform="translate(745, 135)">
      <rect width="200" height="150" fill="url(#card-grad)" stroke="#4b5563" stroke-width="1" rx="6" />
      <rect width="4" height="150" fill="url(#rose-grad)" rx="2" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f3f4f6">Org Risk Dashboards</text>
      
      <!-- Miniature chart visual -->
      <path d="M 15 80 L 50 75 L 85 90 L 120 60 L 155 45 L 180 35" fill="none" stroke="#ef4444" stroke-width="2" />
      <circle cx="180" cy="35" r="3" fill="#ef4444" />
      <line x1="15" y1="95" x2="185" y2="95" stroke="#4b5563" stroke-width="1" stroke-dasharray="2 2" />
      
      <text x="15" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#fca5a5" font-weight="700">Team Attrition Risk Curve</text>
      <text x="15" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">• Triggers alerts to Directors</text>
      <text x="15" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">• Flags critical burnout teams</text>
    </g>

    <!-- Output Box B: Automated Alert Optimization -->
    <g transform="translate(745, 300)">
      <rect width="200" height="155" fill="url(#card-grad)" stroke="#34d399" stroke-width="1" rx="6" />
      <rect width="4" height="155" fill="url(#emerald-grad)" rx="2" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f3f4f6">Alert Budget &amp; SLA</text>
      
      <rect x="12" y="38" width="176" height="42" fill="#022c22" stroke="#065f46" rx="4" />
      <text x="20" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">Dynamic SLA Adjustments</text>
      <text x="20" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">Increases ACK limits at night</text>

      <text x="15" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">• Automatic routing overrides</text>
      <text x="15" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">• Silent low-priority pages</text>
      <text x="15" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">• Recalibrated alert policies</text>
      <text x="15" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#34d399">REDUCES SLEEP LOSS BY 35%</text>
    </g>
  </g>
</svg>
