<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Producer Node Gradient -->
    <linearGradient id="producer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Consumer Node Gradient -->
    <linearGradient id="consumer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Shared Memory Gradient -->
    <linearGradient id="shm-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.3" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Glow Filter for Arrows -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#f3f4f6" letter-spacing="1">
    LOCK-FREE RING BUFFER MEMORY MAP (IPC)
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#9ca3af">
    High-Throughput Shared Memory Architecture with Cache-Line Padding
  </text>

  <!-- PRODUCER PROCESS (LEFT) -->
  <g transform="translate(40, 120)" filter="url(#shadow)">
    <!-- Main Box -->
    <rect width="180" height="280" rx="12" fill="url(#producer-grad)" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Header -->
    <text x="90" y="35" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Producer Process</text>
    <text x="90" y="52" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500" fill="#93c5fd">User Space (Go)</text>
    
    <!-- Inner State -->
    <rect x="15" y="80" width="150" height="175" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#2563eb" stroke-width="1" />
    <text x="25" y="105" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#60a5fa">Local Cache</text>
    
    <rect x="25" y="120" width="130" height="35" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-dasharray="2,2" />
    <text x="35" y="141" font-family="'Consolas', monospace" font-size="10" fill="#e2e8f0">tail_cache: 1024</text>
    
    <rect x="25" y="165" width="130" height="35" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-dasharray="2,2" />
    <text x="35" y="186" font-family="'Consolas', monospace" font-size="10" fill="#e2e8f0">head_cache: 960</text>

    <!-- Ring Buffer Logic block -->
    <rect x="25" y="210" width="130" height="35" rx="4" fill="#1d4ed8" />
    <text x="90" y="231" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Atomic Store (Release)</text>
  </g>

  <!-- SHARED MEMORY SEGMENT (CENTER) -->
  <g transform="translate(280, 80)" filter="url(#shadow)">
    <!-- SHM Boundary -->
    <rect width="240" height="380" rx="12" fill="url(#shm-grad)" stroke="#4b5563" stroke-width="2" />
    
    <!-- Label -->
    <rect x="10" y="-12" width="220" height="24" rx="12" fill="#374151" stroke="#4b5563" stroke-width="1" />
    <text x="120" y="4" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">Mapped File: /dev/shm/ipc.ring</text>

    <!-- HEADER SECTION (64-byte aligned variables to prevent false sharing) -->
    <g transform="translate(15, 25)">
      <rect width="210" height="155" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
      <text x="15" y="22" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b">Metadata Header</text>
      
      <!-- Head Pointer Block -->
      <rect x="10" y="32" width="190" height="32" rx="4" fill="#111827" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="52" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#10b981">Head (Read Index)</text>
      <text x="190" y="52" text-anchor="end" font-family="'Consolas', monospace" font-size="11" fill="#e5e7eb">offset: 0x00</text>

      <!-- Padding Block 1 -->
      <rect x="10" y="69" width="190" height="14" rx="2" fill="#374151" fill-opacity="0.5" />
      <text x="105" y="80" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#9ca3af" letter-spacing="1">PAD TO 64 BYTES (Cache Line)</text>

      <!-- Tail Pointer Block -->
      <rect x="10" y="88" width="190" height="32" rx="4" fill="#111827" stroke="#3b82f6" stroke-width="1.2" />
      <text x="20" y="108" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#3b82f6">Tail (Write Index)</text>
      <text x="190" y="108" text-anchor="end" font-family="'Consolas', monospace" font-size="11" fill="#e5e7eb">offset: 0x40</text>

      <!-- Padding Block 2 -->
      <rect x="10" y="125" width="190" height="14" rx="2" fill="#374151" fill-opacity="0.5" />
      <text x="105" y="136" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#9ca3af" letter-spacing="1">PAD TO 64 BYTES (Cache Line)</text>
    </g>

    <!-- DATA RING BUFFER SECTION -->
    <g transform="translate(15, 195)">
      <rect width="210" height="170" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
      <text x="15" y="22" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Ring Buffer Slots (Data)</text>
      
      <!-- Slot 0 -->
      <rect x="10" y="32" width="190" height="38" rx="4" fill="#111827" stroke="#6b7280" />
      <rect x="15" y="38" width="35" height="12" rx="2" fill="#047857" />
      <text x="32.5" y="47" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff">READ</text>
      <text x="60" y="48" font-family="'Consolas', monospace" font-size="9" fill="#9ca3af">Slot [0] Payload...</text>
      <text x="60" y="60" font-family="'Consolas', monospace" font-size="8" fill="#4b5563">Header: [State: ReadyForRead | Len: 256]</text>

      <!-- Slot 1 -->
      <rect x="10" y="75" width="190" height="38" rx="4" fill="#111827" stroke="#10b981" stroke-width="1.5" />
      <rect x="15" y="81" width="35" height="12" rx="2" fill="#047857" />
      <text x="32.5" y="90" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff">HEAD</text>
      <text x="60" y="91" font-family="'Consolas', monospace" font-size="9" fill="#ffffff">Slot [1] Payload...</text>
      <text x="60" y="103" font-family="'Consolas', monospace" font-size="8" fill="#10b981">Header: [State: ReadyForRead | Len: 128]</text>

      <!-- Slot 2 -->
      <rect x="10" y="118" width="190" height="38" rx="4" fill="#111827" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="15" y="124" width="35" height="12" rx="2" fill="#1d4ed8" />
      <text x="32.5" y="133" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff">TAIL</text>
      <text x="60" y="134" font-family="'Consolas', monospace" font-size="9" fill="#9ca3af">Slot [2] (Writing)</text>
      <text x="60" y="146" font-family="'Consolas', monospace" font-size="8" fill="#3b82f6">Header: [State: Writing | Len: 512]</text>
    </g>
  </g>

  <!-- CONSUMER PROCESS (RIGHT) -->
  <g transform="translate(580, 120)" filter="url(#shadow)">
    <!-- Main Box -->
    <rect width="180" height="280" rx="12" fill="url(#consumer-grad)" stroke="#34d399" stroke-width="1.5" />
    <!-- Header -->
    <text x="90" y="35" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Consumer Process</text>
    <text x="90" y="52" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500" fill="#a7f3d0">User Space (Go)</text>

    <!-- Inner State -->
    <rect x="15" y="80" width="150" height="175" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
    <text x="25" y="105" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">Local Cache</text>

    <rect x="25" y="120" width="130" height="35" rx="4" fill="#1e293b" stroke="#10b981" stroke-dasharray="2,2" />
    <text x="35" y="141" font-family="'Consolas', monospace" font-size="10" fill="#e2e8f0">head_cache: 961</text>

    <rect x="25" y="165" width="130" height="35" rx="4" fill="#1e293b" stroke="#10b981" stroke-dasharray="2,2" />
    <text x="35" y="186" font-family="'Consolas', monospace" font-size="10" fill="#e2e8f0">tail_cache: 1024</text>

    <!-- Ring Buffer Logic block -->
    <rect x="25" y="210" width="130" height="35" rx="4" fill="#059669" />
    <text x="90" y="231" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Atomic Load (Acquire)</text>
  </g>

  <!-- INTERACTION FLOW ARROWS -->
  <!-- Producer -> Write Index (Atomic Store/Release) -->
  <path d="M 220, 345 C 240, 345 230, 195 295, 195" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)" filter="url(#glow-blue)" />
  <path d="M 220, 345 C 240, 345 230, 195 295, 195" fill="none" stroke="#60a5fa" stroke-width="2" />
  
  <!-- Producer -> Slot 2 Write -->
  <path d="M 220, 240 C 250, 240 250, 332 295, 332" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Consumer <- Read Index (Atomic Load/Acquire) -->
  <path d="M 580, 345 C 560, 345 570, 138 505, 138" fill="none" stroke="#34d399" stroke-width="2" />

  <!-- Consumer <- Slot 1 Read -->
  <path d="M 580, 240 C 550, 240 550, 290 505, 290" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Markers -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
    </marker>
  </defs>
</svg>
