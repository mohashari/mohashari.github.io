<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <!-- Definitions for Markers and Filters -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/>
    </marker>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold" letter-spacing="0.05em">
    CONNECTION LEAK CORRELATION ARCHITECTURE
  </text>
  <text x="500" y="55" text-anchor="middle" fill="#64748b" font-size="12" font-weight="medium">
    Correlating Host File Descriptors with PostgreSQL Sessions using eBPF &amp; OpenTelemetry
  </text>

  <!-- Group 1: Linux Host (Client Side) -->
  <g transform="translate(40, 80)" filter="url(#glow)">
    <!-- Boundary -->
    <rect width="400" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="20" y="28" fill="#94a3b8" font-size="14" font-weight="bold" letter-spacing="0.05em">LINUX HOST (CLIENT APP)</text>

    <!-- Userspace Application -->
    <g transform="translate(20, 50)">
      <rect width="360" height="150" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="15" y="25" fill="#38bdf8" font-size="13" font-weight="bold">USERSPACE: Application Pod / Process</text>
      
      <!-- App Logic / Conn Pool -->
      <rect x="15" y="45" width="330" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-dasharray="2 2"/>
      <text x="25" y="72" fill="#e2e8f0" font-size="12" font-weight="semibold">Application Code &amp; Database Connection Pool</text>
      <text x="25" y="85" fill="#94a3b8" font-size="10">Leaks sockets due to unclosed ResultSets/goroutines</text>

      <!-- OpenTelemetry SDK -->
      <rect x="15" y="100" width="330" height="40" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="25" y="124" fill="#ffffff" font-size="12" font-weight="bold">OTel SDK (Active &amp; Idle Conn Metrics)</text>
    </g>

    <!-- Kernelspace -->
    <g transform="translate(20, 220)">
      <rect width="360" height="180" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text x="15" y="25" fill="#c084fc" font-size="13" font-weight="bold">KERNELSPACE: Socket &amp; VFS Subsystems</text>

      <!-- File Descriptors & Sockets -->
      <g transform="translate(15, 40)">
        <rect width="180" height="120" rx="6" fill="#1e293b" stroke="#475569"/>
        <text x="10" y="20" fill="#e2e8f0" font-size="11" font-weight="semibold">Virtual File System (VFS)</text>
        
        <!-- FDs -->
        <rect x="10" y="35" width="160" height="22" rx="4" fill="#334155"/>
        <text x="18" y="50" fill="#f1f5f9" font-size="10" font-family="monospace">FD 3  -&gt; TCP Socket (Established)</text>
        
        <rect x=10 y=62 width=160 height=22 rx=4 fill=#334155/>
        <text x=18 y=77 fill=#f1f5f9 font-size=10 font-family=monospace>FD 4  -&gt; TCP Socket (Established)</text>

        <rect x=10 y=89 width=160 height=22 rx=4 fill=#ef4444 fill-opacity=0.2 stroke=#ef4444 stroke-width=1/>
        <text x=18 y=104 fill=#fca5a5 font-size=10 font-family=monospace>FD 5* -&gt; Socket (Leaked / Orphaned)</text>
      </g>

      <!-- eBPF Probe -->
      <g transform="translate(210, 40)">
        <rect width="135" height="120" rx="6" fill="#6b21a8" stroke="#a855f7" stroke-width="1"/>
        <text x="10" y="20" fill="#f3e8ff" font-size="11" font-weight="bold">eBPF Program</text>
        <text x="10" y="35" fill="#d8b4fe" font-size="9">kprobes / tracepoints:</text>
        <text x="15" y="50" fill="#f3e8ff" font-size="9" font-family="monospace">sys_enter_connect</text>
        <text x="15" y="62" fill="#f3e8ff" font-size="9" font-family="monospace">sys_enter_close</text>
        
        <rect x="8" y="75" width="119" height="35" rx="4" fill="#581c87" stroke="#c084fc"/>
        <text x="14" y="89" fill="#f3e8ff" font-size="9" font-weight="bold">Ring Buffer Exporter</text>
        <text x="14" y="99" fill="#d8b4fe" font-size="8">Tracks socket lifespans</text>
      </g>
    </g>
  </g>

  <!-- Group 2: PostgreSQL Server -->
  <g transform="translate(680, 80)" filter="url(#glow)">
    <rect width="280" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="20" y="28" fill="#94a3b8" font-size="14" font-weight="bold" letter-spacing="0.05em">POSTGRESQL DATABASE</text>

    <!-- Postgres Internals -->
    <g transform="translate(20, 50)">
      <rect width="240" height="350" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="15" y="25" fill="#34d399" font-size="13" font-weight="bold">PostgreSQL Engine</text>

      <!-- Postmaster Listener -->
      <rect x="15" y="45" width="210" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="25" y="62" fill="#e2e8f0" font-size="11" font-weight="semibold">Postmaster (Port 5432)</text>
      <text x="25" y="78" fill="#94a3b8" font-size="9">Spawns backend process per conn</text>

      <!-- Backend Processes -->
      <g transform="translate(15, 105)">
        <rect width="210" height="150" rx="6" fill="#1e293b" stroke="#475569"/>
        <text x="10" y="20" fill="#e2e8f0" font-size="11" font-weight="semibold">Backend Processes (Sessions)</text>
        
        <rect x="10" y="32" width="190" height="24" rx="4" fill="#334155"/>
        <text x="18" y="47" fill="#34d399" font-size="9" font-family="monospace">PID 8941 - query: SELECT... (Active)</text>
        
        <rect x="10" y="60" width="190" height="24" rx="4" fill="#334155"/>
        <text x="18" y="75" fill="#e2e8f0" font-size="9" font-family="monospace">PID 8942 - state: idle</text>

        <rect x="10" y="88" width="190" height="24" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
        <text x="18" y="103" fill="#fca5a5" font-size="9" font-family="monospace">PID 8943 - idle in transaction*</text>

        <rect x="10" y="116" width="190" height="24" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
        <text x="18" y="131" fill="#fca5a5" font-size="9" font-family="monospace">PID 8944 - idle in transaction*</text>
      </g>

      <!-- pg_stat_activity -->
      <rect x="15" y="270" width="210" height="65" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1"/>
      <text x="25" y="288" fill="#ffffff" font-size="11" font-weight="bold">System Views (Telemetry Source)</text>
      <text x="25" y="303" fill="#a7f3d0" font-size="9" font-family="monospace">pg_stat_activity / pg_stat_database</text>
      <text x="25" y="318" fill="#a7f3d0" font-size="9">Exposes state, query runtime &amp; pool details</text>
    </g>
  </g>

  <!-- Intermediate Layer: OTel Collector & Exporters -->
  <g transform="translate(460, 180)" filter="url(#glow)">
    <rect width="200" height="280" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="15" y="25" fill="#f97316" font-size="12" font-weight="bold" letter-spacing="0.05em">OTEL COLLECTOR</text>

    <!-- Receivers -->
    <rect x="10" y="45" width="180" height="70" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="15" y="62" fill="#e2e8f0" font-size="11" font-weight="semibold">Receivers</text>
    <text x="15" y="78" fill="#94a3b8" font-size="9">• otlp/grpc (App metrics)</text>
    <text x="15" y="90" fill="#94a3b8" font-size="9">• postgresql (pg_stat metrics)</text>
    <text x="15" y="102" fill="#94a3b8" font-size="9">• prometheus (ebpf fd counts)</text>

    <!-- Processors (Correlation engine) -->
    <rect x="10" y="125" width="180" height="65" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="15" y="142" fill="#e2e8f0" font-size="11" font-weight="semibold">Processors</text>
    <text x="15" y="158" fill="#94a3b8" font-size="9">• batch &amp; memory_limiter</text>
    <text x="15" y="170" fill="#94a3b8" font-size="9">• transform (add resource.id)</text>
    <text x="15" y="182" fill="#94a3b8" font-size="9">• resourcedetection (k8s/host)</text>

    <!-- Exporters -->
    <rect x="10" y="200" width="180" height="65" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="15" y="217" fill="#e2e8f0" font-size="11" font-weight="semibold">Exporters</text>
    <text x="15" y="233" fill="#94a3b8" font-size="9">• otlp/prometheus (Metrics DB)</text>
    <text x="15" y="245" fill="#94a3b8" font-size="9">• otlp/tempo (Jaeger Traces)</text>
  </g>

  <!-- Network Traffic Arrows -->
  <!-- TCP Connection App -&gt; PG -->
  <path d="M 380,180 C 490,180 570,180 680,180" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="530" y="172" fill="#94a3b8" font-size="10" text-anchor="middle">TCP Port 5432</text>

  <!-- App Metrics -&gt; OTel Collector -->
  <path d="M 380,215 L 460,215" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="420" y="208" fill="#38bdf8" font-size="9" text-anchor="middle">OTLP</text>

  <!-- eBPF metrics -&gt; OTel Collector -->
  <path d="M 365,340 C 420,340 420,250 460,250" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="415" y="285" fill="#c084fc" font-size="9" text-anchor="middle">FD Stats</text>

  <!-- Postgres Metrics -&gt; OTel Collector -->
  <path d="M 680,380 C 620,380 620,290 580,290" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="635" y="325" fill="#34d399" font-size="9" text-anchor="middle">Metrics Scrape</text>

  <!-- Telemetry Output to Monitoring Stack -->
  <g transform="translate(460, 520)">
    <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="15" y="22" fill="#94a3b8" font-size="11" font-weight="bold">PROMETHEUS / GRAFANA</text>
    
    <!-- Correlation Dashboard representation -->
    <rect x="10" y="32" width="180" height="48" rx="4" fill="#0f172a" stroke="#475569"/>
    
    <!-- Correlated Line Graph (mockup) -->
    <!-- FD line -->
    <path d="M 20,68 L 50,65 L 80,50 L 110,42 L 140,38 L 170,35" fill="none" stroke="#c084fc" stroke-width="2"/>
    <!-- PG Active Session Line -->
    <path d="M 20,68 L 50,68 L 80,55 L 110,48 L 140,40 L 170,36" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="2 2"/>
    
    <text x="15" y="42" fill="#c084fc" font-size="7">FD Growth</text>
    <text x="120" y="74" fill="#34d399" font-size="7">Active Sessions</text>
  </g>

  <!-- OTel Collector -&gt; Grafana Stack -->
  <path d="M 560,460 L 560,520" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="495" fill="#f97316" font-size="10">Correlated Datasets</text>
</svg>