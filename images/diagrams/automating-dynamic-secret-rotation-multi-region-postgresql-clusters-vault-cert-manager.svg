<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Region Box Gradients -->
    <linearGradient id="region-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8" />
    </linearGradient>

    <!-- Component Gradients -->
    <linearGradient id="vault-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    
    <linearGradient id="postgres-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="cert-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="app-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow-vault" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="50" y="45" fill="#f9fafb" font-size="22" font-weight="700" letter-spacing="-0.5">Multi-Region Dynamic DB Secret Rotation Architecture</text>
  <text x="50" y="70" fill="#9ca3af" font-size="14" font-weight="400">Vault Database Engine &amp; cert-manager TLS Orchestration</text>

  <!-- ================= REGION 1: Primary (us-east-1) ================= -->
  <rect x="50" y="100" width="420" height="490" rx="12" fill="url(#region-grad)" stroke="#374151" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="130" fill="#f3f4f6" font-size="16" font-weight="700" letter-spacing="1">REGION A (Primary - us-east-1)</text>

  <!-- Region A: Kubernetes Cluster Border -->
  <rect x="70" y="155" width="380" height="415" rx="8" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="85" y="178" fill="#9ca3af" font-size="11" font-weight="600" letter-spacing="0.5">KUBERNETES CLUSTER</text>

  <!-- Region A: Vault Primary -->
  <g transform="translate(90, 200)" filter="url(#shadow)">
    <rect width="150" height="70" rx="8" fill="url(#vault-grad)" />
    <text x="75" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Vault Cluster</text>
    <text x="75" y="50" fill="#fee2e2" font-size="11" font-weight="500" text-anchor="middle">(Primary Active)</text>
  </g>

  <!-- Region A: cert-manager -->
  <g transform="translate(270, 200)" filter="url(#shadow)">
    <rect width="150" height="70" rx="8" fill="url(#cert-grad)" />
    <text x="75" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">cert-manager</text>
    <text x="75" y="50" fill="#d1fae5" font-size="11" font-weight="500" text-anchor="middle">Internal CA Issuer</text>
  </g>

  <!-- Region A: PostgreSQL Primary -->
  <g transform="translate(90, 450)" filter="url(#shadow)">
    <rect width="150" height="80" rx="8" fill="url(#postgres-grad)" />
    <text x="75" y="35" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">PostgreSQL Primary</text>
    <text x="75" y="52" fill="#dbeafe" font-size="11" font-weight="500" text-anchor="middle">(Patroni / Leader)</text>
    <text x="75" y="68" fill="#93c5fd" font-size="10" font-family="monospace" text-anchor="middle">port: 5432</text>
  </g>

  <!-- Region A: Application Pod -->
  <g transform="translate(90, 320)" filter="url(#shadow)">
    <rect width="150" height="80" rx="8" fill="url(#app-grad)" />
    <text x="75" y="30" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">App Instance</text>
    <text x="75" y="48" fill="#ede9fe" font-size="11" font-weight="500" text-anchor="middle">Vault Agent Sidecar</text>
    <text x="75" y="65" fill="#c084fc" font-size="10" font-family="monospace" text-anchor="middle">Lease TTL: 1h</text>
  </g>


  <!-- ================= REGION 2: Secondary/DR (us-west-2) ================= -->
  <rect x="530" y="100" width="420" height="490" rx="12" fill="url(#region-grad)" stroke="#374151" stroke-width="2" filter="url(#shadow)" />
  <text x="550" y="130" fill="#f3f4f6" font-size="16" font-weight="700" letter-spacing="1">REGION B (Replica - us-west-2)</text>

  <!-- Region B: Kubernetes Cluster Border -->
  <rect x="550" y="155" width="380" height="415" rx="8" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="565" y="178" fill="#9ca3af" font-size="11" font-weight="600" letter-spacing="0.5">KUBERNETES CLUSTER</text>

  <!-- Region B: Vault Performance Replica -->
  <g transform="translate(570, 200)" filter="url(#shadow)">
    <rect width="150" height="70" rx="8" fill="url(#vault-grad)" />
    <text x="75" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Vault Cluster</text>
    <text x="75" y="50" fill="#fee2e2" font-size="11" font-weight="500" text-anchor="middle">(Perf Replica)</text>
  </g>

  <!-- Region B: cert-manager -->
  <g transform="translate(750, 200)" filter="url(#shadow)">
    <rect width="150" height="70" rx="8" fill="url(#cert-grad)" />
    <text x="75" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">cert-manager</text>
    <text x="75" y="50" fill="#d1fae5" font-size="11" font-weight="500" text-anchor="middle">Internal CA Issuer</text>
  </g>

  <!-- Region B: PostgreSQL Replica -->
  <g transform="translate(570, 450)" filter="url(#shadow)">
    <rect width="150" height="80" rx="8" fill="url(#postgres-grad)" />
    <text x="75" y="35" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">PostgreSQL Replica</text>
    <text x="75" y="52" fill="#dbeafe" font-size="11" font-weight="500" text-anchor="middle">(Hot Standby)</text>
    <text x="75" y="68" fill="#93c5fd" font-size="10" font-family="monospace" text-anchor="middle">Read-Only</text>
  </g>

  <!-- Region B: Application Pod -->
  <g transform="translate(570, 320)" filter="url(#shadow)">
    <rect width="150" height="80" rx="8" fill="url(#app-grad)" />
    <text x="75" y="30" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">App Instance</text>
    <text x="75" y="48" fill="#ede9fe" font-size="11" font-weight="500" text-anchor="middle">Vault Agent Sidecar</text>
    <text x="75" y="65" fill="#c084fc" font-size="10" font-family="monospace" text-anchor="middle">Lease TTL: 1h</text>
  </g>


  <!-- ================= ARCHITECTURE FLOW ARROWS & INTERACTIONS ================= -->

  <!-- 1. Vault Replication (Region A <-> Region B) -->
  <path d="M 240 235 L 570 235" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5,5" />
  <polygon points="570,235 560,230 560,240" fill="#f87171" />
  <polygon points="240,235 250,230 250,240" fill="#f87171" />
  <text x="405" y="225" fill="#f87171" font-size="10" font-weight="600" text-anchor="middle">Vault Replication</text>

  <!-- 2. DB Replication (Region A -> Region B) -->
  <path d="M 240 490 L 570 490" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="5,5" />
  <polygon points="570,490 560,485 560,495" fill="#60a5fa" />
  <text x="405" y="480" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">Streaming Replication (TLS)</text>

  <!-- 3. TLS Cert Generation (cert-manager -> Vault & PG) in Region A -->
  <path d="M 345 270 L 345 500 L 240 500" fill="none" stroke="#34d399" stroke-width="1.5" />
  <polygon points="240,500 248,496 248,504" fill="#34d399" />
  
  <path d="M 345 270 L 345 285 L 180 285 L 180 270" fill="none" stroke="#34d399" stroke-width="1.5" />
  <polygon points="180,270 176,278 184,278" fill="#34d399" />
  <text x="355" y="295" fill="#34d399" font-size="9" font-weight="600">TLS Certificates</text>

  <!-- 4. Dynamic Credential Request (App -> Vault Agent -> Vault) in Region A -->
  <path d="M 140 320 L 140 270" fill="none" stroke="#a78bfa" stroke-width="2" />
  <polygon points="140,270 136,278 144,278" fill="#a78bfa" />
  <polygon points="140,320 144,312 136,312" fill="#a78bfa" />
  <text x="148" y="300" fill="#c084fc" font-size="10" font-weight="600">1. Fetch Token/Creds</text>

  <!-- 5. Vault Database Engine dynamic user creation (Vault -> PostgreSQL) in Region A -->
  <path d="M 215 270 L 215 450" fill="none" stroke="#f87171" stroke-width="2" />
  <polygon points="215,450 211,442 219,442" fill="#f87171" />
  <text x="222" y="430" fill="#f87171" font-size="10" font-weight="600">2. Create Role (CREATE ROLE ...)</text>

  <!-- 6. App queries Postgres with dynamic login (App -> PostgreSQL) in Region A -->
  <path d="M 165 400 L 165 450" fill="none" stroke="#60a5fa" stroke-width="2" />
  <polygon points="165,450 161,442 169,442" fill="#60a5fa" />
  <text x="172" y="420" fill="#93c5fd" font-size="10" font-weight="600">3. Connect (Leased User)</text>

  <!-- ================= REGION B FLOWS ================= -->

  <!-- 7. TLS Cert Generation (cert-manager -> Vault & PG) in Region B -->
  <path d="M 825 270 L 825 500 L 720 500" fill="none" stroke="#34d399" stroke-width="1.5" />
  <polygon points="720,500 728,496 728,504" fill="#34d399" />
  
  <path d="M 825 270 L 825 285 L 660 285 L 660 270" fill="none" stroke="#34d399" stroke-width="1.5" />
  <polygon points="660,270 656,278 664,278" fill="#34d399" />
  <text x="835" y="295" fill="#34d399" font-size="9" font-weight="600">TLS Certificates</text>

  <!-- 8. Dynamic Credential Request (App -> Vault Agent -> Vault) in Region B -->
  <path d="M 620 320 L 620 270" fill="none" stroke="#a78bfa" stroke-width="2" />
  <polygon points="620,270 616,278 624,278" fill="#a78bfa" />
  <polygon points="620,320 624,312 616,312" fill="#a78bfa" />
  <text x="628" y="300" fill="#c084fc" font-size="10" font-weight="600">1. Fetch Token/Creds</text>

  <!-- 9. Vault Replica forwards write / handles replication token to Primary PG -->
  <path d="M 600 270 L 600 300 L 490 300 L 490 460 L 240 460" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,3" />
  <polygon points="240,460 248,456 248,464" fill="#f87171" />
  <text x="495" y="380" fill="#f87171" font-size="9" font-weight="600" text-anchor="middle" transform="rotate(-90 495 380)">2. Create User on Primary DB</text>

  <!-- 10. App queries local Standby Postgres (App -> PostgreSQL Replica) in Region B -->
  <path d="M 645 400 L 645 450" fill="none" stroke="#60a5fa" stroke-width="2" />
  <polygon points="645,450 641,442 649,442" fill="#60a5fa" />
  <text x="652" y="420" fill="#93c5fd" font-size="10" font-weight="600">3. Connect (Leased User)</text>

  <!-- Legend at the bottom -->
  <g transform="translate(180, 605)">
    <!-- Legend Items -->
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#vault-grad)" />
    <text x="18" y="10" fill="#9ca3af" font-size="10" font-weight="600">HashiCorp Vault</text>

    <rect x="140" y="0" width="12" height="12" rx="2" fill="url(#postgres-grad)" />
    <text x="158" y="10" fill="#9ca3af" font-size="10" font-weight="600">PostgreSQL</text>

    <rect x="260" y="0" width="12" height="12" rx="2" fill="url(#cert-grad)" />
    <text x="278" y="10" fill="#9ca3af" font-size="10" font-weight="600">cert-manager</text>

    <rect x="380" y="0" width="12" height="12" rx="2" fill="url(#app-grad)" />
    <text x="398" y="10" fill="#9ca3af" font-size="10" font-weight="600">Kubernetes Apps</text>

    <line x1="500" y1="6" x2="530" y2="6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="538" y="10" fill="#9ca3af" font-size="10" font-weight="600">Cross-Region Sync / WAN</text>
  </g>
</svg>
