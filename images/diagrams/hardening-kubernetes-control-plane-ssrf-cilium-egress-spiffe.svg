<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <!-- Background -->
  <rect width="1000" height="650" fill="#0d1117" rx="10"/>
  
  <!-- Title -->
  <text x="50" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#f0f6fc">
    Kubernetes SSRF Hardening: Cilium Egress Gateway + SPIFFE Architecture
  </text>
  
  <!-- Subtitle -->
  <text x="50" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#8b949e">
    Zero-Trust egress verification using SPIRE workload attestation and Cilium eBPF datapath.
  </text>

  <!-- Node 1: Worker Node A -->
  <rect x="50" y="110" width="400" height="480" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="70" y="135" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">Worker Node A</text>
  <text x="350" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">IP: 10.0.1.10</text>

  <!-- SPIRE Agent Box -->
  <rect x="70" y="160" width="160" height="100" rx="6" fill="#21262d" stroke="#f2c440" stroke-width="1.5"/>
  <text x="85" y="185" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f2c440">SPIRE Agent</text>
  <text x="85" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">Workload Attestation</text>
  <text x="85" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Unix Domain Socket</text>

  <!-- Cilium Agent Box -->
  <rect x="260" y="160" width="170" height="100" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="275" y="185" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">Cilium Agent</text>
  <text x="275" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">eBPF Engine &amp; Auth</text>
  <text x="275" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Delegation API Client</text>

  <!-- Pod 1: Payment Processor -->
  <rect x="70" y="300" width="360" height="110" rx="6" fill="#21262d" stroke="#2ea043" stroke-width="2"/>
  <text x="85" y="325" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2ea043">Payment Pod (Trusted)</text>
  <text x="85" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">IP: 10.244.1.45 | SA: payment-processor</text>
  <!-- SPIFFE Badge -->
  <rect x="85" y="365" width="330" height="30" rx="4" fill="#1b2a1e" stroke="#2ea043" stroke-dasharray="2,2"/>
  <text x="95" y="384" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787" font-weight="bold">
    SPIFFE: spiffe://prod.muklis.dev/ns/payment-system/sa/payment-processor
  </text>

  <!-- Pod 2: Compromised Frontend Pod -->
  <rect x="70" y="450" width="360" height="110" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="85" y="475" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f85149">Compromised Pod (Attacker-Controlled)</text>
  <text x="85" y="495" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">IP: 10.244.1.99 | SA: guestbook-sa</text>
  <rect x="85" y="515" width="330" height="30" rx="4" fill="#2d1c1c" stroke="#f85149" stroke-dasharray="2,2"/>
  <text x="95" y="534" font-family="system-ui, sans-serif" font-size="10" fill="#ff7b72" font-weight="bold">
    SPIFFE: spiffe://prod.muklis.dev/ns/default/sa/guestbook-sa
  </text>

  <!-- Connections inside Worker Node -->
  <!-- Attestation Arrow -->
  <path d="M 150,300 L 150,260" stroke="#f2c440" stroke-width="2" fill="none" marker-end="url(#arrow-yellow)"/>
  <!-- Delegation API Arrow -->
  <path d="M 230,210 L 260,210" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="3,3"/>
  <text x="233" y="200" font-family="system-ui, sans-serif" font-size="9" fill="#8b949e">SVID Sync</text>

  <!-- Egress Gateway Node -->
  <rect x="520" y="110" width="220" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="540" y="135" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff">Egress Gateway Node</text>
  <text x="540" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Node: node-egress-01</text>
  
  <rect x="540" y="175" width="180" height="90" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="555" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc">SNAT Engine (eBPF)</text>
  <text x="555" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">Outbound NAT Mapping</text>
  <text x="555" y="245" font-family="system-ui, sans-serif" font-size="11" fill="#7ee787" font-weight="bold">Egress IP: 203.0.113.100</text>

  <!-- Cloud Provider Metadata Service (AWS/GCP) -->
  <rect x="520" y="475" width="220" height="85" rx="8" fill="#211d1d" stroke="#f85149" stroke-width="1.5"/>
  <text x="535" y="500" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ff7b72">Cloud Metadata Service</text>
  <text x="535" y="525" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9">IP: 169.254.169.254</text>
  <text x="535" y="545" font-family="system-ui, sans-serif" font-size="10" fill="#ff7b72" font-weight="bold">Target of SSRF (Blocked)</text>

  <!-- External API (Stripe) -->
  <rect x="800" y="200" width="160" height="200" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="815" y="230" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f0f6fc">External API</text>
  <text x="815" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">api.stripe.com</text>
  
  <rect x="812" y="280" width="136" height="100" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="822" y="305" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff">Firewall Policies</text>
  <text x="822" y="330" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787">ALLOW from:</text>
  <text x="822" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787" font-weight="bold">203.0.113.100/32</text>
  <text x="822" y="365" font-family="system-ui, sans-serif" font-size="9" fill="#ff7b72">DENY all others</text>

  <!-- Paths & Flow lines -->
  
  <!-- Flow 1: Trusted Pod Egress to Gateway -->
  <path d="M 430,355 C 480,355 470,220 520,220" stroke="#2ea043" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <text x="480" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787" font-weight="bold" text-anchor="middle">
    SPIFFE Authenticated
  </text>
  
  <!-- Flow 2: Egress Gateway Node to External API -->
  <path d="M 740,220 L 790,220" stroke="#2ea043" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <text x="765" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">NAT SNAT</text>

  <!-- Flow 3: Malicious Pod to Metadata Service (SSRF Attempt) -->
  <path d="M 430,505 L 510,505" stroke="#f85149" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  <circle cx="470" cy="505" r="10" fill="#2d1c1c" stroke="#f85149" stroke-width="1.5"/>
  <text x="470" y="509" font-family="system-ui, sans-serif" font-size="12" fill="#f85149" font-weight="bold" text-anchor="middle">X</text>
  <text x="470" y="485" font-family="system-ui, sans-serif" font-size="10" fill="#ff7b72" font-weight="bold" text-anchor="middle">Blocked by CNP</text>

  <!-- Flow 4: Malicious Pod to Egress Gateway (Bypass Attempt) -->
  <path d="M 430,515 C 500,515 480,260 528,260" stroke="#f85149" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  <circle cx="488" cy="380" r="10" fill="#2d1c1c" stroke="#f85149" stroke-width="1.5"/>
  <text x="488" y="384" font-family="system-ui, sans-serif" font-size="12" fill="#f85149" font-weight="bold" text-anchor="middle">X</text>
  <text x="488" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#ff7b72" font-weight="bold" text-anchor="middle">Denied: Invalid SPIFFE</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2ea043"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f2c440"/>
    </marker>
  </defs>
</svg>