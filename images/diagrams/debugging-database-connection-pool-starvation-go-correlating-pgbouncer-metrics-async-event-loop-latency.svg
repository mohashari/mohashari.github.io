<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Box Gradients -->
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bouncerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Element Gradients -->
    <linearGradient id="accentGo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00add8" />
      <stop offset="100%" stop-color="#007d9c" />
    </linearGradient>
    <linearGradient id="accentBouncer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentPg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#336791" />
      <stop offset="100%" stop-color="#203e5f" />
    </linearGradient>
    <linearGradient id="accentAlert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    
    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowGo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)" rx="8" />

  <!-- Grid Overlay for tech look -->
  <path d="M 0,50 L 1000,50 M 0,100 L 1000,100 M 0,150 L 1000,150 M 0,200 L 1000,200 M 0,250 L 1000,250 M 0,300 L 1000,300 M 0,350 L 1000,350 M 0,400 L 1000,400 M 0,450 L 1000,450 M 0,500 L 1000,500 M 0,550 L 1000,550" stroke="#1e293b" stroke-width="0.5" />
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600 M 800,0 L 800,600 M 900,0 L 900,600" stroke="#1e293b" stroke-width="0.5" />

  <!-- TITLE -->
  <text x="50" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" letter-spacing="0.5">
    CONNECTION STARVATION CORRELATION ARCHITECTURE
  </text>
  <text x="50" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
    Visualizing Go Runtime Latency Propagation to PgBouncer Connection Pools
  </text>

  <!-- ==================== GO APPLICATION ZONE ==================== -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="320" height="430" rx="12" fill="url(#goGrad)" stroke="#00add8" stroke-width="2" />
    <rect width="320" height="45" rx="12" fill="#0f172a" />
    <path d="M 0,45 L 320,45" stroke="#00add8" stroke-width="1" />
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#00add8">Go Application Instance</text>

    <!-- Go Runtime Scheduler (GMP) -->
    <g transform="translate(20, 65)">
      <rect width="280" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Go Runtime &amp; Scheduler (GMP)</text>
      
      <!-- Scheduler Delay Alert -->
      <rect x="15" y="40" width="250" height="55" rx="6" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
      <text x="25" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">STW GC / CPU Overload Bottleneck</text>
      <text x="25" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fecaca">Go Scheduler Latency (/sched/latencies:seconds) &gt; 50ms</text>
      
      <circle cx="245" cy="53" r="5" fill="#ef4444" />
    </g>

    <!-- Goroutines holding connections -->
    <g transform="translate(20, 190)">
      <rect width="280" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="15" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Active Workers (Goroutines)</text>
      
      <!-- Goroutine Piles -->
      <rect x="15" y="35" width="70" height="45" rx="4" fill="#00add8" fill-opacity="0.2" stroke="#00add8" stroke-width="1" />
      <text x="22" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#e2e8f0">G1 (Active)</text>
      <text x="22" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">Processing</text>

      <rect x="95" y="35" width="80" height="45" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
      <text x="102" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5">G2 (STALLED)</text>
      <text x="102" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fca5a5">Cannot yield</text>

      <rect x="185" y="35" width="80" height="45" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
      <text x="192" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5">G3 (STALLED)</text>
      <text x="192" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fca5a5">Holds Conn</text>
    </g>

    <!-- pgxpool / database/sql -->
    <g transform="translate(20, 305)">
      <rect width="280" height="105" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="15" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Connection Pool (pgxpool / sql)</text>
      
      <!-- Connection Pool Stats -->
      <text x="15" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">MaxOpenConns: <tspan fill="#f8fafc">50</tspan></text>
      <text x="15" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">In-Use Conns: <tspan fill="#ef4444" font-weight="bold">50 (Exhausted)</tspan></text>
      <text x="15" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Wait Duration: <tspan fill="#ef4444" font-weight="bold">&gt; 1,200ms</tspan></text>

      <!-- Draw 5 small blocks representing connections -->
      <g transform="translate(160, 35)">
        <rect x="0" y="0" width="18" height="25" rx="2" fill="#ef4444" stroke="#f8fafc" stroke-width="0.5" />
        <rect x="22" y="0" width="18" height="25" rx="2" fill="#ef4444" stroke="#f8fafc" stroke-width="0.5" />
        <rect x="44" y="0" width="18" height="25" rx="2" fill="#ef4444" stroke="#f8fafc" stroke-width="0.5" />
        <rect x="66" y="0" width="18" height="25" rx="2" fill="#ef4444" stroke="#f8fafc" stroke-width="0.5" />
        <rect x="88" y="0" width="18" height="25" rx="2" fill="#ef4444" stroke="#f8fafc" stroke-width="0.5" />
        <text x="-5" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fca5a5" font-weight="bold">All 50 Conns Busy</text>
      </g>
    </g>
  </g>

  <!-- ==================== FLOW ARROW 1: CLIENT CONNS ==================== -->
  <g transform="translate(370, 260)">
    <!-- Path -->
    <path d="M 0,40 L 90,40" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" />
    <polygon points="90,35 100,40 90,45" fill="#ef4444" />
    
    <rect x="5" y="0" width="85" height="30" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="10" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5">Client Conns Blocked</text>
  </g>

  <!-- ==================== PGBOUNCER ZONE ==================== -->
  <g transform="translate(480, 100)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="260" height="430" rx="12" fill="url(#bouncerGrad)" stroke="#f59e0b" stroke-width="2" />
    <rect width="260" height="45" rx="12" fill="#0f172a" />
    <path d="M 0,45 L 260,45" stroke="#f59e0b" stroke-width="1" />
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">PgBouncer (Transaction Mode)</text>

    <!-- Libevent loop -->
    <g transform="translate(15, 65)">
      <rect width="230" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="15" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Libevent Async Loop</text>
      <text x="15" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Manages client FDs multiplexing</text>
      <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">to backend server connection pool</text>
    </g>

    <!-- Client Pools & Waiting Queues -->
    <g transform="translate(15, 160)">
      <rect width="230" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="15" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">PgBouncer Pool Metrics</text>
      
      <!-- Key metrics -->
      <g transform="translate(15, 35)">
        <rect width="200" height="22" rx="4" fill="#0f172a" />
        <text x="8" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">cl_active (active clients): <tspan fill="#f59e0b" font-weight="bold">150</tspan></text>
      </g>
      
      <g transform="translate(15, 62)">
        <rect width="200" height="22" rx="4" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
        <text x="8" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" font-weight="bold">cl_waiting (stuck clients): 100</text>
      </g>

      <g transform="translate(15, 89)">
        <rect width="200" height="22" rx="4" fill="#0f172a" />
        <text x="8" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">sv_active (active servers): <tspan fill="#10b981">20</tspan></text>
      </g>

      <g transform="translate(15, 116)">
        <rect width="200" height="22" rx="4" fill="#0f172a" />
        <text x="8" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">maxwait: <tspan fill="#ef4444" font-weight="bold">4.2s (HIGH)</tspan></text>
      </g>
    </g>

    <!-- Backend Pool Limit -->
    <g transform="translate(15, 320)">
      <rect width="230" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="15" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Server Connection Limit</text>
      <text x="15" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">pool_size: <tspan fill="#f8fafc">20</tspan></text>
      <text x="15" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">max_db_connections: <tspan fill="#f8fafc">100</tspan></text>
      <text x="15" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" font-weight="bold">Server Conns Saturation: 100%</text>
    </g>
  </g>

  <!-- ==================== FLOW ARROW 2: SERVER CONNS ==================== -->
  <g transform="translate(750, 260)">
    <!-- Path -->
    <path d="M 0,40 L 70,40" stroke="#10b981" stroke-width="3" />
    <polygon points="70,35 80,40 70,45" fill="#10b981" />
    
    <rect x="-5" y="0" width="85" height="30" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#a7f3d0">Max Pool Cap</text>
  </g>

  <!-- ==================== POSTGRESQL ZONE ==================== -->
  <g transform="translate(840, 160)" filter="url(#shadow)">
    <!-- Database Cylinder -->
    <path d="M 0,20 C 0,0 110,0 110,20 L 110,280 C 110,300 0,300 0,280 Z" fill="url(#bouncerGrad)" stroke="#336791" stroke-width="2" />
    <path d="M 0,20 C 0,35 110,35 110,20" fill="none" stroke="#336791" stroke-width="2" />
    <ellipse cx="55" cy="20" rx="55" ry="15" fill="#1e293b" stroke="#336791" stroke-width="2" />
    
    <!-- Postgres Label -->
    <text x="55" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#336791" text-anchor="middle">PostgreSQL</text>
    
    <!-- Health metrics -->
    <text x="55" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Database Load</text>
    <rect x="15" y="120" width="80" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="55" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#a7f3d0" text-anchor="middle">CPU: 12% (LOW)</text>

    <!-- Connection Info -->
    <text x="55" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Active Backends</text>
    <text x="55" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">20 (Low Load)</text>
    
    <!-- Query state -->
    <text x="55" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Backend State</text>
    <text x="55" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">IDLE in transaction</text>
    <text x="55" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">(Waiting for Client)</text>
  </g>

  <!-- ==================== ANNOTATIONS & CORRELATION ==================== -->
  <rect x="50" y="540" width="900" height="45" rx="8" fill="#111827" stroke="#334155" stroke-width="1" />
  <circle cx="70" cy="562" r="6" fill="#ef4444" />
  <text x="85" y="566" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">
    Root Cause Cascade:
  </text>
  <text x="215" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
    Go Runtime STW / Scheduler Latency pauses Goroutines &gt;&gt; Connections held open in transaction &gt;&gt; PgBouncer pools saturate &gt;&gt; cl_waiting spikes &gt;&gt; Go pool starves.
  </text>
</svg>
