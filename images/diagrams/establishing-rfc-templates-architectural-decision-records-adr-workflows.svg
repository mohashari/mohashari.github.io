<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="monospace, sans-serif" font-size="13">
  <!-- Background -->
  <rect width="900" height="560" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Unified Architecture Governance: Collaborative RFCs to Code-Level ADRs</text>

  <!-- Left Column: RFC Lifecycle (Fluid, Broad Scope) -->
  <rect x="30" y="65" width="260" height="465" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="160" y="90" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">I. REQUEST FOR COMMENTS (RFC)</text>
  <text x="160" y="105" text-anchor="middle" fill="#64748b" font-size="10">Cross-Team Proposals &amp; Strategy</text>

  <!-- RFC Draft Node -->
  <rect x="50" y="130" width="220" height="65" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="152" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">Draft RFC Proposal</text>
  <text x="160" y="168" text-anchor="middle" fill="#94a3b8" font-size="10">GDoc, Notion, or PR Draft</text>
  <text x="160" y="180" text-anchor="middle" fill="#64748b" font-size="9">Problem context, options, cost</text>

  <!-- RFC Review Node -->
  <rect x="50" y="240" width="220" height="65" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="262" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">Peer &amp; Lead Review</text>
  <text x="160" y="278" text-anchor="middle" fill="#94a3b8" font-size="10">Async Comments &amp; Iteration</text>
  <text x="160" y="290" text-anchor="middle" fill="#64748b" font-size="9">Review window: 5 to 10 days</text>

  <!-- RFC Guild Gate -->
  <rect x="50" y="350" width="220" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="372" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">Architecture Review Board</text>
  <text x="160" y="388" text-anchor="middle" fill="#94a3b8" font-size="10">Guild Review Meeting</text>
  <text x="160" y="400" text-anchor="middle" fill="#64748b" font-size="9">Resolves conflicts &amp; systems impact</text>

  <!-- Flow Lines inside RFC -->
  <line x1="160" y1="195" x2="160" y2="240" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="160" y1="305" x2="160" y2="350" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Decision Box (Center) -->
  <rect x="320" y="225" width="260" height="150" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="250" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="bold">DECISION GATEWAY</text>

  <!-- Decision Outcome: Approved -->
  <rect x="340" y="275" width="220" height="40" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="450" y="293" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="bold">RFC Status: APPROVED</text>
  <text x="450" y="306" text-anchor="middle" fill="#6ee7b7" font-size="9">Approved design transitions to ADR(s)</text>

  <!-- Decision Outcome: Rejected/Archived -->
  <rect x="340" y="325" width="220" height="40" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
  <text x="450" y="343" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">RFC Status: REJECTED</text>
  <text x="450" y="356" text-anchor="middle" fill="#fca5a5" font-size="9">Archived with decision rationale</text>

  <!-- Inter-column arrows -->
  <!-- RFC Guild to Gate -->
  <path d="M 270 382.5 L 450 382.5 L 450 375" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <!-- Gate to ADR -->
  <line x1="560" y1="295" x2="610" y2="295" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-green)"/>

  <!-- Right Column: ADR Lifecycle (Immutable, Codebase Resident) -->
  <rect x="610" y="65" width="260" height="465" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="740" y="90" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">II. ARCHITECTURAL DECISION RECORD</text>
  <text x="740" y="105" text-anchor="middle" fill="#64748b" font-size="10">Local, Immutable Decision Store</text>

  <!-- ADR Creation Node -->
  <rect x="630" y="130" width="220" height="65" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="740" y="152" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">Create ADR (docs/adr/)</text>
  <text x="740" y="168" text-anchor="middle" fill="#94a3b8" font-size="10">Commit to Feature Branch</text>
  <text x="740" y="180" text-anchor="middle" fill="#64748b" font-size="9">Context, Decision, Consequences</text>

  <!-- ADR Git PR Review Node -->
  <rect x="630" y="240" width="220" height="65" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="740" y="262" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">PR Review &amp; CI Checks</text>
  <text x="740" y="278" text-anchor="middle" fill="#94a3b8" font-size="10">Code &amp; Docs Merge Together</text>
  <text x="740" y="290" text-anchor="middle" fill="#64748b" font-size="9">Validation: Format, Index, Status</text>

  <!-- ADR Immutable Registry Node -->
  <rect x="630" y="350" width="220" height="65" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="740" y="372" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Central Sync &amp; Portal</text>
  <text x="740" y="388" text-anchor="middle" fill="#94a3b8" font-size="10">Backstage / Architecture Hub</text>
  <text x="740" y="400" text-anchor="middle" fill="#64748b" font-size="9">Aggregated across all org repositories</text>

  <!-- Flow Lines inside ADR -->
  <line x1="740" y1="195" x2="740" y2="240" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="740" y1="305" x2="740" y2="350" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Operational Health Check Footer -->
  <rect x="30" y="450" width="840" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="450" y="468" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">ORGANIZATIONAL IMPACT &amp; ALIGNMENT</text>
  <text x="70" y="488" fill="#e2e8f0" font-size="10">RFCs address wide multi-team strategies (e.g. migration to Protobuf/gRPC)</text>
  <text x="70" y="502" fill="#e2e8f0" font-size="10">ADRs record micro-decisions inside code repos (e.g. choice of hashing, pool size)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
