<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="620" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="430" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Raft Consensus: Log Replication, Leader Election &amp; Membership Changes</text>

  <!-- ===== LEADER ===== -->
  <rect x="340" y="65" width="180" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="430" y="95" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4ed8">LEADER</text>
  <text x="430" y="113" font-size="12" text-anchor="middle" fill="#1e40af">Node A  |  term = 7</text>
  <text x="430" y="130" font-size="11" text-anchor="middle" fill="#3b82f6">commitIndex = 3</text>

  <!-- ===== FOLLOWERS ===== -->
  <!-- Follower B -->
  <rect x="60" y="230" width="160" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="258" font-size="13" font-weight="700" text-anchor="middle" fill="#15803d">FOLLOWER</text>
  <text x="140" y="276" font-size="12" text-anchor="middle" fill="#166534">Node B  |  term = 7</text>
  <text x="140" y="294" font-size="11" text-anchor="middle" fill="#22c55e">matchIndex = 3</text>

  <!-- Follower C -->
  <rect x="340" y="230" width="160" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="258" font-size="13" font-weight="700" text-anchor="middle" fill="#15803d">FOLLOWER</text>
  <text x="420" y="276" font-size="12" text-anchor="middle" fill="#166534">Node C  |  term = 7</text>
  <text x="420" y="294" font-size="11" text-anchor="middle" fill="#22c55e">matchIndex = 3</text>

  <!-- Follower D -->
  <rect x="620" y="230" width="160" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="258" font-size="13" font-weight="700" text-anchor="middle" fill="#15803d">FOLLOWER</text>
  <text x="700" y="276" font-size="12" text-anchor="middle" fill="#166534">Node D  |  term = 7</text>
  <text x="700" y="294" font-size="11" text-anchor="middle" fill="#22c55e">matchIndex = 2</text>

  <!-- ===== AppendEntries arrows (leader → followers) ===== -->
  <!-- Leader → Node B -->
  <line x1="380" y1="155" x2="210" y2="230" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="265" y="195" font-size="10" text-anchor="middle" fill="#2563eb">AppendEntries</text>

  <!-- Leader → Node C -->
  <line x1="420" y1="155" x2="420" y2="230" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Leader → Node D -->
  <line x1="470" y1="155" x2="635" y2="230" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="590" y="195" font-size="10" text-anchor="middle" fill="#2563eb">AppendEntries</text>

  <!-- ACK arrows (followers → leader) dashed -->
  <!-- Node B → Leader -->
  <line x1="200" y1="230" x2="370" y2="155" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="252" y="215" font-size="10" text-anchor="middle" fill="#16a34a">ACK ✓</text>

  <!-- Node C → Leader -->
  <line x1="430" y1="230" x2="435" y2="155" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <!-- ===== LOG ENTRIES SECTION ===== -->
  <text x="60" y="360" font-size="13" font-weight="700" fill="#374151">Replicated Log (Leader view)</text>

  <!-- Log entry boxes -->
  <!-- Entry 1: committed -->
  <rect x="60" y="375" width="70" height="44" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="95" y="394" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">idx=1</text>
  <text x="95" y="410" font-size="10" text-anchor="middle" fill="#78350f">term=5</text>

  <!-- Entry 2: committed -->
  <rect x="135" y="375" width="70" height="44" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="170" y="394" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">idx=2</text>
  <text x="170" y="410" font-size="10" text-anchor="middle" fill="#78350f">term=6</text>

  <!-- Entry 3: committed (quorum) -->
  <rect x="210" y="375" width="70" height="44" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="394" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">idx=3</text>
  <text x="245" y="410" font-size="10" text-anchor="middle" fill="#166534">term=7 ✓</text>

  <!-- Entry 4: uncommitted -->
  <rect x="285" y="375" width="70" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="320" y="394" font-size="11" font-weight="700" text-anchor="middle" fill="#991b1b">idx=4</text>
  <text x="320" y="410" font-size="10" text-anchor="middle" fill="#7f1d1d">term=7 ?</text>

  <!-- committed / uncommitted separator label -->
  <line x1="280" y1="368" x2="280" y2="426" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="60" y="442" font-size="10" fill="#6b7280">← committed (majority acked)</text>
  <text x="285" y="442" font-size="10" fill="#dc2626">← in-flight / not yet committed</text>

  <!-- ===== LEADER ELECTION SECTION ===== -->
  <rect x="460" y="355" width="360" height="140" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="640" y="378" font-size="13" font-weight="700" text-anchor="middle" fill="#c2410c">Leader Election (election timeout fired)</text>

  <text x="475" y="400" font-size="11" fill="#7c2d12">1. Follower → Candidate  (increments term, votes for self)</text>
  <text x="475" y="418" font-size="11" fill="#7c2d12">2. Broadcasts RequestVote RPC to all peers</text>
  <text x="475" y="436" font-size="11" fill="#7c2d12">3. First to collect majority (3 of 5) wins election</text>
  <text x="475" y="454" font-size="11" fill="#7c2d12">4. New leader sends heartbeat (empty AppendEntries)</text>
  <text x="475" y="472" font-size="11" fill="#7c2d12">   to reset follower timers and assert authority</text>

  <!-- ===== MEMBERSHIP CHANGE SECTION ===== -->
  <rect x="60" y="462" width="380" height="130" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="485" font-size="13" font-weight="700" text-anchor="middle" fill="#5b21b6">Joint Consensus: Membership Change</text>

  <text x="75" y="507" font-size="11" fill="#4c1d95">Phase 1 — C_old+new: new log entry replicates new config;</text>
  <text x="75" y="523" font-size="11" fill="#4c1d95">          decisions require majority of BOTH old and new configs.</text>
  <text x="75" y="541" font-size="11" fill="#4c1d95">Phase 2 — C_new: once committed, leader replicates C_new;</text>
  <text x="75" y="557" font-size="11" fill="#4c1d95">          old servers not in C_new shut down gracefully.</text>
  <text x="75" y="575" font-size="11" fill="#7c3aed" font-weight="600">Etcd v3 uses single-server changes to avoid joint-consensus complexity.</text>

  <!-- ===== TIMING LEGEND ===== -->
  <rect x="460" y="510" width="360" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="640" y="530" font-size="12" font-weight="700" text-anchor="middle" fill="#475569">Typical Timing (etcd defaults)</text>
  <text x="475" y="550" font-size="11" fill="#334155">Election timeout:  150–300 ms (randomized)</text>
  <text x="475" y="568" font-size="11" fill="#334155">Heartbeat interval:  100 ms</text>
  <text x="475" y="586" font-size="11" fill="#334155">Write quorum:  majority (⌈n/2⌉ + 1 nodes)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
