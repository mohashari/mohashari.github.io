<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="producerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="consumerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="queueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="collectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    
    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" rx="16" fill="#0F172A" />
  
  <!-- Outer Grid (Subtle) -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.3">
    <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500 M 800,0 L 800,500 M 900,0 L 900,500" />
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400" />
  </g>

  <!-- Title / Legend (Visual clean-up) -->
  <text x="30" y="40" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">OpenTelemetry Context Propagation Flow</text>
  <text x="30" y="60" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12">Asynchronous Queue Boundaries (e.g., Kafka / RabbitMQ)</text>

  <!-- 1. Producer Service Box -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="240" height="160" rx="12" fill="url(#producerGrad)" />
    <rect x="2" y="2" width="236" height="156" rx="10" fill="#1E293B" opacity="0.9" />
    <text x="20" y="35" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PRODUCER SERVICE</text>
    <text x="20" y="60" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Order Service (Go)</text>
    
    <!-- Code/Trace visual inside box -->
    <rect x="20" y="80" width="200" height="60" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="30" y="98" fill="#F43F5E" font-family="monospace" font-size="11">Span: <tspan fill="#3B82F6">"create_order"</tspan></text>
    <text x="30" y="115" fill="#94A3B8" font-family="monospace" font-size="10">Inject Context to Headers:</text>
    <text x="30" y="130" fill="#10B981" font-family="monospace" font-size="9">traceparent: 00-4bf92f35...-01</text>
  </g>

  <!-- 2. Message Broker / Queue Box -->
  <g transform="translate(380, 120)" filter="url(#shadow)">
    <rect width="240" height="160" rx="12" fill="url(#queueGrad)" />
    <rect x="2" y="2" width="236" height="156" rx="10" fill="#1E293B" opacity="0.9" />
    <text x="20" y="35" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">MESSAGE BROKER</text>
    <text x="20" y="60" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Kafka Topic: orders</text>
    
    <!-- Message representation -->
    <rect x="20" y="80" width="200" height="60" rx="6" fill="#0F172A" stroke="#D97706" stroke-dasharray="4,4" />
    <text x="30" y="98" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Kafka Record Headers</text>
    <text x="30" y="115" fill="#94A3B8" font-family="monospace" font-size="9">traceparent = 00-4bf92f35...</text>
    <text x="30" y="130" fill="#94A3B8" font-family="monospace" font-size="9">payload = {"order_id": 4912}</text>
  </g>

  <!-- 3. Consumer Service Box -->
  <g transform="translate(700, 120)" filter="url(#shadow)">
    <rect width="240" height="160" rx="12" fill="url(#consumerGrad)" />
    <rect x="2" y="2" width="236" height="156" rx="10" fill="#1E293B" opacity="0.9" />
    <text x="20" y="35" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CONSUMER SERVICE</text>
    <text x="20" y="60" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Payment Service (Go)</text>
    
    <!-- Code/Trace visual inside box -->
    <rect x="20" y="80" width="200" height="60" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="30" y="98" fill="#94A3B8" font-family="monospace" font-size="10">Extract context from headers</text>
    <text x="30" y="115" fill="#F43F5E" font-family="monospace" font-size="11">Child Span: <tspan fill="#10B981">"process_payment"</tspan></text>
    <text x="30" y="130" fill="#3B82F6" font-family="monospace" font-size="9">Parent ID: 4bf92f35...</text>
  </g>

  <!-- 4. Distributed Tracing Backend (Tempo/Jaeger) -->
  <g transform="translate(350, 360)" filter="url(#shadow)">
    <rect width="300" height="100" rx="12" fill="url(#collectorGrad)" />
    <rect x="2" y="2" width="296" height="96" rx="10" fill="#1E293B" opacity="0.9" />
    <text x="20" y="30" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">OTEL COLLECTOR &amp; STORAGE</text>
    <text x="20" y="55" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Tempo / Jaeger / Datadog</text>
    
    <!-- Visual Span bar representations -->
    <rect x="20" y="70" width="160" height="8" rx="4" fill="#3B82F6" />
    <rect x="150" y="82" width="110" height="8" rx="4" fill="#10B981" />
    <line x1="150" y1="74" x2="150" y2="82" stroke="#64748B" stroke-dasharray="2,2" />
  </g>

  <!-- Connectors / Arrows -->
  
  <!-- Producer -> Queue -->
  <path d="M 300 200 L 372 200" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="338" y="185" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Publish</text>
  
  <!-- Queue -> Consumer -->
  <path d="M 620 200 L 692 200" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="656" y="185" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Consume</text>

  <!-- Producer -> OTel Collector -->
  <path d="M 180 280 L 180 410 L 342 410" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <text x="210" y="398" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">Export Span</text>

  <!-- Consumer -> OTel Collector -->
  <path d="M 820 280 L 820 410 L 658 410" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <text x="790" y="398" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="end">Export Span</text>
</svg>
