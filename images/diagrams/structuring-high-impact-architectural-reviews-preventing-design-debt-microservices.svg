<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Accent Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 24px; fill: #f8fafc; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 14px; fill: #94a3b8; }
    .step-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 16px; fill: #38bdf8; }
    .card-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 15px; fill: #f1f5f9; }
    .card-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
    .badge { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10px; fill: #0f172a; }
    .flow-line { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 4 4; }
    .connector { fill: none; stroke: #475569; stroke-width: 2; }
    .highlight { fill: none; stroke: #0ea5e9; stroke-width: 1; }
  </style>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg-grad)" rx="16" />
  
  <!-- Header -->
  <g transform="translate(40, 50)">
    <text class="title" x="0" y="0">Architectural Review Lifecycle in Microservices</text>
    <text class="subtitle" x="0" y="24">Continuous design debt mitigation from proposal through deployment &amp; drift auditing</text>
  </g>

  <!-- ==================== STEP 1: PROPOSE ==================== -->
  <g transform="translate(40, 140)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="200" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <rect width="200" height="6" rx="3" fill="#38bdf8" />
    <!-- Step Header -->
    <text class="step-title" x="20" y="35">01 / PROPOSE</text>
    <text class="card-title" x="20" y="60">RFC / ADR Ingestion</text>
    <!-- Items -->
    <circle cx="25" cy="95" r="3" fill="#38bdf8" />
    <text class="card-text" x="38" y="99">Standardized ADR Template</text>
    
    <circle cx="25" cy="130" r="3" fill="#38bdf8" />
    <text class="card-text" x="38" y="134">Asynchronous Slack RFC</text>
    
    <circle cx="25" cy="165" r="3" fill="#38bdf8" />
    <text class="card-text" x="38" y="169">Self-service evaluation</text>
    
    <circle cx="25" cy="200" r="3" fill="#38bdf8" />
    <text class="card-text" x="38" y="204">Schema &amp; Contract Drafts</text>

    <!-- Phase Badge -->
    <rect x="20" y="235" width="80" height="20" rx="10" fill="#38bdf8" />
    <text class="badge" x="32" y="248">PRE-COMMIT</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 240 280 L 290 280" class="connector" marker-end="url(#arrow)" />

  <!-- ==================== STEP 2: EVALUATE ==================== -->
  <g transform="translate(300, 140)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="200" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <rect width="200" height="6" rx="3" fill="#0ea5e9" />
    <!-- Step Header -->
    <text class="step-title" x="20" y="35">02 / REVIEW</text>
    <text class="card-title" x="20" y="60">Cross-Team Review</text>
    <!-- Items -->
    <circle cx="25" cy="95" r="3" fill="#0ea5e9" />
    <text class="card-text" x="38" y="99">Security &amp; Threat Model</text>
    
    <circle cx="25" cy="130" r="3" fill="#0ea5e9" />
    <text class="card-text" x="38" y="134">Database Migration Strategy</text>
    
    <circle cx="25" cy="165" r="3" fill="#0ea5e9" />
    <text class="card-text" x="38" y="169">API Backward Compatibility</text>
    
    <circle cx="25" cy="200" r="3" fill="#0ea5e9" />
    <text class="card-text" x="38" y="204">Resource &amp; Cost Estimation</text>

    <!-- Phase Badge -->
    <rect x="20" y="235" width="85" height="20" rx="10" fill="#0ea5e9" />
    <text class="badge" x="30" y="248" fill="#ffffff">DESIGN SYNC</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 500 280 L 550 280" class="connector" marker-end="url(#arrow)" />

  <!-- ==================== STEP 3: RECORD ==================== -->
  <g transform="translate(560, 140)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="200" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <rect width="200" height="6" rx="3" fill="#10b981" />
    <!-- Step Header -->
    <text class="step-title" x="20" y="35" fill="#10b981">03 / DECIDE</text>
    <text class="card-title" x="20" y="60">Decision Logging</text>
    <!-- Items -->
    <circle cx="25" cy="95" r="3" fill="#10b981" />
    <text class="card-text" x="38" y="99">Git-tracked ADR Registry</text>
    
    <circle cx="25" cy="130" r="3" fill="#10b981" />
    <text class="card-text" x="38" y="134">Approved/Rejected States</text>
    
    <circle cx="25" cy="165" r="3" fill="#10b981" />
    <text class="card-text" x="38" y="169">Design-debt ledger entry</text>
    
    <circle cx="25" cy="200" r="3" fill="#10b981" />
    <text class="card-text" x="38" y="204">RFC Artifact linking</text>

    <!-- Phase Badge -->
    <rect x="20" y="235" width="80" height="20" rx="10" fill="#10b981" />
    <text class="badge" x="31" y="248">IMMUTABLE</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 760 280 L 810 280" class="connector" marker-end="url(#arrow)" />

  <!-- ==================== STEP 4: VERIFY ==================== -->
  <g transform="translate(820, 140)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="200" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <rect width="200" height="6" rx="3" fill="#f59e0b" />
    <!-- Step Header -->
    <text class="step-title" x="20" y="35" fill="#f59e0b">04 / AUDIT</text>
    <text class="card-title" x="20" y="60">Drift Detection</text>
    <!-- Items -->
    <circle cx="25" cy="95" r="3" fill="#f59e0b" />
    <text class="card-text" x="38" y="99">CI ArchUnit validations</text>
    
    <circle cx="25" cy="130" r="3" fill="#f59e0b" />
    <text class="card-text" x="38" y="134">OpenAPI spec sync audits</text>
    
    <circle cx="25" cy="165" r="3" fill="#f59e0b" />
    <text class="card-text" x="38" y="169">Db Schema telemetry</text>
    
    <circle cx="25" cy="200" r="3" fill="#f59e0b" />
    <text class="card-text" x="38" y="204">Post-mortem feed loops</text>

    <!-- Phase Badge -->
    <rect x="20" y="235" width="80" height="20" rx="10" fill="#f59e0b" />
    <text class="badge" x="31" y="248">CONTINUOUS</text>
  </g>

  <!-- ==================== FEEDBACK LOOP (Bottom Arrow) ==================== -->
  <!-- Line from step 4 bottom to step 1 bottom -->
  <path d="M 920 420 L 920 480 L 140 480 L 140 420" class="flow-line" marker-end="url(#arrow)" />
  
  <g transform="translate(420, 495)">
    <rect x="-10" y="-12" width="220" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text class="card-text" x="0" y="4" fill="#38bdf8" font-weight="600" text-anchor="start">Drift Feedback Loop to Proposal Ingestion</text>
  </g>

  <!-- Legend & Metadata -->
  <g transform="translate(40, 545)">
    <rect x="-5" y="-5" width="10" height="10" fill="#38bdf8" />
    <text class="card-text" x="15" y="5">Proposed &amp; Linter Checks</text>

    <rect x="200" y="-5" width="10" height="10" fill="#0ea5e9" />
    <text class="card-text" x="220" y="5">Cross-team review / Guardrails</text>

    <rect x="450" y="-5" width="10" height="10" fill="#10b981" />
    <text class="card-text" x="470" y="5">GitOps Audit Log</text>

    <rect x="670" y="-5" width="10" height="10" fill="#f59e0b" />
    <text class="card-text" x="690" y="5">CI/CD &amp; Production Telemetry Verification</text>
  </g>
</svg>
