<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ebpfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="otelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title / Legend -->
  <text x="30" y="40" fill="#f3f4f6" font-size="20" font-weight="bold" letter-spacing="0.5">eBPF + OpenTelemetry Trace Correlation Architecture</text>
  <text x="30" y="60" fill="#9ca3af" font-size="12">Mapping low-level TCP/IP socket dynamics directly to L7 W3C Distributed Trace IDs</text>

  <!-- User Space (Kubernetes Pods) Boundary -->
  <rect x="30" y="90" width="840" height="230" rx="12" fill="#111827" stroke="#1f2937" stroke-width="2" />
  <text x="45" y="115" fill="#6b7280" font-size="12" font-weight="bold" letter-spacing="1">USER SPACE (KUBERNETES PODS)</text>

  <!-- Pod A (Client) -->
  <rect x="60" y="135" width="240" height="150" rx="8" fill="url(#podGrad)" stroke="#374151" stroke-width="1.5" />
  <text x="80" y="165" fill="#f3f4f6" font-size="15" font-weight="bold">Pod A (Go Client App)</text>
  <text x="80" y="185" fill="#9ca3af" font-size="12">OTel Tracer / HTTP Client</text>
  <rect x="80" y="210" width="200" height="50" rx="6" fill="#1f2937" stroke="#06b6d4" stroke-width="1" />
  <text x="90" y="228" fill="#38bdf8" font-size="11" font-weight="bold">Generates Span A</text>
  <text x="90" y="246" fill="#9ca3af" font-size="10">Injects: traceparent: 00-4bf9...</text>

  <!-- Pod B (Server) -->
  <rect x="600" y="135" width="240" height="150" rx="8" fill="url(#podGrad)" stroke="#374151" stroke-width="1.5" />
  <text x="620" y="165" fill="#f3f4f6" font-size="15" font-weight="bold">Pod B (Go Server App)</text>
  <text x="620" y="185" fill="#9ca3af" font-size="12">OTel HTTP Server Middleware</text>
  <rect x="620" y="210" width="200" height="50" rx="6" fill="#1f2937" stroke="#06b6d4" stroke-width="1" />
  <text x="630" y="228" fill="#38bdf8" font-size="11" font-weight="bold">Generates Span B</text>
  <text x="630" y="246" fill="#9ca3af" font-size="10">Extracts: traceparent: 00-4bf9...</text>

  <!-- Network Link / TCP Packet stream -->
  <path d="M 300 200 L 600 200" stroke="url(#flowGrad)" stroke-width="4" stroke-dasharray="8 6" filter="url(#softGlow)" />
  <rect x="390" y="165" width="120" height="25" rx="4" fill="#111827" stroke="#8b5cf6" stroke-width="1" />
  <text x="400" y="181" fill="#ec4899" font-size="11" font-weight="bold">traceparent Header</text>

  <!-- Kernel Space Boundary -->
  <rect x="30" y="340" width="840" height="230" rx="12" fill="url(#kernelGrad)" stroke="#312e81" stroke-width="2" />
  <text x="45" y="365" fill="#818cf8" font-size="12" font-weight="bold" letter-spacing="1">KERNEL SPACE (LINUX HOST KERNEL)</text>

  <!-- eBPF Hook (e.g. TC / Socket Operations) -->
  <g transform="translate(320, 390)">
    <rect x="0" y="0" width="260" height="155" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="15" y="25" fill="#f472b6" font-size="13" font-weight="bold">eBPF Socket Monitor</text>
    <text x="15" y="45" fill="#9ca3af" font-size="11">Hook: kprobe:tcp_sendmsg / sock_ops</text>
    
    <!-- Parser block -->
    <rect x="15" y="60" width="230" height="40" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
    <text x="25" y="76" fill="#e0e7ff" font-size="10" font-weight="bold">Parser (sk_buff -> L7 Header)</text>
    <text x="25" y="92" fill="#a78bfa" font-size="9">Match "traceparent:" &amp; Extract TraceID</text>

    <!-- BPF Map -->
    <rect x="15" y="110" width="230" height="35" rx="4" fill="#312e81" stroke="#ec4899" stroke-width="1" />
    <text x="25" y="125" fill="#f472b6" font-size="10" font-weight="bold">BPF Map (trace_id_metrics_map)</text>
    <text x="25" y="138" fill="#9ca3af" font-size="9">Key: trace_id | Value: RTT, Retransmits, cwnd</text>
  </g>

  <!-- Hooks connecting packets to Kernel parser -->
  <path d="M 450 200 L 450 450" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="450" cy="200" r="4" fill="#ec4899" />
  <polygon points="446,450 454,450 450,455" fill="#ec4899" />
  <text x="460" y="270" fill="#ec4899" font-size="10" font-weight="bold">Kernel intercepts skb</text>

  <!-- OTel Collector or eBPF Agent -->
  <g transform="translate(60, 390)">
    <rect x="0" y="0" width="220" height="155" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="15" y="25" fill="#22d3ee" font-size="13" font-weight="bold">Beyla / eBPF Collector</text>
    <text x="15" y="45" fill="#9ca3af" font-size="11">Reads BPF map events</text>
    
    <rect x="15" y="65" width="190" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="85" fill="#f8fafc" font-size="10" font-weight="bold">Correlator &amp; Exporter</text>
    <text x="25" y="100" fill="#94a3b8" font-size="9">Binds trace_id payload to</text>
    <text x="25" y="112" fill="#94a3b8" font-size="9">metric attributes (OTLP)</text>
    <text x="25" y="127" fill="#10b981" font-size="9" font-weight="bold">Active Export: OTLP / gRPC</text>
  </g>

  <!-- BPF Map -> Collector Read -->
  <path d="M 320 467 L 280 467" stroke="#22d3ee" stroke-width="2" stroke-dasharray="2 2" />
  <circle cx="320" cy="467" r="3" fill="#22d3ee" />
  <polygon points="280,463 280,471 275,467" fill="#22d3ee" />
  <text x="285" y="455" fill="#22d3ee" font-size="9" font-weight="bold">eBPF ringbuf</text>

  <!-- OTel Collector Outgoing / Jaeger Backend -->
  <g transform="translate(600, 390)">
    <rect x="0" y="0" width="240" height="155" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="15" y="25" fill="#94a3b8" font-size="13" font-weight="bold">OTel Collector &amp; Storage</text>
    <text x="15" y="45" fill="#64748b" font-size="11">ClickHouse / Prometheus / Jaeger</text>
    
    <rect x="15" y="65" width="210" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="85" fill="#22d3ee" font-size="10" font-weight="bold">Correlated Observability</text>
    <text x="25" y="100" fill="#f43f5e" font-size="9" font-weight="bold">Span A -&gt; Trace ID: 4bf9...</text>
    <text x="25" y="113" fill="#fbbf24" font-size="9" font-weight="bold">eBPF TCP RTT: 42ms (Trace: 4bf9...)</text>
    <text x="25" y="126" fill="#10b981" font-size="9" font-weight="bold">Span B -&gt; Trace ID: 4bf9...</text>
  </g>

  <!-- Collector -> Storage -->
  <path d="M 280 480 L 600 480" stroke="#059669" stroke-width="2" stroke-dasharray="5 5" />
  <polygon points="595,476 595,484 600,480" fill="#059669" />
  <text x="420" y="472" fill="#10b981" font-size="10" font-weight="bold">OTLP Metrics + Spans</text>

  <!-- App Spans -> Storage -->
  <path d="M 180 285 L 180 390" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="180" cy="285" r="3" fill="#38bdf8" />
  <polygon points="176,390 184,390 180,395" fill="#38bdf8" />
  
  <path d="M 720 285 L 720 390" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="720" cy="285" r="3" fill="#38bdf8" />
  <polygon points="716,390 724,390 720,395" fill="#38bdf8" />
  <text x="728" y="340" fill="#38bdf8" font-size="10">App Spans</text>

</svg>
