<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Definitions for arrows and filters -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.05em">
    EPHEMERAL CREDENTIAL FLOW VIA KUBERNETES TOKEN VOLUME PROJECTION
  </text>

  <!-- Container Box: Kubernetes Cluster Boundary -->
  <rect x="30" y="70" width="460" height="390" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="45" y="95" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.05em">KUBERNETES CLUSTER</text>

  <!-- Pod Node (within K8s Cluster) -->
  <rect x="60" y="120" width="220" height="310" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <text x="75" y="142" fill="#38bdf8" font-size="13" font-weight="700">Application Pod</text>

  <!-- App Container inside Pod -->
  <rect x="80" y="165" width="180" height="110" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="95" y="190" fill="#f8fafc" font-size="12" font-weight="600">App Container</text>
  <!-- Vault Client Code -->
  <rect x="95" y="205" width="150" height="55" rx="4" fill="#0f172a" stroke="#64748b" />
  <text x="105" y="223" fill="#38bdf8" font-size="10" font-family="monospace">Vault Client SDK</text>
  <text x="105" y="238" fill="#e2e8f0" font-size="9" font-family="monospace">Read /var/run/token</text>
  <text x="105" y="249" fill="#e2e8f0" font-size="9" font-family="monospace">Auth &amp; Fetch DB Creds</text>

  <!-- Projected Token Volume -->
  <rect x="80" y="300" width="180" height="110" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
  <text x="95" y="322" fill="#f43f5e" font-size="12" font-weight="600">Projected Volume</text>
  <!-- Token File -->
  <rect x="95" y="335" width="150" height="60" rx="4" fill="#0f172a" stroke="#e11d48" />
  <text x="105" y="355" fill="#fda4af" font-size="10" font-family="monospace">/var/run/token</text>
  <text x="105" y="372" fill="#94a3b8" font-size="9" font-family="monospace">audience: vault</text>
  <text x="105" y="385" fill="#94a3b8" font-size="9" font-family="monospace">validity: 10m-24h</text>

  <!-- Kubernetes API Server Node -->
  <rect x="320" y="120" width="140" height="310" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2" />
  <text x="335" y="145" fill="#34d399" font-size="13" font-weight="700">K8s API Server</text>
  <!-- Token Review endpoint -->
  <rect x="335" y="220" width="110" height="80" rx="6" fill="#1e293b" stroke="#059669" />
  <text x="342" y="245" fill="#10b981" font-size="11" font-weight="600">TokenReview</text>
  <text x="342" y="265" fill="#94a3b8" font-size="9" font-family="monospace">/apis/authentication</text>
  <text x="342" y="280" fill="#94a3b8" font-size="9" font-family="monospace">.k8s.io/v1</text>

  <!-- HashiCorp Vault Node (Outside or Inside, shown here on the right) -->
  <rect x="540" y="120" width="160" height="310" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="2" />
  <text x="555" y="145" fill="#a78bfa" font-size="13" font-weight="700">HashiCorp Vault</text>
  <!-- Kubernetes Auth Method -->
  <rect x="555" y="170" width="130" height="90" rx="6" fill="#1e293b" stroke="#7c3aed" />
  <text x="565" y="192" fill="#a78bfa" font-size="11" font-weight="600">k8s Auth Engine</text>
  <text x="565" y="212" fill="#e2e8f0" font-size="9" font-family="monospace">Role: app-read</text>
  <text x="565" y="227" fill="#e2e8f0" font-size="9" font-family="monospace">TTL: 1 hour</text>
  <text x="565" y="242" fill="#e2e8f0" font-size="9" font-family="monospace">Bound ServiceAccount</text>

  <!-- Database Dynamic Engine -->
  <rect x="555" y="290" width="130" height="120" rx="6" fill="#1e293b" stroke="#7c3aed" />
  <text x="565" y="312" fill="#a78bfa" font-size="11" font-weight="600">DB Secret Engine</text>
  <text x="565" y="332" fill="#e2e8f0" font-size="9" font-family="monospace">Engine: postgresql</text>
  <text x="565" y="347" fill="#e2e8f0" font-size="9" font-family="monospace">Role: web-app-role</text>
  <text x="565" y="362" fill="#e2e8f0" font-size="9" font-family="monospace">TTL: 15 minutes</text>
  <text x="565" y="377" fill="#e2e8f0" font-size="9" font-family="monospace">Generates dynamic</text>
  <text x="565" y="392" fill="#e2e8f0" font-size="9" font-family="monospace">SQL users/passwords</text>

  <!-- Target System Node (Database) -->
  <rect x="750" y="235" width="120" height="120" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
  <text x="762" y="260" fill="#f59e0b" font-size="13" font-weight="700">Target DB</text>
  <text x="762" y="285" fill="#e2e8f0" font-size="11">PostgreSQL</text>
  <!-- Cylinder database logo representation -->
  <path d="M 780 305 C 780 300, 840 300, 840 305 L 840 335 C 840 340, 780 340, 780 335 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <path d="M 780 312 C 780 307, 840 307, 840 312" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <path d="M 780 320 C 780 315, 840 315, 840 320" fill="none" stroke="#f59e0b" stroke-width="1.5" />

  <!-- FLOW LINES AND LABELS -->

  <!-- 1. Volume projection to container -->
  <path d="M 170 300 L 170 282" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" />
  <text x="178" y="293" fill="#f43f5e" font-size="9" font-weight="bold">1. Read JWT</text>

  <!-- 2. App authenticates to Vault -->
  <!-- Curving line from App Container to Vault Auth Engine -->
  <path d="M 245 220 C 350 180, 480 180, 545 210" fill="none" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="360" y="175" fill="#38bdf8" font-size="10" font-weight="bold">2. Auth: JWT Login</text>

  <!-- 3. Vault reviews token with API Server -->
  <path d="M 545 230 L 458 230" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)" />
  <text x="465" y="222" fill="#a78bfa" font-size="9" font-weight="bold">3. Token Review API</text>

  <!-- 4. API Server replies with validation status -->
  <path d="M 458 250 L 545 250" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="465" y="265" fill="#34d399" font-size="9" font-weight="bold">4. Valid (UID/Roles)</text>

  <!-- 5. Vault issues database credentials -->
  <!-- Vault sends DB credentials back to client -->
  <path d="M 540 320 C 440 290, 320 290, 245 255" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)" />
  <text x="320" y="300" fill="#a78bfa" font-size="10" font-weight="bold">5. Send Dynamic DB Credentials</text>

  <!-- 6. App accesses Target Database -->
  <path d="M 230 265 C 330 380, 500 480, 750 320" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-amber)" />
  <text x="410" y="445" fill="#fbbf24" font-size="11" font-weight="bold">6. Access Database (Dynamic SQL User)</text>

  <!-- 7. Vault configures DB or cleans up -->
  <path d="M 700 315 L 742 315" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow)" />
  <text x="702" y="308" fill="#a78bfa" font-size="8">Provision/Revoke</text>
</svg>
