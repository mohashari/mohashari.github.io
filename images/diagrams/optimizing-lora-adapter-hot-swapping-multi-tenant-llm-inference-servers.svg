<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="darkSlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Title / Header -->
  <text x="30" y="35" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">Multi-Tenant LoRA Inference Engine Architecture</text>
  <text x="30" y="55" fill="#64748b" font-size="12">Optimized 3-tier adapter cache and non-blocking CUDA stream hot-swapping</text>

  <!-- Outer boundary for LLM Inference Server -->
  <rect x="230" y="85" width="640" height="445" rx="12" fill="url(#darkSlateGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="245" y="110" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">LLM INFERENCE NODE (S-LoRA / vLLM WORKER)</text>

  <!-- Incoming Requests Section (Tenant Clients) -->
  <g transform="translate(20, 120)">
    <!-- Title -->
    <text x="10" y="-15" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">MULTI-TENANT REQUESTS</text>
    
    <!-- Req 1 -->
    <rect x="0" y="0" width="180" height="50" rx="6" fill="#111827" stroke="#3b82f6" stroke-width="1.5" />
    <text x="12" y="20" fill="#f8fafc" font-size="11" font-weight="600">Tenant A: Request 1</text>
    <text x="12" y="36" fill="#3b82f6" font-size="10" font-family="monospace">adapter_id: lora-marketing-v2</text>
    
    <!-- Req 2 -->
    <rect x="0" y="65" width="180" height="50" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <text x="12" y="85" fill="#f8fafc" font-size="11" font-weight="600">Tenant B: Request 2</text>
    <text x="12" y="101" fill="#10b981" font-size="10" font-family="monospace">adapter_id: lora-finance-r8</text>

    <!-- Req 3 -->
    <rect x="0" y="130" width="180" height="50" rx="6" fill="#111827" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" />
    <text x="12" y="150" fill="#94a3b8" font-size="11" font-weight="600">Tenant A: Request 3</text>
    <text x="12" y="166" fill="#64748b" font-size="10" font-family="monospace">adapter_id: lora-marketing-v2</text>
  </g>

  <!-- Router / Dispatcher / Dynamic Batcher -->
  <g transform="translate(250, 150)">
    <rect x="0" y="0" width="170" height="190" rx="8" fill="url(#slateGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="12" y="25" fill="#f8fafc" font-size="12" font-weight="700">Dynamic Scheduler</text>
    <text x="12" y="40" fill="#94a3b8" font-size="10">Continual Batching Engine</text>

    <!-- Queue representation -->
    <rect x="10" y="60" width="150" height="30" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="18" y="78" fill="#e2e8f0" font-size="9" font-family="monospace">Batch 1: [Req 1, Req 3]</text>

    <rect x="10" y="100" width="150" height="30" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="18" y="118" fill="#e2e8f0" font-size="9" font-family="monospace">Batch 2: [Req 2, Cold Req]</text>
    
    <!-- LRU Registry -->
    <rect x="10" y="140" width="150" height="40" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
    <text x="15" y="154" fill="#c7d2fe" font-size="9" font-weight="600">Adapter Registry (LRU)</text>
    <text x="15" y="168" fill="#818cf8" font-size="8" font-family="monospace">Active Pins: lora-marketing-v2</text>
  </g>

  <!-- Connectors: Requests to Scheduler -->
  <path d="M 200 155 L 225 155 L 225 210 L 250 210" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 200 220 L 250 220" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 200 285 L 225 285 L 225 230 L 250 230" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)" />

  <!-- Host RAM (Pinned memory cache) -->
  <g transform="translate(460, 130)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="url(#slateGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="12" y="22" fill="#f8fafc" font-size="12" font-weight="700">Host RAM Cache</text>
    <text x="12" y="36" fill="#38bdf8" font-size="9" font-weight="600">Unified Pinned Memory</text>

    <!-- Warm Adapters -->
    <rect x="10" y="50" width="160" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="18" y="66" fill="#38bdf8" font-size="9" font-weight="600" font-family="monospace">lora-marketing-v2 (120MB)</text>

    <rect x="10" y="82" width="160" height="26" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
    <text x="18" y="98" fill="#06b6d4" font-size="9" font-weight="600" font-family="monospace">lora-finance-r8 (64MB)</text>

    <rect x="10" y="114" width="160" height="26" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" />
    <text x="18" y="130" fill="#94a3b8" font-size="9" font-family="monospace">lora-support-r16 (240MB)</text>
  </g>

  <!-- Remote Storage / Object Store (MinIO/S3) -->
  <g transform="translate(460, 320)">
    <rect x="0" y="0" width="180" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="12" y="20" fill="#f8fafc" font-size="11" font-weight="700">Cold Adapter Store</text>
    <text x="12" y="34" fill="#64748b" font-size="9">Remote S3 / Disk Registry</text>

    <rect x="10" y="48" width="160" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="18" y="66" fill="#94a3b8" font-size="9" font-family="monospace">S3 Bucket: /adapters/*</text>
  </g>

  <!-- Connectors: Remote to Host RAM -->
  <path d="M 550 320 L 550 280" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <text x="558" y="305" fill="#f97316" font-size="8" font-weight="600">On-demand Fetch (Cold Start)</text>

  <!-- GPU VRAM (Unified Virtual Memory / PyTorch Allocator) -->
  <g transform="translate(680, 130)">
    <rect x="0" y="0" width="170" height="370" rx="8" fill="url(#darkSlateGrad)" stroke="#1e293b" stroke-width="2" />
    
    <!-- GPU Header -->
    <rect x="0" y="0" width="170" height="35" rx="8" fill="#1e293b" />
    <text x="12" y="22" fill="#10b981" font-size="12" font-weight="700">GPU VRAM (H100/A100)</text>

    <!-- Base Model Weight Space (Frozen) -->
    <rect x="10" y="45" width="150" height="120" rx="6" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="90" fill="#f8fafc" font-size="12" font-weight="700">Base Model Space</text>
    <text x="20" y="105" fill="#bfdbfe" font-size="9" font-weight="600">Llama-3-70B (Frozen)</text>
    <text x="20" y="120" fill="#93c5fd" font-size="8" font-family="monospace">Static: ~140 GB (FP8)</text>

    <!-- GPU Active Adapter Slots (Dynamic Cache) -->
    <g transform="translate(10, 175)">
      <rect x="0" y="0" width="150" height="90" rx="6" fill="url(#cyanGrad)" stroke="#06b6d4" stroke-width="1.5" />
      <text x="10" y="18" fill="#f8fafc" font-size="10" font-weight="700">Active Adapter Slots</text>
      <text x="10" y="30" fill="#22d3ee" font-size="8">S-LoRA Unified Page Allocator</text>
      
      <!-- Slot A -->
      <rect x="8" y="38" width="134" height="20" rx="3" fill="#083344" stroke="#0891b2" stroke-width="1" />
      <text x="14" y="51" fill="#22d3ee" font-size="8" font-family="monospace">Slot 0: [lora-marketing-v2]</text>

      <!-- Slot B -->
      <rect x="8" y="62" width="134" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="75" fill="#64748b" font-size="8" font-family="monospace">Slot 1: [Empty / Swapping...]</text>
    </g>

    <!-- KV Cache (PagedAttention) -->
    <g transform="translate(10, 275)">
      <rect x="0" y="0" width="150" height="85" rx="6" fill="url(#emeraldGrad)" stroke="#10b981" stroke-width="1.5" />
      <text x="10" y="18" fill="#f8fafc" font-size="10" font-weight="700">Paged KV Cache</text>
      <text x="10" y="30" fill="#a7f3d0" font-size="8">Dynamic token-level slots</text>

      <rect x="8" y="38" width="134" height="38" rx="3" fill="#064e3b" stroke="#047857" stroke-width="1" />
      <text x="14" y="50" fill="#34d399" font-size="8" font-family="monospace">Token Blocks allocated</text>
      <text x="14" y="62" fill="#a7f3d0" font-size="8" font-family="monospace">for Tenant A &amp; Tenant B</text>
    </g>
  </g>

  <!-- PCIe Bus / CUDA Async Stream Transfer -->
  <!-- Transfer Arrow representing Async Stream -->
  <path d="M 640 180 L 680 180" fill="none" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
  <path d="M 680 230 L 640 230" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <text x="642" y="172" fill="#22d3ee" font-size="8" font-weight="700">Async CUDA Stream</text>
  <text x="642" y="248" fill="#94a3b8" font-size="8" font-weight="500">Eviction / Writeback</text>
  <text x="642" y="200" fill="#38bdf8" font-size="8" font-weight="600" font-family="monospace">PCIe Gen4 x16</text>

  <!-- Scheduler control flows -->
  <path d="M 335 340 L 335 480 L 680 480" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-emerald)" />
  <text x="350" y="475" fill="#10b981" font-size="9" font-weight="600">Batch Dispatch &amp; PagedAttention mapping</text>

  <path d="M 420 220 L 460 220" fill="none" stroke="#f8fafc" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="424" y="212" fill="#f8fafc" font-size="8" font-weight="600">Lookup / Pin</text>

</svg>
