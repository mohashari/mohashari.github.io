<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    
    <!-- Filters for shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#f8fafc" rx="8" />
  
  <!-- Outer Border -->
  <rect x="15" y="15" width="970" height="570" fill="none" stroke="#e2e8f0" stroke-width="2" rx="8" />

  <!-- TITLE HEADER -->
  <text x="40" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Ownership-Defect Correlation Pipeline</text>
  <text x="40" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">A quantitative data flow from VCS metadata and production logs to tactical engineering allocation decisions.</text>

  <!-- ================= STAGE 1: DATA SOURCES ================= -->
  <g transform="translate(40, 120)">
    <!-- Stage Border / Background -->
    <rect width="200" height="420" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="100" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">1. DATA INGESTION</text>
    
    <!-- Git Repository -->
    <g transform="translate(15, 60)">
      <rect width="170" height="85" fill="url(#blueGrad)" rx="6" />
      <text x="85" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Git Logs &amp; Metadata</text>
      <text x="85" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Commit Hash, Author, Lines</text>
      <text x="85" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Changed Files, Timestamps</text>
    </g>

    <!-- Sentry/Jira Defect Log -->
    <g transform="translate(15, 170)">
      <rect width="170" height="85" fill="url(#accentGrad)" rx="6" />
      <text x="85" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Production Defect Logs</text>
      <text x="85" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fecaca" text-anchor="middle">Sentry Issues, Jira Tickets</text>
      <text x="85" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fecaca" text-anchor="middle">Linked Commits &amp; Tags</text>
    </g>

    <!-- Codebase Architecture -->
    <g transform="translate(15, 280)">
      <rect width="170" height="85" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6" />
      <text x="85" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Architecture Context</text>
      <text x="85" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CODEOWNERS rules</text>
      <text x="85" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Module / Subsystem boundaries</text>
    </g>
  </g>

  <!-- Arrows from Stage 1 to Stage 2 -->
  <path d="M 240 205 L 290 205" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 240 315 L 290 315" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 240 425 L 290 425" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= STAGE 2: PROCESSING ENGINE ================= -->
  <g transform="translate(300, 120)">
    <rect width="360" height="420" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="180" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">2. METRICS EXTRACTION &amp; NORMALIZATION</text>

    <!-- Block A: Code Ownership Metrics -->
    <g transform="translate(15, 60)">
      <rect width="330" height="150" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" rx="6" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">A. Ownership Metrics Pipeline</text>
      
      <!-- Shannon Entropy -->
      <rect x="15" y="45" width="300" height="28" fill="#ffffff" stroke="#e2e8f0" rx="4" />
      <text x="25" y="63" font-family="monospace" font-size="11" fill="#0f172a">H(X) = -Σ P(x_i) log2 P(x_i) (Entropy)</text>

      <!-- Ownership Concentration -->
      <rect x="15" y="80" width="300" height="28" fill="#ffffff" stroke="#e2e8f0" rx="4" />
      <text x="25" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">Minor Contributor Ratio (&lt;5% LOC added)</text>
      
      <!-- Gini Index -->
      <rect x="15" y="115" width="300" height="28" fill="#ffffff" stroke="#e2e8f0" rx="4" />
      <text x="25" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">Gini Index of Commit Distribution (Inequality)</text>
    </g>

    <!-- Block B: Defect & Churn Metrics -->
    <g transform="translate(15, 230)">
      <rect width="330" height="160" fill="#f8fafc" stroke="#ef4444" stroke-width="1.5" rx="6" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">B. Defect &amp; Churn Normalization</text>

      <!-- Defect Rate Formula -->
      <rect x="15" y="45" width="300" height="30" fill="#ffffff" stroke="#e2e8f0" rx="4" />
      <text x="25" y="64" font-family="monospace" font-size="10.5" fill="#0f172a">Defect Density = Incident Count / KLOC</text>

      <!-- Churn Volume -->
      <rect x="15" y="85" width="300" height="30" fill="#ffffff" stroke="#e2e8f0" rx="4" />
      <text x="25" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">Code Churn Rate (Lines modified / week)</text>

      <!-- Out-of-hours edits -->
      <rect x="15" y="125" width="300" height="28" fill="#ffffff" stroke="#e2e8f0" rx="4" />
      <text x="25" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">Off-hours Hotfix Volume (Fatigue Index)</text>
    </g>
  </g>

  <!-- Arrows from Stage 2 to Stage 3 -->
  <path d="M 660 330 L 710 330" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= STAGE 3: CORRELATION & ACTION ================= -->
  <g transform="translate(720, 120)">
    <rect width="240" height="420" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="120" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">3. STRATEGIC OUTCOMES</text>

    <!-- Correlation & Statistical Significance -->
    <g transform="translate(15, 60)">
      <rect width="210" height="95" fill="url(#boxGrad)" rx="6" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Correlation Engine</text>
      <text x="15" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#bfdbfe">Spearman ρ: Fragmentation</text>
      <text x="15" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#bfdbfe">vs. Defect Density</text>
      <text x="15" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">Target Threshold: H(X) &lt; 1.5</text>
    </g>

    <!-- Allocation Optimizer -->
    <g transform="translate(15, 175)">
      <rect width="210" height="110" fill="url(#greenGrad)" rx="6" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Engineering Allocation</text>
      <text x="15" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">Re-route headcount to</text>
      <text x="15" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">high-entropy subsystems</text>
      <text x="15" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">Consolidate code owners</text>
      <text x="15" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">Reduce context switching</text>
    </g>

    <!-- Alerting & Guardrails -->
    <g transform="translate(15, 305)">
      <rect width="210" height="95" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#334155">Operational Gates</text>
      <text x="15" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">• Alert on multi-team PRs</text>
      <text x="15" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">• Block core commits from</text>
      <text x="15" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">  non-authorized teams</text>
    </g>
  </g>

  <!-- Marker definition for arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
