<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <text x="400" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Product Quantization (PQ) Workflow</text>
  <text x="400" y="65" text-anchor="middle" fill="#94a3b8" font-size="14">Compressing high-dimensional vector space into discrete centroid indices</text>

  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="700" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="350" y="-15" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600">Original High-Dimensional Vector: D-dimensional f32 (e.g., D = 1024, 4096 Bytes)</text>
    
    <line x1="87.5" y1="0" x2="87.5" y2="50" stroke="#334155" stroke-dasharray="4" />
    <line x1="175" y1="0" x2="175" y2="50" stroke="#38bdf8" stroke-width="2" />
    <line x1="262.5" y1="0" x2="262.5" y2="50" stroke="#334155" stroke-dasharray="4" />
    <line x1="350" y1="0" x2="350" y2="50" stroke="#38bdf8" stroke-width="2" />
    <line x1="437.5" y1="0" x2="437.5" y2="50" stroke="#334155" stroke-dasharray="4" />
    <line x1="525" y1="0" x2="525" y2="50" stroke="#38bdf8" stroke-width="2" />
    <line x1="612.5" y1="0" x2="612.5" y2="50" stroke="#334155" stroke-dasharray="4" />

    <text x="87.5" y="30" text-anchor="middle" fill="#e2e8f0" font-size="12">Sub-vector 1 (d = D/M)</text>
    <text x="262.5" y="30" text-anchor="middle" fill="#e2e8f0" font-size="12">Sub-vector 2 (d = D/M)</text>
    <text x="437.5" y="30" text-anchor="middle" fill="#e2e8f0" font-size="12">Sub-vector 3 (d = D/M)</text>
    <text x="612.5" y="30" text-anchor="middle" fill="#e2e8f0" font-size="12">Sub-vector M (d = D/M)</text>
  </g>

  <path d="M 137.5 150 L 137.5 210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 312.5 150 L 312.5 210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 487.5 150 L 487.5 210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 662.5 150 L 662.5 210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <g transform="translate(50, 220)">
    <rect x="12.5" y="0" width="150" height="100" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="87.5" y="-10" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="600">Codebook 1</text>
    <text x="87.5" y="25" text-anchor="middle" fill="#94a3b8" font-size="11">256 Centroids (f32)</text>
    <rect x="25" y="45" width="125" height="18" rx="3" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
    <text x="87.5" y="58" text-anchor="middle" fill="#e0e7ff" font-size="10">Find Nearest: Index 42</text>
    <text x="87.5" y="85" text-anchor="middle" fill="#64748b" font-size="10">Subspace Dim = d</text>

    <rect x="187.5" y="0" width="150" height="100" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="262.5" y="-10" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="600">Codebook 2</text>
    <text x="262.5" y="25" text-anchor="middle" fill="#94a3b8" font-size="11">256 Centroids (f32)</text>
    <rect x="200" y="45" width="125" height="18" rx="3" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
    <text x="262.5" y="58" text-anchor="middle" fill="#e0e7ff" font-size="10">Find Nearest: Index 189</text>
    <text x="262.5" y="85" text-anchor="middle" fill="#64748b" font-size="10">Subspace Dim = d</text>

    <rect x="362.5" y="0" width="150" height="100" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="437.5" y="-10" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="600">Codebook 3</text>
    <text x="437.5" y="25" text-anchor="middle" fill="#94a3b8" font-size="11">256 Centroids (f32)</text>
    <rect x="375" y="45" width="125" height="18" rx="3" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
    <text x="437.5" y="58" text-anchor="middle" fill="#e0e7ff" font-size="10">Find Nearest: Index 7</text>
    <text x="437.5" y="85" text-anchor="middle" fill="#64748b" font-size="10">Subspace Dim = d</text>

    <rect x="537.5" y="0" width="150" height="100" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="612.5" y="-10" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="600">Codebook M</text>
    <text x="612.5" y="25" text-anchor="middle" fill="#94a3b8" font-size="11">256 Centroids (f32)</text>
    <rect x="550" y="45" width="125" height="18" rx="3" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
    <text x="612.5" y="58" text-anchor="middle" fill="#e0e7ff" font-size="10">Find Nearest: Index 211</text>
    <text x="612.5" y="85" text-anchor="middle" fill="#64748b" font-size="10">Subspace Dim = d</text>
  </g>

  <path d="M 137.5 320 L 137.5 370" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 312.5 320 L 312.5 370" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 487.5 320 L 487.5 370" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 662.5 320 L 662.5 370" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="700" height="40" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#glow)" />
    <text x="350" y="65" text-anchor="middle" fill="#10b981" font-size="13" font-weight="600">Quantized Vector: M-byte array (e.g., M = 8, 8 Bytes) — 512x Compression Ratio!</text>

    <line x1="175" y1="0" x2="175" y2="40" stroke="#10b981" stroke-width="1.5" />
    <line x1="350" y1="0" x2="350" y2="40" stroke="#10b981" stroke-width="1.5" />
    <line x1="525" y1="0" x2="525" y2="40" stroke="#10b981" stroke-width="1.5" />

    <text x="87.5" y="25" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">42</text>
    <text x="262.5" y="25" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">189</text>
    <text x="437.5" y="25" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">7</text>
    <text x="612.5" y="25" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">211</text>
  </g>
</svg>
