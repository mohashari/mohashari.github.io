<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="aws-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa931" />
      <stop offset="100%" stop-color="#e05300" />
    </linearGradient>
    <linearGradient id="k8s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4481eb" />
      <stop offset="100%" stop-color="#04befe" />
    </linearGradient>
    <linearGradient id="vault-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="app-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="volume-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <!-- Glow Filters -->
    <filter id="vault-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-aws" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff9900" />
    </marker>
    <marker id="arrow-vault" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-k8s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#326ce5" />
    </marker>
    <marker id="arrow-app" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Grid pattern for technical touch -->
  <g opacity="0.05">
    <path d="M 0 50 L 1000 50 M 0 100 L 1000 100 M 0 150 L 1000 150 M 0 200 L 1000 200 M 0 250 L 1000 250 M 0 300 L 1000 300 M 0 350 L 1000 350 M 0 400 L 1000 400 M 0 450 L 1000 450 M 0 500 L 1000 500 M 0 550 L 1000 550 M 0 600 L 1000 600 M 0 650 L 1000 650 M 0 700 L 1000 700" stroke="#f8fafc" stroke-width="1" />
    <path d="M 50 0 L 50 780 M 100 0 L 100 780 M 150 0 L 150 780 M 200 0 L 200 780 M 250 0 L 250 780 M 300 0 L 300 780 M 350 0 L 350 780 M 400 0 L 400 780 M 450 0 L 450 780 M 500 0 L 500 780 M 550 0 L 550 780 M 600 0 L 600 780 M 650 0 L 650 780 M 700 0 L 700 780 M 750 0 L 750 780 M 800 0 L 800 780 M 850 0 L 850 780 M 900 0 L 900 780" stroke="#f8fafc" stroke-width="1" />
  </g>

  <!-- Title Section -->
  <text x="35" y="45" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="0.5">Zero-Trust Secret Retrieval: Vault Agent &amp; K8s IRSA</text>
  <text x="35" y="68" fill="#94a3b8" font-size="14">Architecture for dynamic token federation, automated STS signing, and shared memory secret injection</text>

  <!-- Kubernetes Pod Boundary -->
  <g filter="url(#shadow)">
    <rect x="40" y="220" width="920" height="520" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#326ce5" stroke-width="2" stroke-dasharray="8,4" />
    <rect x="40" y="220" width="920" height="40" rx="16" fill="#1e293b" fill-opacity="0.8" />
    <!-- Kubernetes Logo Icon -->
    <path d="M 60 230 L 70 224 L 80 230 L 80 242 L 70 248 L 60 242 Z" fill="#326ce5" />
    <text x="90" y="246" fill="#38bdf8" font-size="13" font-weight="bold">KUBERNETES POD: backend-service-deployment</text>
    <text x="800" y="245" fill="#94a3b8" font-size="11" text-anchor="end">ServiceAccount: backend-svc-sa</text>
  </g>

  <!-- AWS Identity Provider (EKS OIDC) -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="250" height="90" rx="10" fill="#1e293b" stroke="url(#aws-grad)" stroke-width="1.5" />
    <rect width="250" height="30" rx="10" fill="#0f172a" opacity="0.8" />
    <text x="125" y="20" fill="#ffa931" font-size="12" font-weight="bold" text-anchor="middle">AWS IAM OIDC Provider</text>
    <text x="12" y="52" fill="#f8fafc" font-size="11" font-weight="bold">Issuer: oid.eks.region.amazonaws.com</text>
    <text x="12" y="70" fill="#64748b" font-size="10">Trust engine mapping K8s SA to IAM Role</text>
  </g>

  <!-- AWS STS (Security Token Service) -->
  <g transform="translate(320, 100)" filter="url(#shadow)">
    <rect width="260" height="90" rx="10" fill="#1e293b" stroke="url(#aws-grad)" stroke-width="1.5" />
    <rect width="260" height="30" rx="10" fill="#0f172a" opacity="0.8" />
    <text x="130" y="20" fill="#ffa931" font-size="12" font-weight="bold" text-anchor="middle">AWS STS</text>
    <text x="12" y="52" fill="#e2e8f0" font-size="11" font-weight="bold">AssumeRoleWithWebIdentity()</text>
    <text x="12" y="72" fill="#94a3b8" font-size="10">Validates JWT and issues temporary IAM credentials</text>
  </g>

  <!-- HashiCorp Vault Server (External) -->
  <g transform="translate(610, 100)" filter="url(#shadow)">
    <rect width="350" height="90" rx="10" fill="#1b1216" stroke="url(#vault-grad)" stroke-width="2" />
    <rect width="350" height="30" rx="10" fill="#0f172a" opacity="0.8" />
    <text x="175" y="20" fill="#f43f5e" font-size="12" font-weight="bold" text-anchor="middle">HashiCorp Vault Cluster</text>
    <rect x="15" y="45" width="150" height="32" rx="4" fill="#31151a" stroke="#be123c" stroke-width="1" />
    <text x="90" y="65" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="middle">AWS Auth Engine (/auth/aws)</text>
    <rect x="185" y="45" width="150" height="32" rx="4" fill="#1a1e29" stroke="#334155" stroke-width="1" />
    <text x="260" y="65" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">KV Engine (/secret/db-creds)</text>
  </g>

  <!-- Vault Agent Container (Sidecar) -->
  <g transform="translate(60, 280)" filter="url(#shadow)">
    <rect width="340" height="430" rx="12" fill="#0f172a" stroke="url(#vault-grad)" stroke-width="2" />
    <rect width="340" height="40" rx="12" fill="#1e1b1d" />
    <!-- Vault Keyhole Icon -->
    <circle cx="25" cy="20" r="6" fill="#f43f5e" />
    <path d="M 23 20 L 27 20 L 29 28 L 21 28 Z" fill="#f43f5e" />
    <text x="45" y="25" fill="#f43f5e" font-size="13" font-weight="bold">VAULT AGENT SIDECAR</text>
    
    <!-- Vault Agent Modules -->
    <g transform="translate(15, 60)">
      <!-- Module 1: Token Web Identity Reader -->
      <rect width="310" height="70" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-size="11" font-weight="bold">AWS Web Identity Token Watcher</text>
      <text x="12" y="42" fill="#94a3b8" font-size="10">Path: /var/run/secrets/eks.amazonaws.com/token</text>
      <text x="12" y="58" fill="#38bdf8" font-size="9">Watches AWS OIDC JWT for updates/rotation</text>
      <!-- Key Badge -->
      <rect x="260" y="10" width="40" height="15" rx="3" fill="#1e1b1d" />
      <text x="280" y="21" fill="#ffa931" font-size="8" font-weight="bold" text-anchor="middle">JWT</text>
    </g>

    <g transform="translate(15, 150)">
      <!-- Module 2: AWS Caller Signer -->
      <rect width="310" height="75" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-size="11" font-weight="bold">STS Request Signer (GetCallerIdentity)</text>
      <text x="12" y="42" fill="#94a3b8" font-size="10">Action: Asserts role via STS authorization header</text>
      <text x="12" y="60" fill="#ffa931" font-size="9">Signs vault /login request payload with AWS access keys</text>
      <!-- Key Badge -->
      <rect x="250" y="10" width="50" height="15" rx="3" fill="#14532d" />
      <text x="275" y="21" fill="#86efac" font-size="8" font-weight="bold" text-anchor="middle">AWS SDK</text>
    </g>

    <g transform="translate(15, 245)">
      <!-- Module 3: Vault Login Manager -->
      <rect width="310" height="75" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-size="11" font-weight="bold">Vault Auth &amp; Lease Manager</text>
      <text x="12" y="44" fill="#94a3b8" font-size="10">Action: Logs into /auth/aws and manages token lease</text>
      <text x="12" y="62" fill="#a855f7" font-size="9">Handles automated background token renewals</text>
      <!-- Key Badge -->
      <rect x="260" y="10" width="40" height="15" rx="3" fill="#31151a" />
      <text x="280" y="21" fill="#f43f5e" font-size="8" font-weight="bold" text-anchor="middle">LEASE</text>
    </g>

    <g transform="translate(15, 340)">
      <!-- Module 4: Secrets Template Cache -->
      <rect width="310" height="75" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-size="11" font-weight="bold">Dynamic Secrets Renderer (Consul Template)</text>
      <text x="12" y="44" fill="#94a3b8" font-size="10">Action: Renders Vault secrets based on local templates</text>
      <text x="12" y="62" fill="#34d399" font-size="9">Performs non-disruptive hot reloads on updates</text>
      <!-- Key Badge -->
      <rect x="250" y="10" width="50" height="15" rx="3" fill="#172554" />
      <text x="275" y="21" fill="#93c5fd" font-size="8" font-weight="bold" text-anchor="middle">RENDER</text>
    </g>
  </g>

  <!-- Shared Memory Volume (tmpfs) -->
  <g transform="translate(440, 440)" filter="url(#shadow)">
    <!-- Cylinder representation for Volume -->
    <path d="M 10 30 C 10 10, 110 10, 110 30 L 110 120 C 110 140, 10 140, 10 120 Z" fill="url(#volume-grad)" stroke="#64748b" stroke-width="2" />
    <ellipse cx="60" cy="30" rx="50" ry="15" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <!-- Line ridges -->
    <path d="M 10 60 C 10 75, 110 75, 110 60" fill="none" stroke="#475569" stroke-width="1.5" />
    <path d="M 10 90 C 10 105, 110 105, 110 90" fill="none" stroke="#475569" stroke-width="1.5" />
    
    <text x="60" y="68" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">tmpfs</text>
    <text x="60" y="84" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">/vault/secrets</text>
    <text x="60" y="112" fill="#e2e8f0" font-size="9" text-anchor="middle">secrets.json</text>
  </g>

  <!-- Backend App Container -->
  <g transform="translate(600, 280)" filter="url(#shadow)">
    <rect width="340" height="430" rx="12" fill="#0f172a" stroke="url(#app-grad)" stroke-width="2" />
    <rect width="340" height="40" rx="12" fill="#0b1e19" />
    <!-- App Icon (Three boxes) -->
    <rect x="20" y="12" width="10" height="10" rx="2" fill="#10b981" />
    <rect x="25" y="20" width="10" height="10" rx="2" fill="#10b981" />
    <text x="45" y="25" fill="#10b981" font-size="13" font-weight="bold">BACKEND APP CONTAINER</text>

    <!-- App Modules -->
    <g transform="translate(15, 60)">
      <!-- App Process -->
      <rect width="310" height="90" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-size="11" font-weight="bold">Backend Server Engine (Go / Rust / Java)</text>
      <text x="12" y="44" fill="#94a3b8" font-size="10">Application core handling live traffic</text>
      <text x="12" y="62" fill="#64748b" font-size="9">Executes database statements &amp; API requests</text>
      <text x="12" y="78" fill="#34d399" font-size="9">Only communicates with local memory or loopback</text>
    </g>

    <g transform="translate(15, 170)">
      <!-- In-Memory Secret Cache & Watcher -->
      <rect width="310" height="100" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-size="11" font-weight="bold">Configuration Watcher (fsnotify)</text>
      <text x="12" y="44" fill="#94a3b8" font-size="10">Event: File write detected on `/vault/secrets/secrets.json`</text>
      <text x="12" y="64" fill="#34d399" font-size="9">Action: Triggers dynamic config load into memory</text>
      <text x="12" y="82" fill="#34d399" font-size="9">Zero-downtime hot swap of database pools</text>
      <!-- Key Badge -->
      <rect x="250" y="10" width="50" height="15" rx="3" fill="#065f46" />
      <text x="275" y="21" fill="#a7f3d0" font-size="8" font-weight="bold" text-anchor="middle">FSNOTIFY</text>
    </g>

    <g transform="translate(15, 290)">
      <!-- Outbound Target Database -->
      <rect width="310" height="110" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="24" fill="#f8fafc" font-size="11" font-weight="bold">Live Database Connection Pool</text>
      <text x="12" y="44" fill="#94a3b8" font-size="10">Handles DB connection lifecycles</text>
      <text x="12" y="64" fill="#f43f5e" font-size="9">Recovers automatically from DB authentication failures</text>
      <text x="12" y="80" fill="#e2e8f0" font-size="9" font-weight="bold">Active Credentials Lease: 1 Hour (Dynamic)</text>
      <text x="12" y="96" fill="#64748b" font-size="8">Rotation buffer starts 10 minutes before expiry</text>
    </g>
  </g>

  <!-- Connectors / Paths / Arrows with Steps -->
  
  <!-- Step 1: Web identity token projection by EKS Mutating Webhook -->
  <path d="M 120 190 Q 90 240 120 300" fill="none" stroke="#326ce5" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-k8s)" />
  <circle cx="100" cy="235" r="12" fill="#326ce5" />
  <text x="100" y="239" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <text x="120" y="228" fill="#38bdf8" font-size="9" font-weight="bold">OIDC JWT Mounted</text>

  <!-- Step 2: Vault Agent requests temp AWS credentials from STS -->
  <path d="M 230 350 L 330 190" fill="none" stroke="#ffa931" stroke-width="2" marker-end="url(#arrow-aws)" />
  <circle cx="280" cy="270" r="12" fill="#ffa931" />
  <text x="280" y="274" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <text x="295" y="260" fill="#ffa931" font-size="9" font-weight="bold">AssumeRoleWithWebIdentity()</text>

  <!-- Step 3: Vault Agent signs request & requests Vault Login -->
  <path d="M 370 470 L 630 190" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-vault)" />
  <circle cx="510" cy="320" r="12" fill="#f43f5e" />
  <text x="510" y="324" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <text x="525" y="315" fill="#f43f5e" font-size="9" font-weight="bold">Login with STS Signature</text>

  <!-- Step 4: Vault Server validates signature with AWS STS -->
  <path d="M 680 100 L 580 120" fill="none" stroke="#ffa931" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-aws)" />
  <circle cx="630" cy="95" r="10" fill="#ff9900" />
  <text x="630" y="98" fill="#f8fafc" font-size="8" font-weight="bold" text-anchor="middle">4</text>
  <text x="630" y="80" fill="#ffa931" font-size="8" font-weight="bold" text-anchor="middle">Validate STS Request</text>

  <!-- Step 5: Vault Issues Vault Client Token -->
  <path d="M 650 190 L 370 480" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-vault)" />
  <circle cx="490" cy="355" r="12" fill="#f43f5e" />
  <text x="490" y="359" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">5</text>
  <text x="430" y="375" fill="#f43f5e" font-size="9" font-weight="bold">Issue Vault Token</text>

  <!-- Step 6: Vault Agent Fetches Secrets -->
  <path d="M 370 590 Q 520 700 810 190" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-vault)" />
  <circle cx="560" cy="650" r="12" fill="#f43f5e" />
  <text x="560" y="654" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">6</text>
  <text x="580" y="650" fill="#f43f5e" font-size="9" font-weight="bold">Fetch Dynamic Secrets</text>

  <!-- Step 7: Vault Agent writes secrets to Shared memory volume -->
  <path d="M 370 635 Q 480 600 485 550" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-vault)" />
  <circle cx="430" cy="610" r="12" fill="#f43f5e" />
  <text x="430" y="614" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">7</text>
  <text x="440" y="625" fill="#f43f5e" font-size="9" font-weight="bold">Write Plaintext JSON</text>

  <!-- Step 8: App reads secrets and watches for updates -->
  <path d="M 500 440 Q 540 380 605 380" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-app)" />
  <circle cx="550" cy="390" r="12" fill="#10b981" />
  <text x="550" y="394" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">8</text>
  <text x="530" y="365" fill="#34d399" font-size="9" font-weight="bold">Read &amp; fsnotify Watch</text>

</svg>
