<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <!-- Definitions for gradients, filters, markers -->
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="gateway-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="monolith-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="active-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="deprecate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="telemetry-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-deprecate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrow-telemetry" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .node-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-subtext { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .edge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 500; }
    .group-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.05em; text-transform: uppercase; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="8" />
  <rect width="100%" height="100%" fill="none" stroke="#1e293b" stroke-width="2" rx="8" />

  <!-- Diagram Title -->
  <text x="30" y="40" class="title">Data-Driven Deprecation Architecture</text>
  <text x="30" y="60" class="subtitle">Continuous observation, validation, and safe routing for monolith feature deprecation</text>

  <!-- Group: External Ingress & Routing -->
  <rect x="30" y="90" width="220" height="450" fill="none" stroke="#334155" stroke-dasharray="4 4" rx="6" />
  <text x="45" y="115" class="group-label">1. Traffic Control &amp; Routing</text>

  <!-- Ingress -->
  <g transform="translate(50, 140)" filter="url(#shadow)">
    <rect width="180" height="60" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="6" />
    <text x="15" y="25" class="node-text">Edge Ingress / Clients</text>
    <text x="15" y="43" class="node-subtext">Mobile App, Web, Public APIs</text>
  </g>

  <!-- API Gateway / Proxy -->
  <g transform="translate(50, 240)" filter="url(#shadow)">
    <rect width="180" height="80" fill="url(#gateway-grad)" stroke="#2563eb" stroke-width="1.5" rx="6" />
    <text x="15" y="28" class="node-text" fill="#ffffff">Envoy / Kong Gateway</text>
    <text x="15" y="48" class="node-subtext" fill="#bfdbfe">Dynamic Traffic Routing</text>
    <text x="15" y="63" class="node-subtext" fill="#bfdbfe">&amp; Header-based Canary</text>
  </g>
  
  <!-- Dynamic Rules Store -->
  <g transform="translate(50, 360)" filter="url(#shadow)">
    <rect width="180" height="60" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" rx="6" />
    <text x="15" y="25" class="node-text">Feature Flags / Rules</text>
    <text x="15" y="43" class="node-subtext">Unleash / Redis config</text>
  </g>

  <!-- Group: Distributed Monolith Target -->
  <rect x="290" y="90" width="340" height="450" fill="none" stroke="#334155" stroke-dasharray="4 4" rx="6" />
  <text x="305" y="115" class="group-label">2. Monolith Domain (Monolith-Core)</text>

  <!-- Active Domain Service A -->
  <g transform="translate(310, 140)" filter="url(#shadow)">
    <rect width="300" height="70" fill="url(#active-grad)" stroke="#059669" stroke-width="1.5" rx="6" />
    <text x="15" y="28" class="node-text">Modern Microservice / Target</text>
    <text x="15" y="48" class="node-subtext" fill="#a7f3d0">Replaced domain endpoint</text>
    <text x="15" y="60" class="node-subtext" fill="#a7f3d0">v2 REST/gRPC Interface</text>
  </g>

  <!-- Legacy Monolith Block -->
  <g transform="translate(310, 240)" filter="url(#shadow)">
    <rect width="300" height="180" fill="url(#monolith-grad)" stroke="#475569" stroke-width="1.5" rx="6" />
    <!-- Monolith inner label -->
    <rect x="10" y="10" width="280" height="30" fill="#1e293b" rx="4" />
    <text x="20" y="30" class="node-text">Monolith-Core Process</text>
    
    <!-- Active Legacy Modules -->
    <g transform="translate(20, 55)">
      <rect width="260" height="45" fill="#1e293b" stroke="#10b981" stroke-width="1" rx="4" />
      <text x="10" y="20" class="node-text">Active Features (Core)</text>
      <text x="10" y="35" class="node-subtext" fill="#34d399">Stable Code path (v1 endpoints)</text>
    </g>

    <!-- Deprecated Legacy Module -->
    <g transform="translate(20, 115)">
      <rect width="260" height="50" fill="url(#deprecate-grad)" stroke="#ef4444" stroke-width="1" rx="4" />
      <text x="10" y="22" class="node-text">Deprecated Feature Module</text>
      <text x="10" y="38" class="node-subtext" fill="#fca5a5">Target for removal (legacy business logic)</text>
    </g>
  </g>
  
  <!-- DB / Data Store -->
  <g transform="translate(370, 450)" filter="url(#shadow)">
    <rect width="180" height="60" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="6" />
    <text x="15" y="25" class="node-text">Legacy PostgreSQL DB</text>
    <text x="15" y="43" class="node-subtext">Shared Tables Schema</text>
  </g>


  <!-- Group: Observation & Verification Pipeline -->
  <rect x="670" y="90" width="260" height="450" fill="none" stroke="#334155" stroke-dasharray="4 4" rx="6" />
  <text x="685" y="115" class="group-label">3. Data &amp; Verification</text>

  <!-- OpenTelemetry Collector -->
  <g transform="translate(690, 140)" filter="url(#shadow)">
    <rect width="220" height="70" fill="url(#telemetry-grad)" stroke="#7c3aed" stroke-width="1.5" rx="6" />
    <text x="15" y="28" class="node-text">OpenTelemetry Collector</text>
    <text x="15" y="48" class="node-subtext" fill="#ddd6fe">Spans, Metrics &amp; Logs</text>
    <text x="15" y="60" class="node-subtext" fill="#ddd6fe">Tracing route attributes</text>
  </g>

  <!-- Data Warehouse (Athena/ClickHouse) -->
  <g transform="translate(690, 240)" filter="url(#shadow)">
    <rect width="220" height="85" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" rx="6" />
    <text x="15" y="28" class="node-text">Athena / ClickHouse</text>
    <text x="15" y="48" class="node-subtext">Long-term Telemetry Lake</text>
    <text x="15" y="63" class="node-subtext">Trace analysis on calls</text>
    <text x="15" y="76" class="node-subtext">Zero-traffic audit queries</text>
  </g>

  <!-- Shadow / Diff Engine (e.g. Gor or Envoy Tee) -->
  <g transform="translate(690, 350)" filter="url(#shadow)">
    <rect width="220" height="70" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" rx="6" />
    <text x="15" y="28" class="node-text">Shadow &amp; Diff Engine</text>
    <text x="15" y="48" class="node-subtext">Compares response payloads</text>
    <text x="15" y="60" class="node-subtext">Logs drift and anomalies</text>
  </g>

  <!-- Dashboard & Alerting -->
  <g transform="translate(690, 450)" filter="url(#shadow)">
    <rect width="220" height="60" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="6" />
    <text x="15" y="25" class="node-text">Grafana / Alerting</text>
    <text x="15" y="43" class="node-subtext">Deprecation health tracking</text>
  </g>

  <!-- Flow Lines / Connections -->

  <!-- Ingress to Gateway -->
  <path d="M 140 200 L 140 240" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Gateway to rules check -->
  <path d="M 140 320 L 140 360" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <path d="M 140 360 L 140 320" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Gateway routes to Active / Microservice target (Green path) -->
  <path d="M 230 250 L 270 250 L 270 175 L 310 175" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-active)" />
  <text x="235" y="165" class="edge-text" fill="#10b981">99% Traffic</text>

  <!-- Gateway routes to Monolith core process (Active core modules) -->
  <path d="M 230 280 L 310 280" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="240" y="295" class="edge-text">Shared Paths</text>

  <!-- Gateway routes to Deprecated features (Red path, under canary constraint) -->
  <path d="M 230 310 L 270 310 L 270 380 L 310 380" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-deprecate)" />
  <text x="235" y="400" class="edge-text" fill="#f87171">&lt;1% Canary</text>

  <!-- Monolith Database access -->
  <path d="M 460 420 L 460 450" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Active service database access -->
  <path d="M 580 210 L 580 450" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" />

  <!-- OpenTelemetry pushes from Gateway & Monolith -->
  <path d="M 610 175 L 690 175" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-telemetry)" />
  <path d="M 610 310 L 650 310 L 650 195 L 690 195" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-telemetry)" />

  <!-- OTEL to ClickHouse -->
  <path d="M 800 210 L 800 240" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-telemetry)" />

  <!-- Shadow engine teed traffic from Gateway -->
  <path d="M 140 320 C 140 450, 630 460, 690 395" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arrow-telemetry)" />
  <text x="210" y="445" class="edge-text" fill="#a78bfa">Teed Traffic (Shadowing)</text>

  <!-- ClickHouse query to Grafana -->
  <path d="M 800 325 L 800 450" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Shadow engine verification to Clickhouse / Logging -->
  <path d="M 800 350 L 800 325" fill="none" stroke="#94a3b8" stroke-width="1.5" />
</svg>
