<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Defs for filters, gradients, markers -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- runc Box Gradient -->
    <linearGradient id="runcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    
    <!-- gVisor Box Gradient -->
    <linearGradient id="gvisorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Sentry Box Gradient -->
    <linearGradient id="sentryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Gofer Box Gradient -->
    <linearGradient id="goferGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Container/Pod Box Gradient -->
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Markers for Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" rx="12" fill="url(#bgGrad)" />
  
  <!-- Title -->
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">
    Kubernetes Container Runtime Hardening: runc vs. gVisor (runsc) Sandbox Isolation
  </text>
  
  <line x1="30" y1="55" x2="970" y2="55" stroke="#334155" stroke-width="1" />

  <!-- ================= LEFT COLUMN: STANDARD CONTAINER (runc) ================= -->
  <text x="50" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ef4444">
    STANDARD OCI RUNTIME (runc) — Shared Kernel
  </text>
  
  <!-- Container Boundary -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="380" height="310" rx="8" fill="url(#podGrad)" stroke="#ef4444" stroke-width="1.5" />
    <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Pod: web-app-pod</text>
    <text x="15" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Runtime: runc</text>
    
    <!-- Application Box -->
    <g transform="translate(30, 70)">
      <rect width="320" height="80" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f1f5f9">Application Process (mutator)</text>
      <text x="20" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">e.g., Go/NodeJS REST API (PID 12435)</text>
      <text x="20" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444" font-weight="bold">Directly issues syscalls (read, write, socket...)</text>
    </g>
    
    <!-- Linux Namespaces & Cgroups Box -->
    <g transform="translate(30, 190)">
      <rect width="320" height="90" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ef4444">Logical Isolation Layer</text>
      <text x="15" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Namespaces: pid, net, mnt, ipc, uts, user</text>
      <text x="15" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Cgroups v2: memory, cpu limits</text>
      <text x="15" y="75" font-family="system-ui, sans-serif" font-size="9" fill="#fda4af">• Kernel sharing is a single point of failure (RCE to Host Root)</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: GVISOR SANDBOXED (runsc) ================= -->
  <text x="520" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#10b981">
    HARDENED SANDBOX RUNTIME (gVisor/runsc) — Emulated Kernel
  </text>

  <!-- Sandbox Boundary -->
  <g transform="translate(520, 110)" filter="url(#shadow)">
    <rect width="430" height="310" rx="8" fill="url(#podGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Pod: payment-processor-pod</text>
    <text x="15" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Runtime: runsc (gVisor)</text>
    
    <!-- Application Box -->
    <g transform="translate(20, 60)">
      <rect width="180" height="80" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Application Process</text>
      <text x="15" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Untrusted Code / Webhook</text>
      <text x="15" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#10b981" font-weight="bold">Syscalls Intercepted</text>
      <text x="15" y="70" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">via ptrace or KVM</text>
    </g>

    <!-- Sentry Box (User-Space Kernel) -->
    <g transform="translate(20, 180)">
      <rect width="230" height="110" rx="6" fill="url(#sentryGrad)" stroke="#3b82f6" stroke-width="1.5" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Sentry (User-Space Kernel)</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">Written in Go — Emulates 300+ Syscalls</text>
      <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" fill="#bfdbfe">• Implements VFS, Network Stack (Netstack)</text>
      <text x="15" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#bfdbfe">• No raw host syscalls allowed</text>
      <text x="15" y="85" font-family="system-ui, sans-serif" font-size="9" fill="#34d399" font-weight="bold">Translates filesystem tasks to 9P/lisofs</text>
      <text x="15" y="97" font-family="system-ui, sans-serif" font-size="8" fill="#93c5fd">Communicates with Gofer over UDS</text>
    </g>

    <!-- Gofer Box (FS Proxy) -->
    <g transform="translate(280, 180)">
      <rect width="130" height="110" rx="6" fill="url(#goferGrad)" stroke="#f59e0b" stroke-width="1.5" />
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Gofer (FS Proxy)</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#fde047">Filesystem Daemon</text>
      <text x="12" y="55" font-family="system-ui, sans-serif" font-size="9" fill="#fef08a">• Mediates all file ops</text>
      <text x="12" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#fef08a">• Sandboxed via chroot</text>
      <text x="12" y="81" font-family="system-ui, sans-serif" font-size="9" fill="#fef08a">• Strict drop privileges</text>
      <text x="12" y="97" font-family="system-ui, sans-serif" font-size="8" fill="#fbcfe8">Only opens permitted files</text>
    </g>

    <!-- Arrow between Application and Sentry (Syscalls) -->
    <path d="M 110 140 L 110 172" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)" />
    <text x="115" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#60a5fa">Syscalls</text>

    <!-- Arrow between Sentry and Gofer (9P protocol) -->
    <path d="M 250 220 L 272 220" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="261" y="212" font-family="system-ui, sans-serif" font-size="8" fill="#f59e0b" text-anchor="middle">9P / lisofs</text>
  </g>

  <!-- ================= HOST OS / KERNEL LAYER ================= -->
  <g transform="translate(50, 460)" filter="url(#shadow)">
    <rect width="900" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect width="900" height="30" rx="8" fill="#334155" />
    <text x="20" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Host OS Kernel &amp; Hardware Layer (Shared Host Kernel)</text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Linux Kernel (e.g., 6.1+), cgroups v2, namespaces, seccomp filters</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Physical Hardware (Bare Metal / VM Instances)</text>

    <!-- File System Box on Host -->
    <g transform="translate(740, 40)">
      <rect width="140" height="55" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#cbd5e1">Host Filesystem</text>
      <text x="10" y="35" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">/var/lib/kubelet/pods...</text>
      <text x="10" y="47" font-family="system-ui, sans-serif" font-size="8" fill="#ef4444">Vulnerable if raw write</text>
    </g>
  </g>

  <!-- ================= CONNECTIONS TO HOST KERNEL ================= -->
  
  <!-- Left Side: runc syscall connection (Dangerous) -->
  <path d="M 230 420 L 230 452" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)" />
  <text x="240" y="440" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5">Raw Syscalls (300+ vectors)</text>

  <!-- Right Side: Sentry syscall connection (Hardened) -->
  <path d="M 650 420 L 650 452" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="660" y="440" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#86efac">Restricted Host Syscalls (~70 vectors)</text>

  <!-- Right Side: Gofer FS access connection -->
  <path d="M 860 420 L 860 452" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="870" y="440" font-family="system-ui, sans-serif" font-size="9" fill="#fde047">Strict FS Access</text>

  <!-- Legend / Safety Boundary Indicator -->
  <line x1="480" y1="70" x2="480" y2="445" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="480" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" transform="rotate(-90 480 250)">SANDBOX SECURITY BOUNDARY</text>

</svg>
