<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" style="background:#0f172a; font-family:'Inter', system-ui, sans-serif;">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="brokerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="dynamicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="staticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.18"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#10b981" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="50" y="45" fill="#f8fafc" font-size="22" font-weight="700">Kafka Consumer Membership: Dynamic vs. Static</text>
  <text x="50" y="70" fill="#94a3b8" font-size="14">Failure and deployment recovery behavior in high-throughput clusters</text>

  <!-- Kafka Broker (Group Coordinator) -->
  <g transform="translate(425, 100)">
    <rect width="250" height="90" rx="8" fill="url(#brokerGrad)" stroke="#475569" stroke-width="2"/>
    <text x="125" y="32" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="middle">Kafka Broker</text>
    <text x="125" y="52" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Group Coordinator</text>
    <rect x="25" y="63" width="200" height="18" rx="3" fill="#0f172a"/>
    <text x="125" y="75" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">Epoch: 42 | Schema: v2</text>
  </g>

  <!-- LEFT COLUMN: Dynamic Membership (Rebalance Storm) -->
  <g transform="translate(50, 230)">
    <!-- Boundary Box -->
    <rect width="470" height="350" rx="10" fill="url(#dynamicGrad)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="20" y="30" fill="#f8fafc" font-size="16" font-weight="700">Dynamic Membership (Default)</text>
    <text x="20" y="50" fill="#ef4444" font-size="12" font-weight="600">Triggers Rebalances on Pod Restarts</text>

    <!-- State 1: Pod Restarting / Dying -->
    <g transform="translate(20, 80)">
      <rect width="200" height="75" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="15" y="25" fill="#f8fafc" font-size="13" font-weight="600">Consumer Pod 1</text>
      <text x="15" y="45" fill="#94a3b8" font-size="11">Ephemeral ID: consumer-1-uuid</text>
      <text x="15" y="62" fill="#ef4444" font-size="10" font-weight="600">Action: Restarting / Pod Terminated</text>
    </g>

    <!-- State 2: Broker detects loss -->
    <g transform="translate(250, 80)">
      <rect width="200" height="75" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="15" y="25" fill="#f8fafc" font-size="13" font-weight="600">Broker Detects Loss</text>
      <text x="15" y="45" fill="#f59e0b" font-size="11">No Heartbeat / LeaveGroup received</text>
      <text x="15" y="62" fill="#f59e0b" font-size="10" font-weight="600">Triggers Immediate Rebalance 1</text>
    </g>

    <!-- State 3: Rebalance storm -->
    <g transform="translate(20, 220)">
      <rect width="430" height="110" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
      <text x="15" y="25" fill="#ef4444" font-size="14" font-weight="700">REBALANCE STORM (Cascading Failures)</text>
      <text x="15" y="48" fill="#e2e8f0" font-size="11.5">1. Pod 1 recovers, joins with NEW Ephemeral ID</text>
      <text x="15" y="68" fill="#e2e8f0" font-size="11.5">2. Broker triggers Rebalance 2 to reassign partitions</text>
      <text x="15" y="88" fill="#f87171" font-size="11.5" font-weight="600">All other consumers stop polling, lag spikes, CPU spikes!</text>
    </g>

    <!-- Arrow between states -->
    <path d="M 220 117 L 244 117" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
    <path d="M 350 155 L 350 190 L 235 190 L 235 220" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
  </g>

  <!-- RIGHT COLUMN: Static Membership (Optimal) -->
  <g transform="translate(580, 230)">
    <!-- Boundary Box -->
    <rect width="470" height="350" rx="10" fill="url(#staticGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f8fafc" font-size="16" font-weight="700">Static Membership</text>
    <text x="20" y="50" fill="#10b981" font-size="12" font-weight="600">Configured with group.instance.id</text>

    <!-- State 1: Pod Restarting -->
    <g transform="translate(20, 80)">
      <rect width="200" height="75" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="25" fill="#f8fafc" font-size="13" font-weight="600">Consumer Pod 1</text>
      <text x="15" y="45" fill="#34d399" font-size="11">Static ID: group.instance.id=pod-1</text>
      <text x="15" y="62" fill="#f59e0b" font-size="10" font-weight="600">Action: Pod Restarts (rolling update)</text>
    </g>

    <!-- State 2: Broker holds state -->
    <g transform="translate(250, 80)">
      <rect width="200" height="75" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="15" y="25" fill="#f8fafc" font-size="13" font-weight="600">Broker Holds Session</text>
      <text x="15" y="45" fill="#60a5fa" font-size="11">Waits up to session.timeout.ms</text>
      <text x="15" y="62" fill="#10b981" font-size="10" font-weight="600">NO Rebalance Triggered</text>
    </g>

    <!-- State 3: Re-joins cleanly -->
    <g transform="translate(20, 220)">
      <rect width="430" height="110" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="15" y="25" fill="#10b981" font-size="14" font-weight="700">CLEAN RECOVERY (Zero Rebalances)</text>
      <text x="15" y="48" fill="#e2e8f0" font-size="11.5">1. Pod 1 restarts, joins with SAME Static ID: pod-1</text>
      <text x="15" y="68" fill="#e2e8f0" font-size="11.5">2. Broker recognizes static member, skips JoinGroup phase</text>
      <text x="15" y="88" fill="#34d399" font-size="11.5" font-weight="600">Partitions remain assigned to pod-1. Rest of group unaffected!</text>
    </g>

    <!-- Arrow between states -->
    <path d="M 220 117 L 244 117" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
    <path d="M 350 155 L 350 190 L 235 190 L 235 220" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
  </g>

  <!-- Connectors from Broker to Columns -->
  <!-- Left path -->
  <path d="M 425 145 L 285 145 L 285 230" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <!-- Right path -->
  <path d="M 675 145 L 815 145 L 815 230" stroke="#10b981" stroke-width="1.5" fill="none"/>
</svg>
