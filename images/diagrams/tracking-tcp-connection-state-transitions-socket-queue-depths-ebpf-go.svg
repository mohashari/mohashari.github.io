<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00add8"/>
      <stop offset="100%" stop-color="#007d9c"/>
    </linearGradient>
    <linearGradient id="ebpfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e47"/>
      <stop offset="100%" stop-color="#e0531b"/>
    </linearGradient>
    <linearGradient id="queueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7e47"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00add8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0b0f19"/>

  <!-- Grid lines for subtle tech theme -->
  <g opacity="0.05">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450 M 0,500 L 800,500 M 0,550 L 800,550" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Space Boundary Line -->
  <line x1="50" y1="280" x2="750" y2="280" stroke="#475569" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="270" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">USER SPACE</text>
  <text x="60" y="305" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">KERNEL SPACE</text>

  <!-- ================= USER SPACE ================= -->
  <!-- Go Application Container -->
  <rect x="180" y="50" width="440" height="180" rx="8" fill="url(#userGrad)" stroke="#334155" stroke-width="2" filter="url(#dropShadow)"/>
  <text x="200" y="75" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Go Observability Agent (Go 1.22+)</text>
  
  <!-- cilium/ebpf library -->
  <rect x="200" y="100" width="160" height="50" rx="6" fill="#1e293b" stroke="#00add8" stroke-width="1.5"/>
  <text x="280" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">cilium/ebpf Loader</text>
  <text x="280" y="140" fill="#00add8" font-family="monospace" font-size="10" text-anchor="middle">elf.LoadAndAssign()</text>

  <!-- Ring Buffer Consumer -->
  <rect x="420" y="100" width="180" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="510" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ring Buffer Consumer</text>
  <text x="510" y="140" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">ringbuf.Reader.Read()</text>

  <!-- Prometheus Metrics / Output -->
  <rect x="310" y="170" width="180" height="40" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
  <text x="400" y="195" fill="#f97316" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Prometheus / OpenTelemetry</text>

  <!-- ================= KERNEL SPACE ================= -->
  <!-- TCP Subsystem Block -->
  <rect x="80" y="340" width="300" height="210" rx="8" fill="url(#kernelGrad)" stroke="#1e293b" stroke-width="2" filter="url(#dropShadow)"/>
  <text x="100" y="365" fill="#f3f4f6" font-family="sans-serif" font-size="14" font-weight="bold">Linux TCP/IP Stack</text>

  <!-- Socket Struct representations -->
  <rect x="100" y="385" width="260" height="145" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="110" y="405" fill="#9ca3af" font-family="monospace" font-size="11">struct sock *sk</text>
  
  <!-- Queues inside socket -->
  <g transform="translate(110, 415)">
    <!-- Recv Queue -->
    <rect x="0" y="10" width="220" height="35" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1"/>
    <text x="10" y="25" fill="#38bdf8" font-family="monospace" font-size="10">sk-&gt;sk_receive_queue</text>
    <!-- Packet elements in queue -->
    <rect x="140" y="17" width="20" height="20" rx="2" fill="url(#queueGrad)" opacity="0.8"/>
    <rect x="165" y="17" width="20" height="20" rx="2" fill="url(#queueGrad)" opacity="0.5"/>
    <rect x="190" y="17" width="20" height="20" rx="2" fill="url(#queueGrad)" opacity="0.2"/>
    <text x="145" y="30" fill="#fff" font-family="sans-serif" font-size="8">skb</text>
  </g>

  <g transform="translate(110, 475)">
    <!-- Write Queue -->
    <rect x="0" y="0" width="220" height="35" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1"/>
    <text x="10" y="15" fill="#f87171" font-family="monospace" font-size="10">sk-&gt;sk_write_queue</text>
    <!-- Packet elements in queue -->
    <rect x="140" y="7" width="20" height="20" rx="2" fill="#ef4444" opacity="0.8"/>
    <rect x="165" y="7" width="20" height="20" rx="2" fill="#ef4444" opacity="0.5"/>
    <text x="145" y="20" fill="#fff" font-family="sans-serif" font-size="8">skb</text>
  </g>

  <!-- eBPF Subsystem Block -->
  <rect x="460" y="340" width="260" height="210" rx="8" fill="url(#kernelGrad)" stroke="#ff7e47" stroke-width="1.5" stroke-opacity="0.5" filter="url(#dropShadow)"/>
  <text x="480" y="365" fill="#ff7e47" font-family="sans-serif" font-size="14" font-weight="bold">eBPF Programs (bpf2go)</text>

  <!-- BPF Programs -->
  <g transform="translate(480, 385)">
    <!-- kprobe/tcp_set_state -->
    <rect x="0" y="0" width="220" height="35" rx="4" fill="#1e293b" stroke="#ff7e47" stroke-width="1"/>
    <text x="10" y="20" fill="#e2e8f0" font-family="monospace" font-size="10" font-weight="bold">fentry/tcp_set_state</text>
    <text x="10" y="30" fill="#94a3b8" font-family="sans-serif" font-size="8">State Transitions &amp; Queue Depths</text>
  </g>

  <!-- BPF Maps / Ringbuf -->
  <g transform="translate(480, 440)">
    <!-- Ring Buffer -->
    <rect x="0" y="0" width="220" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="10" y="20" fill="#e2e8f0" font-family="monospace" font-size="10" font-weight="bold">BPF_MAP_TYPE_RINGBUF</text>
    <text x="10" y="32" fill="#94a3b8" font-family="sans-serif" font-size="8">struct tcp_event_t</text>
  </g>

  <!-- CO-RE Maps / Helpers -->
  <g transform="translate(480, 500)">
    <rect x="0" y="0" width="220" height="35" rx="4" fill="#1e293b" stroke="#00add8" stroke-width="1"/>
    <text x="10" y="16" fill="#e2e8f0" font-family="monospace" font-size="9" font-weight="bold">BPF_CORE_READ() helper</text>
    <text x="10" y="28" fill="#94a3b8" font-family="sans-serif" font-size="8">Reads kernel structs safely across kernel versions</text>
  </g>

  <!-- ================= INTERACTIONS / FLOWS ================= -->
  <!-- 1. Kernel Hooking -->
  <path d="M 380,410 C 420,410 420,400 460,400" stroke="#ff7e47" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="420" y="395" fill="#ff7e47" font-family="sans-serif" font-size="9" text-anchor="middle">Hooks state changes</text>

  <!-- 2. BPF Reading TCP Queues -->
  <path d="M 480,415 C 440,430 420,430 380,440" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="430" y="445" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle">Reads Queue size</text>

  <!-- 3. Event Submission to Ringbuf -->
  <path d="M 590,420 L 590,440" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="433" fill="#10b981" font-family="monospace" font-size="8">bpf_ringbuf_output()</text>

  <!-- 4. Ring Buffer consumption by Go -->
  <path d="M 590,440 C 620,380 620,200 520,152" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrow)"/>
  <text x="625" y="270" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ringbuf stream</text>

  <!-- 5. Go loader injecting BPF programs -->
  <path d="M 280,150 C 280,240 450,250 490,340" stroke="#00add8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="350" y="260" fill="#00add8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Loads &amp; Attaches BPF</text>

  <!-- 6. Go pushing metrics to Prom -->
  <path d="M 450,150 L 415,170" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 330,150 L 375,170" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

</svg>
