<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="kafka-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="processor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rocksdb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0.05" />
    </linearGradient>

    <!-- Component Borders -->
    <linearGradient id="border-kafka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="border-rocksdb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="border-processor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="url(#bg-grad)" rx="12" />
  
  <!-- Outer Title / Header -->
  <text x="30" y="45" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    ROCKSDB STATE STORE ARCHITECTURE IN KAFKA STREAM PROCESSING
  </text>
  <text x="30" y="65" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    High-Throughput State Management with Local SSD Storage and Remote Log-Compacted Changelog
  </text>

  <!-- ================= LEFT: KAFKA INPUT TOPIC ================= -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <!-- Boundary -->
    <rect width="180" height="380" rx="10" fill="url(#kafka-grad)" stroke="url(#border-kafka)" stroke-width="1.5" />
    <text x="90" y="30" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">KAFKA CLUSTER</text>
    <text x="90" y="48" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748b">Ingress Topic (events)</text>

    <!-- Partitions -->
    <g transform="translate(15, 75)">
      <!-- Partition 0 -->
      <rect width="150" height="75" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="25" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Partition 0</text>
      <!-- Message slots -->
      <rect x="12" y="38" width="35" height="24" rx="3" fill="#0284c7" opacity="0.8" />
      <rect x="52" y="38" width="35" height="24" rx="3" fill="#0284c7" opacity="0.6" />
      <rect x="92" y="38" width="45" height="24" rx="3" fill="#0284c7" opacity="0.3" />
      <text x="30" y="54" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">msg_3</text>
      <text x="70" y="54" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">msg_2</text>
      <text x="115" y="54" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">msg_1</text>
    </g>

    <g transform="translate(15, 165)">
      <!-- Partition 1 -->
      <rect width="150" height="75" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="25" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Partition 1</text>
      <rect x="12" y="38" width="35" height="24" rx="3" fill="#0284c7" opacity="0.8" />
      <rect x="52" y="38" width="35" height="24" rx="3" fill="#0284c7" opacity="0.6" />
      <rect x="92" y="38" width="45" height="24" rx="3" fill="#0284c7" opacity="0.3" />
      <text x="30" y="54" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">msg_6</text>
      <text x="70" y="54" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">msg_5</text>
      <text x="115" y="54" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">msg_4</text>
    </g>

    <!-- Changelog Topic -->
    <g transform="translate(15, 265)">
      <rect width="150" height="90" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-dasharray="4 3" stroke-width="1.5" />
      <text x="12" y="22" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8">Changelog Topic</text>
      <text x="12" y="36" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#64748b">Log-Compacted Backup</text>
      <!-- Log items -->
      <rect x="12" y="50" width="126" height="14" rx="2" fill="#312e81" stroke="#4f46e5" stroke-width="0.5" />
      <text x="18" y="61" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#c7d2fe">K: user_123 | V: txn_988</text>
      <rect x="12" y="68" width="126" height="14" rx="2" fill="#312e81" stroke="#4f46e5" stroke-width="0.5" />
      <text x="18" y="79" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#c7d2fe">K: user_456 | V: txn_989</text>
    </g>
  </g>

  <!-- ================= MIDDLE: APPLICATION NODE ================= -->
  <g transform="translate(290, 110)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="570" height="380" rx="10" fill="url(#processor-grad)" stroke="url(#border-processor)" stroke-width="2" />
    <text x="20" y="30" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f43f5e" letter-spacing="1">STREAM PROCESSING CONTAINER</text>
    <text x="20" y="48" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">JVM / Go Worker Node (Stateful Processor)</text>

    <!-- Consumer Logic Engine -->
    <g transform="translate(20, 75)">
      <rect width="180" height="280" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5" />
      <text x="90" y="25" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f3f4f6">Consumer Threads</text>
      
      <!-- Thread 1 -->
      <g transform="translate(15, 45)">
        <rect width="150" height="60" rx="4" fill="#1f2937" stroke="#fb7185" stroke-width="1" />
        <circle cx="20" cy="30" r="6" fill="#f43f5e" />
        <text x="35" y="28" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f9fafb">Thread #0</text>
        <text x="35" y="44" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#9ca3af">Poll &amp; Hydrate State</text>
      </g>

      <!-- Thread 2 -->
      <g transform="translate(15, 115)">
        <rect width="150" height="60" rx="4" fill="#1f2937" stroke="#fb7185" stroke-width="1" />
        <circle cx="20" cy="30" r="6" fill="#f43f5e" />
        <text x="35" y="28" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f9fafb">Thread #1</text>
        <text x="35" y="44" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#9ca3af">Process &amp; Join</text>
      </g>

      <!-- Thread 3 (Restore / Init) -->
      <g transform="translate(15, 185)">
        <rect width="150" height="75" rx="4" fill="#111827" stroke="#f43f5e" stroke-dasharray="3 3" stroke-width="1" />
        <text x="15" y="22" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#f43f5e">State Store Manager</text>
        <text x="15" y="38" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#9ca3af">• Async Commit Log</text>
        <text x="15" y="52" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#9ca3af">• Failover Standby Sync</text>
      </g>
    </g>

    <!-- Embedded RocksDB Instance -->
    <g transform="translate(230, 75)">
      <rect width="320" height="280" rx="8" fill="url(#rocksdb-grad)" stroke="url(#border-rocksdb)" stroke-width="1.5" />
      <text x="15" y="25" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="800" fill="#818cf8" letter-spacing="1">LOCAL EMBEDDED ROCKSDB</text>
      <text x="15" y="40" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#64748b">Persistent LSM-Tree Storage Engine</text>

      <!-- Memory Layer (Fast) -->
      <g transform="translate(15, 55)">
        <rect width="290" height="85" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
        <text x="12" y="20" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">RAM Layer (volatile)</text>
        
        <!-- MemTable -->
        <g transform="translate(12, 30)">
          <rect width="125" height="42" rx="4" fill="#312e81" stroke="#818cf8" stroke-width="0.5" />
          <text x="10" y="18" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">MemTable</text>
          <text x="10" y="32" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#94a3b8">Active SkipList (Write)</text>
        </g>
        
        <!-- Block Cache -->
        <g transform="translate(153, 30)">
          <rect width="125" height="42" rx="4" fill="#312e81" stroke="#818cf8" stroke-width="0.5" />
          <text x="10" y="18" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Block Cache</text>
          <text x="10" y="32" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#94a3b8">Uncompressed Read Cache</text>
        </g>
      </g>

      <!-- Disk Layer (Persistent SSD) -->
      <g transform="translate(15, 155)">
        <rect width="290" height="110" rx="6" fill="#0f172a" stroke="#312e81" stroke-width="1.5" />
        <text x="12" y="18" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Local NVMe Disk Layer</text>

        <!-- Write-Ahead Log (WAL) -->
        <rect x="12" y="28" width="266" height="24" rx="3" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.6" stroke-width="1" />
        <text x="22" y="43" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#f87171">Write-Ahead Log (WAL) — Sequential Disk Writes</text>

        <!-- SST files -->
        <g transform="translate(12, 60)">
          <!-- L0 -->
          <rect width="78" height="38" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
          <text x="8" y="16" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">SST Level 0</text>
          <text x="8" y="28" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#64748b">(Overlapping)</text>
          
          <!-- L1 -->
          <rect x="88" width="78" height="38" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
          <text x="96" y="16" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">SST Level 1</text>
          <text x="96" y="28" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#64748b">(Merged/Sorted)</text>
          
          <!-- L2 -->
          <rect x="176" width="90" height="38" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
          <text x="184" y="16" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">SST Level 2+</text>
          <text x="184" y="28" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#64748b">(Compressed/Snappy)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= ARROWS / FLOW LINES ================= -->
  <!-- 1. Consume: Kafka Ingress to Processor -->
  <path d="M 220 220 L 295 220" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-blue)" />
  <text x="257" y="208" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">1. Consume</text>

  <!-- 2. Write to local state: Processor to RocksDB MemTable & WAL -->
  <path d="M 490 220 L 515 220 L 515 160 L 532 160" fill="none" stroke="#e0f2fe" stroke-width="2" marker-end="url(#arrow-white)" />
  <path d="M 515 200 L 532 200" fill="none" stroke="#e0f2fe" stroke-width="2" marker-end="url(#arrow-white)" />
  <text x="495" y="125" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#e0f2fe">2. Put (Key, Val)</text>

  <!-- 3. Flush MemTable to SST -->
  <path d="M 600 135 L 600 210" fill="none" stroke="#818cf8" stroke-dasharray="4 2" stroke-width="1.5" marker-end="url(#arrow-indigo)" />
  <text x="608" y="175" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#a5b4fc">3. Flush</text>

  <!-- 4. Changelog Async replication: RocksDB to Changelog Topic -->
  <!-- We go from local rocksdb / state manager back to Kafka Changelog -->
  <path d="M 500 338 L 470 338 L 470 410 L 205 410" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrow-indigo)" />
  <text x="350" y="402" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#818cf8">4. Replicate / Changelog Commit</text>

  <!-- 5. Standby Restoration (Failover path) -->
  <!-- From Changelog to State Store Manager during recovery -->
  <path d="M 120 370 L 120 460 L 375 460 L 375 355" fill="none" stroke="#fb7185" stroke-dasharray="3 3" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <text x="240" y="452" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#fb7185">5. Restore state on pod failover</text>

  <!-- Markers for Arrows -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#e0f2fe" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#818cf8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
  </defs>
</svg>
