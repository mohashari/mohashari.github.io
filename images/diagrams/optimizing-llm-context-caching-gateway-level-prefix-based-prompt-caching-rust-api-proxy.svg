<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4"/>
    </marker>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.3">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450" />
    <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" />
  </g>

  <!-- Title -->
  <text x="30" y="35" fill="#f8fafc" font-size="16" font-weight="bold" letter-spacing="0.5">PREFIX-BASED PROMPT CACHING PROXY ARCHITECTURE</text>

  <!-- 1. Client App -->
  <g transform="translate(40, 180)">
    <rect width="130" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="65" y="30" fill="#f1f5f9" font-size="14" font-weight="bold" text-anchor="middle">Client App</text>
    <text x="65" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">Backend / Agent</text>
    <!-- Inner client icon -->
    <rect x="15" y="80" width="100" height="80" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="100" fill="#38bdf8" font-size="10" font-family="monospace">POST /chat</text>
    <text x="25" y="118" fill="#64748b" font-size="9" font-family="monospace">{ system: "...",</text>
    <text x="25" y="130" fill="#64748b" font-size="9" font-family="monospace">  messages: [...] }</text>
  </g>

  <!-- 2. Rust API Proxy Gateway -->
  <g transform="translate(240, 100)">
    <!-- Main Outer Container -->
    <rect width="320" height="340" rx="12" fill="url(#gatewayGrad)" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <text x="160" y="25" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="0.5">RUST API PROXY GATEWAY</text>
    <text x="160" y="40" fill="#38bdf8" font-size="10" text-anchor="middle" font-weight="600">Axum + Hyper Engine</text>

    <!-- Component A: Request Normalizer & Tokenizer -->
    <g transform="translate(20, 60)">
      <rect width="280" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="15" y="25" fill="#f1f5f9" font-size="12" font-weight="bold">1. Payload Parser &amp; Normalizer</text>
      <text x="15" y="42" fill="#94a3b8" font-size="10">Strips whitespace, structures tool schemas</text>
      <text x="15" y="55" fill="#a78bfa" font-size="10" font-family="monospace">Hash: SHA-256(normalized_prefix)</text>
    </g>

    <!-- Component B: Cache Decision Engine -->
    <g transform="translate(20, 150)">
      <rect width="280" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="15" y="25" fill="#f1f5f9" font-size="12" font-weight="bold">2. Cache Decision Engine</text>
      <text x="15" y="42" fill="#94a3b8" font-size="10">Determines if prefix size &gt;= 1024 tokens</text>
      <text x="15" y="55" fill="#2dd4bf" font-size="10">Checks Redis prefix tree / TTL counters</text>
    </g>

    <!-- Component C: Dynamic Prompt Modifier -->
    <g transform="translate(20, 240)">
      <rect width="280" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="15" y="25" fill="#f1f5f9" font-size="12" font-weight="bold">3. Cache Control Injector</text>
      <text x="15" y="42" fill="#94a3b8" font-size="10">Modifies outgoing JSON to LLM Provider</text>
      <text x="15" y="55" fill="#f43f5e" font-size="9" font-family="monospace">Injects {"type": "ephemeral"} on match</text>
    </g>
  </g>

  <!-- Redis External cache storage -->
  <g transform="translate(330, 15)">
    <rect width="140" height="50" rx="6" fill="#1e293b" stroke="#ef4444" stroke-dasharray="3 3" stroke-width="1.5"/>
    <text x="70" y="22" fill="#f1f5f9" font-size="11" font-weight="bold" text-anchor="middle">Redis Cluster</text>
    <text x="70" y="38" fill="#94a3b8" font-size="10" text-anchor="middle">Prefix usage tracking</text>
  </g>

  <!-- 3. LLM Provider API -->
  <g transform="translate(630, 180)">
    <rect width="130" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="65" y="30" fill="#f1f5f9" font-size="14" font-weight="bold" text-anchor="middle">LLM Provider</text>
    <text x="65" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">e.g. Anthropic</text>

    <!-- Internal Caching layer -->
    <g transform="translate(10, 70)">
      <rect width="110" height="40" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="55" y="24" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">Prompt Cache</text>
    </g>

    <!-- LLM Processing -->
    <g transform="translate(10, 125)">
      <rect width="110" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="55" y="20" fill="#f1f5f9" font-size="10" text-anchor="middle">LLM GPU Engine</text>
      <text x="55" y="34" fill="#64748b" font-size="9" text-anchor="middle">Prefill / Decode</text>
    </g>
  </g>

  <!-- Connections & Flows -->
  <!-- Client to Gateway -->
  <path d="M 170,230 L 232,230" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="200" y="218" fill="#06b6d4" font-size="10" text-anchor="middle" font-weight="bold">POST</text>

  <!-- Gateway components flow -->
  <!-- Component 1 to 2 -->
  <path d="M 380,130 L 380,142" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Component 2 to 3 -->
  <path d="M 380,220 L 380,232" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gateway to Redis -->
  <path d="M 400,100 L 400,72" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M 370,65 L 370,100" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Gateway to LLM Provider -->
  <path d="M 560,270 L 622,270" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="591" y="258" fill="#a78bfa" font-size="9" text-anchor="middle" font-weight="bold">Modified POST</text>

  <!-- Response flow (bottom) -->
  <path d="M 630,330 L 178,330" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-active)"/>
  <text x="400" y="322" fill="#10b981" font-size="10" text-anchor="middle" font-weight="bold">Streaming Server-Sent Events (SSE) / JSON Response</text>
</svg>
