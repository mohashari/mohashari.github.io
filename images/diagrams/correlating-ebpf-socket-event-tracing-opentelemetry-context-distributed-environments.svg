<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Definitions for gradients, markers, and patterns -->
  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3" />
    </pattern>

    <!-- Glowing gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grayGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Drop shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Apply background grid -->
  <rect width="1000" height="650" fill="#0f172a" />
  <rect width="1000" height="650" fill="url(#grid)" />

  <!-- TITLE -->
  <text x="50" y="45" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">eBPF Socket Tracing &amp; OpenTelemetry Correlation</text>
  <text x="50" y="70" font-size="14" fill="#94a3b8">Context Propagation via Kernel Space &amp; Payload Inspection</text>

  <!-- BOUNDARIES / ZONES -->
  <!-- User Space Zone -->
  <rect x="50" y="110" width="900" height="230" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="70" y="135" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">USER SPACE</text>

  <!-- Kernel Space Zone -->
  <rect x="50" y="370" width="900" height="240" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="70" y="395" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">KERNEL SPACE (eBPF)</text>

  <!-- USER SPACE COMPONENTS -->
  <!-- Service A (Go / Upstream) -->
  <g transform="translate(80, 150)" filter="url(#shadow)">
    <rect width="250" height="160" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect width="250" height="35" rx="8" fill="#0c4a6e" opacity="0.8" />
    <text x="15" y="22" font-size="14" font-weight="700" fill="#f8fafc">Service A (HTTP Client)</text>
    
    <!-- Code/OTel Block -->
    <rect x="15" y="50" width="220" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="25" y="68" font-size="11" font-family="monospace" fill="#38bdf8">OTel SDK (Active Span)</text>
    <text x="25" y="82" font-size="10" font-family="monospace" fill="#94a3b8">TraceID: 4bf92f3577b34d...</text>

    <!-- Socket connection -->
    <rect x="15" y="105" width="220" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="25" y="123" font-size="11" font-family="monospace" fill="#e2e8f0">syscall.Connect()</text>
    <text x="25" y="137" font-size="10" font-family="monospace" fill="#64748b">FD: 7 -> Remote: 10.0.1.5:8080</text>
  </g>

  <!-- Service B (Go / Downstream) -->
  <g transform="translate(670, 150)" filter="url(#shadow)">
    <rect width="250" height="160" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <rect width="250" height="35" rx="8" fill="#064e3b" opacity="0.8" />
    <text x="15" y="22" font-size="14" font-weight="700" fill="#f8fafc">Service B (HTTP Server)</text>
    
    <!-- Socket connection -->
    <rect x="15" y="50" width="220" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="25" y="68" font-size="11" font-family="monospace" fill="#e2e8f0">syscall.Accept()</text>
    <text x="25" y="82" font-size="10" font-family="monospace" fill="#64748b">FD: 12 -> Local: 10.0.1.5:8080</text>

    <!-- Code/OTel Block -->
    <rect x="15" y="105" width="220" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="25" y="123" font-size="11" font-family="monospace" fill="#34d399">OTel Extractor &amp; Span</text>
    <text x="25" y="137" font-size="10" font-family="monospace" fill="#94a3b8">Parent: 4bf92f3577b34d...</text>
  </g>

  <!-- Collector / Correlation Agent (User Space Sidecar/Daemon) -->
  <g transform="translate(380, 120)" filter="url(#shadow)">
    <rect width="240" height="85" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
    <rect width="240" height="30" rx="8" fill="#581c87" opacity="0.8" />
    <text x="120" y="20" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Telemetry Collector Agent</text>
    <text x="120" y="48" font-size="11" fill="#e2e8f0" text-anchor="middle">Assembles Ring Buffer Events</text>
    <text x="120" y="68" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">TraceID &lt;=&gt; TCP Conn Match</text>
  </g>

  <!-- KERNEL SPACE COMPONENTS -->
  <!-- Kprobe sys_enter_connect & sys_enter_write -->
  <g transform="translate(80, 420)">
    <rect width="230" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="15" y="25" font-size="12" font-weight="700" fill="#38bdf8">kprobe/sys_enter_connect</text>
    <text x="15" y="45" font-size="10" font-family="monospace" fill="#94a3b8">Capture: PID, TID, Socket FD</text>
  </g>

  <g transform="translate(80, 500)">
    <rect width="230" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="15" y="25" font-size="12" font-weight="700" fill="#38bdf8">kprobe/sys_enter_write</text>
    <text x="15" y="45" font-size="10" font-family="monospace" fill="#94a3b8">Inspect payload for traceparent</text>
  </g>

  <!-- BPF MAPS (eBPF Storage) -->
  <g transform="translate(380, 430)" filter="url(#shadow)">
    <rect width="240" height="120" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <rect width="240" height="30" rx="8" fill="#78350f" opacity="0.8" />
    <text x="120" y="20" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">eBPF Maps (BPF_MAP_TYPE_HASH)</text>
    
    <!-- Map 1 -->
    <text x="15" y="55" font-size="10" font-family="monospace" fill="#f59e0b">active_conns_map</text>
    <text x="15" y="70" font-size="9" fill="#94a3b8">Key: {TID, FD} | Val: {IP, Port, Inode}</text>
    
    <!-- Map 2 -->
    <line x1="10" y1="80" x2="230" y2="80" stroke="#334155" />
    <text x="15" y="98" font-size="10" font-family="monospace" fill="#f59e0b">events_ringbuf (Perf/RingBuf)</text>
    <text x="15" y="112" font-size="9" fill="#94a3b8">Streams payload and context events to Agent</text>
  </g>

  <!-- Kprobe sys_enter_read / tcp_cleanup_rbuf on Service B -->
  <g transform="translate(690, 420)">
    <rect width="230" height="60" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="15" y="25" font-size="12" font-weight="700" fill="#34d399">kprobe/tcp_cleanup_rbuf</text>
    <text x="15" y="45" font-size="10" font-family="monospace" fill="#94a3b8">Track TCP buffer reads</text>
  </g>
  
  <g transform="translate(690, 500)">
    <rect width="230" height="60" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="15" y="25" font-size="12" font-weight="700" fill="#34d399">kprobe/sys_enter_read</text>
    <text x="15" y="45" font-size="10" font-family="monospace" fill="#94a3b8">Intercept incoming traceparent</text>
  </g>

  <!-- INTERACTION ARROWS & FLOWS -->
  <!-- 1. Syscall invocation from Service A to Kernel -->
  <path d="M 195, 310 L 195, 410" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-blue)" />
  <text x="205" y="360" font-size="11" fill="#38bdf8" font-weight="600">1. Syscall</text>

  <!-- 2. Kernel program updates BPF Map -->
  <path d="M 310, 450 L 370, 450" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)" />
  <path d="M 310, 530 L 350, 530 L 350, 480 L 370, 480" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)" />
  <text x="325" y="440" font-size="10" fill="#f59e0b" font-weight="600">2. Track</text>

  <!-- 3. Over-the-wire TCP connection -->
  <path d="M 330, 230 L 660, 230" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow-blue)" />
  <rect x="445" y="215" width="110" height="30" rx="4" fill="#334155" stroke="#475569" />
  <text x="500" y="234" font-size="10" font-family="monospace" fill="#e2e8f0" text-anchor="middle">TCP Payload</text>

  <!-- 4. Downstream reads and triggers kernel probes -->
  <path d="M 785, 310 L 785, 410" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-emerald)" />
  <text x="795" y="360" font-size="11" fill="#34d399" font-weight="600">3. Read &amp; Trace</text>

  <!-- 5. Downstream kernel update BPF map -->
  <path d="M 690, 450 L 630, 450" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)" />
  <path d="M 690, 530 L 650, 530 L 650, 490 L 630, 490" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- 6. Ring Buffer Events to User-space Agent -->
  <path d="M 500, 430 L 500, 215" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="510" y="315" font-size="11" fill="#c084fc" font-weight="600">4. Ring Buffer Event Stream</text>

  <!-- 7. Agent Correlates trace ID to physical sockets -->
  <path d="M 380, 160 L 340, 160" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <path d="M 620, 160 L 660, 160" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <text x="490" y="105" font-size="10" fill="#c084fc" font-weight="600" text-anchor="middle">5. Out-of-band Match</text>
</svg>
