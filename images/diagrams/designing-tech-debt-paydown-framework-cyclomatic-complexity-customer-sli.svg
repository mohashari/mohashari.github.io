<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none">
  <!-- Definitions for gradients, markers, and patterns -->
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    
    <!-- Linear Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="success-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="danger-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="12" fill="url(#bg-grad)" />
  <rect width="960" height="540" rx="12" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="956" height="536" rx="10" stroke="#334155" stroke-width="1.5" />

  <!-- Diagram Title -->
  <text x="480" y="45" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    TECH DEBT PAYDOWN PIPELINE
  </text>
  <text x="480" y="65" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    Mapping AST Complexity Metrics to Production Service Level Indicators (SLIs)
  </text>

  <!-- ================= CI/CD STATIC CODE ANALYSIS (LEFT) ================= -->
  <g filter="url(#shadow)">
    <!-- Header/Boundary Box -->
    <rect x="40" y="100" width="280" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="40" y="100" width="280" height="40" rx="8" fill="#111827" fill-opacity="0.6"/>
    <text x="56" y="125" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">CI/CD STATIC CODE ANALYSIS</text>
    
    <!-- Radon/Go-cyclone parser component -->
    <rect x="56" y="155" width="248" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="70" y="177" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">AST Complexity Parser</text>
    <text x="70" y="195" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#94a3b8">Go-cyclone / Radon / SonarQube API</text>
    
    <!-- Codebase Metrics Metrics Box -->
    <rect x="56" y="230" width="248" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="70" y="248" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Extracted AST Metrics (by Method/Route)</text>
    <text x="70" y="268" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">• Cyclomatic Complexity (M ≥ 15)</text>
    <text x="70" y="285" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">• Cognitive Complexity (Nest limit)</text>
    <text x="70" y="302" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">• Halstead Volume / Change Frequency</text>
  </g>

  <!-- ================= PRODUCTION OBSERVABILITY (RIGHT) ================= -->
  <g filter="url(#shadow)">
    <!-- Header/Boundary Box -->
    <rect x="640" y="100" width="280" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="640" y="100" width="280" height="40" rx="8" fill="#111827" fill-opacity="0.6"/>
    <text x="656" y="125" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#06b6d4">PRODUCTION OBSERVABILITY</text>
    
    <!-- Prometheus/Datadog APM metrics harvester -->
    <rect x="656" y="155" width="248" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="670" y="177" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">APM Telemetry Harvester</text>
    <text x="670" y="195" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#94a3b8">PromQL / Datadog Query API</text>
    
    <!-- Customer SLIs Box -->
    <rect x="656" y="230" width="248" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="670" y="248" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Real-Time Customer SLIs</text>
    <text x="670" y="268" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">• p99 Latency (Normalized vs Budget)</text>
    <text x="670" y="285" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">• Error Rate (5xx Failures per route)</text>
    <text x="670" y="302" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">• Edge Traffic Volume (RPS)</text>
  </g>

  <!-- ================= METADATA CORRELATION ENGINE (MIDDLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="360" y="130" width="240" height="150" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <rect x="360" y="130" width="240" height="35" rx="8" fill="#312e81" />
    <text x="480" y="152" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">Correlation &amp; Mapping Engine</text>
    
    <!-- Mapping Mechanism -->
    <rect x="375" y="178" width="210" height="85" rx="4" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
    <text x="385" y="195" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#a5b4fc">Identifier Resolution:</text>
    <text x="385" y="212" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#e2e8f0">Code: `controllers/order.go:Create`</text>
    <text x="480" y="228" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399">⇅ (HTTP/GRPC Route Map)</text>
    <text x="385" y="245" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#e2e8f0">Route: `POST /api/v1/orders`</text>
  </g>

  <!-- Arrows into Correlation Engine -->
  <path d="M 320 215 L 352 215" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-indigo)" fill="none" />
  <path d="M 640 215 L 608 215" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-indigo)" fill="none" />

  <!-- Arrow from Correlation Engine to Decision Engine -->
  <path d="M 480 280 L 480 342" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)" fill="none" />

  <!-- ================= PRIORITIZATION MATRIX (BOTTOM) ================= -->
  <g filter="url(#shadow)">
    <rect x="160" y="350" width="640" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="160" y="350" width="640" height="35" rx="8" fill="#111827" fill-opacity="0.6"/>
    <text x="176" y="372" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">DECISION MAKER &amp; REFACORING SCORECARD</text>

    <!-- Formula badge -->
    <rect x="525" y="356" width="265" height="22" rx="4" fill="#065f46"/>
    <text x="535" y="371" font-family="'Courier New', monospace" font-size="10" font-weight="800" fill="#a7f3d0">Score = Complexity(M) × SLI_Deficit</text>

    <!-- Quadrants representation -->
    <!-- Quad 1: High Complexity, High Latency Deficit -->
    <rect x="176" y="398" width="140" height="92" rx="6" fill="#7f1d1d" fill-opacity="0.6" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="246" y="418" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffe4e6">TIER 1 PAYDOWN</text>
    <text x="246" y="438" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#fda4af">M &gt; 20 &amp;&amp; Latency &gt; SLO</text>
    <text x="246" y="454" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" font-style="italic" fill="#f87171">(High ROI Refactor)</text>

    <!-- Quad 2: High Complexity, Safe SLI -->
    <rect x="330" y="398" width="140" height="92" rx="6" fill="#7c2d12" fill-opacity="0.4" stroke="#fdba74" stroke-width="1"/>
    <text x="400" y="418" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffedd5">TIER 2 (Deferrable)</text>
    <text x="400" y="438" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#fed7aa">M &gt; 20 &amp;&amp; Latency &lt; SLO</text>
    <text x="400" y="454" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" font-style="italic" fill="#fb923c">(Technical Debt Accepted)</text>

    <!-- Quad 3: Low Complexity, Poor SLI -->
    <rect x="484" y="398" width="140" height="92" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#93c5fd" stroke-width="1"/>
    <text x="554" y="418" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#dbeafe">TIER 3 (Systemic)</text>
    <text x="554" y="438" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#bfdbfe">M &lt; 10 &amp;&amp; Latency &gt; SLO</text>
    <text x="554" y="454" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" font-style="italic" fill="#60a5fa">(Infra/Database bottleneck)</text>

    <!-- Quad 4: Clean code, Safe SLI -->
    <rect x="638" y="398" width="142" height="92" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#6ee7b7" stroke-width="1"/>
    <text x="709" y="418" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#d1fae5">HEALTHY CODE</text>
    <text x="709" y="438" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#a7f3d0">M &lt; 10 &amp;&amp; Latency &lt; SLO</text>
    <text x="709" y="454" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" font-style="italic" fill="#34d399">(Zero action required)</text>
  </g>
</svg>
