<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="900" height="580" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1e2e">ClickHouse MergeTree: Sparse Index &amp; Query Execution Flow</text>

  <!-- === SECTION: Parts after INSERT === -->
  <text x="30" y="75" font-size="12" fill="#2f9e44" font-weight="bold">INSERT → immutable Parts (one per batch)</text>

  <!-- Part 1 -->
  <rect x="30" y="88" width="155" height="75" rx="6" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="107" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f9e44">Part_1</text>
  <text x="107" y="128" text-anchor="middle" font-size="11" fill="#2f9e44">rows: 0–8191</text>
  <text x="107" y="145" text-anchor="middle" font-size="11" fill="#2f9e44">ORDER BY (date, uid)</text>

  <!-- Part 2 -->
  <rect x="205" y="88" width="155" height="75" rx="6" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="282" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f9e44">Part_2</text>
  <text x="282" y="128" text-anchor="middle" font-size="11" fill="#2f9e44">rows: 0–8191</text>
  <text x="282" y="145" text-anchor="middle" font-size="11" fill="#2f9e44">ORDER BY (date, uid)</text>

  <!-- Part 3 -->
  <rect x="380" y="88" width="155" height="75" rx="6" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="457" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f9e44">Part_3</text>
  <text x="457" y="128" text-anchor="middle" font-size="11" fill="#2f9e44">rows: 0–16383</text>
  <text x="457" y="145" text-anchor="middle" font-size="11" fill="#2f9e44">ORDER BY (date, uid)</text>

  <!-- Merge arrows -->
  <line x1="107" y1="163" x2="282" y2="220" stroke="#f08c00" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <line x1="282" y1="163" x2="282" y2="220" stroke="#f08c00" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <line x1="457" y1="163" x2="282" y2="220" stroke="#f08c00" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <text x="480" y="198" font-size="11" fill="#f08c00" font-weight="bold">Background Merge</text>
  <text x="480" y="212" font-size="10" fill="#f08c00">(MergeTree scheduler)</text>

  <!-- Merged Part -->
  <rect x="190" y="220" width="185" height="80" rx="6" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="282" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#1971c2">Merged Part</text>
  <text x="282" y="262" text-anchor="middle" font-size="11" fill="#1971c2">rows sorted globally</text>
  <text x="282" y="278" text-anchor="middle" font-size="11" fill="#1971c2">Old parts deleted after TTL</text>

  <!-- === SECTION: Sparse Index === -->
  <rect x="570" y="70" width="300" height="235" rx="8" fill="#f3d9fa" stroke="#9c36b5" stroke-width="1.5"/>
  <text x="720" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#9c36b5">Sparse Primary Index</text>
  <text x="720" y="108" text-anchor="middle" font-size="10" fill="#9c36b5">primary.idx  (1 mark per 8192 rows)</text>

  <rect x="585" y="118" width="270" height="25" rx="3" fill="#e9d5f5" stroke="#9c36b5" stroke-width="1"/>
  <text x="600" y="135" font-size="11" fill="#9c36b5">Mark 0 → date=2024-01-01, uid=1001  offset=0</text>

  <rect x="585" y="148" width="270" height="25" rx="3" fill="#e9d5f5" stroke="#9c36b5" stroke-width="1"/>
  <text x="600" y="165" font-size="11" fill="#9c36b5">Mark 1 → date=2024-01-08, uid=4022  offset=1</text>

  <rect x="585" y="178" width="270" height="25" rx="3" fill="#e9d5f5" stroke="#9c36b5" stroke-width="1"/>
  <text x="600" y="195" font-size="11" fill="#9c36b5">Mark 2 → date=2024-01-15, uid=8801  offset=2</text>

  <rect x="585" y="208" width="270" height="25" rx="3" fill="#e9d5f5" stroke="#9c36b5" stroke-width="1"/>
  <text x="600" y="225" font-size="11" fill="#9c36b5">Mark 3 → date=2024-01-22, uid=2033  offset=3</text>

  <text x="720" y="262" text-anchor="middle" font-size="10" fill="#9c36b5">Marks map granule # → file offset in .mrk3</text>
  <text x="720" y="278" text-anchor="middle" font-size="10" fill="#9c36b5">Binary search narrows to candidate marks</text>

  <!-- Arrow from Merged Part to Index -->
  <line x1="375" y1="260" x2="565" y2="185" stroke="#9c36b5" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>
  <text x="435" y="208" font-size="10" fill="#9c36b5">builds index</text>

  <!-- === SECTION: Columnar Storage === -->
  <text x="30" y="335" font-size="12" fill="#364fc7" font-weight="bold">Columnar Storage Files (per Part)</text>

  <rect x="30" y="348" width="130" height="65" rx="5" fill="#dbe4ff" stroke="#364fc7" stroke-width="1.5"/>
  <text x="95" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#364fc7">date.bin</text>
  <text x="95" y="388" text-anchor="middle" font-size="10" fill="#364fc7">LZ4 compressed</text>
  <text x="95" y="403" text-anchor="middle" font-size="10" fill="#364fc7">granule blocks</text>

  <rect x="175" y="348" width="130" height="65" rx="5" fill="#dbe4ff" stroke="#364fc7" stroke-width="1.5"/>
  <text x="240" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#364fc7">user_id.bin</text>
  <text x="240" y="388" text-anchor="middle" font-size="10" fill="#364fc7">LZ4 compressed</text>
  <text x="240" y="403" text-anchor="middle" font-size="10" fill="#364fc7">granule blocks</text>

  <rect x="320" y="348" width="130" height="65" rx="5" fill="#dbe4ff" stroke="#364fc7" stroke-width="1.5"/>
  <text x="385" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#364fc7">amount.bin</text>
  <text x="385" y="388" text-anchor="middle" font-size="10" fill="#364fc7">LZ4 compressed</text>
  <text x="385" y="403" text-anchor="middle" font-size="10" fill="#364fc7">granule blocks</text>

  <rect x="465" y="348" width="130" height="65" rx="5" fill="#dbe4ff" stroke="#364fc7" stroke-width="1.5"/>
  <text x="530" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#364fc7">*.mrk3</text>
  <text x="530" y="388" text-anchor="middle" font-size="10" fill="#364fc7">mark files</text>
  <text x="530" y="403" text-anchor="middle" font-size="10" fill="#364fc7">(offset per col)</text>

  <!-- === SECTION: Query Execution === -->
  <rect x="630" y="330" width="240" height="230" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="750" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#c92a2a">Query Execution Steps</text>

  <text x="648" y="376" font-size="11" fill="#c92a2a">① Partition pruning</text>
  <text x="660" y="392" font-size="10" fill="#555">skip parts outside WHERE range</text>

  <text x="648" y="412" font-size="11" fill="#c92a2a">② Binary search on primary.idx</text>
  <text x="660" y="428" font-size="10" fill="#555">find mark range covering query keys</text>

  <text x="648" y="448" font-size="11" fill="#c92a2a">③ Read .mrk3 for byte offsets</text>
  <text x="660" y="464" font-size="10" fill="#555">jump directly to granule in .bin</text>

  <text x="648" y="484" font-size="11" fill="#c92a2a">④ Decompress &amp; filter granules</text>
  <text x="660" y="500" font-size="10" fill="#555">only touched columns loaded</text>

  <text x="648" y="520" font-size="11" fill="#c92a2a">⑤ Return matching rows</text>
  <text x="660" y="536" font-size="10" fill="#555">skipped cols never read from disk</text>

  <!-- Arrow from columnar to query -->
  <line x1="595" y1="380" x2="628" y2="390" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Arrow defs -->
  <defs>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f08c00"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9c36b5"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c92a2a"/>
    </marker>
  </defs>
</svg>
