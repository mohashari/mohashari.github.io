<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background-color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="gradient-source" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradient-engine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="gradient-metric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="gradient-synthesis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradient-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title / Header -->
  <rect x="0" y="0" width="900" height="70" fill="#1e293b" />
  <text x="30" y="42" fill="#f8fafc" font-size="18" font-weight="bold" letter-spacing="0.025em">
    Team Cognitive Load Quantitative Framework Architecture
  </text>
  <text x="870" y="40" fill="#94a3b8" font-size="12" text-anchor="end" font-style="italic">
    Repository Coupling &amp; Ownership Fragmentation Pipeline
  </text>
  
  <!-- Outer Border -->
  <rect x="1" y="1" width="898" height="558" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Data Sources Swimlane -->
  <rect x="30" y="100" width="180" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <text x="120" y="125" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">DATA SOURCES</text>
  
  <!-- Git Commits -->
  <g transform="translate(45, 145)">
    <rect x="0" y="0" width="150" height="65" rx="8" fill="url(#gradient-source)" filter="url(#shadow)" />
    <text x="75" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Git Commit Logs</text>
    <text x="75" y="46" fill="#e0f2fe" font-size="10" text-anchor="middle">File edits &amp; change history</text>
  </g>
  
  <!-- PR metadata -->
  <g transform="translate(45, 230)">
    <rect x="0" y="0" width="150" height="65" rx="8" fill="url(#gradient-source)" filter="url(#shadow)" />
    <text x="75" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">PR &amp; Approval Data</text>
    <text x="75" y="46" fill="#e0f2fe" font-size="10" text-anchor="middle">Author-reviewer pairings</text>
  </g>

  <!-- CODEOWNERS -->
  <g transform="translate(45, 315)">
    <rect x="0" y="0" width="150" height="65" rx="8" fill="url(#gradient-source)" filter="url(#shadow)" />
    <text x="75" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CODEOWNERS Files</text>
    <text x="75" y="46" fill="#e0f2fe" font-size="10" text-anchor="middle">Explicit ownership declarations</text>
  </g>

  <!-- Org Directory -->
  <g transform="translate(45, 400)">
    <rect x="0" y="0" width="150" height="65" rx="8" fill="url(#gradient-source)" filter="url(#shadow)" />
    <text x="75" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Org Directory</text>
    <text x="75" y="46" fill="#e0f2fe" font-size="10" text-anchor="middle">Developer-to-team maps</text>
  </g>

  <!-- Connectors from sources to metric engines -->
  <line x1="195" y1="177" x2="265" y2="210" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrow-active)" />
  <line x1="195" y1="262" x2="265" y2="230" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrow-active)" />
  
  <line x1="195" y1="347" x2="265" y2="380" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrow-active)" />
  <line x1="195" y1="432" x2="265" y2="400" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrow-active)" />

  <!-- Metric Engines Swimlane -->
  <rect x="250" y="100" width="220" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <text x="360" y="125" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">ANALYTICS ENGINE</text>

  <!-- Temporal Coupling Engine -->
  <g transform="translate(270, 160)">
    <rect x="0" y="0" width="180" height="90" rx="8" fill="url(#gradient-engine)" filter="url(#shadow)" />
    <text x="90" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Temporal Coupling</text>
    <text x="90" y="46" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Analyzer</text>
    <text x="90" y="66" fill="#e0e7ff" font-size="9" text-anchor="middle">Jaccard index of co-changes</text>
    <text x="90" y="78" fill="#e0e7ff" font-size="9" text-anchor="middle">across repos within window W</text>
  </g>

  <!-- Ownership Entropy Engine -->
  <g transform="translate(270, 330)">
    <rect x="0" y="0" width="180" height="90" rx="8" fill="url(#gradient-engine)" filter="url(#shadow)" />
    <text x="90" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Ownership Entropy</text>
    <text x="90" y="46" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Calculator</text>
    <text x="90" y="66" fill="#e0e7ff" font-size="9" text-anchor="middle">Shannon entropy (H) of commits</text>
    <text x="90" y="78" fill="#e0e7ff" font-size="9" text-anchor="middle">distributed across multiple teams</text>
  </g>

  <!-- Connectors to Metrics -->
  <line x1="450" y1="205" x2="510" y2="205" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="450" y1="375" x2="510" y2="375" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Quantitative Metrics Swimlane -->
  <rect x="490" y="100" width="180" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <text x="580" y="125" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">METRICS OUTPUT</text>

  <!-- RCI -->
  <g transform="translate(505, 170)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="url(#gradient-metric)" filter="url(#shadow)" />
    <text x="75" y="26" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">RCI</text>
    <text x="75" y="44" fill="#ffe4e6" font-size="10" text-anchor="middle">Repo Coupling Index</text>
    <text x="75" y="58" fill="#ffe4e6" font-size="9" font-style="italic" text-anchor="middle">[Target: &lt; 0.20]</text>
  </g>

  <!-- COFI -->
  <g transform="translate(505, 340)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="url(#gradient-metric)" filter="url(#shadow)" />
    <text x="75" y="26" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">COFI</text>
    <text x="75" y="44" fill="#ffe4e6" font-size="10" text-anchor="middle">Code Ownership Frag.</text>
    <text x="75" y="58" fill="#ffe4e6" font-size="9" font-style="italic" text-anchor="middle">[Target: &lt; 0.35]</text>
  </g>

  <!-- Connectors to Synthesis -->
  <line x1="655" y1="205" x2="685" y2="205" stroke="#34d399" stroke-width="2" />
  <line x1="685" y1="205" x2="685" y2="280" stroke="#34d399" stroke-width="2" />
  
  <line x1="655" y1="375" x2="685" y2="375" stroke="#34d399" stroke-width="2" />
  <line x1="685" y1="375" x2="685" y2="300" stroke="#34d399" stroke-width="2" />

  <line x1="685" y1="290" x2="705" y2="290" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Cognitive Load Synthesis Swimlane -->
  <rect x="690" y="100" width="180" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <text x="780" y="125" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">SYNTHESIS &amp; ACTIONS</text>

  <!-- CLS Score Engine -->
  <g transform="translate(705, 235)">
    <rect x="0" y="0" width="150" height="110" rx="8" fill="url(#gradient-synthesis)" filter="url(#shadow)" />
    <text x="75" y="24" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">CLS Engine</text>
    <text x="75" y="44" fill="#ecfdf5" font-size="10" text-anchor="middle">Cognitive Load Score</text>
    <text x="75" y="64" fill="#a7f3d0" font-size="9" font-family="monospace" text-anchor="middle">CLS = α*RCI + β*COFI</text>
    <text x="75" y="80" fill="#a7f3d0" font-size="9" font-family="monospace" text-anchor="middle">+ γ*LocalityPenalty</text>
  </g>
  
  <!-- Alert & Decisions -->
  <g transform="translate(705, 385)">
    <rect x="0" y="0" width="150" height="90" rx="8" fill="#334155" stroke="#475569" stroke-width="1" filter="url(#shadow)" />
    <text x="75" y="22" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Actionable Alerts</text>
    <text x="75" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">1. Boundary Consolidation</text>
    <text x="75" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">2. Service Extraction</text>
    <text x="75" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">3. Dev-to-Repo Realignment</text>
  </g>

  <!-- Connect CLS to Alerts -->
  <line x1="780" y1="345" x2="780" y2="380" stroke="#34d399" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow)" />

</svg>
