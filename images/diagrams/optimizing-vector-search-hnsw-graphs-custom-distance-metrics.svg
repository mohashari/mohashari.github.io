<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Node Gradients -->
    <radialGradient id="nodeActive" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </radialGradient>

    <radialGradient id="nodeStandard" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>

    <radialGradient id="nodeQuery" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </radialGradient>
    
    <radialGradient id="nodeTarget" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <!-- Custom Metric Box Gradient -->
    <linearGradient id="metricBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#311042" stop-opacity="0.9" />
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#f87171" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Outer Border -->
  <rect x="5" y="5" width="790" height="590" rx="12" fill="none" stroke="#374151" stroke-width="2" />

  <!-- Title -->
  <text x="40" y="45" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#f3f4f6" letter-spacing="0.5">
    HNSW MULTI-LAYER GRAPH ROUTING &amp; CUSTOM DISTANCE EVALUATION
  </text>
  <text x="40" y="65" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#9ca3af">
    Visualizing top-down query entry, link traversal, and custom SIMD distance calculation in production vector databases.
  </text>

  <!-- ==================== HNSW LAYERS ==================== -->

  <!-- --- LAYER 2: TOP LAYER --- -->
  <g id="layer2">
    <!-- Layer plane outline -->
    <polygon points="100,180 500,180 420,100 20,100" fill="#1e293b" fill-opacity="0.3" stroke="#4f46e5" stroke-dasharray="4,4" stroke-width="1.5" />
    <text x="35" y="125" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="1">LAYER 2 (Sparse / Fast Skip)</text>
    
    <!-- Links -->
    <line x1="120" y1="140" x2="380" y2="140" stroke="#475569" stroke-width="2" />
    
    <!-- Nodes -->
    <circle cx="120" cy="140" r="8" fill="url(#nodeActive)" filter="url(#softGlow)" />
    <circle cx="380" cy="140" r="8" fill="url(#nodeStandard)" />
    
    <text x="120" y="125" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="middle">Entry Point (L2)</text>
  </g>

  <!-- Vertical Projection Lines L2 -> L1 -->
  <line x1="120" y1="140" x2="160" y2="280" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="380" y1="140" x2="320" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />

  <!-- --- LAYER 1: MIDDLE LAYER --- -->
  <g id="layer1">
    <!-- Layer plane outline -->
    <polygon points="140,320 540,320 460,240 60,240" fill="#1e293b" fill-opacity="0.4" stroke="#818cf8" stroke-dasharray="4,4" stroke-width="1.5" />
    <text x="75" y="265" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1">LAYER 1 (Intermediate Routing)</text>

    <!-- Links -->
    <line x1="160" y1="280" x2="240" y2="260" stroke="#475569" stroke-width="2" />
    <line x1="240" y1="260" x2="320" y2="280" stroke="#475569" stroke-width="2" />
    <line x1="320" y1="280" x2="420" y2="270" stroke="#475569" stroke-width="2" />
    <line x1="160" y1="280" x2="320" y2="280" stroke="#475569" stroke-width="1.5" stroke-dasharray="2,2" />

    <!-- Nodes -->
    <circle cx="160" cy="280" r="8" fill="url(#nodeStandard)" />
    <circle cx="240" cy="260" r="8" fill="url(#nodeActive)" filter="url(#softGlow)" />
    <circle cx="320" cy="280" r="8" fill="url(#nodeStandard)" />
    <circle cx="420" cy="270" r="8" fill="url(#nodeStandard)" />
  </g>

  <!-- Vertical Projection Lines L1 -> L0 -->
  <line x1="160" y1="280" x2="200" y2="440" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
  <line x1="240" y1="260" x2="280" y2="420" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="320" y1="280" x2="360" y2="440" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />

  <!-- --- LAYER 0: BASE LAYER (ALL DATA) --- -->
  <g id="layer0">
    <!-- Layer plane outline -->
    <polygon points="180,480 580,480 500,400 100,400" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5" />
    <text x="115" y="425" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">LAYER 0 (Dense / Ground Layer)</text>

    <!-- Links -->
    <line x1="200" y1="440" x2="230" y2="415" stroke="#334155" stroke-width="1.5" />
    <line x1="200" y1="440" x2="280" y2="420" stroke="#334155" stroke-width="1.5" />
    <line x1="280" y1="420" x2="360" y2="440" stroke="#334155" stroke-width="1.5" />
    <line x1="280" y1="420" x2="310" y2="460" stroke="#334155" stroke-width="1.5" />
    <line x1="360" y1="440" x2="440" y2="415" stroke="#334155" stroke-width="1.5" />
    <line x1="360" y1="440" x2="480" y2="450" stroke="#334155" stroke-width="1.5" />
    <line x1="480" y1="450" x2="540" y2="430" stroke="#334155" stroke-width="1.5" />
    <line x1="310" y1="460" x2="480" y2="450" stroke="#334155" stroke-width="1.5" />

    <!-- Nodes -->
    <circle cx="200" cy="440" r="7" fill="url(#nodeStandard)" />
    <circle cx="230" cy="415" r="7" fill="url(#nodeStandard)" />
    <circle cx="280" cy="420" r="7" fill="url(#nodeStandard)" />
    <circle cx="310" cy="460" r="7" fill="url(#nodeActive)" filter="url(#softGlow)" />
    <circle cx="360" cy="440" r="7" fill="url(#nodeStandard)" />
    <circle cx="440" cy="415" r="7" fill="url(#nodeStandard)" />
    <circle cx="480" cy="450" r="7" fill="url(#nodeTarget)" filter="url(#softGlow)" />
    <circle cx="540" cy="430" r="7" fill="url(#nodeStandard)" />
    
    <text x="480" y="475" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">Nearest Neighbor</text>
  </g>

  <!-- ==================== QUERY TRAVERSAL PATH ==================== -->
  <g id="queryPath">
    <!-- Entry to L2 node -->
    <path d="M 80,60 Q 110,80 120,140" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="4,2" marker-end="url(#arrow)" />
    <circle cx="80" cy="60" r="6" fill="url(#nodeQuery)" />
    <text x="75" y="45" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#f87171" text-anchor="middle">Query Vector (q)</text>

    <!-- Path down to L1 -->
    <path d="M 120,140 Q 140,210 240,260" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow)" />
    
    <!-- Path down to L0 -->
    <path d="M 240,260 Q 260,340 310,460" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow)" />
    
    <!-- Final step on L0 to Nearest Neighbor -->
    <path d="M 310,460 Q 395,455 480,450" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#arrow)" />
    
    <text x="215" y="195" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#f87171" transform="rotate(35, 215, 195)">Route L2 -> L1</text>
    <text x="320" y="340" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#f87171" transform="rotate(50, 320, 340)">Local Search (L0)</text>
  </g>

  <!-- ==================== CUSTOM DISTANCE CALCULATION (CALLOUT BOX) ==================== -->
  <g id="callout" transform="translate(480, 80)">
    <!-- Box background -->
    <rect width="280" height="230" rx="10" fill="url(#metricBoxGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)" />
    
    <!-- Title -->
    <text x="15" y="25" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f3ff" letter-spacing="0.5">
      CUSTOM DISTANCE METRIC ENGINE
    </text>
    
    <!-- Horizontal Separator -->
    <line x1="15" y1="35" x2="265" y2="35" stroke="#4f46e5" stroke-width="1" />
    
    <!-- Formula / Text -->
    <text x="15" y="55" font-family="'Fira Code', 'Courier New', monospace" font-size="10" font-weight="400" fill="#a5b4fc">
      d(u,v) = &Sigma; w_i * (u_i - v_i)&sup2;
    </text>
    <text x="15" y="75" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">
      Weighted L2 with dynamically computed penalty
    </text>

    <!-- Vector Comparison graphic -->
    <g transform="translate(15, 95)">
      <!-- Vector Q -->
      <rect x="0" y="0" width="100" height="15" rx="3" fill="#312e81" stroke="#4f46e5" />
      <text x="5" y="11" font-family="'Fira Code', monospace" font-size="8" fill="#e0e7ff">q: [0.12, -0.84, ...]</text>
      
      <!-- Vector V -->
      <rect x="0" y="25" width="100" height="15" rx="3" fill="#1e293b" stroke="#475569" />
      <text x="5" y="36" font-family="'Fira Code', monospace" font-size="8" fill="#cbd5e1">v: [0.15, -0.79, ...]</text>
      
      <!-- Weights W -->
      <rect x="0" y="50" width="100" height="15" rx="3" fill="#311042" stroke="#a21caf" />
      <text x="5" y="61" font-family="'Fira Code', monospace" font-size="8" fill="#fdf4ff">w: [1.00,  2.50, ...]</text>
      
      <text x="110" y="35" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#9ca3af" text-anchor="middle">&rArr;</text>
      
      <!-- Compute Box -->
      <g transform="translate(130, 10)">
        <rect width="110" height="55" rx="5" fill="#111827" stroke="#38bdf8" />
        <text x="55" y="18" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">AVX-512 FMA</text>
        <text x="55" y="30" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">Vectorized Kernel</text>
        <text x="55" y="45" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">dist = 0.0842</text>
      </g>
    </g>

    <!-- Latency metrics -->
    <rect x="15" y="185" width="250" height="30" rx="5" fill="#0f172a" stroke="#334155" />
    <text x="25" y="203" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#e2e8f0">
      TRAVERSAL LATENCY:
    </text>
    <text x="245" y="203" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="end">
      1.84 ms @ p99
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 520)">
    <rect width="400" height="50" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" />
    
    <circle cx="20" cy="25" r="5" fill="url(#nodeQuery)" />
    <text x="30" y="28" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#9ca3af">Query</text>
    
    <circle cx="85" cy="25" r="5" fill="url(#nodeActive)" />
    <text x="95" y="28" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#9ca3af">Traversed Node</text>

    <circle cx="180" cy="25" r="5" fill="url(#nodeStandard)" />
    <text x="190" y="28" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#9ca3af">Unvisited Node</text>

    <circle cx="275" cy="25" r="5" fill="url(#nodeTarget)" />
    <text x="285" y="28" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#9ca3af">Nearest Neighbor</text>
  </g>
</svg>
