<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Client Node Gradient -->
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Envoy Node Gradient -->
    <linearGradient id="envoy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- OPA Node Gradient -->
    <linearGradient id="opa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- App Node Gradient -->
    <linearGradient id="app-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Bundle Server Gradient -->
    <linearGradient id="bundle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Glow/Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="url(#bg-grad)" />
  
  <!-- Grid Lines (Subtle) -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <path d="M 0,50 L 900,50 M 0,100 L 900,100 M 0,150 L 900,150 M 0,200 L 900,200 M 0,250 L 900,250 M 0,300 L 900,300 M 0,350 L 900,350 M 0,400 L 900,400 M 0,450 L 900,450 M 0,500 L 900,500" />
    <path d="M 100,0 L 100,550 M 200,0 L 200,550 M 300,0 L 300,550 M 400,0 L 400,550 M 500,0 L 500,550 M 600,0 L 600,550 M 700,0 L 700,550 M 800,0 L 800,550" />
  </g>

  <!-- Title & Metadata -->
  <text x="30" y="40" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">ZERO-TRUST SERVICE-TO-SERVICE AUTHORIZATION</text>
  <text x="30" y="60" fill="#94a3b8" font-size="12" font-weight="500">Envoy ext_authz Filter + OPA Sidecar Architecture Pattern</text>

  <!-- POD BOUNDARY (Upstream Service Pod) -->
  <rect x="360" y="110" width="480" height="390" rx="16" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 6" filter="url(#drop-shadow)" />
  <text x="380" y="140" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">UPSTREAM KUBERNETES POD BOUNDARY (localhost)</text>

  <!-- Downstream Service (Client) -->
  <g transform="translate(60, 200)" filter="url(#drop-shadow)">
    <rect width="180" height="100" rx="12" fill="url(#client-grad)" />
    <text x="90" y="45" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Downstream Service</text>
    <text x="90" y="65" fill="#e0f2fe" font-size="11" font-weight="500" text-anchor="middle">Client (Go/Rust/Java)</text>
    <rect x="15" y="75" width="150" height="18" rx="4" fill="#1e3a8a" opacity="0.6" />
    <text x="90" y="88" fill="#93c5fd" font-size="9" font-weight="600" text-anchor="middle">mTLS Client Certs</text>
  </g>

  <!-- Envoy Proxy Sidecar -->
  <g transform="translate(390, 200)" filter="url(#drop-shadow)">
    <rect width="180" height="100" rx="12" fill="url(#envoy-grad)" />
    <text x="90" y="40" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Envoy Proxy</text>
    <text x="90" y="58" fill="#d1fae5" font-size="11" font-weight="500" text-anchor="middle">Sidecar (ext_authz)</text>
    <!-- Ports and Filters detail -->
    <rect x="15" y="70" width="150" height="22" rx="4" fill="#064e3b" opacity="0.6" />
    <text x="90" y="84" fill="#6ee7b7" font-size="9" font-weight="600" text-anchor="middle">Port 443 (Ingress mTLS)</text>
  </g>

  <!-- Upstream Service (App Container) -->
  <g transform="translate(630, 200)" filter="url(#drop-shadow)">
    <rect width="180" height="100" rx="12" fill="url(#app-grad)" />
    <text x="90" y="45" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Upstream App</text>
    <text x="90" y="65" fill="#f5f3ff" font-size="11" font-weight="500" text-anchor="middle">Target API (Container)</text>
    <rect x="15" y="75" width="150" height="18" rx="4" fill="#4c1d95" opacity="0.6" />
    <text x="90" y="88" fill="#ddd6fe" font-size="9" font-weight="600" text-anchor="middle">Port 8080 (HTTP/gRPC)</text>
  </g>

  <!-- OPA Agent Sidecar -->
  <g transform="translate(390, 380)" filter="url(#drop-shadow)">
    <rect width="180" height="100" rx="12" fill="url(#opa-grad)" />
    <text x="90" y="40" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Open Policy Agent</text>
    <text x="90" y="58" fill="#fef3c7" font-size="11" font-weight="500" text-anchor="middle">OPA Sidecar (gRPC API)</text>
    <rect x="15" y="70" width="150" height="22" rx="4" fill="#78350f" opacity="0.6" />
    <text x="90" y="84" fill="#fde047" font-size="9" font-weight="600" text-anchor="middle">Port 9001 (ext_authz v3)</text>
  </g>

  <!-- OPA Bundle Server / Control Plane -->
  <g transform="translate(630, 380)" filter="url(#drop-shadow)">
    <rect width="180" height="100" rx="12" fill="url(#bundle-grad)" />
    <text x="90" y="45" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">OPA Bundle Server</text>
    <text x="90" y="65" fill="#f1f5f9" font-size="10" font-weight="500" text-anchor="middle">Policy Control Plane</text>
    <rect x="15" y="75" width="150" height="18" rx="4" fill="#334155" opacity="0.6" />
    <text x="90" y="88" fill="#cbd5e1" font-size="9" font-weight="600" text-anchor="middle">Rego Bundles / Data</text>
  </g>

  <!-- FLOW ARROWS & LABELS -->

  <!-- Flow 1: Client to Envoy Ingress -->
  <g>
    <!-- Arrow -->
    <path d="M 240,250 L 380,250" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" />
    <circle cx="240" cy="250" r="4" fill="#3b82f6" />
    <text x="310" y="235" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle">1. TLS Request</text>
    <text x="310" y="247" fill="#64748b" font-size="8" font-weight="500" text-anchor="middle">(HTTPS/mTLS)</text>
  </g>

  <!-- Flow 2: Envoy to OPA ext_authz (gRPC) -->
  <g>
    <path d="M 465,300 L 465,370" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow-orange)" />
    <circle cx="465" cy="300" r="4" fill="#10b981" />
    <text x="515" y="330" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="start">2. Authz Check</text>
    <text x="515" y="342" fill="#94a3b8" font-size="8" font-weight="500" text-anchor="start">(gRPC CheckRequest)</text>
  </g>

  <!-- Flow 3: OPA Policy Evaluation / Response to Envoy -->
  <g>
    <path d="M 495,370 L 495,310" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
    <text x="430" y="345" fill="#34d399" font-size="10" font-weight="700" text-anchor="end">3. Allow/Deny</text>
    <text x="430" y="357" fill="#94a3b8" font-size="8" font-weight="500" text-anchor="end">(HTTP 200 OK / 403)</text>
  </g>

  <!-- Flow 4: Envoy to App Container (Localhost bypass) -->
  <g>
    <path d="M 570,250 L 620,250" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />
    <circle cx="570" cy="250" r="4" fill="#10b981" />
    <text x="595" y="235" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">4. Forward</text>
    <text x="595" y="247" fill="#64748b" font-size="8" font-weight="500" text-anchor="middle">(HTTP/localhost)</text>
  </g>

  <!-- Flow 5: Policy Bundles pulling (Asynchronous) -->
  <g>
    <path d="M 630,430 L 580,430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow-gray)" />
    <text x="605" y="415" fill="#cbd5e1" font-size="9" font-weight="600" text-anchor="middle">Bundle Poll</text>
    <text x="605" y="425" fill="#64748b" font-size="8" font-weight="500" text-anchor="middle">HTTP/JSON</text>
  </g>

  <!-- Marker definitions for arrows -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
