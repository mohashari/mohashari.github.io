<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tpm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.05em">
    TPM 2.0 Ephemeral Vault Token Attestation Flow
  </text>
  
  <!-- Subtitle -->
  <text x="450" y="55" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-style="italic">
    Hardware-Rooted Identity for Bootstrapping Trust on Bare-Metal Servers
  </text>

  <!-- BOUNDARIES -->
  <!-- Bare-Metal Host Boundary -->
  <rect x="30" y="80" width="320" height="440" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" rx="8"/>
  <text x="45" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">BARE-METAL HOST (UNTRUSTED OS)</text>

  <!-- Attestation Validator Boundary -->
  <rect x="390" y="80" width="240" height="440" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" rx="8"/>
  <text x="405" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">ATTESTATION VERIFIER</text>

  <!-- Vault Boundary -->
  <rect x="670" y="80" width="200" height="440" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" rx="8"/>
  <text x="685" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">VAULT CLUSTER</text>

  <!-- NODES & COMPONENTS -->

  <!-- TPM 2.0 Chip -->
  <g transform="translate(60, 310)" filter="url(#shadow)">
    <rect width="260" height="180" fill="url(#box-grad)" stroke="#d97706" stroke-width="2" rx="6"/>
    <rect width="260" height="30" fill="url(#tpm-grad)" rx="6"/>
    <text x="130" y="20" text-anchor="middle" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TPM 2.0 HARDWARE CHIP</text>
    
    <!-- Endorsement Key -->
    <rect x="15" y="45" width="110" height="50" fill="#1e293b" stroke="#b45309" stroke-width="1" rx="4"/>
    <text x="70" y="62" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Endorsement Key</text>
    <text x="70" y="78" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">(EK - Burned in)</text>

    <!-- Attestation Key -->
    <rect x="135" y="45" width="110" height="50" fill="#1e293b" stroke="#d97706" stroke-width="1" rx="4"/>
    <text x="190" y="62" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Attestation Key</text>
    <text x="190" y="78" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">(AK - Ephemeral)</text>

    <!-- PCR Registers -->
    <rect x="15" y="110" width="230" height="55" fill="#0f172a" stroke="#b45309" stroke-dasharray="2 2" rx="4"/>
    <text x="130" y="128" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Platform Configuration Registers</text>
    <text x="130" y="145" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9">PCR[0..7] (Firmware, Boot, Kernel Hashes)</text>
  </g>

  <!-- Host Agent -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="260" height="120" fill="url(#box-grad)" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <text x="130" y="25" text-anchor="middle" fill="#eff6ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Host Attestation Agent</text>
    <text x="130" y="45" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Runs in early boot systemd</text>
    
    <!-- tmpfs mount -->
    <rect x="20" y="65" width="220" height="40" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" rx="4"/>
    <text x="130" y="82" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">tmpfs Mount (/run/vault)</text>
    <text x="130" y="97" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">vault_token (RAM only)</text>
  </g>

  <!-- Verifier Service -->
  <g transform="translate(405, 130)" filter="url(#shadow)">
    <rect width="210" height="360" fill="url(#box-grad)" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="105" y="25" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Verification Engine</text>

    <!-- EK Validator -->
    <rect x="15" y="55" width="180" height="50" fill="#065f46" stroke="#10b981" stroke-width="1" rx="4"/>
    <text x="105" y="72" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1. EK Cert Validation</text>
    <text x="105" y="87" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Against Manufacturer CA</text>

    <!-- Credential Challenge -->
    <rect x="15" y="125" width="180" height="70" fill="#065f46" stroke="#10b981" stroke-width="1" rx="4"/>
    <text x="105" y="142" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2. Credential Activation</text>
    <text x="105" y="160" text-anchor="middle" fill="#d1fae5" font-family="monospace" font-size="9">MakeCredential(EK, AK)</text>
    <text x="105" y="175" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Decrypt challenge via TPM</text>

    <!-- PCR Policy Engine -->
    <rect x="15" y="215" width="180" height="50" fill="#065f46" stroke="#10b981" stroke-width="1" rx="4"/>
    <text x="105" y="232" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3. PCR Policy Check</text>
    <text x="105" y="247" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Validates Golden PCR state</text>

    <!-- Token Requestor -->
    <rect x="15" y="285" width="180" height="55" fill="#065f46" stroke="#10b981" stroke-width="1" rx="4"/>
    <text x="105" y="302" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4. Vault Token Exchange</text>
    <text x="105" y="318" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Uses Vault AppRole to</text>
    <text x="105" y="330" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">mint ephemeral token</text>
  </g>

  <!-- HashiCorp Vault Node -->
  <g transform="translate(690, 130)" filter="url(#shadow)">
    <rect width="160" height="360" fill="url(#box-grad)" stroke="#f43f5e" stroke-width="2" rx="6"/>
    <text x="80" y="30" text-anchor="middle" fill="#fff1f2" font-family="system-ui, sans-serif" font-size="15" font-weight="700">HashiCorp Vault</text>
    
    <!-- AppRole & Token Store -->
    <rect x="15" y="80" width="130" height="80" fill="#4c0519" stroke="#f43f5e" stroke-dasharray="2 2" rx="4"/>
    <text x="80" y="105" text-anchor="middle" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AppRole Engine</text>
    <text x="80" y="125" text-anchor="middle" fill="#fda4af" font-family="monospace" font-size="9">Role: node-auth</text>
    <text x="80" y="140" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">TTL: 1 hour max</text>

    <path d="M 30,220 L 130,220" stroke="#f43f5e" stroke-width="1"/>

    <!-- Policies -->
    <rect x="15" y="260" width="130" height="70" fill="#4c0519" stroke="#f43f5e" stroke-width="1" rx="4"/>
    <text x="80" y="285" text-anchor="middle" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Node Identity Policy</text>
    <text x="80" y="305" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="9">read secret/data/*</text>
    <text x="80" y="318" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="9">no token creation</text>
  </g>

  <!-- FLOW INTERFACE ARROWS & ANNOTATIONS -->

  <!-- 1. Host Agent to TPM (Read EK/AK) -->
  <path d="M 190,252 L 190,300" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="180" y="280" text-anchor="end" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="600">1. Generate AK &amp; Quote</text>

  <!-- 2. Host Agent to Verifier (Send Attestation Request) -->
  <path d="M 322,150 L 403,150" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="362" y="142" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9" font-weight="600">2. Send Quote + EK/AK</text>

  <!-- 3. Challenge: Verifier to Host Agent (MakeCredential challenge) -->
  <path d="M 403,200 L 322,200" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="362" y="192" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">3. Decrypt Challenge</text>

  <!-- 4. Decrypt challenge: Host Agent to TPM (ActivateCredential) -->
  <path d="M 110,252 L 110,300" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="120" y="280" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="600">4. Activate Cred</text>

  <!-- 5. Challenge response: Host Agent to Verifier (Verify Decrypted Challenge) -->
  <path d="M 322,230 L 403,230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="362" y="224" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9" font-weight="600">5. Prove Decrypt</text>

  <!-- 6. Verifier to Vault (AppRole authenticate + generate token) -->
  <path d="M 617,420 L 688,420" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="652" y="412" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">6. Auth &amp; Issue</text>

  <!-- 7. Vault to Verifier (Return short-lived Vault Token) -->
  <path d="M 688,450 L 617,450" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="652" y="468" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="9" font-weight="600">7. Vault Token</text>

  <!-- 8. Verifier to Host Agent (Deliver Vault Token) -->
  <path d="M 405,480 L 190,480 L 190,252" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-green)"/>
  <text x="300" y="472" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">8. Write Token to tmpfs</text>
</svg>