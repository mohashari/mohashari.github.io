<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients for Components -->
    <linearGradient id="app-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kernel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="otel-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="ebpf-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d946ef" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bg-grad)" rx="12" />

  <!-- Outer Borders/Grid Subtly -->
  <rect x="5" y="5" width="990" height="640" fill="none" stroke="#1e293b" stroke-width="2" rx="10" />

  <!-- Diagram Title -->
  <text x="30" y="45" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">
    eBPF-Enriched OpenTelemetry Architecture
  </text>
  <text x="30" y="65" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#94a3b8">
    Correlating socket-level TCP/IP state latency with application-level distributed trace spans
  </text>

  <!-- ==================== USER SPACE ==================== -->
  <rect x="40" y="90" width="920" height="230" fill="url(#app-grad)" stroke="#334155" stroke-width="1.5" rx="8" />
  <text x="55" y="115" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">
    USER SPACE
  </text>

  <!-- Application Box -->
  <rect x="80" y="140" width="340" height="150" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="6" />
  <text x="100" y="165" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">
    Go / Rust HTTP Service
  </text>
  <text x="100" y="185" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#94a3b8">
    PID: 48102 | Threads: T1, T2
  </text>

  <!-- OTel SDK Block inside Application -->
  <rect x="230" y="200" width="170" height="75" fill="url(#otel-grad)" stroke="#06b6d4" stroke-width="1" rx="4" fill-opacity="0.15" />
  <text x="242" y="222" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#06b6d4">
    OpenTelemetry SDK
  </text>
  <rect x="242" y="235" width="146" height="30" fill="#0891b2" rx="3" />
  <text x="250" y="254" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">
    Context: TraceParent Header
  </text>

  <!-- Socket API abstraction inside Application -->
  <rect x="100" y="210" width="110" height="60" fill="#1e293b" stroke="#475569" rx="4" />
  <text x="110" y="230" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9">
    socket() / write()
  </text>
  <text x="110" y="248" font-family="'Inter', -apple-system, sans-serif" font-size="9" fill="#94a3b8">
    FD: 12 (TCP client)
  </text>

  <!-- eBPF User Agent / Collector -->
  <rect x="580" y="140" width="340" height="150" fill="#0f172a" stroke="#d946ef" stroke-width="1.5" rx="6" stroke-dasharray="0" />
  <text x="600" y="165" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#d946ef">
    eBPF User-Space Agent
  </text>
  <text x="600" y="185" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#94a3b8">
    (e.g., OTel eBPF Receiver / Custom Daemon)
  </text>

  <!-- In-Memory Correlation Engine -->
  <rect x="600" y="210" width="300" height="65" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" rx="4" />
  <text x="612" y="230" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#c084fc">
    Correlation Engine
  </text>
  <text x="612" y="248" font-family="'Inter', -apple-system, sans-serif" font-size="9" fill="#e2e8f0">
    Match: (IP/Port, PID) → TraceParent from Socket Buffer
  </text>


  <!-- ==================== KERNEL SPACE ==================== -->
  <rect x="40" y="360" width="920" height="250" fill="url(#kernel-grad)" stroke="#4c1d95" stroke-width="1.5" rx="8" />
  <text x="55" y="385" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#818cf8" letter-spacing="1">
    KERNEL SPACE (LINUX)
  </text>

  <!-- eBPF Programs Block -->
  <rect x="80" y="410" width="360" height="180" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" rx="6" />
  <text x="95" y="432" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#818cf8">
    eBPF Latency Tracer Program
  </text>

  <!-- Hooks -->
  <g transform="translate(95, 450)">
    <rect x="0" y="0" width="310" height="32" fill="#1e1b4b" stroke="#4f46e5" rx="4" />
    <circle cx="15" cy="16" r="6" fill="#10b981" />
    <text x="30" y="20" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#f8fafc">
      kprobe:sys_enter_connect / sys_exit
    </text>
  </g>
  <g transform="translate(95, 492)">
    <rect x="0" y="0" width="310" height="32" fill="#1e1b4b" stroke="#4f46e5" rx="4" />
    <circle cx="15" cy="16" r="6" fill="#10b981" />
    <text x="30" y="20" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#f8fafc">
      kprobe:tcp_v4_connect / tcp_sendmsg
    </text>
  </g>
  <g transform="translate(95, 534)">
    <rect x="0" y="0" width="310" height="32" fill="#1e1b4b" stroke="#4f46e5" rx="4" />
    <circle cx="15" cy="16" r="6" fill="#f59e0b" />
    <text x="30" y="20" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#f8fafc">
      tracepoint:tcp:tcp_retransmit_skb
    </text>
  </g>

  <!-- Kernel Network Stack / Socket Layer -->
  <rect x="490" y="410" width="160" height="180" fill="#111827" stroke="#4b5563" stroke-width="1.5" rx="6" />
  <text x="505" y="432" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#9ca3af">
    TCP/IP Socket Layer
  </text>
  
  <rect x="505" y="450" width="130" height="35" fill="#1f2937" stroke="#374151" rx="4" />
  <text x="515" y="472" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#e5e7eb">
    struct sock / socket
  </text>

  <rect x="505" y="500" width="130" height="35" fill="#1f2937" stroke="#374151" rx="4" />
  <text x="515" y="522" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#e5e7eb">
    TCP Queue &amp; Buffers
  </text>

  <rect x="505" y="550" width="130" height="30" fill="#1f2937" stroke="#374151" rx="4" />
  <text x="515" y="568" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#f87171">
    NIC Ring Buffer
  </text>

  <!-- eBPF Maps -->
  <rect x="710" y="410" width="210" height="180" fill="#1e1b4b" stroke="#d946ef" stroke-width="1.5" rx="6" filter="url(#glow-purple)" />
  <text x="725" y="432" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#d946ef">
    eBPF Ring Buffer &amp; Maps
  </text>

  <!-- Map 1 -->
  <rect x="725" y="450" width="180" height="35" fill="#0f172a" stroke="#8b5cf6" rx="4" />
  <text x="735" y="471" font-family="'Courier New', monospace" font-size="10" fill="#f472b6">
    map: socket_conns_map
  </text>

  <!-- Map 2 -->
  <rect x="725" y="495" width="180" height="35" fill="#0f172a" stroke="#8b5cf6" rx="4" />
  <text x="735" y="516" font-family="'Courier New', monospace" font-size="10" fill="#f472b6">
    map: connect_start_map
  </text>

  <!-- Map 3 -->
  <rect x="725" y="540" width="180" height="35" fill="#0f172a" stroke="#8b5cf6" rx="4" />
  <text x="735" y="561" font-family="'Courier New', monospace" font-size="10" fill="#f472b6">
    ringbuf: latency_events
  </text>

  <!-- ==================== FLOW ARROWS & INTERACTIONS ==================== -->
  
  <!-- App triggers socket system calls (User Space -> Kernel Space) -->
  <path d="M 150 270 L 150 410" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="80" y="340" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#94a3b8">
    1. Syscalls (write/connect)
  </text>

  <!-- eBPF kprobes hook TCP/IP operations -->
  <path d="M 440 467 L 490 467" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan)" />
  <path d="M 440 517 L 490 517" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan)" />
  <text x="445" y="495" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#06b6d4">
    2. Hook
  </text>

  <!-- eBPF programs write records to Maps -->
  <path d="M 440 550 C 490 580, 680 580, 710 565" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="530" y="590" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#c084fc">
    3. Publish socket info and metrics to eBPF Map
  </text>

  <!-- User-space Agent polls eBPF Maps -->
  <path d="M 815 410 L 815 275" fill="none" stroke="#d946ef" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="825" y="345" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#d946ef" font-weight="bold">
    4. Consume Ringbuf Events
  </text>

  <!-- Context propagation / tracing bridge -->
  <!-- In our design, OTel SDK passes tracing metadata. eBPF reads tracing metadata from the socket payload or correlates it. -->
  <path d="M 315 275 C 315 330, 710 330, 710 275" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow-cyan)" />
  <text x="440" y="325" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#06b6d4">
    5. Correlate (TraceParent via payload inspection or Netfilter/sk_buff metadata)
  </text>
  
</svg>
