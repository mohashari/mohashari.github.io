<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Component Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="embedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="faissGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="kvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" rx="16" fill="url(#bgGrad)" />
  <rect width="996" height="646" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Title & Context -->
  <text x="40" y="50" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.025em">IN-MEMORY SEMANTIC CACHE ARCHITECTURE</text>
  <text x="40" y="75" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">Low-latency vector similarity cache layer using Rust, FAISS, and in-memory K-V store (Moka)</text>

  <!-- ==================== COMPONENTS ==================== -->

  <!-- 1. Client / API Consumer -->
  <g transform="translate(40, 240)" filter="url(#shadow)">
    <rect width="140" height="100" rx="12" fill="url(#clientGrad)" />
    <text x="70" y="45" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">API Client</text>
    <text x="70" y="65" fill="#e0f2fe" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">User Queries</text>
  </g>

  <!-- 2. Rust Cache Coordinator (The Heart) -->
  <g transform="translate(240, 200)" filter="url(#shadow)">
    <rect width="220" height="180" rx="12" fill="none" stroke="#f97316" stroke-width="2" />
    <rect width="216" height="176" x="2" y="2" rx="10" fill="#1e293b" />
    <rect width="220" height="40" rx="10" fill="url(#rustGrad)" />
    <text x="110" y="26" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Rust Coordinator</text>
    <text x="110" y="70" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Semantic Cache Engine</text>
    <text x="110" y="95" fill="#f97316" font-family="monospace" font-size="12" text-anchor="middle">Distance Threshold: θ</text>
    
    <!-- Inner Box: Similarity Checker -->
    <rect width="180" height="50" x="20" y="115" rx="6" fill="#0f172a" stroke="#475569" />
    <text x="110" y="145" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Decision: Hit if d &lt; θ</text>
  </g>

  <!-- 3. Embedding Generator (ONNX / local model) -->
  <g transform="translate(240, 40)" filter="url(#shadow)">
    <rect width="220" height="90" rx="12" fill="url(#embedGrad)" />
    <text x="110" y="35" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Embedding Generator</text>
    <text x="110" y="55" fill="#f3e8ff" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">onnxruntime (all-MiniLM-L6-v2)</text>
    <text x="110" y="72" fill="#d8b4fe" font-family="monospace" font-size="11" text-anchor="middle">Dense Vector (384-dim)</text>
  </g>

  <!-- 4. FAISS Index (In-memory C++ Binding) -->
  <g transform="translate(560, 120)" filter="url(#shadow)">
    <rect width="180" height="140" rx="12" fill="url(#faissGrad)" />
    <text x="90" y="40" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">FAISS Index</text>
    <text x="90" y="60" fill="#dcfce7" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">IndexFlatL2 / IndexIVF</text>
    <!-- Vector representations visual -->
    <rect width="140" height="50" x="20" y="75" rx="6" fill="#14532d" />
    <text x="90" y="95" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">[v_0, v_1, v_2, ... v_n]</text>
    <text x="90" y="112" fill="#4ade80" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Returns: Index ID, Distance</text>
  </g>

  <!-- 5. In-Memory Key-Value Store (Moka Cache) -->
  <g transform="translate(560, 320)" filter="url(#shadow)">
    <rect width="180" height="140" rx="12" fill="url(#kvGrad)" />
    <text x="90" y="40" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Moka K-V Store</text>
    <text x="90" y="60" fill="#fef9c3" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">In-Memory Key-Value</text>
    
    <rect width="140" height="50" x="20" y="75" rx="6" fill="#713f12" />
    <text x="90" y="95" fill="#fde047" font-family="monospace" font-size="11" text-anchor="middle">ID -&gt; JSON Response</text>
    <text x="90" y="112" fill="#fef08a" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">TTL Expiry &amp; LIRS Eviction</text>
  </g>

  <!-- 6. LLM Provider (Upstream API) -->
  <g transform="translate(240, 500)" filter="url(#shadow)">
    <rect width="220" height="90" rx="12" fill="url(#llmGrad)" />
    <text x="110" y="35" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Upstream LLM API</text>
    <text x="110" y="55" fill="#fce7f3" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">External LLM (e.g. Claude, GPT-4)</text>
    <text x="110" y="72" fill="#fbcfe8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Costly / High Latency (1.5s+)</text>
  </g>

  <!-- ==================== FLOW LINES & ARROWS ==================== -->

  <!-- Client <-> Coordinator -->
  <path d="M 180 270 L 232 270" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="205" y="260" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">1. Query</text>

  <path d="M 232 310 L 180 310" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="205" y="325" fill="#22c55e" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">6. Hit / Resp</text>

  <!-- Coordinator <-> Embedding -->
  <path d="M 320 200 L 320 138" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="290" y="175" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">2. Embed</text>

  <path d="M 380 130 L 380 192" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="420" y="175" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">3. Return Vec</text>

  <!-- Coordinator <-> FAISS Index -->
  <path d="M 460 220 L 550 180" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="500" y="190" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" transform="rotate(-23.5 500 190)">4a. Search</text>

  <path d="M 550 210 L 462 250" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="245" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" transform="rotate(-23.5 510 245)">4b. Dist &amp; ID</text>

  <!-- Coordinator <-> Moka (Cache Hit Path) -->
  <path d="M 460 300 L 550 340" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="500" y="315" fill="#22c55e" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" transform="rotate(23.5 500 315)">5a. Fetch JSON</text>

  <path d="M 550 370 L 462 410" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="510" y="395" fill="#22c55e" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" transform="rotate(23.5 510 395)">5b. Cached Data</text>

  <!-- Coordinator <-> LLM API (Cache Miss Path) -->
  <path d="M 320 380 L 320 492" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="270" y="445" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">5c. Query LLM</text>

  <path d="M 380 492 L 380 388" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  <text x="430" y="445" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">5d. LLM Resp</text>

  <!-- Coordinator -> Update Cache (FAISS + Moka) on Miss -->
  <path d="M 440 380 Q 500 480 550 420" fill="none" stroke="#eab308" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="505" y="465" fill="#eab308" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">5e. Write-through Cache &amp; Index</text>

  <!-- Legend / Flow indicators -->
  <g transform="translate(760, 480)" filter="url(#shadow)">
    <rect width="200" height="130" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="15" y="25" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">LEGEND</text>
    
    <line x1="15" y1="45" x2="45" y2="45" stroke="#22c55e" stroke-width="3" />
    <text x="55" y="49" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="11">Cache Hit Path (Fast)</text>

    <line x1="15" y1="70" x2="45" y2="70" stroke="#ef4444" stroke-width="3" />
    <text x="55" y="74" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="11">Cache Miss Path (Slow)</text>

    <line x1="15" y1="95" x2="45" y2="95" stroke="#eab308" stroke-dasharray="4" stroke-width="2" />
    <text x="55" y="99" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="11">Write-back/Populate</text>
  </g>
</svg>
