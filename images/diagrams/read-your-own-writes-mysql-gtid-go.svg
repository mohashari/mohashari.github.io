<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="backend-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="replica-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#a78bfa" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" />
  
  <!-- Outer Border -->
  <rect width="100%" height="100%" fill="none" stroke="#334155" stroke-width="2" rx="12" />

  <!-- Title -->
  <text x="30" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">MySQL GTID-Based Read-Your-Own-Writes (RYOW) Flow</text>
  <text x="30" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Consistency enforcement in replicated database architectures using Go</text>

  <!-- CLIENT BOX -->
  <rect x="50" y="210" width="160" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="50" y="210" width="160" height="35" rx="8" fill="url(#client-grad)" opacity="0.9" />
  <text x="130" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Client (Web/App)</text>
  <text x="130" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Tracks Session GTID</text>
  <text x="130" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">e.g., in cookie or header</text>
  <rect x="70" y="315" width="120" height="22" rx="4" fill="#0c4a6e" />
  <text x="130" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="bold">X-GTID: UUID:1-240</text>

  <!-- GO BACKEND BOX -->
  <rect x="330" y="150" width="220" height="280" rx="8" fill="#1e293b" stroke="#2dd4bf" stroke-width="2" />
  <rect x="330" y="150" width="220" height="35" rx="8" fill="url(#backend-grad)" opacity="0.9" />
  <text x="440" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Go Backend Service</text>
  
  <!-- Go Backend Internals -->
  <rect x="350" y="205" width="180" height="60" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="440" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="bold">Write Handler</text>
  <text x="440" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Extracts Primary GTID</text>
  <text x="440" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Injects into HTTP Response</text>

  <rect x="350" y="285" width="180" height="85" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="440" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="bold">Read Router Middleware</text>
  <text x="440" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Parses client's requested GTID</text>
  <text x="440" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">WAIT_FOR_EXECUTED_GTID_SET</text>
  <text x="440" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#f43f5e" text-anchor="middle">Fallback to primary on timeout</text>

  <!-- MYSQL PRIMARY BOX -->
  <rect x="670" y="100" width="220" height="130" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2" />
  <rect x="670" y="100" width="220" height="35" rx="8" fill="url(#primary-grad)" opacity="0.9" />
  <text x="780" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">MySQL Primary (Writer)</text>
  <text x="780" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Executes mutating queries</text>
  <text x="780" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Generates GTID set</text>
  <text x="780" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">e.g. UUID:1-240</text>

  <!-- MYSQL REPLICA BOX -->
  <rect x="670" y="330" width="220" height="150" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2" />
  <rect x="670" y="330" width="220" height="35" rx="8" fill="url(#replica-grad)" opacity="0.9" />
  <text x="780" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">MySQL Replica (Reader)</text>
  <text x="780" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Replicates via binlog stream</text>
  <text x="780" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle" font-style="italic">WAIT_FOR_EXECUTED_GTID_SET()</text>
  <text x="780" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Blocks client read query until</text>
  <text x="780" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">replica GTID &gt;= client GTID</text>

  <!-- FLOW LINES / ARROWS -->
  
  <!-- 1. WRITE REQUEST (Client to Go Backend) -->
  <path d="M 210, 240 L 330, 240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="270" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">1. Write Request</text>
  
  <!-- 2. WRITE TO PRIMARY (Go Backend to Primary) -->
  <path d="M 550, 180 L 670, 150" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="610" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">2. INSERT/UPDATE</text>

  <!-- 3. PRIMARY RETURNS GTID (Primary to Go Backend) -->
  <path d="M 670, 185 L 550, 215" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <text x="610" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">3. Return GTID Set</text>

  <!-- 4. RESPOND TO CLIENT WITH GTID (Go Backend to Client) -->
  <path d="M 330, 265 L 210, 265" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="270" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">4. HTTP 200 + X-GTID</text>

  <!-- REPLICATION LINK -->
  <path d="M 780, 230 L 780, 330" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)" />
  <text x="850" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">Async Replication</text>
  <text x="850" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(GTID events streaming)</text>

  <!-- 5. READ REQUEST (Client to Go Backend) -->
  <path d="M 210, 320 L 330, 320" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="270" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">5. Read with X-GTID</text>

  <!-- 6. WAIT FOR GTID SET (Go Backend to Replica) -->
  <path d="M 550, 345 L 670, 365" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="610" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">6. Wait for GTID</text>

  <!-- 7. DB RETURNS FRESH DATA (Replica to Go Backend) -->
  <path d="M 670, 420 L 550, 400" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="610" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">7. Execute Read</text>

  <!-- 8. RETURN CONSISTENT RESP (Go Backend to Client) -->
  <path d="M 330, 350 L 210, 350" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)" />
  <text x="270" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#2dd4bf" text-anchor="middle">8. Fresh Data Resp</text>

</svg>
