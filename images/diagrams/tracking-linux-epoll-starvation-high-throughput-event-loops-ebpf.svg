<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #adbac7; }
      .label { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #adbac7; }
      .label-bold { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #adbac7; }
      .label-sm { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #768390; }
      .box { stroke-width: 1.5; rx: 6; }
      .box-user { fill: #1c2128; stroke: #444c56; }
      .box-kernel { fill: #13233a; stroke: #3162a6; }
      .box-ebpf { fill: #1b2d24; stroke: #347d39; }
      .line { stroke: #444c56; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .arrow { stroke: #539bf5; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #e5534b; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-green { stroke: #57ab5a; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .time-bar { stroke-width: 12; stroke-linecap: round; }
      .time-epoll { stroke: #2d3139; }
      .time-work { stroke: #539bf5; }
      .time-starve { stroke: #e5534b; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#539bf5" />
    </marker>
    <marker id="arrowhead-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5534b" />
    </marker>
    <marker id="arrowhead-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57ab5a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <text x="30" y="35" class="title">Linux epoll_wait Starvation Tracking via eBPF</text>

  <!-- User Space / Kernel Space boundary -->
  <line x1="30" y1="210" x2="770" y2="210" stroke="#373e47" stroke-width="2" stroke-dasharray="8 4" />
  <text x="35" y="200" class="label-bold" fill="#768390">USER SPACE</text>
  <text x="35" y="230" class="label-bold" fill="#768390">KERNEL SPACE</text>

  <!-- User Space Event Loop Box -->
  <rect x="50" y="60" width="220" height="110" class="box box-user" />
  <text x="65" y="85" class="label-bold">Event Loop Thread</text>
  <text x="65" y="105" class="label-sm">• Executes non-blocking callbacks</text>
  <text x="65" y="125" class="label-sm">• Dispatches I/O events</text>
  <text x="65" y="145" class="label-sm" fill="#e5534b">• Vulnerable to CPU-bound stalls</text>

  <!-- Kernel Space Epoll subsystem -->
  <rect x="50" y="260" width="220" height="110" class="box box-kernel" />
  <text x="65" y="285" class="label-bold" fill="#539bf5">epoll Subsystem</text>
  <text x="65" y="305" class="label-sm">• sys_enter_epoll_wait</text>
  <text x="65" y="325" class="label-sm">• OS blocks thread until events ready</text>
  <text x="65" y="345" class="label-sm">• sys_exit_epoll_wait</text>

  <!-- eBPF Starvation Monitor Box -->
  <rect x="510" y="260" width="240" height="140" class="box box-ebpf" />
  <text x="525" y="285" class="label-bold" fill="#57ab5a">eBPF Starvation Tracer</text>
  <text x="525" y="310" class="label-sm">• sys_exit_epoll_wait -> Record Exit TS</text>
  <text x="525" y="330" class="label-sm">• sys_enter_epoll_wait -> Delta = Now - Exit TS</text>
  <text x="525" y="350" class="label-sm" fill="#57ab5a">• Delta &gt; Threshold? Emit Ring Buffer Event</text>
  <text x="525" y="375" class="label-sm">• Tracks per-TID event loop overhead</text>

  <!-- Time Flow Timeline -->
  <g transform="translate(300, 40)">
    <text x="0" y="20" class="label-bold">Execution Timeline (Event Loop Thread)</text>
    
    <!-- Time axis line -->
    <line x1="0" y1="80" x2="450" y2="80" stroke="#444c56" stroke-width="2" />
    <polygon points="450,75 460,80 450,85" fill="#444c56" />
    <text x="430" y="98" class="label-sm">Time</text>

    <!-- epoll_wait active -->
    <line x1="10" y1="80" x2="80" y2="80" class="time-bar time-epoll" />
    <text x="15" y="65" class="label-sm">epoll_wait()</text>

    <!-- Normal work (short duration) -->
    <line x1="80" y1="80" x2="130" y2="80" class="time-bar time-work" />
    <text x="85" y="65" class="label-sm" fill="#539bf5">Callbacks</text>

    <!-- epoll_wait active -->
    <line x1="130" y1="80" x2="200" y2="80" class="time-bar time-epoll" />
    <text x="140" y="65" class="label-sm">epoll_wait()</text>

    <!-- STARVATION (Long work / blocking call) -->
    <line x1="200" y1="80" x2="380" y2="80" class="time-bar time-starve" />
    <text x="210" y="65" class="label-bold" fill="#e5534b">Starvation / CPU Stall</text>

    <!-- Next epoll_wait -->
    <line x1="380" y1="80" x2="430" y2="80" class="time-bar time-epoll" />
    
    <!-- Visualizing trace points -->
    <circle cx="80" cy="80" r="4" fill="#57ab5a" />
    <text x="80" y="105" class="label-sm" text-anchor="middle">exit_epoll</text>
    
    <circle cx="130" cy="80" r="4" fill="#539bf5" />
    <text x="130" y="105" class="label-sm" text-anchor="middle">enter_epoll</text>

    <circle cx="200" cy="80" r="4" fill="#57ab5a" />
    <text x="200" y="105" class="label-sm" text-anchor="middle">exit_epoll</text>
    
    <circle cx="380" cy="80" r="4" fill="#e5534b" />
    <text x="380" y="105" class="label-bold" fill="#e5534b" text-anchor="middle">enter_epoll</text>

    <!-- Measure bracket -->
    <path d="M 200 120 L 200 125 L 290 125 L 380 125 L 380 120" fill="none" stroke="#e5534b" stroke-width="1.5" />
    <text x="290" y="140" class="label-bold" fill="#e5534b" text-anchor="middle">Starvation Delta</text>
  </g>

  <!-- Connective Arrows -->
  <!-- Thread down to epoll wait -->
  <path d="M 160 170 Q 160 215 160 250" class="arrow" />
  
  <!-- Kernel tracepoints to eBPF tracer -->
  <path d="M 270 300 Q 390 300 500 300" class="arrow-green" />
  <text x="350" y="292" class="label-sm" fill="#57ab5a">Tracepoints</text>
</svg>