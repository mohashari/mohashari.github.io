<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <!-- Definitions for gradients, markers, and patterns -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="logical-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="physical-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="quant-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="callout-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
  </defs>
  
  <!-- Base Background -->
  <rect width="900" height="520" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title Block -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">vLLM Memory Management Architecture</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">PagedAttention Block Mapping &amp; KV Cache Quantization (FP8 / FP16)</text>

  <!-- Container 1: Logical KV Cache -->
  <rect x="30" y="90" width="240" height="400" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
  <text x="45" y="118" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Logical KV Cache (Request)</text>
  <text x="45" y="135" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">Contiguous token representation</text>

  <!-- Logical Block 0 -->
  <rect x="45" y="160" width="210" height="65" rx="8" fill="url(#logical-grad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="58" y="185" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Logical Block 0</text>
  <text x="58" y="202" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11">Tokens 0 - 15 (FP16/BF16)</text>
  
  <!-- Logical Block 1 -->
  <rect x="45" y="240" width="210" height="65" rx="8" fill="url(#logical-grad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="58" y="265" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Logical Block 1</text>
  <text x="58" y="282" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11">Tokens 16 - 31 (FP16/BF16)</text>

  <!-- Logical Block 2 (Partially Filled) -->
  <rect x="45" y="320" width="210" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="58" y="345" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Logical Block 2</text>
  <text x="58" y="362" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Tokens 32 - 47 (Allocating...)</text>

  <text x="45" y="420" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Logical View:</text>
  <text x="45" y="440" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Sequence of keys &amp; values is</text>
  <text x="45" y="455" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">contiguous in the request thread.</text>


  <!-- Container 2: Block Table -->
  <rect x="300" y="90" width="240" height="400" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
  <text x="315" y="118" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">vLLM Block Table</text>
  <text x="315" y="135" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">Maps logical pages to physical</text>

  <!-- Block Table Row 0 -->
  <rect x="315" y="160" width="210" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="325" y="187" fill="#f8fafc" font-family="monospace" font-size="12">Logical #0 ──&gt; Phys #7</text>

  <!-- Block Table Row 1 -->
  <rect x="315" y="215" width="210" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="325" y="242" fill="#f8fafc" font-family="monospace" font-size="12">Logical #1 ──&gt; Phys #3</text>

  <!-- Block Table Row 2 -->
  <rect x="315" y="270" width="210" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="325" y="297" fill="#f8fafc" font-family="monospace" font-size="12">Logical #2 ──&gt; Phys #12</text>

  <rect x="315" y="340" width="210" height="130" rx="8" fill="#111827" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="325" y="365" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Dynamic Translation Layer</text>
  <text x="325" y="385" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Like OS virtual memory paging,</text>
  <text x="325" y="400" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">this maps sequence index to non-</text>
  <text x="325" y="415" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">contiguous GPU physical frames.</text>
  <text x="325" y="435" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Result: 0% internal fragmentation</text>
  <text x="325" y="450" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Result: Zero pre-allocation waste</text>


  <!-- Container 3: Physical GPU VRAM -->
  <rect x="570" y="90" width="300" height="400" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
  <text x="585" y="118" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">GPU VRAM (Physical KV Cache)</text>
  <text x="585" y="135" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">Pre-allocated non-contiguous memory blocks</text>

  <!-- Physical Blocks Grid -->
  <!-- Row 1 -->
  <rect x="585" y="160" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="595" y="182" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #0</text>

  <rect x="655" y="160" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="665" y="182" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #1</text>

  <rect x="725" y="160" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="735" y="182" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #2</text>

  <rect x="795" y="160" width="60" height="35" rx="4" fill="url(#physical-grad)" stroke="#34d399" stroke-width="1.5"/>
  <text x="805" y="182" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #3</text>

  <!-- Row 2 -->
  <rect x="585" y="205" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="595" y="227" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #4</text>

  <rect x="655" y="205" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="665" y="227" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #5</text>

  <rect x="725" y="205" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="735" y="227" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #6</text>

  <rect x="795" y="205" width="60" height="35" rx="4" fill="url(#physical-grad)" stroke="#34d399" stroke-width="1.5"/>
  <text x="805" y="227" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #7</text>

  <!-- Row 3 -->
  <rect x="585" y="250" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="595" y="272" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #8</text>

  <rect x="655" y="250" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="665" y="272" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #9</text>

  <rect x="725" y="250" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="735" y="272" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #10</text>

  <rect x="795" y="250" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="805" y="272" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #11</text>

  <!-- Row 4 -->
  <rect x="585" y="295" width="60" height="35" rx="4" fill="url(#physical-grad)" stroke="#34d399" stroke-width="1.5"/>
  <text x="595" y="317" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #12</text>

  <rect x="655" y="295" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="665" y="317" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #13</text>

  <rect x="725" y="295" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="735" y="317" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #14</text>

  <rect x="795" y="295" width="60" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="805" y="317" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Phys #15</text>

  <!-- KV Cache Quantization Callout Box -->
  <rect x="585" y="350" width="270" height="125" rx="8" fill="url(#callout-grad)" stroke="#f97316" stroke-width="1.5"/>
  <text x="600" y="372" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">KV Quantization Optimization</text>
  
  <text x="600" y="395" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">FP16 / BF16 (No Quantization)</text>
  <rect x="600" y="402" width="240" height="10" rx="3" fill="#3b82f6"/>
  <text x="605" y="411" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="8">2 Bytes/Parameter (100% space)</text>
  
  <text x="600" y="435" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">FP8 / INT8 Quantized Block</text>
  <rect x="600" y="442" width="120" height="10" rx="3" fill="#f97316"/>
  <text x="605" y="451" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="8">1 Byte/Parameter (50% Space Savings)</text>
  <text x="730" y="451" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold">2x Throughput!</text>


  <!-- Connecting Arrows -->
  <!-- Logical Blocks to Block Table -->
  <path d="M 255 192 L 292 182" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <path d="M 255 272 L 292 237" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <path d="M 255 352 L 292 292" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" />

  <!-- Block Table to Physical Blocks -->
  <!-- Row 0 -> Phys #7 -->
  <path d="M 525 182 Q 625 182 787 215" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)" />
  <!-- Row 1 -> Phys #3 -->
  <path d="M 525 237 Q 625 237 787 182" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)" />
  <!-- Row 2 -> Phys #12 -->
  <path d="M 525 292 Q 545 292 577 305" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)" />
</svg>
