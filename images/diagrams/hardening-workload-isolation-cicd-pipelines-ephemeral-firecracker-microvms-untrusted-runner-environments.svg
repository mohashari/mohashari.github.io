<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="host-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="vm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="8" fill="#0b0f17" />
  <rect width="800" height="500" rx="8" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- Grid lines (subtle) -->
  <g stroke="#1f2937" stroke-width="0.5" opacity="0.3">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400" />
    <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" />
  </g>

  <!-- Title -->
  <text x="30" y="40" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Firecracker CI/CD Runner Architecture</text>
  <text x="30" y="60" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="12">Ephemeral MicroVM Isolation for Untrusted Pipeline Execution</text>

  <!-- CI/CD Control Plane (GitLab/GitHub) -->
  <g transform="translate(30, 100)">
    <rect width="180" height="340" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <text x="90" y="25" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CI/CD Control Plane</text>
    <line x1="15" y1="35" x2="165" y2="35" stroke="#374151" stroke-width="1" />
    
    <!-- GitLab/GitHub Runner Manager -->
    <rect x="15" y="55" width="150" height="70" rx="4" fill="#111827" stroke="#4b5563" />
    <text x="90" y="85" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Runner Manager</text>
    <text x="90" y="105" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(GitLab Runner / GHA)</text>
    
    <!-- Event Queue / DB -->
    <rect x="15" y="150" width="150" height="70" rx="4" fill="#111827" stroke="#4b5563" />
    <text x="90" y="180" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job Queue</text>
    <text x="90" y="200" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(Untrusted Code)</text>

    <!-- Artifact Registry -->
    <rect x="15" y="245" width="150" height="75" rx="4" fill="#111827" stroke="#4b5563" />
    <text x="90" y="275" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Artifact Store</text>
    <text x="90" y="295" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(S3 / Internal Registry)</text>
  </g>

  <!-- Host Machine Boundary -->
  <g transform="translate(250, 100)">
    <rect width="520" height="340" rx="8" fill="url(#host-grad)" stroke="#4b5563" stroke-width="2" />
    <text x="20" y="25" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Bare-Metal / Nested VM Host (Ubuntu/Bottlerocket)</text>
    <line x1="20" y1="35" x2="500" y2="35" stroke="#374151" stroke-width="1.5" />

    <!-- Orchestrator / VM Provisioner Daemon -->
    <g transform="translate(20, 55)">
      <rect width="180" height="260" rx="6" fill="#111827" stroke="#6366f1" stroke-width="1.5" />
      <text x="90" y="25" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Firecracker Daemon</text>
      <text x="90" y="40" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">(Go / gRPC Service)</text>
      <line x1="15" y1="50" x2="165" y2="50" stroke="#1f2937" stroke-width="1" />
      
      <!-- VM Provisioner Logic -->
      <rect x="15" y="65" width="150" height="45" rx="4" fill="#1f2937" stroke="#374151" />
      <text x="90" y="85" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">1. Pool Allocator</text>
      <text x="90" y="98" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">(Pre-warmed MicroVMs)</text>

      <rect x="15" y="125" width="150" height="45" rx="4" fill="#1f2937" stroke="#374151" />
      <text x="90" y="145" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">2. Jailer Configuration</text>
      <text x="90" y="158" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">(cgroups, chroot, namespaces)</text>

      <rect x="15" y="185" width="150" height="60" rx="4" fill="#1f2937" stroke="#374151" />
      <text x="90" y="205" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">3. Firecracker API Client</text>
      <text x="90" y="220" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Unix Socket Communication</text>
      <text x="90" y="235" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">(/run/firecracker.socket)</text>
    </g>

    <!-- Ephemeral Firecracker MicroVM -->
    <g transform="translate(230, 55)">
      <rect width="270" height="260" rx="6" fill="url(#vm-grad)" stroke="#a855f7" stroke-width="2" />
      <rect x="10" y="-10" width="180" height="20" rx="3" fill="#a855f7" />
      <text x="100" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">JAILER / MICROVM ISOLATION</text>

      <g transform="translate(15, 25)">
        <!-- Inside MicroVM -->
        <rect width="240" height="215" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1" />
        <text x="120" y="20" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Guest OS (custom vmlinux)</text>
        <line x1="20" y1="30" x2="220" y2="30" stroke="#1f2937" stroke-width="1" />

        <!-- Runner Agent -->
        <rect x="20" y="45" width="200" height="50" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
        <text x="120" y="65" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Runner Exec Agent</text>
        <text x="120" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Executes script inside VM sandbox</text>

        <!-- Container/Docker-in-Docker -->
        <rect x="20" y="105" width="200" height="50" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
        <text x="120" y="125" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Docker-in-Docker (optional)</text>
        <text x="120" y="140" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Shared loopback / raw block store</text>

        <!-- Linux Kernel / Jailer Layer -->
        <rect x="20" y="165" width="200" height="35" rx="3" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
        <text x="120" y="180" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Strict Networking (TUN/TAP)</text>
        <text x="120" y="192" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">eBPF / iptables rate-limits</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrows & Labels -->
  <!-- Runner Manager to Daemon -->
  <path d="M 210,180 L 260,180" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="235" y="172" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" font-weight="bold">Deploy</text>

  <!-- Daemon to Jailer/VM -->
  <path d="M 450,230 L 470,230" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="460" y="222" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" font-weight="bold">Fork</text>

  <!-- Inside VM Network egress to Store -->
  <path d="M 610,230 C 650,210 650,380 195,380" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <text x="640" y="300" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Isolated Net</text>
  <text x="640" y="315" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Egress-Only</text>

</svg>
