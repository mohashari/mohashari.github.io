<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0F172A" rx="8"/>
  <!-- Title / Legend -->
  <text x="30" y="40" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">Speculative Decoding Engine Architecture</text>
  <text x="30" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Rust-based high-performance inference pipeline utilizing concurrent draft &amp; verification stages</text>

  <!-- Flow layout: Left is Draft Generation, Middle is Verification, Right is Output & KV-rollback -->
  
  <!-- Draft Model Box -->
  <g transform="translate(50, 100)">
    <rect width="220" height="150" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="6"/>
    <text x="110" y="30" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Draft Model (Small)</text>
    <text x="110" y="50" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">e.g., Llama-3-8B-Draft</text>
    
    <!-- Inner steps -->
    <rect x="20" y="70" width="180" height="30" fill="#0F172A" stroke="#38BDF8" stroke-width="1" rx="4"/>
    <text x="110" y="88" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Auto-regressive K Steps</text>
    
    <rect x="20" y="110" width="180" height="25" fill="#0F172A" stroke="#475569" stroke-width="1" rx="4"/>
    <text x="110" y="126" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Generates: [T₁, T₂, ..., T_K]</text>
  </g>

  <!-- Channel / Queue -->
  <g transform="translate(270, 150)">
    <path d="M 0,25 L 60,25" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <polygon points="60,25 52,20 52,30" fill="#38BDF8"/>
    <text x="30" y="15" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Rust mpsc</text>
  </g>

  <!-- Target Model Box -->
  <g transform="translate(330, 100)">
    <rect width="220" height="150" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="6"/>
    <text x="110" y="30" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Target Model (Large)</text>
    <text x="110" y="50" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">e.g., Llama-3-70B</text>
    
    <!-- Inner steps -->
    <rect x="20" y="70" width="180" height="30" fill="#0F172A" stroke="#34D399" stroke-width="1" rx="4"/>
    <text x="110" y="88" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Parallel Logit Evaluation</text>
    
    <rect x="20" y="110" width="180" height="25" fill="#0F172A" stroke="#475569" stroke-width="1" rx="4"/>
    <text x="110" y="126" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Verifies K Draft Tokens</text>
  </g>

  <!-- Verification Logic Box (Below) -->
  <g transform="translate(330, 300)">
    <rect width="220" height="120" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="6"/>
    <text x="110" y="25" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Speculative Verifier</text>
    
    <rect x="20" y="40" width="180" height="30" fill="#0F172A" stroke="#F59E0B" stroke-width="1" rx="4"/>
    <text x="110" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Acceptance Test: p / q &gt; U</text>
    
    <rect x="20" y="80" width="180" height="25" fill="#0F172A" stroke="#475569" stroke-width="1" rx="4"/>
    <text x="110" y="96" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Accept n ≤ K, Gen n+1</text>
  </g>

  <!-- Connect Target to Verifier -->
  <g transform="translate(440, 250)">
    <path d="M 0,0 L 0,50" stroke="#34D399" stroke-width="2" fill="none"/>
    <polygon points="0,50 -5,42 5,42" fill="#34D399"/>
  </g>

  <!-- Connect Draft to Verifier (Curved path) -->
  <path d="M 160,250 C 160,360 300,360 330,360" stroke="#38BDF8" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <polygon points="330,360 322,355 322,365" fill="#38BDF8"/>
  <text x="210" y="340" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Tokens [T₁..T_K]</text>

  <!-- Output / Accepted path -->
  <g transform="translate(550, 360)">
    <path d="M 0,0 L 80,0" stroke="#10B981" stroke-width="2" fill="none"/>
    <polygon points="80,0 72,-5 72,5" fill="#10B981"/>
    <text x="40" y="-10" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Accepted</text>
  </g>

  <!-- Output block -->
  <g transform="translate(630, 320)">
    <rect width="120" height="80" fill="#064E3B" stroke="#10B981" stroke-width="1.5" rx="6"/>
    <text x="60" y="35" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Token Output</text>
    <text x="60" y="55" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Commit to Target</text>
    <text x="60" y="68" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">KV Cache Update</text>
  </g>

  <!-- Rollback / Reject path -->
  <path d="M 440,420 L 440,460 L 160,460 L 160,250" stroke="#EF4444" stroke-width="2" fill="none"/>
  <polygon points="160,250 155,258 165,258" fill="#EF4444"/>
  <text x="300" y="450" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Rollback KV Cache &amp; Re-align (Index n)</text>

</svg>
