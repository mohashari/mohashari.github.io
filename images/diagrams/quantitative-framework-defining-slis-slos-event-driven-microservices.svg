<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <dropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9ca3af" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a" />
  
  <!-- Grid Lines (Subtle) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="850" y1="0" x2="850" y2="500" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="250" x2="900" y2="250" />
    <line x1="0" y1="400" x2="900" y2="400" />
  </g>

  <!-- Title & Context -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Event-Driven SLI/SLO Measurement Architecture</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Quantitative points for ingestion, queueing, processing, and dead-lettering</text>

  <!-- ==================== PRODUCER / INGRESS ==================== -->
  <g transform="translate(40, 150)" filter="url(#dropShadow)">
    <rect width="130" height="80" rx="8" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="65" y="35" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Producer</text>
    <text x="65" y="55" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">API/Ingress Service</text>
    <text x="65" y="70" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-family="monospace">t_produce</text>
  </g>

  <!-- Flow 1: Producer to Broker -->
  <path d="M 170 190 L 250 190" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
  <text x="210" y="175" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Publish</text>

  <!-- ==================== EVENT BROKER (KAFKA/RABBITMQ) ==================== -->
  <g transform="translate(250, 120)" filter="url(#dropShadow)">
    <rect width="180" height="260" rx="8" fill="url(#purpleGrad)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="90" y="30" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Message Broker</text>
    <text x="90" y="48" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11">Apache Kafka Topic</text>
    
    <!-- Queued messages representation -->
    <g transform="translate(20, 70)">
      <!-- Msg 3 -->
      <rect x="0" y="0" width="140" height="30" rx="4" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
      <text x="70" y="18" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10">Event C (Newest)</text>
    </g>
    <g transform="translate(20, 110)">
      <!-- Msg 2 -->
      <rect x="0" y="0" width="140" height="30" rx="4" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
      <text x="70" y="18" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10">Event B</text>
    </g>
    <g transform="translate(20, 150)">
      <!-- Msg 1 -->
      <rect x="0" y="0" width="140" height="30" rx="4" fill="#581c87" stroke="#d8b4fe" stroke-width="1" />
      <text x="70" y="18" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Event A (Oldest)</text>
      <!-- timestamp anchor -->
      <text x="135" y="20" text-anchor="end" fill="#c084fc" font-family="monospace" font-size="8">t_enqueue</text>
    </g>

    <!-- Queue Metrics -->
    <rect x="15" y="200" width="150" height="45" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="25" y="218" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">SLI metrics:</text>
    <text x="25" y="233" fill="#818cf8" font-family="monospace" font-size="9">Lag = Offset_head - Offset_curr</text>
  </g>

  <!-- Flow 2: Broker to Consumer -->
  <path d="M 430 270 L 530 270" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
  <text x="480" y="255" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Fetch/Push</text>

  <!-- ==================== CONSUMER SERVICE ==================== -->
  <g transform="translate(530, 150)" filter="url(#dropShadow)">
    <rect width="160" height="150" rx="8" fill="url(#greenGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="80" y="30" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Consumer Worker</text>
    <text x="80" y="48" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Go / Java Engine</text>

    <!-- Internal stages -->
    <g transform="translate(15, 65)">
      <rect width="130" height="25" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1" />
      <text x="8" y="16" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="9">1. De-serialize &amp; Validate</text>
      <text x="122" y="16" text-anchor="end" fill="#a7f3d0" font-family="monospace" font-size="8">t_consume</text>
    </g>
    <g transform="translate(15, 100)">
      <rect width="130" height="35" rx="4" fill="#047857" stroke="#6ee7b7" stroke-width="1" />
      <text x="8" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">2. Execute Business Logic</text>
      <text x="8" y="27" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8">DB Writes / External API</text>
      <text x="122" y="27" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="8">t_ack</text>
    </g>
  </g>

  <!-- Flow 3: Success Ack (back to broker or just completed) -->
  <path d="M 610 150 Q 520 90 400 120" fill="none" stroke="#10b981" stroke-dasharray="4,4" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="500" y="95" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">Offset Commit (Ack)</text>

  <!-- Flow 4: Failure path to DLQ -->
  <path d="M 610 300 L 610 380 Q 610 410 500 410" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="620" y="350" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10">Retry Limit Exceeded</text>

  <!-- ==================== DEAD LETTER QUEUE (DLQ) ==================== -->
  <g transform="translate(320, 380)" filter="url(#dropShadow)">
    <rect width="180" height="60" rx="8" fill="url(#redGrad)" stroke="#ef4444" stroke-width="1.5" />
    <text x="90" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Dead Letter Queue (DLQ)</text>
    <text x="90" y="45" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10">Poison Pills / Unprocessable Events</text>
  </g>

  <!-- ==================== METRICS BOX / SLI EQUATIONS ==================== -->
  <g transform="translate(710, 120)" filter="url(#dropShadow)">
    <rect width="170" height="290" rx="8" fill="url(#grayGrad)" stroke="#9ca3af" stroke-width="1.5" />
    <text x="15" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">QUANTITATIVE SLIs</text>
    <line x1="15" y1="40" x2="155" y2="40" stroke="#4b5563" stroke-width="1" />
    
    <!-- SLI 1: End-to-End Latency -->
    <text x="15" y="60" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">1. End-to-End Latency</text>
    <text x="15" y="75" fill="#e5e7eb" font-family="monospace" font-size="9">L_e2e = t_ack - t_produce</text>
    <text x="15" y="90" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Target: &lt; 2.5s for 99%</text>

    <!-- SLI 2: Consumer Processing Latency -->
    <text x="15" y="120" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">2. Processing Latency</text>
    <text x="15" y="135" fill="#e5e7eb" font-family="monospace" font-size="9">L_proc = t_ack - t_consume</text>
    <text x="15" y="150" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Target: &lt; 200ms for 99.5%</text>

    <!-- SLI 3: Queue Delay -->
    <text x="15" y="180" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">3. Queue Delay</text>
    <text x="15" y="195" fill="#e5e7eb" font-family="monospace" font-size="9">L_queue = t_consume - t_enqueue</text>
    <text x="15" y="210" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Indicates broker/consumer lag</text>

    <!-- SLI 4: Processing Error Rate -->
    <text x="15" y="240" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">4. Processing Quality</text>
    <text x="15" y="255" fill="#e5e7eb" font-family="monospace" font-size="9">Err = N_dlq / N_total</text>
    <text x="15" y="270" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Target: &lt; 0.01% (Poison pills)</text>
  </g>

  <!-- Connector from Processing to Metrics -->
  <path d="M 690 225 L 710 225" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2,2" />
</svg>
