<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-product" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="grad-techdebt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="grad-engine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="grad-allocation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="50" y="45" fill="#F8FAFC" font-size="22" font-weight="700" letter-spacing="-0.025em">Quantitative Engineering Capacity Allocation Framework</text>
  <text x="50" y="68" fill="#64748B" font-size="14">Dynamic scheduling engine using production SLA metrics, developer latency, and business risk profiling</text>

  <!-- Stage Dividers & Labels -->
  <line x1="335" y1="100" x2="335" y2="520" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="675" y1="100" x2="675" y2="520" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

  <text x="50" y="105" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="0.05em">01 / DUAL INPUT TELEMETRY</text>
  <text x="365" y="105" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="0.05em">02 / ALLOCATION ENGINE</text>
  <text x="705" y="105" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="0.05em">03 / DYNAMIC ALLOCATION</text>

  <!-- ================= INPUT 1: PRODUCT & BUSINESS ================= -->
  <g transform="translate(50, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 250 0 A 10 10 0 0 1 260 10 L 260 14 L 0 14 Z" fill="url(#grad-product)"/>
    <text x="20" y="38" fill="#F8FAFC" font-size="14" font-weight="600">Product &amp; Business Demands</text>
    
    <!-- Item 1 -->
    <text x="20" y="65" fill="#94A3B8" font-size="11" font-weight="600">SLO Violation Deficit</text>
    <rect x="20" y="73" width="160" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="73" width="130" height="8" rx="4" fill="#34D399"/>
    <text x="190" y="81" fill="#34D399" font-size="11" font-weight="700">81% Risk</text>

    <!-- Item 2 -->
    <text x="20" y="105" fill="#94A3B8" font-size="11" font-weight="600">Feature Backlog Delay</text>
    <rect x="20" y="113" width="160" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="113" width="70" height="8" rx="4" fill="#34D399"/>
    <text x="190" y="121" fill="#94A3B8" font-size="11">44% Delay</text>
  </g>

  <!-- ================= INPUT 2: TECH DEBT & health ================= -->
  <g transform="translate(50, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="190" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 250 0 A 10 10 0 0 1 260 10 L 260 14 L 0 14 Z" fill="url(#grad-techdebt)"/>
    <text x="20" y="38" fill="#F8FAFC" font-size="14" font-weight="600">Technical Debt Telemetry</text>
    
    <!-- Telemetry Stats -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="105" height="48" rx="6" fill="#0F172A" stroke="#1E293B" />
      <text x="10" y="18" fill="#FB7185" font-size="11" font-weight="600">DEV LOSS HOURS</text>
      <text x="10" y="38" fill="#F8FAFC" font-size="16" font-weight="700">14.2 / wk</text>
    </g>
    <g transform="translate(135, 60)">
      <rect x="0" y="0" width="105" height="48" rx="6" fill="#0F172A" stroke="#1E293B" />
      <text x="10" y="18" fill="#FB7185" font-size="11" font-weight="600">CI BUILD TIME</text>
      <text x="10" y="38" fill="#F8FAFC" font-size="16" font-weight="700">22.4 min</text>
    </g>

    <!-- Defect & Churn Rate -->
    <text x="20" y="135" fill="#94A3B8" font-size="11" font-weight="600">Hotspot Code Churn + Complexity</text>
    <rect x="20" y="143" width="160" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="143" width="120" height="8" rx="4" fill="#F43F5E"/>
    <text x="190" y="151" fill="#F43F5E" font-size="11" font-weight="700">High</text>

    <text x="20" y="170" fill="#94A3B8" font-size="10" font-family="monospace">Interest = Loss Hours * Dev Rate</text>
  </g>

  <!-- ================= MIDDLE: ALLOCATION ENGINE ================= -->
  <g transform="translate(365, 180)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="240" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 270 0 A 10 10 0 0 1 280 10 L 280 14 L 0 14 Z" fill="url(#grad-engine)"/>
    <text x="20" y="38" fill="#F8FAFC" font-size="14" font-weight="600">Dynamic Capacity Router (f)</text>
    
    <!-- Calculation Box -->
    <rect x="15" y="60" width="250" height="85" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="25" y="80" fill="#38BDF8" font-size="11" font-family="monospace">Capacity Budget Target Allocation:</text>
    <text x="25" y="105" fill="#F1F5F9" font-size="13" font-family="monospace" font-weight="700">C_debt = B + α(SLO_d) + β(LH)</text>
    <text x="25" y="125" fill="#94A3B8" font-size="10" font-family="monospace">B: 20% Base | α: 0.35 | β: 0.45</text>
    
    <!-- Status Checks -->
    <text x="20" y="170" fill="#94A3B8" font-size="11" font-weight="600">Engine Variables Input Check:</text>
    
    <circle cx="30" cy="192" r="4" fill="#34D399"/>
    <text x="42" y="196" fill="#E2E8F0" font-size="11">Production SLO Deficit (ACTIVE)</text>

    <circle cx="30" cy="212" r="4" fill="#F43F5E"/>
    <text x="42" y="216" fill="#E2E8F0" font-size="11">Friction Interest Threshold (EXCEEDED)</text>
  </g>

  <!-- ================= RIGHT: DYNAMIC ALLOCATION ================= -->
  <g transform="translate(705, 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="245" height="300" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 235 0 A 10 10 0 0 1 245 10 L 245 14 L 0 14 Z" fill="url(#grad-allocation)"/>
    <text x="20" y="38" fill="#F8FAFC" font-size="14" font-weight="600">Calculated Capacity Allocation</text>

    <!-- Allocated Slices -->
    <!-- Feature Capacity -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="205" height="42" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
      <text x="15" y="25" fill="#34D399" font-size="14" font-weight="700">55%</text>
      <text x="60" y="18" fill="#E2E8F0" font-size="11" font-weight="600">Product Features</text>
      <text x="60" y="32" fill="#94A3B8" font-size="9">Strategic Backlog Roadmap</text>
    </g>

    <!-- Tech Debt Paydown Capacity -->
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="205" height="42" rx="6" fill="#EF4444" fill-opacity="0.15" stroke="#F43F5E" stroke-width="1" />
      <text x="15" y="25" fill="#FB7185" font-size="14" font-weight="700">30%</text>
      <text x="60" y="18" fill="#E2E8F0" font-size="11" font-weight="600">Tech Debt paydown</text>
      <text x="60" y="32" fill="#94A3B8" font-size="9">Architectural Refactoring</text>
    </g>

    <!-- KTLO / Maintenance Capacity -->
    <g transform="translate(20, 175)">
      <rect x="0" y="0" width="205" height="42" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#60A5FA" stroke-width="1" />
      <text x="15" y="25" fill="#60A5FA" font-size="14" font-weight="700">15%</text>
      <text x="60" y="18" fill="#E2E8F0" font-size="11" font-weight="600">KTLO &amp; Operations</text>
      <text x="60" y="32" fill="#94A3B8" font-size="9">On-Call, Upgrades &amp; Patches</text>
    </g>

    <text x="20" y="245" fill="#94A3B8" font-size="11" font-weight="600">Policy applied to Sprint:</text>
    <text x="20" y="265" fill="#818CF8" font-size="13" font-weight="700" font-family="monospace">Sprint v26.32 - AUTO_RULE</text>
  </g>

  <!-- ================= CONNECTING ARROWS & LABELS ================= -->
  <!-- Product -> Engine -->
  <path d="M 310 205 L 335 205 Q 350 205 350 220 L 350 280 Q 350 290 365 290" 
        fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="325" y="235" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="middle" transform="rotate(-90 325 235)">SLA Metrics</text>

  <!-- Tech Debt -> Engine -->
  <path d="M 310 405 L 335 405 Q 350 405 350 390 L 350 330 Q 350 310 365 310" 
        fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="325" y="365" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="middle" transform="rotate(90 325 365)">Loss Rates</text>

  <!-- Engine -> Dynamic Target -->
  <path d="M 645 300 L 675 300 Q 690 300 690 280 L 690 270 Q 690 260 705 260" 
        fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="668" y="290" fill="#818CF8" font-size="10" font-weight="600">Output Ratio</text>

  <!-- Loopback / Feedback loop from Dynamic Target back to input (Telemetry) -->
  <path d="M 827 450 L 827 525 Q 827 545 807 545 L 200 545 Q 180 545 180 520 L 180 500" 
        fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)" />
  <text x="500" y="538" fill="#34D399" font-size="11" font-weight="600" text-anchor="middle">Feedback Loop: Debt reduction improves Loss Hours &amp; Developer Latency</text>

</svg>
