<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="550" rx="12" fill="#0f172a"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="user-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="kernel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ebpf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="otel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">gRPC FD Exhaustion Detection Architecture</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">eBPF-powered syscall tracing &amp; OpenTelemetry metric exporter pipeline</text>

  <!-- User Space Container -->
  <rect x="30" y="90" width="400" height="420" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="45" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">USER SPACE</text>

  <!-- Kernel Space Container -->
  <rect x="460" y="90" width="410" height="420" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="475" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">KERNEL SPACE</text>

  <!-- gRPC Server App -->
  <g transform="translate(60, 140)" filter="url(#shadow)">
    <rect width="180" height="80" rx="6" fill="url(#user-grad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">gRPC Server (Go)</text>
    <text x="90" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Serving Port: 50051</text>
    <rect x="15" y="62" width="150" height="3" rx="1.5" fill="#ef4444"/> <!-- FD leak indicator -->
  </g>

  <!-- OTel Collector/Agent -->
  <g transform="translate(60, 360)" filter="url(#shadow)">
    <rect width="180" height="80" rx="6" fill="url(#otel-grad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">OTel Collector / Agent</text>
    <text x="90" y="55" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Prometheus Receiver</text>
  </g>

  <!-- Syscall interface (boundary) -->
  <path d="M 330 90 L 330 510" stroke="#334155" stroke-dasharray="2,2"/>
  <text x="320" y="525" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">Syscall Boundary</text>

  <!-- Kernel: Syscalls (sys_enter_accept4 / sys_enter_close) -->
  <g transform="translate(480, 140)" filter="url(#shadow)">
    <rect width="160" height="80" rx="6" fill="url(#kernel-grad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="80" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Syscall Layer</text>
    <text x="80" y="55" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">accept4(), close(), socket()</text>
  </g>

  <!-- eBPF Probes (kprobes/tracepoints) -->
  <g transform="translate(680, 140)" filter="url(#shadow)">
    <rect width="160" height="80" rx="6" fill="url(#ebpf-grad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="80" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">eBPF Probes</text>
    <text x="80" y="48" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">sys_enter_accept4</text>
    <text x="80" y="62" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">sys_enter_close</text>
  </g>

  <!-- eBPF Maps -->
  <g transform="translate(580, 290)" filter="url(#shadow)">
    <rect width="160" height="80" rx="6" fill="url(#ebpf-grad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="80" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">eBPF Maps</text>
    <text x="80" y="50" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">BPF_MAP_TYPE_HASH</text>
    <text x="80" y="65" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">[TGID -&gt; Open FDs Count]</text>
  </g>

  <!-- OTel Prometheus Exporter (User space collector for ebpf metrics) -->
  <g transform="translate(60, 260)" filter="url(#shadow)">
    <rect width="180" height="60" rx="6" fill="url(#user-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">eBPF Exporter Daemon</text>
    <text x="90" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">:9435 /metrics</text>
  </g>

  <!-- Connecting Lines and Arrows -->
  
  <!-- gRPC Server calling Syscalls -->
  <path d="M 240 180 L 470 180" stroke="#60a5fa" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  <polygon points="475,180 465,175 465,185" fill="#60a5fa"/>
  <text x="350" y="170" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Syscall Invocations</text>

  <!-- Syscall triggering eBPF Probe -->
  <path d="M 640 180 L 670 180" stroke="#a855f7" stroke-width="2" fill="none"/>
  <polygon points="675,180 665,175 665,185" fill="#a855f7"/>
  <text x="655" y="170" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Trace</text>

  <!-- eBPF Probe writing/updating Map -->
  <path d="M 760 220 L 760 300 L 750 300" stroke="#a855f7" stroke-width="2" fill="none"/>
  <polygon points="740,300 750,295 750,305" fill="#a855f7"/>
  <text x="770" y="260" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Update FD Count</text>

  <!-- eBPF Exporter scraping Kernel Map via bpf_perf_event or Map Read -->
  <path d="M 240 290 L 570 290" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <polygon points="230,290 240,285 240,295" fill="#38bdf8"/>
  <text x="400" y="280" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Reads Map State (libbpf)</text>

  <!-- OTel Collector scraping eBPF Exporter -->
  <path d="M 150 320 L 150 350" stroke="#10b981" stroke-width="2" fill="none"/>
  <polygon points="150,355 145,345 155,345" fill="#10b981"/>
  <text x="160" y="340" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Scrape /metrics</text>

</svg>
