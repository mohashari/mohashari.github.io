<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="#0F172A" />
  
  <!-- Definitions for gradients/filters -->
  <defs>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ebpfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="ciliumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="envoyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0EA5E9" flood-opacity="0.3" />
    </filter>
    <filter id="orangeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F97316" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC">Cilium eBPF-Based Network Policy Enforcement</text>
  <text x="40" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Fast-path kernel-level drops (L3/L4) vs redirecting to Envoy for L7 inspection</text>

  <!-- User Space / Kernel Space boundary -->
  <line x1="40" y1="260" x2="760" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="8 4" />
  <text x="680" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#64748B">USER SPACE</text>
  <text x="680" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#64748B">KERNEL SPACE</text>

  <!-- Pod A (Frontend) -->
  <rect x="60" y="110" width="160" height="110" rx="8" fill="url(#podGrad)" stroke="#475569" stroke-width="1.5" />
  <text x="80" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Pod A (Frontend)</text>
  <text x="80" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">IP: 10.244.1.5</text>
  <text x="80" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38BDF8">Identity: 4105</text>
  <rect x="75" y="188" width="130" height="18" rx="3" fill="#1E293B" stroke="#0EA5E9" stroke-width="1" />
  <text x="80" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38BDF8">GET /api/v1/payments</text>

  <!-- Pod B (Backend) -->
  <rect x="580" y="110" width="160" height="110" rx="8" fill="url(#podGrad)" stroke="#475569" stroke-width="1.5" />
  <text x="600" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Pod B (Backend)</text>
  <text x="600" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">IP: 10.244.2.19</text>
  <text x="600" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34D399">Identity: 9912</text>
  <rect x="595" y="188" width="130" height="18" rx="3" fill="#1E293B" stroke="#34D399" stroke-width="1" />
  <text x="600" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34D399">Port: 8080</text>

  <!-- Cilium Agent -->
  <rect x="250" y="110" width="130" height="90" rx="8" fill="url(#ciliumGrad)" stroke="#FB923C" stroke-width="1.5" filter="url(#orangeGlow)" />
  <text x="265" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Cilium Agent</text>
  <text x="265" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#FFE5D9">compiles Cilium</text>
  <text x="265" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#FFE5D9">Network Policies</text>

  <!-- Envoy Proxy (L7) -->
  <rect x="410" y="110" width="130" height="90" rx="8" fill="url(#envoyGrad)" stroke="#34D399" stroke-width="1.5" />
  <text x="425" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Envoy Proxy</text>
  <text x="425" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#D1FAE5">L7 HTTP Rules</text>
  <text x="425" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#D1FAE5">Header &amp; Path</text>

  <!-- Kernel Space Components -->
  <!-- eBPF Hook tc/socket -->
  <rect x="130" y="320" width="540" height="140" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <text x="150" y="345" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#94A3B8">eBPF Engine (Linux Kernel)</text>

  <!-- eBPF Program Block -->
  <rect x="150" y="365" width="210" height="75" rx="6" fill="url(#ebpfGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#glow)" />
  <text x="165" y="388" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">cil_to_container()</text>
  <text x="165" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#E0F2FE">eBPF Program at tc/socket</text>
  <text x="165" y="422" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#0284C7">FAST PATH (Identity-Based)</text>

  <!-- BPF Maps -->
  <rect x="385" y="365" width="140" height="75" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1.5" />
  <text x="400" y="388" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38BDF8">BPF Maps</text>
  <text x="400" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">IP-to-Identity Map</text>
  <text x="400" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Policy Decision Map</text>

  <!-- eBPF L7 Redir Hook -->
  <rect x="545" y="365" width="110" height="75" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1" />
  <text x="555" y="388" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34D399">L7 Redirect</text>
  <text x="555" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Sockmap /</text>
  <text x="555" y="418" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">tc proxy-redir</text>

  <!-- Connections / Arrows (Paths) -->
  
  <!-- 1. Pod A to Kernel (egress) -->
  <path d="M 140 220 L 140 290 L 180 290 L 180 365" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-dasharray="4 2" />
  
  <!-- 2. Agent writes to Maps -->
  <path d="M 315 200 L 315 285 L 455 285 L 455 365" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- 3. eBPF lookup Map -->
  <path d="M 360 400 L 385 400" fill="none" stroke="#38BDF8" stroke-width="2" />
  
  <!-- 4. L7 Policy Redirect -->
  <path d="M 360 420 L 545 420" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2 2" />
  <!-- Envoy Hook Back and Forth -->
  <path d="M 600 365 L 600 280 L 475 280 L 475 200" fill="none" stroke="#10B981" stroke-width="1.5" />
  <path d="M 475 200 L 475 280 L 600 280 L 600 365" fill="none" stroke="#10B981" stroke-width="1.5" />

  <!-- 5. Approved egress to Pod B -->
  <path d="M 655 400 L 690 400 L 690 220" fill="none" stroke="#34D399" stroke-width="2" />

  <!-- Labels along the path -->
  <rect x="70" y="260" width="80" height="20" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="75" y="273" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">1. Pod Egress</text>

  <rect x="200" y="295" width="100" height="20" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="205" y="308" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">2. eBPF Hook (tc)</text>

  <rect x="360" y="325" width="110" height="20" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="365" y="338" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">3. Map Lookup (Identity)</text>

  <rect x="525" y="295" width="90" height="20" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="530" y="308" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10B981">4. Envoy Redirect (L7)</text>

  <rect x="670" y="260" width="80" height="20" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="675" y="273" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34D399">5. Allowed Ingress</text>
  
</svg>
