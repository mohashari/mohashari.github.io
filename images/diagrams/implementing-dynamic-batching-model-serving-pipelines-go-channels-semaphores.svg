<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="reqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="chanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="batchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="semGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#0f172a" rx="12" />
  
  <!-- Outer Border -->
  <rect width="898" height="548" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="12" />

  <!-- Title & Subtitle -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Dynamic Batching Architecture in Go</text>
  <text x="30" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">High-throughput model serving pipeline using Channels, Batchers, and Semaphores</text>

  <!-- Section 1: Concurrent Client Requests -->
  <g transform="translate(30, 100)" filter="url(#shadow)">
    <!-- Boundary Box -->
    <rect width="180" height="380" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4 4" rx="8" />
    <text x="90" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CLIENT REQUESTS</text>

    <!-- Request items -->
    <g transform="translate(15, 50)">
      <rect width="150" height="45" fill="url(#reqGrad)" rx="6" />
      <text x="15" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Request 1 (c1)</text>
      <text x="15" y="38" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10">Payload A | Wait for c1</text>
    </g>

    <g transform="translate(15, 110)">
      <rect width="150" height="45" fill="url(#reqGrad)" rx="6" />
      <text x="15" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Request 2 (c2)</text>
      <text x="15" y="38" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10">Payload B | Wait for c2</text>
    </g>

    <g transform="translate(15, 170)">
      <rect width="150" height="45" fill="url(#reqGrad)" rx="6" />
      <text x="15" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Request 3 (c3)</text>
      <text x="15" y="38" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10">Payload C | Wait for c3</text>
    </g>

    <text x="90" y="260" fill="#475569" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">...</text>

    <g transform="translate(15, 290)">
      <rect width="150" height="45" fill="url(#reqGrad)" rx="6" />
      <text x="15" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Request N (cN)</text>
      <text x="15" y="38" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10">Payload N | Wait for cN</text>
    </g>
  </g>

  <!-- Connect Client Requests to Job Queue -->
  <path d="M 210 220 L 265 220" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="238" y="210" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Enqueue</text>

  <!-- Section 2: Go Job Channel / Queue -->
  <g transform="translate(280, 100)" filter="url(#shadow)">
    <rect width="100" height="380" fill="url(#chanGrad)" stroke="#475569" stroke-width="1.5" rx="8" />
    <text x="50" y="25" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">JOB CHANNEL</text>
    <text x="50" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">chan Job</text>

    <!-- Channel Slots -->
    <g transform="translate(15, 60)">
      <rect width="70" height="30" fill="#1e293b" stroke="#334155" rx="4" />
      <text x="35" y="19" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Job N</text>
    </g>
    <g transform="translate(15, 100)">
      <rect width="70" height="30" fill="#1e293b" stroke="#334155" rx="4" />
      <text x="35" y="19" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Job 3</text>
    </g>
    <g transform="translate(15, 140)">
      <rect width="70" height="30" fill="#1e293b" stroke="#334155" rx="4" />
      <text x="35" y="19" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Job 2</text>
    </g>
    <g transform="translate(15, 180)">
      <rect width="70" height="30" fill="#1e293b" stroke="#334155" rx="4" />
      <text x="35" y="19" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Job 1</text>
    </g>
    <path d="M 50 230 L 50 340" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="2 4" />
    <text x="50" y="365" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">FIFO Queue</text>
  </g>

  <!-- Connect Job Queue to Batcher -->
  <path d="M 380 290 L 425 290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="403" y="278" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Consume</text>

  <!-- Section 3: Dynamic Batcher Loop -->
  <g transform="translate(440, 100)" filter="url(#shadow)">
    <rect width="180" height="210" fill="url(#batchGrad)" rx="8" />
    <text x="90" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Dynamic Batcher Loop</text>
    
    <!-- Code logic representations -->
    <rect x="15" y="45" width="150" height="145" fill="#1e1b4b" fill-opacity="0.8" rx="6" />
    
    <!-- Timer & Max Batch labels -->
    <text x="25" y="70" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Flush triggers:</text>
    
    <g transform="translate(25, 85)">
      <circle cx="8" cy="8" r="6" fill="#fb7185" />
      <text x="22" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Ticker (e.g. 5ms)</text>
    </g>

    <g transform="translate(25, 110)">
      <circle cx="8" cy="8" r="6" fill="#38bdf8" />
      <text x="22" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Max Batch (e.g. 32)</text>
    </g>

    <!-- Visual of current batch building -->
    <rect x="25" y="140" width="130" height="38" fill="#312e81" stroke="#4f46e5" rx="4" />
    <text x="35" y="157" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Current Batch Array</text>
    <text x="35" y="171" fill="#cbd5e1" font-family="monospace" font-size="9">[Job1, Job2, Job3]</text>
  </g>

  <!-- Connect Batcher to Semaphore / GPU Worker -->
  <path d="M 620 205 L 685 205" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="653" y="195" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Flush</text>

  <!-- Section 4: Concurrency Control (Semaphore) & GPU worker -->
  <g transform="translate(700, 100)" filter="url(#shadow)">
    <!-- Semaphore -->
    <g transform="translate(0, 0)">
      <rect width="170" height="85" fill="url(#semGrad)" rx="8" />
      <text x="85" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Weighted Semaphore</text>
      <rect x="15" y="38" width="140" height="35" fill="#4c0519" fill-opacity="0.8" rx="4" stroke="#e11d48" />
      <text x="85" y="52" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Protects Host RAM / VRAM</text>
      <text x="85" y="65" fill="#fecdd3" font-family="monospace" font-size="9" text-anchor="middle">Concurrency Limit = 4</text>
    </g>

    <!-- GPU Model Serving Engine -->
    <g transform="translate(0, 115)">
      <rect width="170" height="155" fill="url(#gpuGrad)" rx="8" />
      <text x="85" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GPU Serving Engine</text>
      <text x="85" y="38" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">ONNX / PyTorch Lib / Triton</text>
      
      <!-- Execution block -->
      <rect x="15" y="50" width="140" height="90" fill="#022c22" fill-opacity="0.9" rx="4" />
      <text x="25" y="70" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Inference Exec</text>
      <text x="25" y="88" fill="#a7f3d0" font-family="monospace" font-size="9">Input Shape: [3, 3, 224, 224]</text>
      <text x="25" y="103" fill="#a7f3d0" font-family="monospace" font-size="9">Batched Tensor Calc</text>
      <text x="25" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Latency ~12ms</text>
    </g>
  </g>

  <!-- Loopback / Scatter Response to Client Channels -->
  <!-- We draw a curved path from GPU Engine back to the client request channels -->
  <path d="M 785 380 L 785 500 L 120 500 L 120 450" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
  <text x="450" y="490" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SCATTER RESULTS (Response Channels c1, c2, c3 ... cN)</text>

  <!-- Explanation details inside diagram -->
  <g transform="translate(440, 330)">
    <rect width="180" height="150" fill="#1e293b" stroke="#334155" rx="8" />
    <text x="15" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Pipeline Characteristics:</text>
    
    <text x="15" y="50" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Dynamic resizing (1 to N)</text>
    <text x="15" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Context-aware cancellation</text>
    <text x="15" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Non-blocking handler enqueues</text>
    <text x="15" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Clean graceful shutdown</text>
    <text x="15" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">• Max latency bounds enforced</text>
  </g>
</svg>
