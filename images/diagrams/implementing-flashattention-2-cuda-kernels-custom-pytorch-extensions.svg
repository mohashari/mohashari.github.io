<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- sleek modern dark background -->
  <rect width="800" height="500" rx="12" fill="#0f172a"/>
  
  <!-- Grid pattern for background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <linearGradient id="hbmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="computeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    FlashAttention-2 CUDA Tiling &amp; Memory Hierarchy
  </text>
  
  <!-- HBM (High Bandwidth Memory) Section -->
  <rect x="40" y="70" width="160" height="380" rx="8" fill="#1e293b" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <text x="120" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">HBM (VRAM)</text>
  
  <!-- Q, K, V, O in HBM -->
  <rect x="60" y="120" width="120" height="45" rx="6" fill="url(#hbmGrad)" opacity="0.85"/>
  <text x="120" y="147" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Q Matrix [N, d]</text>
  
  <rect x="60" y="180" width="120" height="45" rx="6" fill="url(#hbmGrad)" opacity="0.85"/>
  <text x="120" y="207" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">K Matrix [N, d]</text>

  <rect x="60" y="240" width="120" height="45" rx="6" fill="url(#hbmGrad)" opacity="0.85"/>
  <text x="120" y="267" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">V Matrix [N, d]</text>
  
  <rect x="60" y="380" width="120" height="45" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-dasharray="2" stroke-width="1"/>
  <text x="120" y="407" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">O Matrix [N, d]</text>

  <!-- SRAM (Shared Memory) Section -->
  <rect x="300" y="70" width="200" height="380" rx="8" fill="#1e293b" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <text x="400" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">SRAM (Shared Memory)</text>
  
  <!-- Blocks in SRAM -->
  <rect x="320" y="120" width="160" height="45" rx="6" fill="url(#sramGrad)" opacity="0.9"/>
  <text x="400" y="147" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Q_i Block [Br, d]</text>

  <rect x="320" y="180" width="160" height="45" rx="6" fill="url(#sramGrad)" opacity="0.9"/>
  <text x="400" y="207" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">K_j Block [Bc, d]</text>

  <rect x="320" y="240" width="160" height="45" rx="6" fill="url(#sramGrad)" opacity="0.9"/>
  <text x="400" y="267" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">V_j Block [Bc, d]</text>

  <!-- Online Softmax Stats -->
  <rect x="320" y="320" width="160" height="60" rx="6" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <text x="400" y="342" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Online Softmax Stats</text>
  <text x="400" y="360" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Row Max m_i | Row Sum d_i</text>

  <!-- CUDA Cores (Register File Compute) -->
  <rect x="580" y="70" width="180" height="380" rx="8" fill="#1e293b" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <text x="670" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">Register File / ALU</text>
  
  <!-- Tensor Cores / Compute -->
  <rect x="600" y="130" width="140" height="80" rx="6" fill="url(#computeGrad)"/>
  <text x="670" y="165" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">S_ij = Q_i @ K_j^T</text>
  <text x="670" y="185" font-family="'Inter', sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Tensor Core (FP16)</text>

  <rect x="600" y="235" width="140" height="80" rx="6" fill="url(#computeGrad)"/>
  <text x="670" y="265" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">P_ij = Softmax(S_ij)</text>
  <text x="670" y="285" font-family="'Inter', sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Rescaled using m_i, d_i</text>

  <rect x="600" y="340" width="140" height="80" rx="6" fill="url(#computeGrad)"/>
  <text x="670" y="375" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">O_i += P_ij @ V_j</text>
  <text x="670" y="395" font-family="'Inter', sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Accumulate in FP32</text>

  <!-- Connectors / Arrows -->
  <!-- HBM to SRAM Load -->
  <path d="M 180 142.5 L 320 142.5" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 180 202.5 L 320 202.5" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 180 262.5 L 320 262.5" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  
  <!-- SRAM to Compute -->
  <path d="M 480 142.5 L 530 142.5 L 530 170 L 600 170" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M 480 202.5 L 540 202.5 L 540 185 L 600 185" stroke="#34d399" stroke-width="2" fill="none"/>
  
  <!-- Softmax Stats to Rescaling -->
  <path d="M 480 350 L 560 350 L 560 275 L 600 275" stroke="#fb7185" stroke-width="1.5" fill="none"/>
  
  <!-- V_j block to Accumulate -->
  <path d="M 480 262.5 L 550 262.5 L 550 380 L 600 380" stroke="#34d399" stroke-width="2" fill="none"/>
  
  <!-- Accumulator Write Back to HBM -->
  <path d="M 670 420 L 670 440 L 120 440 L 120 425" stroke="#38bdf8" stroke-dasharray="4" stroke-width="2" fill="none"/>
  
  <!-- Markers for arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Labels -->
  <rect x="205" y="112" width="70" height="20" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="240" y="126" font-family="'Inter', sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">Load Blocks</text>
  
  <rect x="500" y="425" width="130" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5"/>
  <text x="565" y="439" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="bold">Write-back (HBM)</text>
</svg>
