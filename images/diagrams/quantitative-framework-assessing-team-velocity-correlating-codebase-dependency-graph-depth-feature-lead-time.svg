<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" width="100%" height="100%" style="background-color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <!-- Highlight Arrow Marker -->
    <marker id="arrow-highlight" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <!-- Gradients -->
    <linearGradient id="gradient-src" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradient-proc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="gradient-metric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="gradient-engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="gradient-action" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Title / Header -->
  <text x="30" y="35" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="-0.025em">Quantitative Velocity Correlation Framework Architecture</text>
  <text x="30" y="55" fill="#94a3b8" font-size="12">Pipeline for extracting codebase dependency depths and correlating them with transactional lead times.</text>

  <!-- COLUMN 1: DATA SOURCES -->
  <g transform="translate(30, 80)">
    <!-- Source Group Header -->
    <text x="0" y="-10" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.05em">01. INGESTION SOURCES</text>
    
    <!-- Git Repository -->
    <rect x="0" y="0" width="180" height="85" rx="8" fill="url(#gradient-src)" stroke="#334155" stroke-width="1.5" />
    <text x="15" y="25" fill="#38bdf8" font-size="11" font-weight="600">Git Repository</text>
    <text x="15" y="45" fill="#e2e8f0" font-size="13" font-weight="600">Source Tree &amp; Logs</text>
    <text x="15" y="65" fill="#94a3b8" font-size="11">Production codebase / main branch</text>

    <!-- Jira / Issue Tracker -->
    <rect x="0" y="220" width="180" height="85" rx="8" fill="url(#gradient-src)" stroke="#334155" stroke-width="1.5" />
    <text x="15" y="245" fill="#38bdf8" font-size="11" font-weight="600">Issue Tracker</text>
    <text x="15" y="265" fill="#e2e8f0" font-size="13" font-weight="600">Jira / GitHub API</text>
    <text x="15" y="285" fill="#94a3b8" font-size="11">Feature ticket lifecycles &amp; states</text>
  </g>

  <!-- COLUMN 2: PARSERS & EXTRACTORS -->
  <g transform="translate(260, 80)">
    <text x="0" y="-10" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.05em">02. EXTRACTION &amp; PARSING</text>

    <!-- Code AST & Dependency Parser -->
    <rect x="0" y="0" width="190" height="85" rx="8" fill="url(#gradient-proc)" stroke="#0284c7" stroke-width="1.5" />
    <text x="15" y="25" fill="#bae6fd" font-size="11" font-weight="600">AST &amp; Import Parser</text>
    <text x="15" y="45" fill="#f8fafc" font-size="13" font-weight="600">Module Dep Extractor</text>
    <text x="15" y="65" fill="#e0f2fe" font-size="11">Resolves import statements to nodes</text>

    <!-- Git Metatdata & Lifecycle Extractor -->
    <rect x="0" y="220" width="190" height="85" rx="8" fill="url(#gradient-proc)" stroke="#0284c7" stroke-width="1.5" />
    <text x="15" y="245" fill="#bae6fd" font-size="11" font-weight="600">Transactional Log Extractor</text>
    <text x="15" y="265" fill="#f8fafc" font-size="13" font-weight="600">Lead Time Extractor</text>
    <text x="15" y="285" fill="#e0f2fe" font-size="11">Tracks commit-to-merge metrics</text>
  </g>

  <!-- COLUMN 3: METRIC CALCULATORS -->
  <g transform="translate(500, 80)">
    <text x="0" y="-10" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.05em">03. METRIC CALCULATORS</text>

    <!-- DAG Analyzer -->
    <rect x="0" y="0" width="190" height="85" rx="8" fill="url(#gradient-metric)" stroke="#0d9488" stroke-width="1.5" />
    <text x="15" y="25" fill="#99f6e4" font-size="11" font-weight="600">DAG Builder</text>
    <text x="15" y="45" fill="#f8fafc" font-size="13" font-weight="600">Graph Depth Engine</text>
    <text x="15" y="65" fill="#ccfbf1" font-size="11">Calculates Out-Degree &amp; Max Depth</text>

    <!-- Lead Time Aggregator -->
    <rect x="0" y="220" width="190" height="85" rx="8" fill="url(#gradient-metric)" stroke="#0d9488" stroke-width="1.5" />
    <text x="15" y="245" fill="#99f6e4" font-size="11" font-weight="600">Lead Time Aggregator</text>
    <text x="15" y="265" fill="#f8fafc" font-size="13" font-weight="600">Time-to-Production</text>
    <text x="15" y="285" fill="#ccfbf1" font-size="11">Groups lead times by modified file paths</text>
  </g>

  <!-- COLUMN 4: STATISTICAL CORRELATION ENGINE -->
  <g transform="translate(740, 150)">
    <text x="0" y="-10" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.05em">04. CORRELATION ENGINE</text>
    
    <rect x="0" y="0" width="200" height="150" rx="10" fill="url(#gradient-engine)" stroke="#7c3aed" stroke-width="2" />
    <text x="20" y="30" fill="#ddd6fe" font-size="11" font-weight="600" letter-spacing="0.025em">STATISTICAL ENGINE</text>
    <text x="20" y="55" fill="#f8fafc" font-size="15" font-weight="700">Spearman Rank &amp;</text>
    <text x="20" y="75" fill="#f8fafc" font-size="15" font-weight="700">OLS Regression</text>
    <text x="20" y="105" fill="#ede9fe" font-size="11" font-weight="500">Inputs: Path Graph Depth (d)</text>
    <text x="20" y="125" fill="#ede9fe" font-size="11" font-weight="500">Outputs: Velocity Impact Coefficient (β)</text>
  </g>

  <!-- COLUMN 5: SYSTEM FEEDBACK -->
  <g transform="translate(990, 150)">
    <text x="0" y="-10" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.05em">05. DEPLOYMENT &amp; FEEDBACK</text>
    
    <rect x="0" y="0" width="160" height="150" rx="10" fill="url(#gradient-action)" stroke="#e11d48" stroke-width="2" />
    <text x="15" y="30" fill="#fecdd3" font-size="11" font-weight="600">ACTION SYSTEMS</text>
    
    <circle cx="25" cy="58" r="4" fill="#fda4af" />
    <text x="37" y="62" fill="#fff" font-size="12" font-weight="600">CI/CD Gates</text>
    
    <circle cx="25" cy="88" r="4" fill="#fda4af" />
    <text x="37" y="92" fill="#fff" font-size="12" font-weight="600">Velocity Dashboard</text>
    
    <circle cx="25" cy="118" r="4" fill="#fda4af" />
    <text x="37" y="122" fill="#fff" font-size="12" font-weight="600">Refactoring Alerts</text>
  </g>

  <!-- CONNECTORS -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <!-- Col 1 to Col 2 -->
    <path d="M 210 122 L 260 122" marker-end="url(#arrow)" />
    <path d="M 210 342 L 260 342" marker-end="url(#arrow)" />

    <!-- Col 2 to Col 3 -->
    <path d="M 450 122 L 500 122" marker-end="url(#arrow)" />
    <path d="M 450 342 L 500 342" marker-end="url(#arrow)" />

    <!-- Col 3 to Col 4 (Elbows) -->
    <!-- Top to Engine -->
    <path d="M 690 122 L 715 122 L 715 200 L 734 200" marker-end="url(#arrow-highlight)" stroke="#38bdf8" />
    <!-- Bottom to Engine -->
    <path d="M 690 342 L 715 342 L 715 250 L 734 250" marker-end="url(#arrow-highlight)" stroke="#38bdf8" />

    <!-- Col 4 to Col 5 -->
    <path d="M 940 225 L 984 225" marker-end="url(#arrow-highlight)" stroke="#38bdf8" stroke-dasharray="3,3" />
  </g>

  <!-- Flow Annotations (Small Labels) -->
  <text x="215" y="112" fill="#94a3b8" font-size="9" text-anchor="middle">source files</text>
  <text x="215" y="332" fill="#94a3b8" font-size="9" text-anchor="middle">tickets &amp; PRs</text>
  <text x="475" y="112" fill="#94a3b8" font-size="9" text-anchor="middle">AST import map</text>
  <text x="475" y="332" fill="#94a3b8" font-size="9" text-anchor="middle">lifecycle spans</text>
  <text x="705" y="165" fill="#38bdf8" font-size="9" font-weight="600" text-anchor="middle">Graph Depth (d)</text>
  <text x="705" y="280" fill="#38bdf8" font-size="9" font-weight="600" text-anchor="middle">Lead Time (t)</text>
</svg>
