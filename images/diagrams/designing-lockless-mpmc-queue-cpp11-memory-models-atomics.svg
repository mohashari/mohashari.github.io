<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="550" rx="12" fill="#0f172a"/>
  
  <!-- Definitions for gradients/shadows -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="45" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">
    Lock-Free MPMC Ring Buffer (Vyukov's Queue)
  </text>
  <text x="30" y="65" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#64748b">
    Visualizing atomic operations, cacheline padding, and memory barriers under high concurrency
  </text>

  <!-- Producer Section (Left) -->
  <g transform="translate(40, 120)">
    <!-- Producers Title -->
    <rect width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Producers (Writer Threads)</text>
    
    <!-- Active Writers -->
    <circle cx="35" cy="90" r="18" fill="url(#blueGrad)"/>
    <text x="35" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">T1</text>

    <circle cx="90" cy="90" r="18" fill="url(#blueGrad)"/>
    <text x="90" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">T2</text>

    <circle cx="145" cy="90" r="18" fill="url(#blueGrad)"/>
    <text x="145" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">T3</text>

    <!-- CAS Arrow -->
    <path d="M 90,120 L 90,165" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <polygon points="90,172 85,162 95,162" fill="#38bdf8"/>
    <text x="98" y="145" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8" font-weight="bold">CAS enqueue_pos</text>
  </g>

  <!-- Global Atomic Enqueue Position -->
  <g transform="translate(40, 310)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">alignas(64)</text>
    <text x="90" y="38" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">std::atomic&lt;size_t&gt;</text>
    <text x="90" y="52" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">enqueue_pos = 12</text>
  </g>

  <!-- Array Cells (Middle) -->
  <g transform="translate(260, 120)">
    <text x="190" y="-15" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Ring Buffer (Array of Cells)</text>
    
    <!-- Cell 0 -->
    <g transform="translate(0, 0)">
      <rect width="85" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="42" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">Cell [0]</text>
      <!-- Divider -->
      <line x1="0" y1="30" x2="85" y2="30" stroke="#334155" stroke-width="1.5"/>
      <!-- Data -->
      <rect x="8" y="40" width="69" height="35" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
      <text x="42" y="55" font-family="'Courier New', monospace" font-size="11" fill="#f8fafc" text-anchor="middle">data</text>
      <text x="42" y="68" font-family="'Courier New', monospace" font-size="10" fill="#0284c7" text-anchor="middle">0x8FA4</text>
      <!-- Sequence -->
      <rect x="8" y="90" width="69" height="50" rx="4" fill="#7e22ce" fill-opacity="0.2" stroke="#7e22ce" stroke-width="1"/>
      <text x="42" y="105" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" text-anchor="middle">sequence</text>
      <text x="42" y="125" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">16</text>
    </g>

    <!-- Cell 1 -->
    <g transform="translate(95, 0)">
      <rect width="85" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="42" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">Cell [1]</text>
      <line x1="0" y1="30" x2="85" y2="30" stroke="#334155" stroke-width="1.5"/>
      <rect x="8" y="40" width="69" height="35" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
      <text x="42" y="55" font-family="'Courier New', monospace" font-size="11" fill="#f8fafc" text-anchor="middle">data</text>
      <text x="42" y="68" font-family="'Courier New', monospace" font-size="10" fill="#0284c7" text-anchor="middle">0x9C30</text>
      <rect x="8" y="90" width="69" height="50" rx="4" fill="#7e22ce" fill-opacity="0.2" stroke="#7e22ce" stroke-width="1"/>
      <text x="42" y="105" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" text-anchor="middle">sequence</text>
      <text x="42" y="125" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">13</text>
    </g>

    <!-- Cell 2 -->
    <g transform="translate(190, 0)">
      <rect width="85" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="42" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">Cell [2]</text>
      <line x1="0" y1="30" x2="85" y2="30" stroke="#334155" stroke-width="1.5"/>
      <rect x="8" y="45" width="69" height="25" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="42" y="62" font-family="'Courier New', monospace" font-size="11" fill="#64748b" text-anchor="middle">empty</text>
      <rect x="8" y="90" width="69" height="50" rx="4" fill="#7e22ce" fill-opacity="0.2" stroke="#7e22ce" stroke-width="1"/>
      <text x="42" y="105" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" text-anchor="middle">sequence</text>
      <text x="42" y="125" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">2</text>
    </g>

    <!-- Cell 3 -->
    <g transform="translate(285, 0)">
      <rect width="85" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="42" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">Cell [3]</text>
      <line x1="0" y1="30" x2="85" y2="30" stroke="#334155" stroke-width="1.5"/>
      <rect x="8" y="45" width="69" height="25" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="42" y="62" font-family="'Courier New', monospace" font-size="11" fill="#64748b" text-anchor="middle">empty</text>
      <rect x="8" y="90" width="69" height="50" rx="4" fill="#7e22ce" fill-opacity="0.2" stroke="#7e22ce" stroke-width="1"/>
      <text x="42" y="105" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" text-anchor="middle">sequence</text>
      <text x="42" y="125" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">3</text>
    </g>

    <!-- Index Mapping indicator -->
    <path d="M -20,220 L 400,220" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="190" y="240" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Index = Position &amp; (Capacity - 1)  [Capacity = 4]</text>
  </g>

  <!-- Consumer Section (Right) -->
  <g transform="translate(680, 120)">
    <!-- Consumers Title -->
    <rect width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Consumers (Reader Threads)</text>
    
    <!-- Active Readers -->
    <circle cx="35" cy="90" r="18" fill="url(#emeraldGrad)"/>
    <text x="35" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">C1</text>

    <circle cx="90" cy="90" r="18" fill="url(#emeraldGrad)"/>
    <text x="90" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">C2</text>

    <circle cx="145" cy="90" r="18" fill="url(#emeraldGrad)"/>
    <text x="145" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">C3</text>

    <!-- CAS Arrow -->
    <path d="M 90,120 L 90,165" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <polygon points="90,172 85,162 95,162" fill="#10b981"/>
    <text x="-25" y="145" font-family="'Courier New', monospace" font-size="10" fill="#10b981" font-weight="bold">CAS dequeue_pos</text>
  </g>

  <!-- Global Atomic Dequeue Position -->
  <g transform="translate(680, 310)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">alignas(64)</text>
    <text x="90" y="38" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">std::atomic&lt;size_t&gt;</text>
    <text x="90" y="52" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">dequeue_pos = 10</text>
  </g>

  <!-- Arrows from pointers to cells -->
  <!-- Enqueue points to Cell 0 (since 12 & 3 = 0) -->
  <path d="M 130,370 L 130,420 L 302,420 L 302,280" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="302,272 297,282 307,282" fill="#38bdf8"/>
  <rect x="180" y="405" width="80" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="220" y="419" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#38bdf8" font-weight="bold" text-anchor="middle">12 % 4 = [0]</text>

  <!-- Dequeue points to Cell 2 (since 10 & 3 = 2) -->
  <path d="M 770,370 L 770,420 L 492,420 L 492,280" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="492,272 487,282 497,282" fill="#10b981"/>
  <rect x="600" y="405" width="80" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="640" y="419" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#10b981" font-weight="bold" text-anchor="middle">10 % 4 = [2]</text>

  <!-- Footer explanation on barriers/coherency -->
  <g transform="translate(40, 470)">
    <rect width="820" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Key Synchronization Protocols:</text>
    <text x="20" y="45" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#94a3b8">
      1. CAS on positions is relaxed. 2. Acquire cell sequence to verify space/data availability. 3. Release sequence to publish update to other threads.
    </text>
  </g>
</svg>
