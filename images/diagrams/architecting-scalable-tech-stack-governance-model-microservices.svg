<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Component Gradients -->
    <linearGradient id="paved-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pipeline-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="drift-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="k8s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Markers for Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" rx="12" fill="url(#bg-grad)"/>

  <!-- Title & Subtitle -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.025em">
    Tech Stack Governance &amp; Drift Detection Architecture
  </text>
  <text x="30" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
    Automating policy enforcement, paved paths validation, and continuous runtime compliance.
  </text>

  <!-- Phase 1: Define & Plan (Left Column) -->
  <g transform="translate(30, 100)">
    <!-- Section Border Group -->
    <rect width="230" height="390" rx="8" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="15" y="-12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.05em" text-anchor="start">1. DESIGN &amp; DEFINE</text>

    <!-- Developer/ADR Node -->
    <g transform="translate(15, 20)" filter="url(#shadow)">
      <rect width="200" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="15" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Engineering Teams</text>
      <text x="15" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Propose tech stack changes</text>
      <text x="15" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="500">via RFC / ADR PRs</text>
    </g>

    <!-- Tech Stack Catalog (Backstage/YAML) -->
    <g transform="translate(15, 175)" filter="url(#shadow)">
      <rect width="200" height="100" rx="6" fill="url(#paved-grad)" stroke="#0284c7" stroke-width="1"/>
      <text x="15" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Governance Registry</text>
      <text x="15" y="48" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11">Defined "Paved Paths" (YAML)</text>
      <text x="15" y="64" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11">Allowed Base Images &amp; SDKs</text>
      <text x="15" y="80" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Single Source of Truth</text>
    </g>
    
    <!-- Local Linter / IDE Feed -->
    <g transform="translate(15, 305)" filter="url(#shadow)">
      <rect width="200" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Local Validation</text>
      <text x="15" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Pre-commit checks &amp; IDE</text>
      <text x="15" y="53" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Early feedback loop</text>
    </g>
  </g>

  <!-- Connectors Design & Define -->
  <!-- ADR to Catalog -->
  <path d="M 145 195 L 145 275" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="155" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Approve &amp; Merge</text>

  <!-- Catalog to Local -->
  <path d="M 145 375 L 145 405" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Phase 2: Enforce & Deploy (Middle Column) -->
  <g transform="translate(315, 100)">
    <!-- Section Border Group -->
    <rect width="250" height="390" rx="8" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="15" y="-12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.05em" text-anchor="start">2. BUILD &amp; ENFORCE</text>

    <!-- CI Pipeline Box -->
    <g transform="translate(15, 20)" filter="url(#shadow)">
      <rect width="220" height="235" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
      <rect x="0" y="0" width="220" height="30" rx="6" fill="url(#pipeline-grad)"/>
      <text x="15" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CI/CD Pipeline Checks</text>
      
      <!-- OPA / Conftest -->
      <g transform="translate(12, 45)">
        <rect width="196" height="50" rx="4" fill="#1e293b" stroke="#0d9488" stroke-width="1"/>
        <text x="10" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">OPA / Conftest Policies</text>
        <text x="10" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Checks Dockerfile &amp; manifest syntax</text>
      </g>
      
      <!-- Dependency Guard -->
      <g transform="translate(12, 105)">
        <rect width="196" height="50" rx="4" fill="#1e293b" stroke="#0d9488" stroke-width="1"/>
        <text x="10" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dependency Guard (SBOM)</text>
        <text x="10" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Blocks non-approved SDKs/libs</text>
      </g>

      <!-- Policy Sync -->
      <g transform="translate(12, 165)">
        <rect width="196" height="55" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="10" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Dynamic Rules Pull</text>
        <text x="10" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Fetches latest allowed list</text>
        <text x="10" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">from Governance Registry</text>
      </g>
    </g>

    <!-- CD / Spinnaker / ArgoCD -->
    <g transform="translate(15, 290)" filter="url(#shadow)">
      <rect width="220" height="80" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Continuous Delivery</text>
      <text x="15" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ArgoCD / GitOps Engine</text>
      <text x="15" y="62" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Only deploys validated images</text>
    </g>
  </g>

  <!-- Connectors Design to CI -->
  <!-- Catalog Registry -> CI Dynamic Rules Pull -->
  <path d="M 245 320 C 290 320, 290 285, 335 285" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="260" y="295" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Syncs Catalog</text>

  <!-- Developer PR -> CI Pipeline -->
  <path d="M 245 157 L 315 157" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="147" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Triggers CI</text>

  <!-- CI -> CD -->
  <path d="M 440 355 L 440 380" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="448" y="372" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Passed</text>


  <!-- Phase 3: Runtime & Audit (Right Column) -->
  <g transform="translate(615, 100)">
    <!-- Section Border Group -->
    <rect width="235" height="390" rx="8" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="15" y="-12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.05em" text-anchor="start">3. MONITOR &amp; AUDIT</text>

    <!-- Production Cluster -->
    <g transform="translate(15, 20)" filter="url(#shadow)">
      <rect width="205" height="110" rx="6" fill="url(#k8s-grad)" stroke="#4f46e5" stroke-width="1"/>
      <text x="15" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Production (K8s)</text>
      <text x="15" y="48" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10">Active Running Pods</text>
      
      <!-- Microservice boxes inside cluster -->
      <g transform="translate(15, 60)">
        <rect width="50" height="35" rx="3" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
        <text x="25" y="22" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Svc A</text>
      </g>
      <g transform="translate(75, 60)">
        <rect width="50" height="35" rx="3" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
        <text x="25" y="22" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Svc B</text>
      </g>
      <g transform="translate(135, 60)">
        <!-- Drifted Service -->
        <rect width="50" height="35" rx="3" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
        <text x="25" y="22" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Svc C*</text>
      </g>
    </g>

    <!-- Drift Detector (Cron / Operator) -->
    <g transform="translate(15, 175)" filter="url(#shadow)">
      <rect width="205" height="100" rx="6" fill="url(#drift-grad)" stroke="#b45309" stroke-width="1"/>
      <text x="15" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Drift Detection Engine</text>
      <text x="15" y="45" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11">Scans live containers via API</text>
      <text x="15" y="60" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11">Correlates with registry</text>
      <text x="15" y="85" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Runs: Every 4 Hours</text>
    </g>

    <!-- Notification / Alerting -->
    <g transform="translate(15, 305)" filter="url(#shadow)">
      <rect width="205" height="65" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="15" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Slack / SecOps Alert</text>
      <text x="15" y="40" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">"Svc C is running unapproved</text>
      <text x="15" y="52" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">Python 3.8 base image!"</text>
    </g>
  </g>

  <!-- Connectors Enforce to Runtime -->
  <!-- CD -> Prod Cluster -->
  <path d="M 550 380 C 600 380, 595 185, 645 185" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="225" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Deploys to</text>

  <!-- Runtime Cluster -> Drift Detector -->
  <path d="M 720 230 L 720 265" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Inspects Runtime</text>

  <!-- Drift Detector -> Slack Alert -->
  <path d="M 720 375 L 720 395" fill="none" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="730" y="390" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Alerts Drift</text>

  <!-- Drift Detector -> Governance Catalog (Feedback Loop) -->
  <path d="M 630 225 C 440 225, 440 435, 245 320" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-rose)"/>
  <text x="440" y="450" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Reports Out-of-Compliance State</text>

</svg>
