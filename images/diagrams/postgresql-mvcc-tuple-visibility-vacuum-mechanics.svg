<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1971c2"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e03131"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9e44"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#868e96"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="860" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e1e2e">PostgreSQL MVCC: Tuple Lifecycle &amp; VACUUM</text>

  <!-- ===== SECTION 1: HEAP PAGE ===== -->
  <text x="160" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1971c2">Heap Page Layout</text>

  <!-- Page border -->
  <rect x="20" y="72" width="280" height="200" rx="6" fill="#f1f3f5" stroke="#1971c2" stroke-width="2"/>
  <text x="160" y="91" text-anchor="middle" font-size="11" fill="#868e96">8KB Page</text>

  <!-- Tuple 1 (live) -->
  <rect x="35" y="100" width="250" height="40" rx="4" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="48" y="116" font-size="10" fill="#1e1e2e" font-weight="bold">Tuple (ctid: 0,1)</text>
  <text x="48" y="130" font-size="10" fill="#2f9e44">xmin=100  xmax=0  data="Alice"</text>

  <!-- Tuple 2 (dead - updated) -->
  <rect x="35" y="148" width="250" height="40" rx="4" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="48" y="164" font-size="10" fill="#1e1e2e" font-weight="bold">Tuple (ctid: 0,2) ☠ DEAD</text>
  <text x="48" y="178" font-size="10" fill="#e03131">xmin=98   xmax=102  data="Bob_old"</text>

  <!-- Tuple 3 (live) -->
  <rect x="35" y="196" width="250" height="40" rx="4" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="48" y="212" font-size="10" fill="#1e1e2e" font-weight="bold">Tuple (ctid: 0,3)</text>
  <text x="48" y="226" font-size="10" fill="#2f9e44">xmin=102  xmax=0  data="Bob_new"</text>

  <!-- Free space indicator -->
  <rect x="35" y="244" width="250" height="20" rx="4" fill="#e9ecef" stroke="#adb5bd" stroke-width="1"/>
  <text x="160" y="258" text-anchor="middle" font-size="10" fill="#868e96">Free Space (to be reclaimed by VACUUM)</text>

  <!-- ===== SECTION 2: TRANSACTION SNAPSHOT ===== -->
  <text x="470" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#7048e8">Transaction Snapshot &amp; Visibility</text>

  <!-- Snapshot box -->
  <rect x="320" y="72" width="300" height="200" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>

  <!-- TXN 103 active -->
  <rect x="335" y="90" width="270" height="50" rx="4" fill="#e5dbff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="470" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#7048e8">Transaction 103 (Active)</text>
  <text x="350" y="124" font-size="10" fill="#1e1e2e">snapshot: xmin=101, xmax=104</text>
  <text x="350" y="136" font-size="10" fill="#1e1e2e">active_txids: {101, 103}</text>

  <!-- Visibility rules -->
  <text x="335" y="162" font-size="11" font-weight="bold" fill="#1e1e2e">Visibility Check (tuple xmin=100, xmax=0):</text>
  <text x="345" y="177" font-size="10" fill="#2f9e44">✓ xmin=100 &lt; snapshot.xmin=101 → committed</text>
  <text x="345" y="191" font-size="10" fill="#2f9e44">✓ xmax=0 → not deleted → VISIBLE</text>

  <text x="335" y="210" font-size="11" font-weight="bold" fill="#1e1e2e">Visibility Check (dead tuple xmin=98, xmax=102):</text>
  <text x="345" y="225" font-size="10" fill="#e03131">✗ xmax=102 &lt; snapshot.xmax=104, not in active → DEAD</text>
  <text x="345" y="238" font-size="10" fill="#e03131">   (not in active_txids) → INVISIBLE</text>

  <!-- ===== SECTION 3: VACUUM PROCESS ===== -->
  <text x="720" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67700">VACUUM Mechanics</text>

  <rect x="640" y="72" width="200" height="200" rx="6" fill="#fff9db" stroke="#e67700" stroke-width="2"/>

  <!-- VACUUM steps -->
  <rect x="655" y="88" width="170" height="28" rx="4" fill="#ffe8cc" stroke="#e67700" stroke-width="1"/>
  <text x="740" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67700">1. Scan Heap Pages</text>
  <text x="740" y="112" text-anchor="middle" font-size="9" fill="#1e1e2e">find dead tuples</text>

  <line x1="740" y1="116" x2="740" y2="128" stroke="#e67700" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="655" y="128" width="170" height="28" rx="4" fill="#ffe8cc" stroke="#e67700" stroke-width="1"/>
  <text x="740" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67700">2. Index Cleanup</text>
  <text x="740" y="152" text-anchor="middle" font-size="9" fill="#1e1e2e">remove dead index entries</text>

  <line x1="740" y1="156" x2="740" y2="168" stroke="#e67700" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="655" y="168" width="170" height="28" rx="4" fill="#ffe8cc" stroke="#e67700" stroke-width="1"/>
  <text x="740" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67700">3. Reclaim Space</text>
  <text x="740" y="192" text-anchor="middle" font-size="9" fill="#1e1e2e">mark pages reusable (FSM)</text>

  <line x1="740" y1="196" x2="740" y2="208" stroke="#e67700" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="655" y="208" width="170" height="28" rx="4" fill="#ffe8cc" stroke="#e67700" stroke-width="1"/>
  <text x="740" y="220" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67700">4. Freeze Old XIDs</text>
  <text x="740" y="232" text-anchor="middle" font-size="9" fill="#1e1e2e">prevent XID wraparound</text>

  <line x1="740" y1="236" x2="740" y2="248" stroke="#e67700" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="655" y="248" width="170" height="20" rx="4" fill="#fff3bf" stroke="#e67700" stroke-width="1"/>
  <text x="740" y="262" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67700">Update pg_statistic</text>

  <!-- ===== SECTION 4: XID WRAPAROUND WARNING ===== -->
  <rect x="20" y="290" width="280" height="90" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
  <text x="160" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#e03131">XID Wraparound Risk</text>
  <text x="35" y="328" font-size="10" fill="#1e1e2e">32-bit XID space: ~2.1 billion txns</text>
  <text x="35" y="342" font-size="10" fill="#1e1e2e">age(datfrozenxid) &gt; 200M → autovacuum forced</text>
  <text x="35" y="356" font-size="10" fill="#1e1e2e">age &gt; 1.6B → DB goes read-only (emergency!)</text>
  <text x="35" y="370" font-size="10" fill="#e03131">Freeze tuples to reset XID → FrozenTransactionId</text>

  <!-- ===== SECTION 5: BLOAT + HOT UPDATE ===== -->
  <rect x="320" y="290" width="300" height="90" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="470" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1971c2">HOT Update (Heap-Only Tuple)</text>
  <text x="335" y="328" font-size="10" fill="#1e1e2e">UPDATE on non-indexed col → stays in same page</text>
  <text x="335" y="342" font-size="10" fill="#1e1e2e">Old tuple ctid → points to new tuple version</text>
  <text x="335" y="356" font-size="10" fill="#1e1e2e">No index entry added → index stays clean</text>
  <text x="335" y="370" font-size="10" fill="#2f9e44">Pruned in-place without full VACUUM scan</text>

  <!-- ===== SECTION 6: AUTOVACUUM TRIGGERS ===== -->
  <rect x="640" y="290" width="200" height="90" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="740" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f9e44">Autovacuum Trigger</text>
  <text x="655" y="328" font-size="10" fill="#1e1e2e">dead_tuples &gt; threshold:</text>
  <text x="660" y="342" font-size="10" fill="#1e1e2e">50 + 0.2 × reltuples</text>
  <text x="655" y="358" font-size="10" fill="#1e1e2e">autovacuum_vacuum_scale_</text>
  <text x="660" y="370" font-size="10" fill="#1e1e2e">factor = 0.2 (default)</text>

  <!-- ===== SECTION 7: BLOAT QUERY ===== -->
  <rect x="20" y="398" width="620" height="70" rx="6" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
  <text x="30" y="416" font-size="11" font-weight="bold" fill="#1e1e2e">Key monitoring query: table bloat</text>
  <text x="30" y="432" font-size="10" fill="#1971c2" font-family="monospace">SELECT relname, n_dead_tup, n_live_tup,</text>
  <text x="30" y="446" font-size="10" fill="#1971c2" font-family="monospace">  round(n_dead_tup::numeric / nullif(n_live_tup,0) * 100, 2) AS dead_pct</text>
  <text x="30" y="460" font-size="10" fill="#1971c2" font-family="monospace">FROM pg_stat_user_tables ORDER BY n_dead_tup DESC;</text>

  <!-- ===== SECTION 8: pg_visibility / freeze map ===== -->
  <rect x="650" y="398" width="190" height="70" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="745" y="416" text-anchor="middle" font-size="11" font-weight="bold" fill="#7048e8">Visibility Map</text>
  <text x="660" y="432" font-size="10" fill="#1e1e2e">1 bit per page:</text>
  <text x="660" y="446" font-size="10" fill="#2f9e44">all-visible → skip heap scan</text>
  <text x="660" y="460" font-size="10" fill="#e67700">all-frozen → skip freeze check</text>

  <!-- Legend -->
  <rect x="20" y="485" width="820" height="60" rx="6" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="502" font-size="11" font-weight="bold" fill="#1e1e2e">Legend:</text>
  <rect x="80" y="490" width="14" height="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1"/>
  <text x="100" y="502" font-size="10" fill="#1e1e2e">Live tuple</text>
  <rect x="170" y="490" width="14" height="14" fill="#ffe3e3" stroke="#e03131" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="190" y="502" font-size="10" fill="#1e1e2e">Dead tuple (invisible, reclaimable)</text>
  <rect x="360" y="490" width="14" height="14" fill="#ffe8cc" stroke="#e67700" stroke-width="1"/>
  <text x="380" y="502" font-size="10" fill="#1e1e2e">VACUUM phase</text>
  <rect x="460" y="490" width="14" height="14" fill="#e5dbff" stroke="#7048e8" stroke-width="1"/>
  <text x="480" y="502" font-size="10" fill="#1e1e2e">Snapshot / visibility check</text>
  <text x="30" y="535" font-size="10" fill="#868e96">xmin = inserting transaction ID  |  xmax = deleting/updating transaction ID  |  ctid = physical location (page, offset)</text>
</svg>
