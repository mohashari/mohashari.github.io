<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="500" rx="12" fill="#0f172a" />
  
  <!-- Definitions for gradients and markers -->
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3" />
    </pattern>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
    <!-- Glow effects -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apply Grid -->
  <rect width="900" height="500" fill="url(#grid)" rx="12" />

  <!-- Title / Header -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Multi-Team Migration &amp; Zero-Downtime Deprecation Architecture</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Phase 2: Double-Writing, Shadow Routing, and Asynchronous Reconciliation</text>

  <!-- Clients -->
  <g transform="translate(40, 200)">
    <rect width="110" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="55" y="35" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Clients</text>
    <text x="55" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">REST / GraphQL</text>
    <text x="55" y="70" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Web &amp; Mobile</text>
  </g>

  <!-- API Gateway / Reverse Proxy (Envoy) -->
  <g transform="translate(200, 180)">
    <rect width="130" height="130" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="65" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">API Gateway</text>
    <text x="65" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">(Envoy Proxy)</text>
    <!-- Features inside Gateway -->
    <rect x="10" y="65" width="110" height="20" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="65" y="79" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dynamic Routing</text>
    <rect x="10" y="95" width="110" height="20" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="65" y="109" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Traffic Shadowing</text>
  </g>

  <!-- Legacy Service (Top Path) -->
  <g transform="translate(420, 110)">
    <rect width="140" height="80" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
    <text x="70" y="30" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Legacy Service</text>
    <text x="70" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Monolith (V1 API)</text>
    <text x="70" y="65" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">State: Deprecating</text>
  </g>

  <!-- New Service (Bottom Path) -->
  <g transform="translate(420, 290)">
    <rect width="140" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="70" y="30" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">New Service</text>
    <text x="70" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Microservice (V2)</text>
    <text x="70" y="65" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">State: Shadowing / Live</text>
  </g>

  <!-- Legacy Database (Top Right) -->
  <g transform="translate(640, 110)">
    <rect width="110" height="80" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="55" y="35" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Legacy DB</text>
    <text x="55" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">PostgreSQL V1</text>
  </g>

  <!-- New Database (Bottom Right) -->
  <g transform="translate(640, 290)">
    <rect width="110" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="55" y="35" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">New DB</text>
    <text x="55" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">PostgreSQL V2</text>
  </g>

  <!-- Async Reconciler (Center Right) -->
  <g transform="translate(630, 210)">
    <rect width="130" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="65" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Reconciliation Worker</text>
    <text x="65" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Asynchronous Compare</text>
  </g>

  <!-- Arrows & Connections -->
  <!-- Clients -> API Gateway -->
  <path d="M 150 245 L 192 245" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Gateway -> Legacy Service (Primary Traffic) -->
  <path d="M 330 215 C 360 215, 360 150, 410 150" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-rose)" />
  <text x="355" y="165" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Primary Write</text>

  <!-- Gateway -> New Service (Shadowed / Double Write Traffic) -->
  <path d="M 330 275 C 360 275, 360 330, 410 330" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="355" y="320" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Shadow Write</text>

  <!-- Legacy Service -> Legacy DB -->
  <path d="M 560 150 L 632 150" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)" />

  <!-- New Service -> New DB -->
  <path d="M 560 330 L 632 330" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- Reconciler reading from both DBs -->
  <!-- From Legacy DB down to Reconciler -->
  <path d="M 695 190 L 695 204" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow-amber)" />
  <!-- From New DB up to Reconciler -->
  <path d="M 695 290 L 695 266" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow-amber)" />

  <!-- Slack/Alerting Target for Reconciler -->
  <g transform="translate(800, 215)">
    <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <text x="20" y="24" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">!</text>
    <text x="20" y="48" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="bold">Alerts</text>
  </g>
  <path d="M 760 235 L 774 235" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Dynamic Routing Controller / Consul / Control Plane -->
  <g transform="translate(205, 360)">
    <rect width="120" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="60" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Control Plane</text>
    <text x="60" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Consul / Feature Flag</text>
  </g>
  <path d="M 265 360 L 265 316" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow)" />
  
  <!-- Legend -->
  <g transform="translate(40, 440)">
    <!-- Legacy path -->
    <line x1="0" y1="10" x2="30" y2="10" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4" />
    <text x="35" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Legacy Path (Live Traffic)</text>

    <!-- New path -->
    <line x1="200" y1="10" x2="230" y2="10" stroke="#10b981" stroke-width="2" />
    <text x="235" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">New Path (Shadow/Gradual Live)</text>

    <!-- Reconciliation -->
    <line x1="450" y1="10" x2="480" y2="10" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3" />
    <text x="485" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Reconciliation &amp; Verification</text>
  </g>
</svg>
