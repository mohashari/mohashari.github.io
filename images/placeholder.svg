<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312E81;stop-opacity:1" />
    </linearGradient>
    
    <!-- Indigo Radial Glow -->
    <radialGradient id="indigo-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0" />
    </radialGradient>

    <!-- Teal/Cyan Secondary Glow -->
    <radialGradient id="teal-glow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(226, 232, 240, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#indigo-glow)" />
  <rect width="100%" height="100%" fill="url(#teal-glow)" />
  <rect width="100%" height="100%" fill="url(#grid-pattern)" />

  <!-- Abstract Geometric Artwork -->
  <!-- Top Right Concentric Circles -->
  <circle cx="850" cy="150" r="120" fill="none" stroke="rgba(79, 70, 229, 0.15)" stroke-width="1" />
  <circle cx="850" cy="150" r="180" fill="none" stroke="rgba(79, 70, 229, 0.08)" stroke-width="1.5" />
  <circle cx="850" cy="150" r="240" fill="none" stroke="rgba(79, 70, 229, 0.04)" stroke-width="2" />
  
  <!-- Bottom Left Concentric Circles -->
  <circle cx="150" cy="550" r="100" fill="none" stroke="rgba(6, 182, 212, 0.12)" stroke-width="1" />
  <circle cx="150" cy="550" r="160" fill="none" stroke="rgba(6, 182, 212, 0.06)" stroke-width="1.5" />

  <!-- Decorative Sine Waves -->
  <path d="M-100,360 C 200,200 400,520 700,360 C 900,260 1000,400 1200,300" fill="none" stroke="rgba(79, 70, 229, 0.06)" stroke-width="3" stroke-linecap="round" />
  <path d="M-100,380 C 200,220 400,540 700,380 C 900,280 1000,420 1200,320" fill="none" stroke="rgba(6, 182, 212, 0.04)" stroke-width="2" stroke-linecap="round" />

  <!-- Code / Tech Graphic in Center -->
  <g transform="translate(540, 360)">
    <!-- Decorative Outer Ring -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="6" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(79, 70, 229, 0.25)" stroke-width="1.5" stroke-dasharray="10 15" />
    
    <!-- Solid Glassmorphic Circle -->
    <circle cx="0" cy="0" r="60" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Code Bracket Icon -->
    <path d="M-22,-12 L-34,0 L-22,12 M22,-12 L34,0 L22,12 M-6,18 L6,-18" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Soft Title Text -->
  <text x="540" y="490" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="24" font-weight="700" fill="#94A3B8" letter-spacing="4" text-anchor="middle" style="opacity: 0.8;">MOH ASHARI MUKLIS</text>
  <text x="540" y="520" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="500" fill="#4F46E5" letter-spacing="2" text-anchor="middle" style="opacity: 0.9;">DEVELOPER BLOG</text>
</svg>
